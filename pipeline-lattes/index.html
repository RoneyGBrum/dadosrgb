strong> — <strong>feito em 11/09/2026 (versão 1.6)</strong>, ver 6.5. O parâmetro chega ao motor como <code>rerank_candidatos</code> do eixo, entra na assinatura do cache quando o desempate está ligado, e um teste de integração vigia. O valor padrão continua 5, então nenhum resultado mudou. O que fica com vocês é o valor: 5 é ponto de partida, e a calibração da seção 21 é que diz se vale mais ou menos.</p>\n<p><strong>9. Onde ficam os pesos dos modelos, quando a máquina tem mais de uma conta.</strong> O E5 (1,1 GB) e o reranker (2,2 GB) são baixados uma vez para o cache da Hugging Face — por padrão, dentro do perfil de quem rodou (<code>~/.cache/huggingface</code>). Outra conta da mesma máquina não enxerga esse cache e <strong>baixa tudo de novo, sem erro e sem aviso</strong>: só uma execução que demora horas. A saída é um cache fora de perfil, apontado pela variável <code>HF_HOME</code> (só ela; <code>SENTENCE_TRANSFORMERS_HOME</code> e <code>TRANSFORMERS_CACHE</code> atrapalham), com leitura liberada para cada conta que opera o pipeline. Nesta instalação isso ficou pela metade em 11/09/2026: os pesos foram para <code>C:\\Projetos_IA\\modelos_ia</code>, mas a conta isolada que executa o pipeline não tem <code>HF_HOME</code> definida nem permissão na pasta — o E5 carrega do cache do próprio perfil dela, e o reranker não está acessível. Até decidir, rode com <code>HF_HUB_OFFLINE=1</code>: o pipeline falha alto em vez de baixar 2 GB em silêncio.</p>\n<p>Desde a versão 1.7, isso tem lugar na janela: o campo «HF_HOME (cache dos modelos de IA)», na aba «6 · Ambiente», grava a pasta e a passa a todo processo que o Assistente dispara, e o passo 5 da Primeira configuração (14.4) confere se o E5 e o reranker estão lá — e baixa o que faltar. Nesta instalação, a pasta <code>C:\\Projetos_IA\\modelos_ia</code> foi liberada para a conta isolada em 14/09/2026 e tem os dois modelos; o que continua pendente é a variável: <code>HF_HOME</code> ainda não está definida para a máquina, e cada execução fora da janela precisa recebê-la. Continua sendo decisão de vocês o lugar — uma pasta fora de qualquer perfil, com permissão de leitura para cada conta que opera o pipeline — e defini-la para a máquina inteira. A sugestão, num PowerShell aberto como administrador: <code>setx HF_HOME &quot;C:\\Projetos_IA\\modelos_ia&quot; /M</code> — vale para os programas abertos depois, em todas as contas.</p>\n<h2 id=\"dados-de-demonstração\">27. Dados de demonstração</h2>\n<p>A pasta de demonstração traz uma base simulada de <strong>300 currículos</strong>, processada pelas quatro etapas:</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 62%\" />\n<col style=\"width: 35%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Arquivo</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>curriculo_*.csv</code></td>\n<td style=\"text-align: left;\">as dez tabelas da etapa 1</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>classificado_*.csv</code></td>\n<td style=\"text-align: left;\">os sete blocos com rótulos (etapa 2)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>quantificacao.csv</code> / <code>.xlsx</code></td>\n<td style=\"text-align: left;\">uma linha por pesquisador (etapa 3)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>contagens_detalhadas.csv</code> / <code>.xlsx</code></td>\n<td style=\"text-align: left;\">formato longo, para tabela dinâmica</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>curriculos_vetorizados.parquet</code></td>\n<td style=\"text-align: left;\">com os vetores (etapa 4)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>1_ingestao.xlsx</code>, <code>2_classificacao.xlsx</code>, <code>3_quantificacao.xlsx</code></td>\n<td style=\"text-align: left;\">os relatórios</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Estes dados são simulados.</strong> Foram gerados por <code>ingestao/simulador.py</code> para exercitar o sistema antes da extração real. A classificação usou similaridade lexical, não o modelo de vetores de produção. <strong>Nenhum número descreve pessoas reais.</strong> Servem para demonstrar o formato da entrega, não para produzir conclusões.</p>\n</blockquote>\n<h2 id=\"o-que-mudou-na-versão-1.4\">28. O que mudou na versão 1.4</h2>\n<p>Esta versão nasceu de uma revisão dirigida: treze pontos do manual 1.3 foram marcados como insuficientes por quem o leu, e cada um deles foi reescrito contra o código-fonte do pipeline — não contra a versão anterior do texto.</p>\n<p><strong>Explicações reescritas ou criadas</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Onde</th>\n<th>O que mudou</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>3.2</td>\n<td><strong>Novo.</strong> Vocabulário do sistema — bloco, eixo, categoria e glosa — apresentado logo no início, antes de as palavras serem usadas.</td>\n</tr>\n<tr class=\"even\">\n<td>6.4</td>\n<td><strong>Novo.</strong> O que é exatamente a “zona cinzenta”: uma faixa de pontuação (0,60 a 0,85), e não o conjunto dos itens ambíguos.</td>\n</tr>\n<tr class=\"odd\">\n<td>6.5</td>\n<td><strong>Novo.</strong> O que é o método top-K, com exemplo numérico, o motivo de <code>argpartition</code> e os quatro lugares em que ele aparece no pipeline.</td>\n</tr>\n<tr class=\"even\">\n<td>7.1</td>\n<td><strong>Reescrito.</strong> O que significa normalizar um vetor, com a conta de Pitágoras feita passo a passo.</td>\n</tr>\n<tr class=\"odd\">\n<td>7.2</td>\n<td><strong>Reescrito.</strong> O exemplo prático da normalização, agora com todas as multiplicações à vista e cinco passos numerados.</td>\n</tr>\n<tr class=\"even\">\n<td>7.4</td>\n<td><strong>Reescrito.</strong> Como o sistema decide o que é texto longo e o que é curto — resposta: não decide, é declarado por uma pessoa, por bloco.</td>\n</tr>\n<tr class=\"odd\">\n<td>7.5</td>\n<td><strong>Reescrito.</strong> A limitação real, com o caso concreto de duas linhas do mesmo bloco e a lista do que o sistema não faz.</td>\n</tr>\n<tr class=\"even\">\n<td>7.6</td>\n<td><strong>Reescrito.</strong> Os dois caminhos possíveis, precedidos da recomendação explícita de não implementar nenhum sem medida.</td>\n</tr>\n<tr class=\"odd\">\n<td>9.1</td>\n<td><strong>Novo.</strong> Para que serve cada biblioteca instalada, separadas em obrigatórias, notebook, descoberta e nuvem.</td>\n</tr>\n<tr class=\"even\">\n<td>11.6 a 11.12</td>\n<td><strong>Novo.</strong> Operar pelo Jupyter: célula de abertura, execução etapa a etapa, tabela de equivalências com o terminal, mudança de parâmetros em memória, armadilhas do notebook e um notebook mínimo de cinco células.</td>\n</tr>\n<tr class=\"odd\">\n<td>12.4</td>\n<td><strong>Reescrito.</strong> Verificação do Ollama nas duas formas, incluindo a checagem pelo próprio código do projeto dentro do notebook.</td>\n</tr>\n<tr class=\"even\">\n<td>13.5</td>\n<td><strong>Novo.</strong> Como rodar o assistente de glosas pelo notebook, nas duas formas.</td>\n</tr>\n<tr class=\"odd\">\n<td>17.2</td>\n<td><strong>Reescrito.</strong> Anatomia completa de um bloco, com um item percorrido de ponta a ponta.</td>\n</tr>\n<tr class=\"even\">\n<td>17.3</td>\n<td><strong>Reescrito.</strong> O cruzamento bloco × taxonomia em matriz, com a justificativa de cada cruzamento presente <strong>e de cada ausência</strong>.</td>\n</tr>\n<tr class=\"odd\">\n<td>26, item 5</td>\n<td><strong>Reescrito.</strong> A decisão pendente sobre textos de comprimentos díspares, com o quadro de medição e o critério de decisão.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Correções</strong></p>\n<ul>\n<li><strong>Numeração das subseções.</strong> Na versão 1.3, as seções 12, 13, 15, 16 e 18 traziam subseções numeradas com o prefixo de outra seção (12 usava “20.1”, 13 usava “17.1”, 16 usava “20.1”). Todas foram renumeradas para seguir a seção-mãe, e as referências cruzadas do texto foram ajustadas.</li>\n<li><strong>Referências cruzadas</strong> para 7.2, 7.5, 9.1, 9.2, 20.11 e 22 corrigidas em consequência da renumeração.</li>\n<li><strong><code>reranker_topk</code>.</strong> Registrada a discrepância entre o parâmetro documentado e o comportamento do código (6.5, 20.4 e a pendência 8 da seção 26).</li>\n</ul>\n<p><strong>Blocos “NO TERMINAL / NO NOTEBOOK”</strong> foram acrescentados a cada uma das quatro etapas da Parte III, à primeira execução (14) e à tabela de comandos (15.1).</p>\n<h2 id=\"o-que-mudou-na-versao-1-5\">29. O que mudou na versão 1.5</h2>\n<p>A 1.4 foi uma revisão do texto. Esta é uma revisão contra o que aconteceu: a primeira carga de currículos reais, as correções que ela obrigou e a janela que passou a operar tudo isso sem terminal.</p>\n<table>\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 78%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Onde</th>\n<th>O que mudou</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>15.4</td>\n<td><strong>Novo.</strong> O Assistente, a janela única: como abrir, o que cada uma das nove abas faz, os três subcomandos sem janela e o roteiro do primeiro dia.</td>\n</tr>\n<tr class=\"even\">\n<td>14.3 (hoje 14.4)</td>\n<td><strong>Novo.</strong> A primeira execução pelo assistente, sem abrir o terminal.</td>\n</tr>\n<tr class=\"odd\">\n<td>15.1</td>\n<td><strong>Ampliado.</strong> A ingestão em lote, o <code>--amostras</code>, o assistente e os dois comandos do Prospecta entraram na tabela de comandos.</td>\n</tr>\n<tr class=\"even\">\n<td>15.2 e 16.2</td>\n<td><strong>Corrigido.</strong> As saídas da etapa 1 em lote — pastas de lote e planilhas de amostra — e a pasta <code>6_PROSPECTA/</code>.</td>\n</tr>\n<tr class=\"odd\">\n<td>16.6</td>\n<td><strong>Novo.</strong> As planilhas de amostra de <code>2_CURRICULOS</code> e a opção <code>--amostras</code>.</td>\n</tr>\n<tr class=\"even\">\n<td>20.4 e 21</td>\n<td><strong>Novo.</strong> O achado da primeira carga real: com a margem em 0,015 os ambíguos ficaram entre 67% e 99,8%, o desempate recebeu quase todos os textos e a execução travou por mais de cinco horas; desligado, 445 segundos.</td>\n</tr>\n<tr class=\"odd\">\n<td>25</td>\n<td><strong>Novo.</strong> Quatro entradas: classificação parada em reranking, Prospecta sem enxergar a base, planilha de amostra confundida com a tabela e o duplo clique que não abre a janela.</td>\n</tr>\n<tr class=\"even\">\n<td>Ingestão (código)</td>\n<td><strong>Corrigido.</strong> A compactação passou a ser sempre global e a reescrever o manifesto; o manifesto é gravado antes de a origem ser apagada; a leitura em lotes mantém só a versão atual de cada currículo; o parser aceita XML e ZIP na mesma pasta; a produção técnica, que vinha vazia, foi corrigida; <code>LATTES_LOTE</code> e <code>LATTES_FORMATO_E5</code> passaram a ser lidos; o desempate informa progresso a cada 30 segundos; e as planilhas de amostra passaram a ser gravadas.</td>\n</tr>\n<tr class=\"odd\">\n<td>Prospecta (código)</td>\n<td><strong>Corrigido.</strong> O caminho da raiz; a leitura das pastas de lote com deduplicação pelo manifesto; a recusa das planilhas de amostra como se fossem a tabela; o <code>--sem-login</code> aceito só em loopback, conferido a cada requisição; a IA em nuvem bloqueada por padrão, de modo que nenhum currículo sai da máquina; a faixa de aviso de base SIMULADA ou DESATUALIZADA; o multirrótulo e a régua TRL.</td>\n</tr>\n<tr class=\"even\">\n<td>Dados</td>\n<td>A base simulada de agosto foi arquivada em <code>_arquivo_demo_2026-08/</code>; em seu lugar, 50 currículos reais ingeridos em 04/09/2026 — 5 segundos, 35.436 linhas, nenhuma falha.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"o-que-mudou-na-versao-1-6\">30. O que mudou na versão 1.6</h2>\n<p>A 1.5 registrou a primeira carga real. Esta versão fecha o que ela deixou anotado: o parâmetro do desempate que não chegava ao código, dois defeitos do reranker que o projeto irmão já havia medido, e o ambiente Python que deixou de existir para a conta que opera a máquina. Tudo verificado por execução, não por leitura — os números estão nas seções citadas.</p>\n<table>\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 78%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Onde</th>\n<th>O que mudou</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>6.5, 6.6, 20.4 e 26</td>\n<td><strong>Corrigido.</strong> <code>reranker_topk</code> passou a ser lido: chega ao eixo como <code>rerank_candidatos</code>, entra na assinatura do cache quando o desempate está ligado, e um teste de integração falha se alguém desfizer. O valor padrão continua 5 — nenhum resultado mudou.</td>\n</tr>\n<tr class=\"even\">\n<td>6.8</td>\n<td><strong>Novo.</strong> Reranker ausente não altera mais a decisão. Antes devolvia zeros, o motor escolhia o primeiro candidato global e carimbava <code>motivo=\"rerank\"</code>: medido em 11/09/2026 com 200 currículos simulados, 491 de 9.160 decisões (5,4%) trocadas, até 41% num eixo.</td>\n</tr>\n<tr class=\"odd\">\n<td>Reranker (código)</td>\n<td><strong>Corrigido.</strong> Meia precisão na GPU, como o E5 (~1,1 GB em vez de ~2,3 GB), e liberação da placa ao fim da classificação — as duas correções que o projeto irmão mediu em 08/09/2026 numa placa de 4 GB: sem elas os dois modelos passam do físico e a vazão cai ~6x, sem erro.</td>\n</tr>\n<tr class=\"even\">\n<td>Ambiente</td>\n<td><strong>Corrigido.</strong> A pasta <code>venv</code> da raiz virou uma junção para o ambiente único fora de perfil, <code>C:\\Projetos_IA\\venv_recruta</code> (Python 3.13.5, torch 2.11 com CUDA 12.8); o venv antigo (Python 3.11 do perfil do dono, inexecutável pela conta isolada) ficou em <code>venv_antigo_py311</code> até ser apagado. <code>umap-learn</code> e <code>hdbscan</code> passaram a existir — a descoberta de temas (20.13) roda. As três baterias passaram no ambiente novo, e o pipeline real dos 50 currículos rodou por ele com o cache intacto.</td>\n</tr>\n<tr class=\"odd\">\n<td>26</td>\n<td><strong>Novo.</strong> Item 9: onde ficam os pesos dos modelos quando a máquina tem mais de uma conta (<code>HF_HOME</code>), e o que ficou pendente nesta instalação.</td>\n</tr>\n<tr class=\"even\">\n<td>15.4</td>\n<td><strong>Novo.</strong> A aba «9 · Comandos»: escrever um comando qualquer sem sair da janela, com o Python do venv, o utf-8 e o log já resolvidos. Os dois projetos irmãos já a tinham. Junto veio uma correção do log: o erro do Windows PowerShell 5.1 chegava serializado em CLIXML — duas linhas de XML com a mensagem escondida dentro — e agora é desembrulhado e pintado como erro.</td>\n</tr>\n<tr class=\"odd\">\n<td>Ingestão (código)</td>\n<td><strong>Corrigido.</strong> Três tipos entravam sem título — 584 de 584 capítulos de livro, 195 de 195 produtos tecnológicos e 164 de 164 processos ou técnicas — porque o leitor pedia nomes de atributo que o XML não tem (e, no processo, o elemento errado: <code>DADOS-BASICOS-DO-PROCESSOS-OU-TECNICAS</code>, plural). Achado contando nomes de atributo nos XML, sem abrir currículo; provado no reparse dos originais (943 → 0) e na cadeia completa refeita numa pasta de rascunho: só os 937 textos recuperados saíram do cache, e a ambiguidade de produtos e processos caiu de 96% para 78% (setor) e de 89% para 66% (tecnologia). Novo: a aba <code>VAZIOS_POR_TIPO</code> no <code>1_ingestao.xlsx</code> e o aviso por tipo no log, para isso nunca mais passar em silêncio.</td>\n</tr>\n<tr class=\"even\">\n<td>16, 17 e 21</td>\n<td><strong>Medido.</strong> 65% dos títulos da base real são em inglês (o campo <code>idioma</code> do Lattes erra em 24% dos que declara «Português»). Na classificação contra as glosas em português, inglês e português receberam a MESMA distribuição de confiança (mediana 0,808 nos dois; indefinido 4,4% vs 5,4%) — o E5 é multilíngue e a língua do título não é fonte de viés nesta base. O que domina é a compressão das notas (P10–P90 entre 0,787 e 0,833), que é o problema da margem, não da língua.</td>\n</tr>\n<tr class=\"odd\">\n<td>16 e 18</td>\n<td><strong>Novo.</strong> A tabela <code>publicacoes</code> ganhou a coluna <code>repetida</code> (1 na segunda ocorrência do mesmo trabalho no mesmo currículo: mesmo título e tipo, ou mesmo DOI), derivada na ingestão, e a quantificação ganhou <code>n_trabalhos</code> — trabalhos distintos, ao lado de <code>n_publicacoes</code>, que continua sendo registros. Medido na base real: 19.884 registros, 19.359 trabalhos, 525 repetidos (2,6%). Marcar, não apagar: a tabela espelha o Lattes; quem conta é a etapa 3. O painel mostra «273 registros, 262 trabalhos» na ficha e sinaliza cada registro repetido.</td>\n</tr>\n<tr class=\"even\">\n<td>15.4</td>\n<td><strong>Novo.</strong> O botão «🔗 Criar atalho na área de trabalho» na aba «0 · Início» e o ícone do Assistente (<code>ferramentas/gerar_icone.py</code> gera <code>ferramentas/assistente.ico</code>, sete tamanhos), que aparece na janela, na barra de tarefas e no atalho. A contagem de botões deixou de ser um número fixo.</td>\n</tr>\n<tr class=\"odd\">\n<td>6.3</td>\n<td><strong>Medido e corrigido.</strong> A zona cinzenta pega ~98% dos textos da base real, e o desempate chamava o reranker um texto por vez, cego e lento — agora é um lote por eixo (~100 pares/s), com andamento a cada 30 s. Ver o NA PRÁTICA de 6.3.</td>\n</tr>\n<tr class=\"even\">\n<td>15.4</td>\n<td><strong>Novo.</strong> Dez capturas da janela do Assistente, uma por aba, logo abaixo do primeiro parágrafo de cada subseção — a janela como ela fica numa máquina pronta, para quem lê antes de abrir.</td>\n</tr>\n<tr class=\"odd\">\n<td>Manual (Word)</td>\n<td><strong>Corrigido.</strong> O rodapé ainda dizia v1.4.</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"o-que-mudou-na-versao-1-7\">31. O que mudou na versão 1.7</h2>\n<p>A versão anterior fechou o que a primeira carga real deixou anotado. Esta é sobre o primeiro dia numa máquina nova: instalar e configurar seguindo o manual, sem saber programar — do Python, que nenhum manual descrevia, ao PyTorch que travava no Python 3.13, aos modelos de IA baixados antes da primeira execução e à janela, que agora faz em passos numerados o que antes só apontava.</p>\n<table>\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 78%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Onde</th>\n<th>O que mudou</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>8.1 e 8.2</td>\n<td><strong>Novo.</strong> Instalar o Python no Windows, com os rótulos do instalador oficial («Add python.exe to PATH», «Install Now»), o que evitar (versão da Microsoft Store; 3.14, que mudou de instalador) e como conferir. Era o único passo que nenhum manual descrevia.</td>\n</tr>\n<tr class=\"even\">\n<td>9.3, 9.7 e 9.9</td>\n<td><strong>Corrigido.</strong> O índice cu121 não tem roda para Python 3.13 (o pip responde «No matching distribution found for torch»). Passa a valer o medido: <code>torch==2.11.0</code> pelo índice cu128 (Python 3.11 a 3.14, driver com CUDA 12 ou mais novo), ou o índice cpu sem placa. torchvision/torchaudio saem: o pipeline não os usa.</td>\n</tr>\n<tr class=\"odd\">\n<td>14.2</td>\n<td><strong>Novo.</strong> Os modelos de IA (E5 1,1 GB e reranker 2,2 GB): <code>python pipeline.py --baixar-modelos</code>, onde ficam (<code>HF_HOME</code>), e o pré-voo passou a dizer se estão no cache.</td>\n</tr>\n<tr class=\"even\">\n<td>14.4 e 15.4</td>\n<td><strong>Novo.</strong> Primeira configuração pelo Assistente: o cartão da aba «0 · Início» virou sete passos numerados (mais dois opcionais), com o passo atual em azul e botões que instalam o torch com o índice certo, instalam as bibliotecas, baixam os modelos e escolhem a pasta das bases; <code>HF_HOME</code> na aba «6 · Ambiente»; «Instalar o torch (GPU ou CPU)» executa em vez de só mostrar; subcomando <code>--modelos-ia</code>; roteiro do primeiro dia reescrito em sete passos e três abas; seis figuras novas (14.1 a 14.6) e as dez de 15.4 refeitas (15.1 a 15.10).</td>\n</tr>\n<tr class=\"odd\">\n<td>12, 25 e 26</td>\n<td>Ollama marcado como opcional; três problemas comuns novos; item 9 de 26 atualizado.</td>\n</tr>\n</tbody>\n</table>\n<p><em>Pipeline Lattes · Manual de referência · Versão 1.7 · CNPq × CNI</em></p>"}];
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   LABORATÓRIOS — as peças que só existem no HTML.

   Cada função monta um widget dentro de um <div class="lab" data-lab="nome">
   que o texto do manual traz como marcador. Nenhuma delas altera o conteúdo
   escrito: elas acrescentam uma forma de manipular o que o texto explica.

   Todos os números usados aqui são ilustrativos e coerentes com os exemplos
   do manual — não são medições da base real, que ainda não foi processada.
   ═══════════════════════════════════════════════════════════════════════════ */

const LABS = {};
const fmt = (n, c = 3) => n.toFixed(c).replace('.', ',');
const el = (t, cls, html) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};
function moldura(host, selo, titulo, sub) {
  host.innerHTML = '';
  const topo = el('div', 'lab-topo');
  topo.append(el('span', 'lab-selo', selo), el('span', 'lab-tit', titulo));
  if (sub) topo.append(el('span', 'lab-sub', sub));
  const corpo = el('div', 'lab-corpo');
  host.append(topo, corpo);
  return corpo;
}
function controle(rotulo, min, max, passo, valor, formatar) {
  const item = el('div', 'ctrl-item');
  const rot = el('div', 'ctrl-rot');
  const val = el('span', 'ctrl-val', formatar(valor));
  rot.append(el('span', '', rotulo), val);
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = passo; inp.value = valor;
  inp.setAttribute('aria-label', rotulo);
  item.append(rot, inp);
  return { item, inp, val, formatar };
}

/* ───────────────────────────────────────────────────────────────────────────
   1 · AS QUATRO ETAPAS — o caminho dos dados, clicável
   ─────────────────────────────────────────────────────────────────────────── */
const ETAPAS = [
  { n: 'ETAPA 1', t: 'Ingestão', d: 'arruma a casa',
    entra: '1_ENTRADA/ — XML, ZIP, CSV ou Parquet, no formato que vier',
    sai: '2_CURRICULOS/*.parquet — dez tabelas sempre iguais',
    arquivo: 'etapas/e01_ingestao.py', tempo: 'segundos a minutos',
    porque: 'Concentra toda a variação de formato num lugar só. Tudo o que vem depois enxerga uma estrutura única — e trocar a fonte de dados não afeta mais nada.',
    conferir: '5_RELATORIOS/1_ingestao.xlsx, aba RESUMO' },
  { n: 'ETAPA 2', t: 'Classificação', d: 'coloca rótulos',
    entra: 'as dez tabelas + o dicionário do domínio',
    sai: '3_CLASSIFICADO/LATTES_&lt;BLOCO&gt;.csv — um por bloco',
    arquivo: 'etapas/e02_classificacao.py', tempo: 'a mais demorada — domina o total',
    porque: 'É o coração do sistema: cada pedaço do currículo vira vetor, é comparado com o vetor de cada categoria e recebe um rótulo, se passar no limiar e na margem.',
    conferir: '5_RELATORIOS/2_classificacao.xlsx, aba QUALIDADE' },
  { n: 'ETAPA 3', t: 'Quantificação', d: 'conta os rótulos',
    entra: 'os CSVs classificados da etapa 2',
    sai: '4_RESULTADOS/quantificacao.parquet — uma linha por pesquisador',
    arquivo: 'etapas/e03_quantificacao.py', tempo: 'segundos',
    porque: 'Transforma milhares de linhas num retrato de uma linha por pessoa: predominante, concentração e diversidade. Contagem pura, sem peso e sem índice composto.',
    conferir: '5_RELATORIOS/3_quantificacao.xlsx' },
  { n: 'ETAPA 4', t: 'Vetorização', d: 'condensa num vetor',
    entra: 'tudo — tabelas, rótulos e contagens',
    sai: '4_RESULTADOS/curriculos_vetorizados.parquet — com o vetor',
    arquivo: 'etapas/e04_vetorizacao.py', tempo: 'minutos',
    porque: 'Condensa o currículo inteiro num texto único e o converte num vetor, gravado para uso posterior por qualquer aplicação que precise comparar perfis.',
    conferir: 'curriculos_vetorizados.xlsx (sai sem a coluna de vetor)' }
];

LABS.etapas = host => {
  const c = moldura(host, 'interativo', 'O caminho dos dados', 'clique numa etapa');
  const fluxo = el('div', 'fluxo');
  const painel = el('div', 'passo-corpo');
  painel.style.marginTop = '16px';
  const bts = ETAPAS.map((e, i) => {
    const b = el('button', 'et' + (i === 0 ? ' on' : ''),
      `<span class="n">${e.n}</span><span class="t">${e.t}</span><span class="d">${e.d}</span>`);
    b.onclick = () => { bts.forEach(x => x.classList.remove('on')); b.classList.add('on'); pinta(i); };
    fluxo.append(b);
    return b;
  });
  function pinta(i) {
    const e = ETAPAS[i];
    painel.innerHTML = `<h5>${e.n} · ${e.t}</h5>
      <p>${e.porque}</p>
      <table><tbody>
        <tr><td style="width:96px"><b>Entra</b></td><td>${e.entra}</td></tr>
        <tr><td><b>Sai</b></td><td>${e.sai}</td></tr>
        <tr><td><b>Arquivo</b></td><td><code>${e.arquivo}</code></td></tr>
        <tr><td><b>Tempo</b></td><td>${e.tempo}</td></tr>
        <tr><td><b>Conferir</b></td><td>${e.conferir}</td></tr>
      </tbody></table>`;
  }
  c.append(fluxo, painel);
  pinta(0);
  c.append(el('div', 'lab-nota',
    'As quatro rodam em fila e cada uma grava o próprio resultado em disco. Por isso dá para rodar só uma delas — <code>--etapas classificacao</code> — sem refazer as anteriores.'));
};

/* ───────────────────────────────────────────────────────────────────────────
   2 · LIMIAR E MARGEM — o simulador da decisão
   ─────────────────────────────────────────────────────────────────────────── */
const ITENS = [
  { t: 'Processo de obtenção de liga metálica resistente à corrosão', c1: 'Metalurgia e Siderurgia', s1: 0.842, c2: 'Metalmecânica e Bens de Capital', s2: 0.803 },
  { t: 'Engenheiro de Processos', c1: 'Engenharia de Processos e Manufatura', s1: 0.744, c2: 'Qualidade e Metrologia', s2: 0.731 },
  { t: 'Sistema embarcado para monitoramento de silos de grãos', c1: 'Internet das Coisas e Sensoriamento', s1: 0.871, c2: 'Automação e Instrumentação', s2: 0.812 },
  { t: 'Modelo preditivo de falhas em compressores industriais', c1: 'Ciência de Dados e IA', s1: 0.836, c2: 'Manutenção e Gestão de Ativos', s2: 0.829 },
  { t: 'Coordenador', c1: 'Gestão de Inovação', s1: 0.658, c2: 'Engenharia de Processos', s2: 0.641 },
  { t: 'Planta piloto para produção de hidrogênio por eletrólise', c1: 'Hidrogênio e Combustíveis de Baixo Carbono', s1: 0.889, c2: 'Eficiência Energética', s2: 0.774 },
  { t: 'Análise de fadiga em juntas soldadas de aço estrutural', c1: 'Materiais e Caracterização', s1: 0.807, c2: 'Metalmecânica e Bens de Capital', s2: 0.795 },
  { t: 'Treinamento de equipe, controle estatístico, soldagem e segurança', c1: 'Qualidade, Confiabilidade e Metrologia', s1: 0.792, c2: 'Engenharia de Processos e Manufatura', s2: 0.787 },
  { t: 'Bacharelado em Administração', c1: 'Gestão de Inovação', s1: 0.612, c2: 'Pesquisa Aplicada', s2: 0.588 },
  { t: 'Software de gêmeo digital para linha de montagem', c1: 'Gêmeo Digital e Simulação Avançada', s1: 0.864, c2: 'Robótica e Sistemas Autônomos', s2: 0.769 },
  { t: 'Patente: dispositivo de captura de CO₂ em gases de combustão', c1: 'Captura, Uso e Armazenamento de Carbono', s1: 0.918, c2: 'Química e Petroquímica Fina', s2: 0.801 }
];

LABS.decisao = host => {
  const c = moldura(host, 'simulador', 'Limiar e margem — veja a decisão mudar', 'arraste os controles');
  const ctrl = el('div', 'ctrl');
  const cl = controle('Limiar — o mínimo para aceitar', 0.5, 0.95, 0.01, 0.78, v => fmt(+v, 2));
  const cm = controle('Margem — distância mínima entre 1º e 2º', 0, 0.09, 0.005, 0.015, v => fmt(+v, 3));
  ctrl.append(cl.item, cm.item);

  const tabela = el('div', 'rolagem');
  const barras = el('div', 'barras');
  const nota = el('div', 'lab-nota');

  function calcula() {
    const L = +cl.inp.value, M = +cm.inp.value;
    cl.val.textContent = cl.formatar(L); cm.val.textContent = cm.formatar(M);
    let ok = 0, amb = 0, ind = 0;
    const linhas = ITENS.map(it => {
      const marg = it.s1 - it.s2;
      let est, chip;
      if (it.s1 < L) { est = 'Indefinido'; chip = 'ind'; ind++; }
      else if (marg < M) { est = 'ambíguo'; chip = 'amb'; amb++; }
      else { est = it.c1; chip = 'ok'; ok++; }
      return `<tr>
        <td style="max-width:280px">${it.t}</td>
        <td class="num">${fmt(it.s1)}</td>
        <td class="num ${marg < M ? '' : 'apagado'}">${fmt(marg)}</td>
        <td><span class="chip ${chip}">${est}</span></td></tr>`;
    }).join('');
    tabela.innerHTML = `<table><thead><tr>
      <th>Texto do currículo</th><th>Nota 1º</th><th>Margem</th><th>Resultado</th>
      </tr></thead><tbody>${linhas}</tbody></table>`;

    const n = ITENS.length;
    const b = (rot, v, cor) => `<div class="barra">
      <div class="barra-rot"><span>${rot}</span><b>${Math.round(100 * v / n)}%</b></div>
      <div class="barra-tri"><i style="width:${100 * v / n}%;background:${cor}"></i></div></div>`;
    barras.innerHTML = b('classificados', ok, 'var(--verde)') +
      b('ambíguos', amb, 'var(--cobre)') + b('indefinidos', ind, 'var(--tinta-3)');

    let msg = '';
    if (ind / n > 0.4) msg = '<b>Indefinido acima de 40%.</b> No relatório, isso significa que a taxonomia não cobre o material — ou que o limiar está alto demais para o modelo em uso. Ver 20.2.';
    else if (amb / n > 0.3) msg = '<b>Ambíguo acima de 30%.</b> Suspeite da margem antes de suspeitar das glosas: é a causa mais frequente e a mais fácil de corrigir. Ver 20.3.';
    else msg = 'Taxas dentro do esperado. Com <b>limiar 0,78</b> e <b>margem 0,015</b> — os padrões do projeto — repare quais itens ficam de fora: são os textos curtos, exatamente como descrito em 7.5.';
    nota.innerHTML = msg + ' <i>Os dez itens são ilustrativos e coerentes com os exemplos do manual.</i>';
  }
  cl.inp.oninput = calcula; cm.inp.oninput = calcula;
  c.append(ctrl, tabela, barras, nota);
  calcula();
};

/* ───────────────────────────────────────────────────────────────────────────
   3 · TOP-K E O DESEMPATE
   ─────────────────────────────────────────────────────────────────────────── */
const CANDIDATOS = [
  { c: 'Metalurgia e Siderurgia', bi: 0.842, cross: 0.61 },
  { c: 'Metalmecânica e Bens de Capital', bi: 0.838, cross: 0.44 },
  { c: 'Automotiva e Mobilidade', bi: 0.791, cross: 0.22 },
  { c: 'Mineração e Beneficiamento Mineral', bi: 0.774, cross: 0.18 },
  { c: 'Química e Petroquímica Fina', bi: 0.762, cross: 0.09 },
  { c: 'Materiais e Caracterização', bi: 0.759, cross: 0.93 },
  { c: 'Alimentos e Bebidas', bi: 0.655, cross: 0.04 },
  { c: 'Têxtil, Couro e Calçados', bi: 0.601, cross: 0.02 }
];
const CERTO = 'Materiais e Caracterização';

LABS.topk = host => {
  const c = moldura(host, 'simulador', 'Top-K e o desempate', 'mude o K e rode o cross-encoder');
  const ctrl = el('div', 'ctrl');
  const ck = controle('K — quantos candidatos seguem para o desempate', 1, 8, 1, 5, v => v);
  ctrl.append(ck.item);
  const linha = el('div', 'btn-linha');
  const bRodar = el('button', 'btn acento', 'Rodar o desempate');
  const bVoltar = el('button', 'btn', 'Recomeçar');
  linha.append(bRodar, bVoltar);
  ctrl.append(el('div', 'ctrl-item'));
  const tabela = el('div', 'rolagem');
  const nota = el('div', 'lab-nota');
  let rodou = false;

  function pinta() {
    const K = +ck.inp.value;
    ck.val.textContent = K;
    const base = CANDIDATOS.slice();
    const sel = base.slice(0, K);
    let ordem = base;
    if (rodou) {
      const reord = sel.slice().sort((a, b) => b.cross - a.cross);
      ordem = reord.concat(base.slice(K));
    }
    tabela.innerHTML = `<table><thead><tr>
      <th style="width:34px">#</th><th>Categoria candidata</th>
      <th>Nota do bi-encoder</th><th>${rodou ? 'Nota do cross-encoder' : 'No top-K?'}</th>
      </tr></thead><tbody>${ordem.map((r, i) => {
      const dentro = rodou ? i < K : base.indexOf(r) < K;
      const vencedor = i === 0 && dentro;
      return `<tr class="${vencedor ? 'destaque' : ''}">
        <td class="num">${i + 1}</td>
        <td class="${dentro ? '' : 'apagado'}">${r.c}${r.c === CERTO ? ' <span class="chip neutro">rótulo correto</span>' : ''}</td>
        <td class="num ${dentro ? '' : 'apagado'}">${fmt(r.bi)}</td>
        <td>${rodou
          ? (dentro ? `<span class="num">${fmt(r.cross, 2)}</span>${vencedor ? ' <span class="chip ok">vence</span>' : ''}` : '<span class="apagado">—</span>')
          : (dentro ? '<span class="chip neutro">sim</span>' : '<span class="chip ind">fora</span>')}</td>
      </tr>`;
    }).join('')}</tbody></table>`;

    const K2 = +ck.inp.value;
    const posCerto = CANDIDATOS.findIndex(x => x.c === CERTO) + 1;
    let msg;
    if (!rodou) {
      msg = `O bi-encoder pôs <b>${CANDIDATOS[0].c}</b> em primeiro, por 0,004 de vantagem. O rótulo correto — <b>${CERTO}</b> — está em ${posCerto}º lugar. Com <b>K = ${K2}</b>, ele ${K2 >= posCerto ? '<b>entra</b> na lista que vai ao desempate' : '<b>fica de fora</b>, e o desempate não terá como escolhê-lo'}.`;
    } else if (K2 >= posCerto) {
      msg = `<b>O desempate corrigiu a decisão.</b> O cross-encoder leu cada par (texto + definição da categoria) junto e deu 0,93 a <b>${CERTO}</b>, contra 0,61 do primeiro colocado do bi-encoder. É exatamente para isso que ele existe: o bi-encoder nunca lê os dois textos ao mesmo tempo.`;
    } else {
      msg = `<b>O desempate não teve como acertar.</b> Com K = ${K2}, o rótulo correto (${posCerto}º) nem chegou ao cross-encoder. É o custo de um K pequeno demais — e a razão de o padrão do projeto ser 5.`;
    }
    nota.innerHTML = msg + ' <i>Notas ilustrativas; a escala do cross-encoder é diferente da do bi-encoder de propósito — só a ordem importa.</i>';
    bRodar.disabled = rodou;
  }
  ck.inp.oninput = () => { rodou = false; pinta(); };
  bRodar.onclick = () => { rodou = true; pinta(); };
  bVoltar.onclick = () => { rodou = false; pinta(); };
  c.append(ctrl, linha, el('div', '', '<div style="height:14px"></div>'), tabela, nota);
  pinta();
};

/* ───────────────────────────────────────────────────────────────────────────
   4 · NORMALIZAÇÃO DOS VETORES
   ─────────────────────────────────────────────────────────────────────────── */
LABS.normalizacao = host => {
  const c = moldura(host, 'simulador', 'Normalização — a mesma direção, comprimentos diferentes', 'com e sem');
  const ctrl = el('div', 'ctrl');
  const cf = controle('Tamanho do texto B (múltiplo do A)', 1, 15, 1, 10, v => v + '×');
  ctrl.append(cf.item);
  const linha = el('div', 'btn-linha');
  const bSem = el('button', 'btn on', 'Sem normalizar');
  const bCom = el('button', 'btn', 'Com normalização');
  linha.append(bSem, bCom);
  let normalizado = false;

  const plano = el('div', 'plano');
  const svgWrap = el('div');
  const lado = el('div');
  plano.append(svgWrap, lado);
  const nota = el('div', 'lab-nota');

  const O = { x: 34, y: 266 }, EIXO = 232;
  const CORES = { A: '#2C5282', B: '#B05A22', M: '#1F6B4A', T: '#5B4B8A' };

  function desenha() {
    const f = +cf.inp.value;
    cf.val.textContent = cf.formatar(f);
    const V = {
      A: [3, 1], B: [3 * f, 1 * f], M: [4, 1], T: [1, 4]
    };
    const norma = v => Math.sqrt(v[0] * v[0] + v[1] * v[1]);
    const unit = v => { const n = norma(v); return [v[0] / n, v[1] / n]; };
    const mostra = {};
    let escala;
    if (normalizado) {
      escala = EIXO * 0.86;
      for (const k in V) mostra[k] = unit(V[k]).map(x => x * escala);
      // A e B viram exatamente a mesma seta — é o ponto do exercício.
    } else {
      const maxc = Math.max(...Object.values(V).flat());
      escala = (EIXO * 0.86) / maxc;
      for (const k in V) mostra[k] = V[k].map(x => x * escala);
    }
    // O rótulo sai deslocado na perpendicular à seta: em «sem normalizar» os
    // quatro vetores apontam quase para o mesmo lado, e sem esse desvio os
    // textos se sobrepõem exatamente onde o leitor precisa ler.
    const seta = (k, rot, desvio) => {
      const [x, y] = mostra[k];
      const comp = Math.hypot(x, y) || 1;
      const px = -y / comp, py = x / comp;                 // perpendicular unitária
      const lx = O.x + x + (x / comp) * 9 + px * desvio;
      const ly = O.y - y - (y / comp) * 9 - py * desvio;
      const anc = x > 150 ? 'end' : 'start';
      return `<line class="seta" x1="${O.x}" y1="${O.y}" x2="${O.x + x}" y2="${O.y - y}"
        stroke="${CORES[k]}" stroke-width="2.4" stroke-linecap="round" marker-end="url(#p${k})"/>
        <circle class="seta" cx="${O.x + x}" cy="${O.y - y}" r="2.6" fill="${CORES[k]}"/>
        <text class="seta" x="${lx}" y="${ly}" font-size="10.5" font-weight="750"
        text-anchor="${anc}" fill="${CORES[k]}">${rot}</text>`;
    };
    const pontas = Object.entries(CORES).map(([k, cor]) =>
      `<marker id="p${k}" markerWidth="7" markerHeight="7" refX="5.4" refY="3" orient="auto">
         <path d="M0,0 L6,3 L0,6 z" fill="${cor}"/></marker>`).join('');
    const circulo = normalizado
      ? `<circle cx="${O.x}" cy="${O.y}" r="${EIXO * 0.86}" fill="none"
           stroke="var(--linha)" stroke-width="1.2" stroke-dasharray="3 4"/>` : '';
    svgWrap.innerHTML = `<svg viewBox="0 0 300 300" role="img"
      aria-label="Plano com os vetores dos dois textos e das duas categorias">
      <defs>${pontas}</defs>
      <line x1="${O.x}" y1="${O.y}" x2="${O.x + EIXO}" y2="${O.y}" stroke="var(--linha)" stroke-width="1.2"/>
      <line x1="${O.x}" y1="${O.y}" x2="${O.x}" y2="${O.y - EIXO}" stroke="var(--linha)" stroke-width="1.2"/>
      <text x="${O.x + EIXO - 4}" y="${O.y + 15}" font-size="9.5" fill="var(--tinta-3)" text-anchor="end">metalurgia →</text>
      <text x="${O.x - 6}" y="${O.y - EIXO + 6}" font-size="9.5" fill="var(--tinta-3)" transform="rotate(-90 ${O.x - 6} ${O.y - EIXO + 6})" text-anchor="end">automação →</text>
      ${circulo}
      ${seta('M', 'Metalurgia', -15)}${seta('T', 'Automação', 12)}
      ${normalizado
        ? seta('B', 'Texto A = Texto B', 16)
        : seta('B', 'Texto B', 14) + seta('A', 'Texto A', 16)}
    </svg>`;

    const escalar = (a, b) => a[0] * b[0] + a[1] * b[1];
    const cos = (a, b) => escalar(a, b) / (norma(a) * norma(b));
    const casas = normalizado ? 3 : 1;
    const val = (a, b) => normalizado ? fmt(cos(a, b), 3) : fmt(escalar(a, b), casas);
    lado.innerHTML = `
      <div class="legenda" style="margin-bottom:12px">
        <i style="background:${CORES.A}"></i><b>Texto A</b> — "Soldagem de aços", 3 palavras &nbsp;<span class="num">(${V.A[0]} ; ${V.A[1]})</span><br>
        <i style="background:${CORES.B}"></i><b>Texto B</b> — o mesmo assunto, ${f}× mais longo &nbsp;<span class="num">(${V.B[0]} ; ${V.B[1]})</span><br>
        <i style="background:${CORES.M}"></i><b>Categoria «Metalurgia»</b> &nbsp;<span class="num">(4 ; 1)</span><br>
        <i style="background:${CORES.T}"></i><b>Categoria «Automação»</b> &nbsp;<span class="num">(1 ; 4)</span>
      </div>
      <table><thead><tr><th></th><th>Metalurgia</th><th>Automação</th><th>Comprimento</th></tr></thead>
      <tbody>
        <tr><td><b>Texto A</b></td><td class="num">${val(V.A, V.M)}</td><td class="num">${val(V.A, V.T)}</td><td class="num">${normalizado ? '1,000' : fmt(norma(V.A), 2)}</td></tr>
        <tr><td><b>Texto B</b></td><td class="num">${val(V.B, V.M)}</td><td class="num">${val(V.B, V.T)}</td><td class="num">${normalizado ? '1,000' : fmt(norma(V.B), 2)}</td></tr>
      </tbody></table>`;

    if (normalizado) {
      nota.innerHTML = `<b>Com normalização, A e B são o mesmo vetor.</b> Cada um foi dividido pelo próprio comprimento — ${fmt(norma(V.A), 2)} e ${fmt(norma(V.B), 2)} — e os dois caíram exatamente sobre o mesmo ponto do círculo de raio 1. As notas ficaram idênticas, entre 0 e 1, e o limiar volta a significar a mesma coisa para os dois. Arraste o tamanho de B: nada muda.`;
    } else {
      nota.innerHTML = `<b>Sem normalizar, o tamanho vira nota.</b> B é ${f}× mais longo e recebe notas ${f}× maiores — inclusive na categoria errada: ${fmt(escalar(V.B, V.T), 1)} em «Automação», contra ${fmt(escalar(V.A, V.M), 1)} que A obteve na categoria <i>certa</i>. Com um limiar fixo em 20, A seria descartado e B aceito nas duas. Aumente o multiplicador e veja o absurdo crescer.`;
    }
  }
  bSem.onclick = () => { normalizado = false; bSem.classList.add('on'); bCom.classList.remove('on'); desenha(); };
  bCom.onclick = () => { normalizado = true; bCom.classList.add('on'); bSem.classList.remove('on'); desenha(); };
  cf.inp.oninput = desenha;
  c.append(ctrl, linha, el('div', '', '<div style="height:16px"></div>'), plano, nota);
  desenha();
};

  { k: 'atuacao', n: 'Atuação', v: 8, cor: '#B05A22' },
  { k: 'producao_tec', n: 'Produção técnica', v: 10, cor: '#1F6B4A' },
  { k: 'projetos', n: 'Projetos', v: 5, cor: '#5B4B8A' },
  { k: 'formacao', n: 'Formação', v: 6, cor: '#14607A' },
  { k: 'publicacoes', n: 'Publicações', v: 10, cor: '#8A5B2B' },

];

LABS.pesos = host => {
  const c = moldura(host, 'simulador', 'A composição do texto consolidado', 'mude os pesos');
  const grade = el('div', 'ctrl');
  const faixa = el('div');
  faixa.style.cssText = 'display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--linha);margin:6px 0 14px';
  const nota = el('div', 'lab-nota');
  const vals = PESOS.map(p => p.v);

  const ctrls = PESOS.map((p, i) => {
    const cc = controle(p.n, 0, 20, 1, p.v, v => v + ' itens');
    cc.inp.oninput = () => { vals[i] = +cc.inp.value; cc.val.textContent = cc.formatar(vals[i]); pinta(); };
    grade.append(cc.item);
    return cc;
  });

  function pinta() {
    const total = vals.reduce((a, b) => a + b, 0) || 1;
    faixa.innerHTML = PESOS.map((p, i) => vals[i] === 0 ? '' :
      `<div title="${p.n}: ${vals[i]} itens" style="flex:${vals[i]};background:${p.cor};
        display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;
        font-weight:650;overflow:hidden;white-space:nowrap;transition:flex .3s">
        ${100 * vals[i] / total > 11 ? p.n : ''}</div>`).join('');
    const ordenado = PESOS.map((p, i) => ({ ...p, v: vals[i] })).filter(p => p.v > 0);
    const primeiro = ordenado[0], maior = ordenado.slice().sort((a, b) => b.v - a.v)[0];
    nota.innerHTML = `O número é <b>quantos itens</b> daquele bloco entram no texto consolidado — mais itens, mais espaço, mais peso no vetor final.
      <b>A ordem importa tanto quanto os números</b>, porque modelos de vetores dão mais importância ao início do texto e truncam o fim quando ele fica longo.
      Hoje o texto começa por <b>${primeiro ? primeiro.n : '—'}</b> e o bloco com mais espaço é <b>${maior ? maior.n : '—'}</b> (${maier(maior)} do total).
      Para um uso acadêmico, faria sentido subir <i>publicações</i> e descer <i>produção técnica</i> — é uma linha de configuração, não uma reescrita.`;
    function maier(m) { return m ? Math.round(100 * m.v / total) + '%' : '0%'; }
  }
  c.append(grade, faixa, nota);
  pinta();
};

/* ───────────────────────────────────────────────────────────────────────────

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   APLICAÇÃO — montagem das partes, sumário, busca e os acréscimos do HTML.
   Arquivo único, sem servidor e sem CDN: abre com dois cliques e funciona
   offline, inclusive dentro de um anexo de e-mail.
   ═══════════════════════════════════════════════════════════════════════════ */

const CURTO = {
  "Como ler este manual": "Início",
  "PARTE I — ENTENDER": "I · Entender",
  "PARTE II — INSTALAR E USAR": "II · Instalar",
  "PARTE III — AS ETAPAS EM DETALHE": "III · Etapas",
  "PARTE IV — CALIBRAR": "IV · Calibrar",
  "PARTE V — ADAPTAR E OPERAR": "V · Operar"
};

const NUDGES = [
  ["EM UMA FRASE", "n-frase"], ["ANALOGIA", "n-analogia"], ["NA PRÁTICA", "n-pratica"],
  ["ATENÇÃO", "n-atencao"], ["CONFIRA", "n-confira"], ["LEMBRE-SE", "n-lembre"],
  ["NO TERMINAL", "n-terminal"], ["NO NOTEBOOK", "n-terminal"],
  ["NO TERMINAL / NO NOTEBOOK", "n-terminal"]
];

/* As entradas do que mudou na 1.7 — viram atalhos na capa. */
const MUDOU = [
  ["8.1", "Instalar o Python (Windows)", 2],
  ["9.3", "O PyTorch que funciona no 3.13", 2],
  ["14.2", "Os modelos de IA, antes da estreia", 2],
  ["14.4", "Primeira configuração pelo Assistente", 2],
  ["31", "O que mudou na 1.7", 5]
];

const capaHTML = `
<div class="capa">
  <div class="inst">CNPq &nbsp;·&nbsp; CNI</div>
  <div class="inst-sub">Conselho Nacional de Desenvolvimento Científico e Tecnológico<br>
  Confederação Nacional da Indústria</div>
  <h1>Pipeline Lattes</h1>
  <p class="lead">Classificação e quantificação de perfis a partir do Currículo Lattes</p>
  <div class="regua"></div>
  <div class="meta">MANUAL DE REFERÊNCIA &nbsp;·&nbsp; VERSÃO 1.7 &nbsp;·&nbsp; SETEMBRO DE 2026</div>
  <div class="mudou">
    <h3>Novo na versão 1.7</h3>
    <p>A 1.7 é a da primeira configuração, para quem nunca instalou nada: o Python passo a passo
       (8.1), o comando do PyTorch que funciona no Python 3.13 (9.3) e os modelos de IA baixados
       antes da primeira execução (14.2). Pelo Assistente, a aba «0 · Início» virou nove passos
       numerados (dois opcionais), com o passo atual em azul e botões que instalam, baixam e
       configuram (14.4).
       O Ollama passou a opcional, e há três problemas comuns novos (25).
       Esta edição em HTML acrescenta simuladores que o Word não comporta:
       arraste o limiar e veja a decisão mudar, normalize vetores no plano,
       percorra a matriz de cruzamentos. O texto é o mesmo do documento.</p>
    <div class="mudou-lista" id="mudouLista"></div>
  </div>
  <div class="rgb">RGB</div>
</div>`;

let atual = 0;

/* ── Nudges: converte as citações do markdown em caixas coloridas ────────── */
function aplicarNudges(raiz) {
  raiz.querySelectorAll('blockquote').forEach(bq => {
    const texto = bq.textContent.trim();
    const achado = NUDGES.find(([r]) => texto.startsWith(r));
    const div = document.createElement('div');
    div.className = 'nudge ' + (achado ? achado[1] : 'n-lembre');
    if (achado) {
      const rotulo = achado[0];
      const p1 = bq.querySelector('p');
      if (p1) {
        p1.innerHTML = p1.innerHTML
          .replace(new RegExp('^\\s*<strong>' + rotulo + '</strong>\\s*(—|-|–)?\\s*'),
            `<span class="rot">${rotulo}</span>`)
          .replace(new RegExp('^' + rotulo + '\\s*(—|-|–)?\\s*'),
            `<span class="rot">${rotulo}</span>`);
      }
    }
    while (bq.firstChild) div.appendChild(bq.firstChild);
    bq.replaceWith(div);
    div.dataset.rot = achado ? achado[0] : '';
  });
}

/* ── Abas terminal ↔ notebook ────────────────────────────────────────────
   O manual mostra o mesmo comando nas duas formas de operar. No papel eles
   ficam empilhados; aqui ocupam o mesmo espaço, e a comparação é imediata.

   Dois formatos são reconhecidos:
     A) uma única caixa contendo "NO TERMINAL" e "NO NOTEBOOK";
     B) um parágrafo em negrito "NO TERMINAL…" seguido de código, e depois
        um parágrafo "NO NOTEBOOK…" seguido de código.                       */

function rotuloDuo(txt) {
  const t = txt.replace(/\s+/g, ' ').trim();
  const extra = t.replace(/^NO (TERMINAL|NOTEBOOK)\s*/i, '')
    .replace(/^[—–-]\s*/, '').replace(/^\((.*)\)$/, '$1').trim();
  const base = /^NO TERMINAL/i.test(t) ? 'Terminal' : 'Notebook';
  if (!extra) return base === 'Terminal' ? 'Terminal · PowerShell' : 'Jupyter Notebook';
  return base + ' · ' + extra.charAt(0).toLowerCase() + extra.slice(1);
}

function criarDuo(pares) {
  const duo = document.createElement('div');
  duo.className = 'duo';
  const abas = document.createElement('div'); abas.className = 'duo-abas';
  const corpo = document.createElement('div'); corpo.className = 'duo-corpo';
  pares.forEach(([rot, nos], i) => {
    const b = document.createElement('button');
    b.className = 'duo-aba' + (i === 0 ? ' on' : '');
    b.type = 'button'; b.textContent = rot;
    const painel = document.createElement('div');
    if (i === 0) painel.className = 'on';
    nos.forEach(n => painel.appendChild(n));
    b.onclick = () => {
      abas.querySelectorAll('.duo-aba').forEach(x => x.classList.remove('on'));
      [...corpo.children].forEach(x => x.classList.remove('on'));
      b.classList.add('on'); painel.classList.add('on');
    };
    abas.appendChild(b); corpo.appendChild(painel);
  });
  duo.append(abas, corpo);
  return duo;
}

function montarDuos(raiz) {
  /* ── formato A: uma caixa só, com os dois rótulos dentro ───────────── */
  [...raiz.querySelectorAll('.nudge')].forEach(cx => {
    if (!/^NO TERMINAL/i.test(cx.textContent.trim())) return;
    const filhos = [...cx.children];
    const corte = filhos.findIndex(f => /^NO NOTEBOOK/i.test(f.textContent.trim()));
    if (corte < 1) return;
    const rotT = cx.querySelector('.rot');
    const rotN = filhos[corte].textContent.trim();
    if (rotT) rotT.remove();
    const antes = filhos.slice(1, corte).filter(f => f.textContent.trim() || f.tagName === 'PRE');
    const depois = filhos.slice(corte + 1).filter(f => f.textContent.trim() || f.tagName === 'PRE');
    const primeiro = filhos[0];
    if (!primeiro.textContent.trim()) primeiro.remove(); else antes.unshift(primeiro);
    if (!antes.length || !depois.length) return;
    cx.replaceWith(criarDuo([[rotuloDuo('NO TERMINAL'), antes], [rotuloDuo(rotN), depois]]));
  });

  /* ── formato B: parágrafos em negrito, cada um seguido de código ────── */
  const ehMarca = (n, palavra) => n && n.tagName === 'P' &&
    n.children.length === 1 && n.children[0].tagName === 'STRONG' &&
    new RegExp('^NO ' + palavra, 'i').test(n.textContent.trim());
  const juntarPres = n => {
    const out = [];
    while (n && (n.tagName === 'PRE' || n.tagName === 'UL' || n.tagName === 'OL')) {
      out.push(n); n = n.nextElementSibling;
    }
    return [out, n];
  };

  let no = raiz.firstElementChild;
  while (no) {
    const seguinte = no.nextElementSibling;
    if (ehMarca(no, 'TERMINAL')) {
      const rotT = rotuloDuo(no.textContent);
      const [presT, apos] = juntarPres(no.nextElementSibling);
      if (presT.length && ehMarca(apos, 'NOTEBOOK')) {
        const rotN = rotuloDuo(apos.textContent);
        const [presN, fim] = juntarPres(apos.nextElementSibling);
        if (presN.length) {
          const duo = criarDuo([[rotT, presT], [rotN, presN]]);
          no.parentNode.insertBefore(duo, no);
          no.remove(); apos.remove();
          no = fim; continue;
        }
      }
    }
    no = seguinte;
  }
}

/* ── Tabelas roláveis ────────────────────────────────────────────────────
   As tabelas do manual têm muitas colunas. Num telefone elas empurrariam a
   página inteira para o lado; embrulhadas, rolam sozinhas.                  */
function montarTabelas(raiz) {
  raiz.querySelectorAll('table').forEach(t => {
    if (t.closest('.lab, .rolagem')) return;
    const caixa = document.createElement('div');
    caixa.className = 'rolagem-tab';
    t.parentNode.insertBefore(caixa, t);
    caixa.appendChild(t);
  });
}

/* ── Botão de copiar em cada bloco de código ────────────────────────────── */
function montarCopiar(raiz) {
  raiz.querySelectorAll('pre').forEach(pre => {
    if (pre.closest('.lab')) return;
    const caixa = document.createElement('div');
    caixa.className = 'pre-caixa';
    pre.parentNode.insertBefore(caixa, pre);
    caixa.appendChild(pre);
    const b = document.createElement('button');
    b.className = 'copiar'; b.type = 'button'; b.textContent = 'copiar';
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(pre.innerText); }
      catch (e) {
        const t = document.createElement('textarea');
        t.value = pre.innerText; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); } catch (_) { }
        t.remove();
      }
      b.textContent = 'copiado'; b.classList.add('feito');
      setTimeout(() => { b.textContent = 'copiar'; b.classList.remove('feito'); }, 1600);
    };
    caixa.appendChild(b);
  });
}

/* ── Laboratórios ───────────────────────────────────────────────────────── */
function montarLabs(raiz) {
  raiz.querySelectorAll('[data-lab]').forEach(host => {
    const nome = host.dataset.lab;
    host.classList.add('lab');
    if (LABS[nome]) {
      try { LABS[nome](host); }
      catch (e) { host.innerHTML = '<div class="lab-corpo">Não foi possível montar este painel.</div>'; }
    }
  });
}

/* ── Sumário lateral ────────────────────────────────────────────────────── */
function montarSumario(painel) {
  const alvo = document.getElementById('sumario');
  const itens = painel.querySelectorAll('h2, h3');
  alvo.innerHTML = '';
  itens.forEach((h, i) => {
    if (!h.id) h.id = 'sec-' + atual + '-' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'n3';
    a.addEventListener('click', e => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', '#' + h.id);
    });
    alvo.appendChild(a);
  });
  observarTitulos(itens);
}

let observador = null;
function observarTitulos(itens) {
  if (typeof IntersectionObserver === 'undefined') return;
  if (observador) observador.disconnect();
  const links = [...document.querySelectorAll('#sumario a')];
  observador = new IntersectionObserver(entradas => {
    entradas.forEach(e => {
      if (e.isIntersecting) {
        const i = [...itens].indexOf(e.target);
        links.forEach(l => l.classList.remove('ativo'));
        if (links[i]) {
          links[i].classList.add('ativo');
          const cx = document.querySelector('aside');
          if (cx && links[i].offsetTop > cx.scrollTop + cx.clientHeight - 40)
            cx.scrollTop = links[i].offsetTop - cx.clientHeight / 2;
        }
      }
    });
  }, { rootMargin: '-140px 0px -72% 0px' });
  itens.forEach(h => observador.observe(h));
}

/* ── Troca de parte ─────────────────────────────────────────────────────── */
function mostrar(i, rolarTopo = true) {
  atual = i;
  const cont = document.getElementById('conteudo');
  cont.innerHTML = (i === 0 ? capaHTML : '') +
    `<div class="painel ativo" id="painel">${PARTES[i].html}</div>`;
  const painel = document.getElementById('painel');
  aplicarNudges(painel);
  montarDuos(painel);
  montarLabs(painel);
  montarTabelas(painel);
  montarCopiar(painel);
  montarSumario(painel);
  montarRodape(painel);
  if (i === 0) montarMudou();

  document.querySelectorAll('.aba').forEach((b, j) =>
    b.setAttribute('aria-selected', j === i ? 'true' : 'false'));
  if (rolarTopo) window.scrollTo({ top: 0, behavior: 'instant' });
  const campo = document.getElementById('campoBusca');
  if (campo.value) buscar();
}

/* ── Atalhos "novo na 1.7" ──────────────────────────────────────────────── */
function montarMudou() {
  const alvo = document.getElementById('mudouLista');
  if (!alvo) return;
  alvo.innerHTML = '';
  MUDOU.forEach(([num, txt, parte]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<b>${num}</b> · ${txt}`;
    b.onclick = () => irPara(parte, num);
    alvo.appendChild(b);
  });
}

/* Vai para uma parte e rola até a seção cujo título começa com `num`. */
function irPara(parte, num) {
  mostrar(parte, true);
  setTimeout(() => {
    const painel = document.getElementById('painel');
    const alvo = [...painel.querySelectorAll('h2, h3')]
      .find(h => h.textContent.trim().replace('·', '').startsWith(num + ' ') ||
        h.textContent.trim().startsWith(num + '.') ||
        h.textContent.trim().startsWith(num + ' '));
    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 90);
}

function montarRodape(painel) {
  const nav = document.createElement('div');
  nav.className = 'rodape-nav';
  const ant = document.createElement('button');
  ant.disabled = atual === 0;
  ant.innerHTML = `<span class="l">Anterior</span><span class="t">${atual > 0 ? CURTO[PARTES[atual - 1].titulo] : '—'}</span>`;
  ant.onclick = () => mostrar(atual - 1);
  const prox = document.createElement('button');
  prox.className = 'dir';
  prox.disabled = atual === PARTES.length - 1;
  prox.innerHTML = `<span class="l">Próxima</span><span class="t">${atual < PARTES.length - 1 ? CURTO[PARTES[atual + 1].titulo] : '—'}</span>`;
  prox.onclick = () => mostrar(atual + 1);
  nav.append(ant, prox);
  painel.appendChild(nav);
}

/* ── Busca dentro da parte visível ──────────────────────────────────────── */
function limparMarcas(raiz) {
  raiz.querySelectorAll('mark').forEach(m => {
    const pai = m.parentNode;
    pai.replaceChild(document.createTextNode(m.textContent), m);
    pai.normalize();
  });
}
function buscar() {
  const termo = document.getElementById('campoBusca').value.trim();
  const painel = document.getElementById('painel');
  if (!painel) return;
  limparMarcas(painel);
  const cont = document.getElementById('contaBusca');
  if (termo.length < 2) { cont.textContent = ''; return; }
  const re = new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  const andar = document.createTreeWalker(painel, NodeFilter.SHOW_TEXT);
  const nos = [];
  while (andar.nextNode()) {
    const n = andar.currentNode;
    if (n.parentElement.closest('script, .rot, .lab')) continue;
    if (re.test(n.nodeValue)) nos.push(n);
  }
  nos.forEach(n => {
    const span = document.createElement('span');
    span.innerHTML = n.nodeValue.replace(re, '<mark>$1</mark>');
    n.parentNode.replaceChild(span, n);
  });
  const achados = painel.querySelectorAll('mark');
  cont.textContent = achados.length ? `${achados.length} nesta parte` : 'nada nesta parte';
  if (achados[0] && achados[0].scrollIntoView)
    achados[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ── Inicialização ──────────────────────────────────────────────────────── */
const abas = document.getElementById('abas');
PARTES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'aba'; b.setAttribute('role', 'tab'); b.type = 'button';
  b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  b.textContent = CURTO[p.titulo] || p.titulo;
  b.onclick = () => mostrar(i);
  abas.appendChild(b);
});

document.getElementById('btnTema').onclick = e => {
  const esc = document.documentElement.dataset.tema === 'escuro';
  document.documentElement.dataset.tema = esc ? '' : 'escuro';
  e.target.textContent = esc ? 'Escuro' : 'Claro';
};
document.getElementById('btnImprimir').onclick = () => window.print();
document.getElementById('campoBusca').addEventListener('input', () => {
  clearTimeout(window._t); window._t = setTimeout(buscar, 240);
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' && atual < PARTES.length - 1) mostrar(atual + 1);
  if (e.key === 'ArrowLeft' && atual > 0) mostrar(atual - 1);
  if (e.key === '/') { e.preventDefault(); document.getElementById('campoBusca').focus(); }
});

/* Barra de progresso de leitura. */
const barraProg = document.getElementById('progresso');
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  barraProg.style.width = (h > 0 ? Math.min(100, 100 * window.scrollY / h) : 0) + '%';
}, { passive: true });

mostrar(0);

</script>
