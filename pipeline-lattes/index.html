 antes de tirar qualquer conclusão sobre essa pessoa.</p>\n</blockquote>\n<h3 id=\"os-dois-caminhos-possíveis-e-por-que-nenhum-deles-deve-ser-tomado-agora\">7.6 · Os dois caminhos possíveis — e por que nenhum deles deve ser tomado agora</h3>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Leia esta caixa antes de ler os dois caminhos.</strong> Nenhum dos dois está implementado, e isso é uma <strong>decisão</strong>, não um esquecimento. Eles só devem ser considerados se, e somente se, a calibração da seção 21 <strong>demonstrar com números</strong> que as classificações estão destoando da realidade de forma relevante. Não se mexe num método que funciona por causa de uma limitação conhecida e documentada: mexer sem medida é trocar um problema que se entende por um problema que não se entende.</p>\n</blockquote>\n<p>O método atual tem limitações — todas as descritas em 7.5 — e ainda assim ele é o método. Ele é determinístico, auditável, reproduzível e explicável a um comitê. Cada um desses atributos custou uma decisão de projeto, e cada acréscimo de esperteza cobra um pedaço deles de volta. A postura correta é <strong>confiar no método, sabendo das suas limitações</strong>, e só alterá-lo diante de evidência.</p>\n<p><strong>O gatilho para reabrir a discussão.</strong> Faça a medição descrita em 21 e separe as linhas por faixa de tamanho:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Faixa</th>\n<th>Taxa de <code>Indefinido</code> observada</th>\n<th>Leitura</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1 a 5 palavras</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>6 a 20 palavras</td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>21 palavras ou mais</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>Se a taxa da faixa curta for <strong>próxima</strong> das demais, a limitação é teórica e nada deve ser feito. Se ela for <strong>desproporcional</strong> — muitas vezes maior, a ponto de deixar um grupo de pesquisadores sistematicamente sub-representado — então, e só então, um dos dois caminhos abaixo se justifica.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Sem a amostra rotulada da seção 21, “está destoando da realidade” é impressão, não medida. Impressão não é motivo suficiente para mudar o classificador.</p>\n</blockquote>\n<p>Os dois caminhos ficam documentados aqui porque a análise já foi feita — e uma análise registrada é mais barata que uma análise refeita daqui a um ano. Ambos são mensuráveis contra a amostra de calibração antes de qualquer decisão.</p>\n<p><strong>Caminho A — limiar em função do tamanho.</strong></p>\n<p>Em vez de dois valores fixos por bloco, uma função contínua que exige mais de textos curtos:</p>\n<pre><code>limiar = limiar_base + ajuste × (1 / número_de_palavras)</code></pre>\n<p><em>Vantagem:</em> trata cada linha pelo que ela é, não pela média do bloco. <em>Custo:</em> mais um parâmetro para calibrar, e a curva precisa ser ajustada contra dados reais — não se adivinha o formato dela. <em>Como validar:</em> na amostra rotulada, separe as linhas por faixa de tamanho (1-5, 6-20, 21+ palavras) e compare a taxa de acerto em cada faixa. Se a faixa curta tiver taxa de <code>Indefinido</code> desproporcional, o caminho A ajuda.</p>\n<p><strong>Caminho B — agregar antes de classificar.</strong></p>\n<p>Concatenar todas as entradas curtas de um mesmo pesquisador dentro do bloco, classificando o conjunto em vez de cada uma:</p>\n<pre><code>antes:  &quot;Engenheiro de Processos&quot;           → Indefinido\n        &quot;Coordenador de Produção&quot;           → Indefinido\n        &quot;Analista de Qualidade&quot;             → Indefinido\n\ndepois: &quot;Engenheiro de Processos |\n         Coordenador de Produção |\n         Analista de Qualidade&quot;             → Engenharia de Processos ✓</code></pre>\n<p><em>Vantagem:</em> resolve o problema na raiz, sem parâmetro novo. Três textos fracos somam contexto suficiente. <em>Custo:</em> perde-se a granularidade — você deixa de saber qual cargo específico gerou o rótulo. E se os cargos forem de áreas diferentes, a agregação cria justamente a diluição descrita em 7.3. <em>Como validar:</em> rode os dois modos na amostra e compare quantos <code>Indefinido</code> foram convertidos em acertos, versus quantos acertos viraram ambíguos.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — A escolha entre A e B não é técnica, é de uso. Se você precisa saber <em>qual item</em> gerou cada rótulo (auditoria, rastreabilidade), o caminho B destrói essa informação. Se você só precisa do retrato do pesquisador, B é mais simples e mais eficaz.</p>\n</blockquote>\n<p><strong>Resumo da recomendação:</strong> não implemente nenhum dos dois agora. Rode a calibração da seção 21, meça a taxa de <code>Indefinido</code> por faixa de tamanho e só reabra esta página se o número justificar. Enquanto isso, o método atual — com a limitação descrita em 7.5, conhecida e mensurável — é o método.</p>"}, {"titulo": "PARTE II — INSTALAR E USAR", "html": "<h1 id=\"parte-ii-instalar-e-usar\">PARTE II — INSTALAR E USAR</h1>\n<p><em>Ambiente virtual, GPU, Jupyter e os primeiros comandos.</em></p>\n<h2 id=\"o-python-e-o-ambiente-virtual\">8. O Python e o ambiente virtual</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Primeiro o Python, uma vez por máquina; depois, uma pasta isolada com as bibliotecas deste projeto, para que ele não brigue com os outros.</p>\n</blockquote>\n<h3 id=\"instalar-o-python-windows\">8.1 · Instalar o Python (Windows)</h3>\n<p>O Python é o programa que faz todo o sistema funcionar — o pipeline, o painel e a própria janela do Assistente. É a única instalação feita à mão, uma vez por máquina: tudo o que vem depois o Assistente faz por botões (14.4). São cinco passos, uns dez minutos, e convém ter <strong>uns 10 GB livres</strong> no disco — o Python e o ambiente virtual ocupam pouco, mas o PyTorch com placa de vídeo leva 2,8 GB e os modelos de IA, 3,3 GB.</p>\n<p><strong>Passo 1 — baixe o instalador certo.</strong></p>\n<p>No navegador, abra <a href=\"https://www.python.org/downloads/windows/\" class=\"uri\">https://www.python.org/downloads/windows/</a>. Na lista, procure a versão mais recente do <strong>Python 3.13</strong> — aparece como «Python 3.13.x», com um número no lugar do x — e clique em <strong>«Download Windows installer (64-bit)»</strong>, logo abaixo dela.</p>\n<p>Duas escolhas parecem iguais e não são. Não use o Python da <strong>Microsoft Store</strong>. E não pegue o <strong>3.14</strong>: ele trocou o instalador clássico pelo «Python install manager», e este manual descreve o instalador do 3.13, a versão medida neste projeto.</p>\n<p><strong>Passo 2 — abra o arquivo baixado.</strong></p>\n<p>Ele fica na pasta Downloads, com um nome como <code>python-3.13.x-amd64.exe</code>. Dois cliques.</p>\n<p><strong>Passo 3 — marque o PATH e clique em «Install Now».</strong></p>\n<p>Na primeira tela, <strong>embaixo, marque «Add python.exe to PATH»</strong> — a caixa vem desmarcada, e é ela que faz o comando <code>python</code> funcionar em qualquer janela. Deixe «Use admin privileges when installing py.exe» como está. Então clique em <strong>«Install Now»</strong>, em cima.</p>\n<p>O «Install Now» instala só para o seu usuário, em <code>%LOCALAPPDATA%\\Programs\\Python\\Python313</code> — exatamente onde o lançador do Assistente procura. Se o Windows pedir uma senha de administrador que você não tem, feche o instalador, abra-o de novo e, desta vez, desmarque «Use admin privileges when installing py.exe»: essa caixa só instala o atalho <code>py.exe</code> para todas as contas, e nada neste manual depende dele.</p>\n<p><strong>Passo 4 — espere «Setup was successful».</strong></p>\n<p>Leva de um a três minutos. Se a tela final oferecer <strong>«Disable path length limit»</strong>, clique nela: é inofensivo e evita erros com caminhos longos. Depois, <strong>«Close»</strong>.</p>\n<p><strong>Passo 5 — confira.</strong></p>\n<p>Feche qualquer janela de terminal que já estivesse aberta — o PATH novo só vale para as janelas abertas depois da instalação — e siga 8.2. Quem não vai usar o terminal confere de outro jeito: dois cliques em <code>Assistente Lattes.vbs</code>, na raiz do repositório; se a janela abrir, o Python está pronto.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Se, ao digitar <code>python</code>, abrir a <strong>Microsoft Store</strong> — ou não acontecer nada —, quem respondeu foi o atalho que o Windows traz de fábrica, e não o Python que você instalou. Duas saídas: desligue o atalho em <strong>Configurações → Aplicativos → Configurações avançadas de aplicativos → Aliases de execução de aplicativo</strong> (os dois do Python, «python.exe» e «python3.exe»), ou reinstale marcando «Add python.exe to PATH», o passo 3.</p>\n</blockquote>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — O Assistente não instala o Python porque precisa dele para abrir. Tudo o que vem depois — o ambiente virtual, o PyTorch, as bibliotecas, os modelos de IA e as pastas das bases — ele faz por botões, na Primeira configuração (14.4).</p>\n</blockquote>\n<blockquote>\n<p><strong>CONFIRA</strong> — Sem Python, os dois cliques no <code>Assistente Lattes.vbs</code> não abrem a janela: aparece a caixa «Não consegui iniciar o Python.», com a linha «Tentei: …» — o que o lançador procurou — e a orientação «Instale o Python 3.13 pelo instalador oficial (python.org), marcando \"Add python.exe to PATH\" — manual, seção 8.1 — ou crie o ambiente virtual pela aba 0 do Assistente depois de instalar o Python. Depois, tente de novo.» É esta seção. Com o Python instalado, os mesmos dois cliques abrem a janela.</p>\n</blockquote>\n<h3 id=\"conferir-que-o-python-certo-responde\">8.2 · Conferir que o Python certo responde</h3>\n<p>Três perguntas, num PowerShell aberto depois da instalação (menu Iniciar → digite «PowerShell» → Enter). Digite uma linha por vez; embaixo de cada uma está a resposta certa.</p>\n<pre><code>python --version\n# Python 3.13.x\n\npython -c &quot;import tkinter; print(tkinter.TkVersion)&quot;\n# 8.6\n\nwhere.exe python\n# C:\\Users\\&lt;você&gt;\\AppData\\Local\\Programs\\Python\\Python313\\python.exe   ← o primeiro da lista</code></pre>\n<p><strong>A versão</strong> precisa começar por <code>3.13</code> (3.11 e 3.12 também funcionam; fora de 3.11 a 3.14 não há o PyTorch deste manual — 9.3). <strong>O Tkinter</strong> é o que desenha a janela do Assistente: vem com o instalador oficial, não se instala com <code>pip</code>, e responde <code>8.6</code>. <strong>O caminho:</strong> <code>where.exe</code> lista, em ordem, todos os <code>python.exe</code> que o Windows encontra — e é o primeiro que vale. Ele precisa terminar em <code>\\Python313\\python.exe</code>; se o primeiro for <code>…\\Microsoft\\WindowsApps\\python.exe</code>, é o atalho da Store (ATENÇÃO de 8.1).</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — No PowerShell é <code>where.exe</code>, com o <code>.exe</code>. Sem ele, <code>where</code> é um comando do próprio PowerShell, que não procura programa nenhum e não responde nada.</p>\n</blockquote>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Sem terminal, a mesma conferência está no Assistente: se a janela abriu, o Python e o Tkinter estão bons, e o passo 1 da «Primeira configuração» mostra a versão — «Python 3.13.x — o que abre esta janela».</p>\n</blockquote>\n<p><strong>Git é opcional</strong> — só para quem versiona o código (aba «8 · Git»): <a href=\"https://git-scm.com/download/win\" class=\"uri\">https://git-scm.com/download/win</a>.</p>\n<h3 id=\"o-que-é-e-por-que-usar\">8.3 · O que é, e por que usar</h3>\n<p>Quando você instala uma biblioteca Python, ela vai por padrão para a instalação do sistema — compartilhada por todos os projetos da máquina. Isso cria um problema previsível: o projeto A precisa da versão 1.2 de uma biblioteca, o projeto B precisa da 2.0, e instalar uma quebra a outra.</p>\n<p>Um <strong>ambiente virtual</strong> é uma pasta isolada com sua própria cópia do Python e suas próprias bibliotecas. O que você instala nele não afeta mais nada na máquina.</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — É a diferença entre guardar as ferramentas de todos os serviços numa gaveta só, e ter uma caixa por serviço. Na gaveta comum, alguém sempre leva a chave que você precisava.</p>\n</blockquote>\n<h3 id=\"onde-criar\">8.4 · Onde criar</h3>\n<p>Vamos usar como exemplo a pasta de trabalho do projeto:</p>\n<pre><code>C:\\0_Desenvolvimento\\CNPQ</code></pre>\n<h3 id=\"criar-e-ativar-windows-powershell\">8.5 · Criar e ativar (Windows PowerShell)</h3>\n<p><strong>Passo 1 — vá até a pasta do projeto.</strong></p>\n<pre><code>cd C:\\0_Desenvolvimento\\CNPQ</code></pre>\n<p><strong>Passo 2 — crie o ambiente virtual.</strong></p>\n<pre><code>python -m venv venv</code></pre>\n<p>Isso cria a subpasta <code>venv</code> dentro de <code>C:\\0_Desenvolvimento\\CNPQ</code>. Leva alguns segundos e só precisa ser feito <strong>uma vez</strong>.</p>\n<p><strong>Passo 3 — ative o ambiente.</strong></p>\n<pre><code>.\\venv\\Scripts\\Activate.ps1</code></pre>\n<blockquote>\n<p><strong>CONFIRA</strong> — O prompt passa a exibir <code>(venv)</code> no início:</p>\n<pre><code>(venv) PS C:\\0_Desenvolvimento\\CNPQ&gt;</code></pre>\n<p>Esse prefixo é a única confirmação visual de que você está dentro do ambiente. <strong>Se ele não aparecer, o ambiente não está ativo</strong> — e tudo o que você instalar irá para o Python do sistema.</p>\n</blockquote>\n<h3 id=\"o-erro-mais-comum-no-powershell\">8.6 · O erro mais comum no PowerShell</h3>\n<p>Na primeira ativação, é provável que apareça:</p>\n<pre><code>.\\venv\\Scripts\\Activate.ps1 : O arquivo não pode ser carregado porque a\nexecução de scripts foi desabilitada neste sistema.</code></pre>\n<p>Não é um defeito do projeto. O Windows bloqueia a execução de scripts por padrão, como medida de segurança. A solução é liberar apenas para o seu usuário:</p>\n<pre><code>Set-ExecutionPolicy -Scope CurrentUser RemoteSigned</code></pre>\n<p>Responda <code>S</code> (ou <code>Y</code>) à confirmação e tente ativar de novo. <code>RemoteSigned</code> permite rodar scripts locais e exige assinatura apenas nos baixados da internet — é a configuração recomendada, e não desprotege a máquina.</p>\n<p>Isso é feito <strong>uma vez por usuário</strong>, não a cada projeto.</p>\n<h3 id=\"outros-ambientes\">8.7 · Outros ambientes</h3>\n<p><strong>Prompt de Comando (CMD):</strong></p>\n<pre><code>venv\\Scripts\\activate.bat</code></pre>\n<p><strong>Linux ou macOS:</strong></p>\n<pre><code>source venv/bin/activate</code></pre>\n<h2 id=\"instalar-as-bibliotecas\">9. Instalar as bibliotecas</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Instale tudo de uma vez, na ordem certa, e só depois gere o <code>requirements.txt</code>.</p>\n<p><strong>ATENÇÃO</strong> — Use sempre <code>python -m pip</code>, nunca <code>pip</code> sozinho.</p>\n<p><code>pip</code> sozinho pode apontar para o Python do sistema mesmo com o ambiente ativo, dependendo de como o PATH está configurado. O resultado é confuso: a instalação diz que deu certo, e o projeto não encontra a biblioteca. <code>python -m pip</code> usa o interpretador que está de fato ativo — sempre.</p>\n</blockquote>\n<h3 id=\"o-que-cada-biblioteca-faz-aqui\">9.1 · O que cada biblioteca faz aqui</h3>\n<p>Antes de instalar, vale saber o que se está instalando. Nenhuma destas bibliotecas está no projeto por hábito: cada uma resolve um problema específico, e o manual indica onde ela é usada.</p>\n<p><strong>Obrigatórias — o pipeline não roda sem elas</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Biblioteca</th>\n<th>Para que serve <strong>neste projeto</strong></th>\n<th>Onde é usada</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>torch</code> (PyTorch)</td>\n<td>O motor de cálculo que roda o modelo de vetores. É ele que decide se o trabalho vai para a placa de vídeo ou para o processador.</td>\n<td><code>semantica/vetores.py</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>sentence-transformers</code></td>\n<td>A camada que carrega o modelo E5 e transforma texto em vetor com uma chamada só. Também traz o <code>CrossEncoder</code>, usado no desempate.</td>\n<td><code>vetores.py</code>, <code>reranker.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>pandas</code></td>\n<td>A tabela em memória. Todas as dez tabelas do currículo, os CSVs classificados e as contagens são objetos do pandas.</td>\n<td>todo o pipeline</td>\n</tr>\n<tr class=\"even\">\n<td><code>numpy</code></td>\n<td>A matemática dos vetores: similaridade, top-K, ordenação. É o que torna viável comparar 500 mil textos com 295 categorias.</td>\n<td><code>vetores.py</code>, <code>classificador.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>pyarrow</code></td>\n<td>Lê e grava os arquivos <code>.parquet</code> — o formato em que ficam os dados completos, com tipos preservados.</td>\n<td><code>nucleo/arquivos.py</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>openpyxl</code></td>\n<td>Lê e grava os arquivos <code>.xlsx</code> — o dicionário de entrada e todos os relatórios em Excel.</td>\n<td><code>planilha.py</code>, <code>arquivos.py</code></td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Instala-se só o <code>torch</code>. Os tutoriais da internet costumam trazer, no mesmo comando, mais dois pacotes do PyTorch — um de imagem e um de áudio. O pipeline não usa nenhum dos dois, o ambiente medido (<code>requirements-medido.txt</code>) não os tem, e cada um é mais um download que pode travar: os comandos deste manual os deixam de fora.</p>\n</blockquote>\n<p><strong>Para trabalhar no notebook</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Biblioteca</th>\n<th>Para que serve</th>\n<th>Quando instalar</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>jupyter</code></td>\n<td>O ambiente de notebook em si — o servidor e a interface no navegador.</td>\n<td>se você for usar o Jupyter (seção 11)</td>\n</tr>\n<tr class=\"even\">\n<td><code>ipykernel</code></td>\n<td>Registra o ambiente virtual como um <em>kernel</em>, para o notebook enxergar as bibliotecas do projeto. <strong>Sem ele o notebook usa o Python do sistema.</strong></td>\n<td>sempre, junto com o Jupyter</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Opcionais — só para a descoberta de temas (seção 20.13)</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Biblioteca</th>\n<th>Para que serve</th>\n<th>Consequência de não instalar</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>umap-learn</code></td>\n<td>Reduz os vetores de mais de mil dimensões para cerca de dez, preservando a vizinhança. É o passo ① da descoberta.</td>\n<td>a descoberta de temas não roda; <strong>o resto do pipeline funciona normalmente</strong></td>\n</tr>\n<tr class=\"even\">\n<td><code>hdbscan</code></td>\n<td>Encontra grupos densos entre os itens <code>Indefinido</code>, e marca como ruído o que estiver espalhado. É o passo ②.</td>\n<td>idem</td>\n</tr>\n<tr class=\"odd\">\n<td><code>scikit-learn</code></td>\n<td>Fornece o cálculo de termos característicos (c-TF-IDF) que <strong>nomeia</strong> cada grupo encontrado. É o passo ③.</td>\n<td>idem</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Opcionais — só para redigir glosas com um modelo de nuvem (seção 12.5)</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Biblioteca</th>\n<th>Provedor</th>\n<th>Quando instalar</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>google-generativeai</code></td>\n<td>Google Gemini</td>\n<td>só se <code>provedor = \"google\"</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>anthropic</code></td>\n<td>Anthropic Claude</td>\n<td>só se <code>provedor = \"anthropic\"</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>openai</code></td>\n<td>OpenAI GPT</td>\n<td>só se <code>provedor = \"openai\"</code></td>\n</tr>\n</tbody>\n</table>\n<p>Nenhuma delas é necessária para o padrão do projeto, que é o <strong>Ollama</strong> — e o Ollama não exige biblioteca Python nenhuma: o sistema fala com ele por HTTP, usando o <code>urllib</code> que já vem no Python.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Instalação mínima para classificar currículos: <code>torch</code> + <code>sentence-transformers</code> + <code>pandas</code> + <code>numpy</code> + <code>pyarrow</code> + <code>openpyxl</code>. Todo o resto é conveniência (notebook), exploração (descoberta) ou redação de glosas (nuvem).</p>\n</blockquote>\n<p><strong>O que vem junto sem você pedir.</strong> O <code>sentence-transformers</code> puxa como dependências o <code>transformers</code> e o <code>huggingface_hub</code> (baixam e executam o modelo), o <code>tokenizers</code> (parte o texto em pedaços que o modelo entende) e o <code>safetensors</code> (formato dos pesos do modelo). Você não os instala nem os chama diretamente — mas eles aparecem no <code>requirements.txt</code>, e agora não são um mistério.</p>\n<h3 id=\"ordem-de-instalação\">9.2 · Ordem de instalação</h3>\n<p>A ordem importa em um ponto: <strong>o PyTorch deve ser instalado antes do</strong> <code>sentence-transformers</code>. Se você instalar na ordem inversa, o <code>sentence-transformers</code> puxa a versão de CPU do PyTorch como dependência, e ela sobrescreve a versão com GPU que você queria.</p>\n<pre><code>1º  PyTorch (com suporte a GPU)     ← primeiro, sempre\n2º  Bibliotecas do pipeline\n3º  Jupyter\n4º  Opcionais (calibração e descoberta)\n─────────────────────────────────────\n5º  requirements.txt                 ← só no fim, com tudo instalado</code></pre>\n<h3 id=\"passo-1-pytorch-com-suporte-a-gpu\">9.3 · Passo 1 — PyTorch com suporte a GPU</h3>\n<p>O PyTorch não vem do endereço padrão do <code>pip</code>: cada tipo de máquina tem um <strong>índice</strong> próprio, e o que muda é o fim do endereço — <code>cu128</code> para placa NVIDIA, <code>cpu</code> para quem não tem. Escolha <strong>um</strong> dos dois comandos. A versão fica fixada em <code>2.11.0</code>, a medida neste projeto (<code>requirements-medido.txt</code>): sem ela, o <code>pip</code> escolheria sozinho a mais nova que encontrasse — que não é a medida.</p>\n<p><strong>Placa NVIDIA</strong> (o caso desta máquina):</p>\n<pre><code>python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu128</code></pre>\n<p>Download de cerca de 2,8 GB — de 5 a 30 minutos, conforme a internet. Vale para driver com «CUDA Version» 12.0 ou mais novo (como ler, logo abaixo).</p>\n<p><strong>Sem placa NVIDIA</strong> (só processador):</p>\n<pre><code>python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu</code></pre>\n<p>Cerca de 115 MB. Tudo funciona; a classificação fica de 10 a 50 vezes mais lenta (10.1).</p>\n<p><strong>Qual é o seu caso.</strong> Rode o <code>nvidia-smi</code> no PowerShell:</p>\n<pre><code>nvidia-smi</code></pre>\n<p>Se o PowerShell disser que não reconhece o nome <code>nvidia-smi</code>, a máquina não tem placa NVIDIA visível — use o índice <code>cpu</code>. Se o quadro aparecer, a primeira linha traz, à direita, a <strong>«CUDA Version»</strong>: a versão mais nova do CUDA que o driver aceita. Nesta máquina (RTX 2050, 4 GB):</p>\n<pre><code>| NVIDIA-SMI 595.79   Driver Version: 595.79   CUDA Version: 13.2 |</code></pre>\n<p><strong>12.0 ou mais</strong> → índice <code>cu128</code>: as rodas para CUDA 12.8 rodam em qualquer driver da série 12 ou mais nova. <strong>Abaixo de 12</strong> → driver antigo: atualize em <a href=\"https://www.nvidia.com/drivers\" class=\"uri\">https://www.nvidia.com/drivers</a> e rode o <code>nvidia-smi</code> de novo; enquanto isso, o índice <code>cpu</code> funciona.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Se você não souber qual tem, abra o <strong>Gerenciador de Tarefas → Desempenho</strong> no Windows. As placas aparecem como “GPU 0”, “GPU 1”, com o nome do fabricante. Placas integradas Intel não servem para acelerar este trabalho; procure por NVIDIA ou AMD dedicada.</p>\n</blockquote>\n<p><strong>Python × índice</strong> — o que cada endereço oferece (conferido em 15/09/2026):</p>\n<table>\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 42%\" />\n<col style=\"width: 24%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Índice</th>\n<th>Quando usar</th>\n<th>Versão do torch</th>\n<th>Python</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>cu128</code></td>\n<td>placa NVIDIA com «CUDA Version» 12.0 ou mais</td>\n<td><strong>2.11.0</strong> — a medida neste projeto</td>\n<td>3.11, 3.12, 3.13 e 3.14</td>\n</tr>\n<tr class=\"even\">\n<td><code>cpu</code></td>\n<td>sem placa NVIDIA</td>\n<td>2.11.0</td>\n<td>3.11, 3.12, 3.13 e 3.14</td>\n</tr>\n<tr class=\"odd\">\n<td><code>cu118</code></td>\n<td>driver antigo (abaixo de 12), como último recurso — não medido</td>\n<td>até 2.7.1</td>\n<td>até 3.13; nada para 3.14</td>\n</tr>\n<tr class=\"even\">\n<td><code>cu121</code></td>\n<td>não use — era o índice das versões anteriores deste manual</td>\n<td>até 2.5.1</td>\n<td>nada para 3.13 nem 3.14</td>\n</tr>\n</tbody>\n</table>\n<p>Para o <code>cu118</code>, troque o fim do endereço e tire o <code>==2.11.0</code> — ele não tem essa versão.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <code>ERROR: No matching distribution found for torch</code> quer dizer que o índice do comando não tem o torch para a sua versão do Python — não é falta de internet nem erro de digitação. É o que acontece com o índice <code>cu121</code>, o das versões anteriores deste manual, num Python 3.13: a versão mais nova que ele oferece é a 2.5.1, anterior ao 3.13. A correção é o comando de cima, com <code>cu128</code> (ou <code>cpu</code>) e <code>torch==2.11.0</code>. Se o erro continuar, confira a versão do Python (8.2): fora de 3.11 a 3.14, instale o 3.13 (8.1).</p>\n</blockquote>\n<p><strong>AMD, Linux e Apple — não medido neste projeto.</strong> Os comandos abaixo ficam como referência; nenhuma bateria deste projeto rodou neles.</p>\n<p><strong>AMD no Windows</strong> (via DirectML):</p>\n<pre><code>python -m pip install torch\npython -m pip install torch-directml</code></pre>\n<p><strong>AMD no Linux</strong> (via ROCm):</p>\n<pre><code>python -m pip install torch --index-url https://download.pytorch.org/whl/rocm6.0</code></pre>\n<p><strong>Apple Silicon (M1/M2/M3):</strong></p>\n<pre><code>python -m pip install torch</code></pre>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Pelo Assistente, é o passo 3 da Primeira configuração (14.4): o botão «Instalar o torch» lê o <code>nvidia-smi</code>, escolhe entre <code>cu128</code> e <code>cpu</code>, mostra o comando e o tamanho do download e só roda depois da sua confirmação.</p>\n</blockquote>\n<h3 id=\"passo-2-bibliotecas-do-pipeline\">9.4 · Passo 2 — bibliotecas do pipeline</h3>\n<pre><code>python -m pip install pandas numpy pyarrow openpyxl sentence-transformers</code></pre>\n<h3 id=\"passo-3-jupyter\">9.5 · Passo 3 — Jupyter</h3>\n<pre><code>python -m pip install jupyter ipykernel</code></pre>\n<h3 id=\"passo-4-opcionais\">9.6 · Passo 4 — opcionais</h3>\n<p>Necessárias apenas para a calibração e a descoberta de temas:</p>\n<pre><code>python -m pip install scikit-learn umap-learn hdbscan</code></pre>\n<h3 id=\"tudo-de-uma-vez\">9.7 · Tudo de uma vez</h3>\n<p>Se preferir um bloco único, com a ordem já correta (sem placa NVIDIA, troque <code>cu128</code> por <code>cpu</code> — 9.3):</p>\n<pre><code>cd C:\\0_Desenvolvimento\\CNPQ\n.\\venv\\Scripts\\Activate.ps1\n\npython -m pip install --upgrade pip\npython -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu128\npython -m pip install pandas numpy pyarrow openpyxl sentence-transformers\npython -m pip install jupyter ipykernel\npython -m pip install scikit-learn umap-learn hdbscan</code></pre>\n<h3 id=\"passo-5-gerar-o-requirements.txt\">9.8 · Passo 5 — gerar o <code>requirements.txt</code></h3>\n<p><strong>Só depois de tudo instalado e verificado.</strong> Este arquivo registra exatamente quais bibliotecas e versões o projeto usa, e serve para reproduzir o mesmo ambiente em outra máquina.</p>\n<pre><code>python -m pip freeze &gt; requirements.txt</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Gerar o <code>requirements.txt</code> cedo demais é um erro comum. Se você o gerar antes de instalar o PyTorch com GPU, ele congela a versão de CPU — e a máquina seguinte, ao restaurar o ambiente, herda o problema sem ninguém perceber.</p>\n</blockquote>\n<p><strong>Restaurar em outra máquina:</strong></p>\n<pre><code>python -m pip install -r requirements.txt</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — O <code>requirements.txt</code> gerado por <code>pip freeze</code> <strong>não preserva o</strong> <code>--index-url</code> do PyTorch. Numa máquina nova, instale o PyTorch primeiro, pelo comando da seção 9.3, e só depois rode o <code>install -r</code>.</p>\n</blockquote>\n<h3 id=\"desativar-e-recriar\">9.9 · Desativar e recriar</h3>\n<pre><code>deactivate</code></pre>\n<p>O prefixo <code>(venv)</code> desaparece e você volta ao Python do sistema.</p>\n<p>Se algo der muito errado, a saída mais rápida é apagar e refazer. Nada de importante se perde: o ambiente virtual contém apenas bibliotecas, nunca o seu código nem os seus dados.</p>\n<pre><code>deactivate\nRemove-Item -Recurse -Force venv\npython -m venv venv\n.\\venv\\Scripts\\Activate.ps1\npython -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cu128\npython -m pip install -r requirements.txt</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Nunca versione a pasta</strong> <code>venv</code><strong>.</strong> Ela tem centenas de megabytes, é específica do sistema operacional e é inteiramente reconstruível a partir do <code>requirements.txt</code>. Se o projeto usar Git, inclua no <code>.gitignore</code>:</p>\n<pre><code>venv/\n__pycache__/</code></pre>\n</blockquote>\n<h2 id=\"forçar-o-uso-da-gpu\">10. Forçar o uso da GPU</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — A placa de vídeo torna o processamento de 10 a 50 vezes mais rápido, e a instalação errada faz tudo cair no processador <strong>sem avisar</strong>.</p>\n</blockquote>\n<h3 id=\"por-que-isso-importa-tanto\">10.1 · Por que isso importa tanto</h3>\n<p>A etapa 2 é a mais demorada do pipeline, e o que ela faz — converter texto em vetores — é exatamente o tipo de cálculo em que uma placa de vídeo é muitas vezes mais rápida que um processador.</p>\n<p>A diferença não é de conforto, é de viabilidade:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 30%\" />\n<col style=\"width: 37%\" />\n<col style=\"width: 29%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Dispositivo</th>\n<th style=\"text-align: left;\">10 mil currículos</th>\n<th style=\"text-align: left;\">100 mil currículos</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">GPU dedicada</td>\n<td style=\"text-align: left;\">minutos a poucas horas</td>\n<td style=\"text-align: left;\">horas</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Processador (CPU)</td>\n<td style=\"text-align: left;\">horas</td>\n<td style=\"text-align: left;\">dias</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>O modo de falha é silencioso.</strong> Se o PyTorch instalado for a versão de CPU, ou se o driver estiver desatualizado, a biblioteca simplesmente usa o processador. Não há erro, não há aviso. A pessoa conclui que “o modelo é lento assim” e espera seis horas pelo que levaria vinte minutos.</p>\n<p>É por isso que a checagem abaixo não é opcional.</p>\n</blockquote>\n<h3 id=\"confira-se-a-gpu-está-sendo-vista\">10.2 · Confira se a GPU está sendo vista</h3>\n<p>Com o ambiente ativo, rode:</p>\n<pre><code>python -c &quot;import torch; print(&#39;GPU disponível:&#39;, torch.cuda.is_available()); print(&#39;Placa:&#39;, torch.cuda.get_device_name(0) if torch.cuda.is_available() else &#39;nenhuma&#39;)&quot;</code></pre>\n<p><strong>Resultado desejado:</strong></p>\n<pre><code>GPU disponível: True\nPlaca: NVIDIA GeForce RTX 4070</code></pre>\n<p><strong>Se aparecer</strong> <code>False</code><strong>:</strong></p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 66%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Causa provável</th>\n<th style=\"text-align: left;\">Solução</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">PyTorch de CPU instalado</td>\n<td style=\"text-align: left;\">Reinstale pelo comando da seção 9.3, com o <code>--index-url</code> correto</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Driver da placa desatualizado</td>\n<td style=\"text-align: left;\">Atualize pelo site do fabricante</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Placa integrada Intel apenas</td>\n<td style=\"text-align: left;\">Não há aceleração possível; use <code>dispositivo = \"cpu\"</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ambiente virtual errado</td>\n<td style=\"text-align: left;\">Confira o <code>(venv)</code> no prompt</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"forçar-no-pipeline\">10.3 · Forçar no pipeline</h3>\n<p>O sistema tem um parâmetro dedicado em <code>config.py</code>:</p>\n<pre><code>dispositivo: str = &quot;auto&quot;</code></pre>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 77%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Valor</th>\n<th style=\"text-align: left;\">Efeito</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>\"auto\"</code></td>\n<td style=\"text-align: left;\">Descobre sozinho: usa GPU se houver, processador se não</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>\"cuda\"</code></td>\n<td style=\"text-align: left;\"><strong>Força GPU NVIDIA</strong> — ou AMD no Linux, via ROCm</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>\"mps\"</code></td>\n<td style=\"text-align: left;\">Força GPU Apple Silicon</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>\"directml\"</code></td>\n<td style=\"text-align: left;\">Força GPU AMD/Intel no Windows</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>\"cpu\"</code></td>\n<td style=\"text-align: left;\">Força processador</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Forçar é melhor que confiar.</strong> Com <code>\"auto\"</code>, uma instalação errada cai no processador em silêncio. Com <code>\"cuda\"</code> explícito, você recebe um <strong>erro claro</strong> se a GPU não estiver disponível — o que é infinitamente preferível a uma espera inexplicável.</p>\n<p>Em produção, deixe explícito.</p>\n</blockquote>\n<p>Também é possível definir sem editar o arquivo:</p>\n<pre><code>$env:LATTES_DISPOSITIVO = &quot;cuda&quot;</code></pre>\n<h3 id=\"confirme-na-execução\">10.4 · Confirme na execução</h3>\n<p>O pipeline <strong>anuncia</strong> onde está rodando, logo ao carregar o modelo:</p>\n<pre><code>🧠 Carregando modelo vetorial: intfloat/multilingual-e5-large-instruct\n⚡ Dispositivo: GPU · NVIDIA GeForce RTX 4070 · 12.0 GB</code></pre>\n<p>Se aparecer:</p>\n<pre><code>⚡ Dispositivo: PROCESSADOR (CPU) — muito mais lento; confira a instalação do PyTorch</code></pre>\n<p>…interrompa e volte à seção 10.2. Vale muito mais gastar cinco minutos ali do que descobrir o problema no fim de uma execução longa.</p>\n<blockquote>\n<p><strong>CONFIRA</strong> — O comando <code>python pipeline.py --pre-voo</code> também mostra o dispositivo detectado, antes de processar qualquer coisa. É o primeiro comando a rodar em qualquer máquina nova.</p>\n</blockquote>\n<h3 id=\"se-a-memória-da-placa-estourar\">10.5 · Se a memória da placa estourar</h3>\n<p>Erro típico:</p>\n<pre><code>torch.cuda.OutOfMemoryError: CUDA out of memory</code></pre>\n<p>Significa que o lote é grande demais para a sua placa. Reduza em <code>config.py</code>:</p>\n<pre><code>lote: int = 16     # ou 8, em placas de 4 GB</code></pre>\n<p>O resultado da classificação é <strong>idêntico</strong> com qualquer valor de lote — muda apenas a velocidade e o consumo de memória.</p>\n<h2 id=\"usar-com-jupyter-notebook\">11. Usar com Jupyter Notebook</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — O ambiente virtual precisa ser registrado como <em>kernel</em> para o Jupyter enxergá-lo.</p>\n</blockquote>\n<h3 id=\"registrar-o-kernel\">11.1 · Registrar o kernel</h3>\n<p>Com o ambiente <strong>ativo</strong>:</p>\n<pre><code>python -m pip install ipykernel\npython -m ipykernel install --user --name lattes --display-name &quot;Python (lattes)&quot;</code></pre>\n<ul>\n<li><code>--name lattes</code> é o identificador interno.</li>\n<li><code>--display-name \"Python (lattes)\"</code> é o nome que aparece na lista.</li>\n</ul>\n<p>Isso é feito <strong>uma vez</strong>.</p>\n<h3 id=\"abrir-o-jupyter\">11.2 · Abrir o Jupyter</h3>\n<pre><code>cd C:\\0_Desenvolvimento\\CNPQ\n.\\venv\\Scripts\\Activate.ps1\njupyter notebook</code></pre>\n<h3 id=\"selecionar-o-kernel\">11.3 · Selecionar o kernel</h3>\n<table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 84%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Ferramenta</th>\n<th style=\"text-align: left;\">Como</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Jupyter Notebook</td>\n<td style=\"text-align: left;\">Menu <em>Kernel → Change kernel → Python (lattes)</em></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">JupyterLab</td>\n<td style=\"text-align: left;\">Clique no nome do kernel, no canto superior direito</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">VS Code</td>\n<td style=\"text-align: left;\">Clique em <em>Select Kernel</em>, no alto à direita, e escolha o interpretador dentro de <code>C:\\0_Desenvolvimento\\CNPQ\\venv</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"conferir-se-o-kernel-certo-está-ativo\">11.4 · Conferir se o kernel certo está ativo</h3>\n<blockquote>\n<p><strong>CONFIRA</strong> — Este é o teste que resolve a maior parte da confusão. Rode numa célula:</p>\n<pre><code>import sys\nprint(sys.executable)</code></pre>\n<p><strong>Resultado esperado:</strong></p>\n<pre><code>C:\\0_Desenvolvimento\\CNPQ\\venv\\Scripts\\python.exe</code></pre>\n</blockquote>\n<p>Se aparecer outro caminho — algo como <code>C:\\Python311\\python.exe</code> ou um caminho com <code>Anaconda</code> —, o notebook está usando o Python do sistema. As bibliotecas instaladas no <code>venv</code> não estarão disponíveis, e o sintoma será um <code>ModuleNotFoundError</code> em algo que você tem certeza de ter instalado.</p>\n<p><strong>A causa quase sempre é uma destas duas:</strong> o kernel selecionado está errado (troque no menu), ou o Jupyter foi aberto sem o ambiente ativo (feche, ative e abra de novo).</p>\n<h3 id=\"conferir-a-gpu-dentro-do-notebook\">11.5 · Conferir a GPU dentro do notebook</h3>\n<pre><code>import torch\nprint(&quot;GPU disponível:&quot;, torch.cuda.is_available())\nif torch.cuda.is_available():\n    print(&quot;Placa:&quot;, torch.cuda.get_device_name(0))</code></pre>\n<h3 id=\"a-célula-de-abertura-sempre-a-primeira\">11.6 · A célula de abertura — sempre a primeira</h3>\n<p>Todo notebook deste projeto começa com a mesma célula. Ela ensina o Python onde o pipeline mora e confirma que a configuração resolveu certo.</p>\n<pre><code>import sys\nsys.path.insert(0, r&quot;C:\\0_Desenvolvimento\\CNPQ\\lattes_pipeline&quot;)\n\nfrom config import CFG\nprint(&quot;domínio ativo:&quot;, CFG.dominio)\nprint(CFG.caminhos.como_texto())</code></pre>\n<p>O <code>r</code> antes das aspas (<em>raw string</em>) faz a contrabarra ser literal. Sem ele, <code>\"\\0\"</code> viraria o caractere nulo e o caminho quebraria em silêncio — erro clássico no Windows.</p>\n<blockquote>\n<p><strong>CONFIRA</strong> — Se esta célula falhar com <code>ModuleNotFoundError: config</code>, o caminho está errado: aponte para a pasta que <strong>contém</strong> <code>config.py</code>, não para a pasta acima dela.</p>\n</blockquote>\n<h3 id=\"executar-o-pipeline-pelo-notebook\">11.7 · Executar o pipeline pelo notebook</h3>\n<p><strong>Tudo de uma vez</strong> — o equivalente exato a <code>python pipeline.py</code>:</p>\n<pre><code>import pipeline\npipeline.executar()</code></pre>\n<p><strong>Com dados simulados</strong>, para testar a instalação:</p>\n<pre><code>pipeline.executar(demonstracao=300)</code></pre>\n<p><strong>Uma etapa só:</strong></p>\n<pre><code>pipeline.executar(etapas=[&quot;classificacao&quot;])</code></pre>\n<p><strong>Silenciar a saída detalhada</strong> (útil quando o log polui o notebook):</p>\n<pre><code>pipeline.executar(verboso=False)</code></pre>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — <code>pipeline.executar()</code> é literalmente a mesma função que o comando de terminal chama. Não existe “modo notebook” e “modo terminal”: existe uma função, chamada de dois lugares. Os arquivos gravados, o cache e os relatórios são idênticos.</p>\n</blockquote>\n<h3 id=\"executar-etapa-por-etapa-com-o-resultado-na-mão\">11.8 · Executar etapa por etapa, com o resultado na mão</h3>\n<p>É aqui que o notebook ganha do terminal. Rodando etapa a etapa, cada resultado intermediário fica em memória, pronto para ser inspecionado antes de seguir.</p>\n<p><strong>Etapa 1 — ingestão</strong></p>\n<pre><code>from etapas import e01_ingestao\n\ne01_ingestao.executar()                       # lê 1_ENTRADA e grava 2_CURRICULOS\ntabelas = e01_ingestao.carregar_curriculos()  # devolve as dez tabelas\n\nfor nome, df in tabelas.items():\n    print(f&quot;{nome:16s} {len(df):&gt;8,} linha(s)&quot;)\n\ntabelas[&quot;producao_tec&quot;].head()</code></pre>\n<p><strong>Etapa 2 — classificação</strong></p>\n<pre><code>import pipeline\nfrom etapas import e02_classificacao\n\ntaxonomias, dominio = pipeline.carregar_taxonomias(CFG.dominio)\ncodificador, classificador = pipeline.montar_motor()\n\nclassificados = e02_classificacao.executar(\n    tabelas, taxonomias, dominio, classificador)\n\n# inspecionar um bloco específico\ndf = classificados[&quot;producao_tecnica&quot;]\ndf[[&quot;texto&quot;, &quot;Setor_PRODUCAO_TECNICA&quot;,\n    &quot;CONFIANCA_Setor_PRODUCAO_TECNICA&quot;]].head(10)</code></pre>\n<p><strong>Etapa 3 — quantificação</strong></p>\n<pre><code>from etapas import e03_quantificacao\n\nquantificacao = e03_quantificacao.executar(\n    tabelas, classificados, taxonomias, dominio)\n\nquantificacao.head()</code></pre>\n<p><strong>Etapa 4 — vetorização</strong></p>\n<pre><code>from etapas import e04_vetorizacao\n\nbase = e04_vetorizacao.executar(tabelas, quantificacao, codificador)\nbase.columns.tolist()</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — A ordem importa e as etapas dependem umas das outras: a 2 precisa das <code>tabelas</code> da 1, a 3 precisa dos <code>classificados</code> da 2, a 4 precisa da <code>quantificacao</code> da 3 e do mesmo <code>codificador</code> usado na 2. Rodar uma célula fora de ordem produz <code>NameError</code> — que é o comportamento desejável, porque o erro aparece na hora, e não como um resultado silenciosamente errado.</p>\n</blockquote>\n<h3 id=\"a-tabela-de-equivalências-terminal-notebook\">11.9 · A tabela de equivalências — terminal ↔︎ notebook</h3>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>No terminal (PowerShell)</th>\n<th>No notebook (Python)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>python pipeline.py</code></td>\n<td><code>pipeline.executar()</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>python pipeline.py --demonstracao 300</code></td>\n<td><code>pipeline.executar(demonstracao=300)</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>python pipeline.py --etapas classificacao</code></td>\n<td><code>pipeline.executar(etapas=[\"classificacao\"])</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>python pipeline.py --config</code></td>\n<td><code>print(CFG.caminhos.como_texto())</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>python pipeline.py --pre-voo</code></td>\n<td><code>pipeline.pre_voo()</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>python pipeline.py --dominios</code></td>\n<td><code>import dominios; dominios.listar()</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>python pipeline.py --dominio saude</code></td>\n<td><code>CFG.dominio = \"saude\"</code> <strong>antes</strong> de executar</td>\n</tr>\n<tr class=\"even\">\n<td><code>python testes/test_integracao.py</code></td>\n<td><code>!python testes/test_integracao.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>python -m ingestao.adaptadores amostra.xml</code></td>\n<td><code>from ingestao import adaptadores</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>python ferramentas/construir_glosas.py --simular</code></td>\n<td>ver 13.5</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — A exclamação (<code>!</code>) no início de uma célula manda a linha para o terminal do sistema, sem sair do notebook. Serve para qualquer comando — <code>!ollama list</code>, <code>!python -m pip install ...</code>, <code>!dir</code>. É a saída mais rápida quando não existe equivalente em Python.</p>\n</blockquote>\n<h3 id=\"mudar-parâmetros-sem-editar-o-config.py\">11.10 · Mudar parâmetros sem editar o <code>config.py</code></h3>\n<p>No notebook dá para experimentar um valor e rodar de novo, sem tocar em arquivo:</p>\n<pre><code>CFG.semantica.limiar_curto = 0.74    # mais permissivo\nCFG.semantica.margem = 0.03          # mais itens marcados como ambíguos\nCFG.semantica.reranker_ativo = False # desliga o desempate\n\npipeline.executar(etapas=[&quot;classificacao&quot;])</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Duas consequências que confundem quem não sabe delas. <strong>Primeira:</strong> mudar limiar, margem ou reranker altera a assinatura do eixo, e a classificação é refeita sozinha — não é preciso apagar cache nenhum. <strong>Segunda:</strong> a mudança vale só até o notebook ser reiniciado. Ela <strong>não</strong> é gravada em <code>config.py</code>. Isso é uma vantagem enquanto se está calibrando e uma armadilha quando se esquece: o valor que ficou bom precisa ser copiado para o <code>config.py</code> à mão, senão a próxima execução pelo terminal usa o valor antigo.</p>\n</blockquote>\n<h3 id=\"armadilhas-próprias-do-notebook\">11.11 · Armadilhas próprias do notebook</h3>\n<p><strong>O módulo alterado não recarrega sozinho.</strong> Se você editar <code>blocos.py</code> ou <code>config.py</code> com o notebook aberto, o Python continua usando a versão que já estava na memória. A saída limpa é ligar o recarregamento automático, na primeira célula:</p>\n<pre><code>%load_ext autoreload\n%autoreload 2</code></pre>\n<p>Sem isso, a alternativa é reiniciar o kernel (Kernel → Restart) e rodar tudo de novo.</p>\n<p><strong>O modelo ocupa a memória da placa e não devolve.</strong> Depois de uma etapa 2, o modelo de vetores continua carregado. Se você for rodar o Ollama na mesma placa, libere antes:</p>\n<pre><code>codificador.descarregar()</code></pre>\n<p><strong>A ordem de execução das células não é a ordem da tela.</strong> Uma célula rodada, apagada e reescrita continua tendo efeito na memória. Ao terminar uma investigação, rode Kernel → Restart &amp; Run All para confirmar que o notebook funciona de cima para baixo.</p>\n<p><strong>A barra de progresso polui.</strong> Em lotes grandes, passe <code>verboso=False</code> ou use <code>pipeline.executar(verboso=False)</code>.</p>\n<h3 id=\"um-notebook-mínimo-do-zero-ao-resultado\">11.12 · Um notebook mínimo, do zero ao resultado</h3>\n<p>Cole estas cinco células num notebook novo e você tem o pipeline inteiro rodando:</p>\n<pre><code># ── célula 1 · abertura ────────────────────────────────\n%load_ext autoreload\n%autoreload 2\nimport sys\nsys.path.insert(0, r&quot;C:\\0_Desenvolvimento\\CNPQ\\lattes_pipeline&quot;)\nfrom config import CFG\nprint(CFG.caminhos.como_texto())\n\n# ── célula 2 · conferir o ambiente ─────────────────────\nimport pipeline\npipeline.pre_voo()\n\n# ── célula 3 · rodar com dados simulados ───────────────\npipeline.executar(demonstracao=300)\n\n# ── célula 4 · abrir o resultado ───────────────────────\nimport pandas as pd\nq = pd.read_parquet(CFG.caminhos.resultados / &quot;quantificacao.parquet&quot;)\nq.head()\n\n# ── célula 5 · ver a distribuição de um eixo ───────────\nq[&quot;setor_industrial_predominante&quot;].value_counts().head(10)</code></pre>\n<h2 id=\"instalar-o-ollama-e-o-modelo-de-linguagem\">12. Instalar o Ollama e o modelo de linguagem</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — O Ollama roda um modelo de linguagem na sua máquina, de graça, sem que nenhum texto saia do computador.</p>\n</blockquote>\n<p><strong>Opcional:</strong> só quem vai redigir glosas com IA local precisa dele — é o passo 8 da Primeira configuração (14.4). Nada do pipeline depende dele: classificar, medir e vetorizar funcionam sem o Ollama.</p>\n<h3 id=\"para-que-ele-serve-aqui\">12.1 · Para que ele serve aqui</h3>\n<p>O modelo de linguagem <strong>não classifica currículos</strong>. Ele é usado por uma única ferramenta: o assistente que redige as glosas do dicionário (seção 13).</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — A separação é deliberada. Classificar precisa ser determinístico e auditável: mesmo texto, mesmo resultado, sempre. Um modelo de linguagem daria respostas ligeiramente diferentes a cada execução, e não haveria como explicar uma decisão a um comitê.</p>\n<p>Redigir glosa é o oposto: é trabalho de texto, sem resposta única correta, e o resultado passa por revisão humana antes de valer.</p>\n</blockquote>\n<h3 id=\"instalar\">12.2 · Instalar</h3>\n<p><strong>Windows / macOS:</strong> baixe o instalador em <a href=\"https://ollama.com/download\" class=\"uri\">https://ollama.com/download</a> e execute. Ele se instala como serviço e sobe sozinho com o sistema.</p>\n<p><strong>Linux:</strong></p>\n<pre><code>curl -fsSL https://ollama.com/install.sh | sh</code></pre>\n<blockquote>\n<p><strong>CONFIRA</strong> — Abra um terminal novo e rode:</p>\n<pre><code>ollama --version</code></pre>\n<p>Se aparecer um número de versão, está instalado.</p>\n</blockquote>\n<h3 id=\"baixar-o-modelo\">12.3 · Baixar o modelo</h3>\n<p>O padrão do projeto é o <strong>Gemma 2</strong>, do Google. Cerca de 5,4 GB.</p>\n<pre><code>ollama pull gemma2</code></pre>\n<p>Alternativas, conforme a sua máquina:</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 30%\" />\n<col style=\"width: 12%\" />\n<col style=\"width: 35%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Modelo</th>\n<th style=\"text-align: left;\">Comando</th>\n<th style=\"text-align: left;\">Tamanho</th>\n<th style=\"text-align: left;\">Quando usar</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Gemma 2</strong></td>\n<td style=\"text-align: left;\"><code>ollama pull gemma2</code></td>\n<td style=\"text-align: left;\">~5,4 GB</td>\n<td style=\"text-align: left;\"><strong>padrão</strong> — bom equilíbrio</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Gemma 2 grande</td>\n<td style=\"text-align: left;\"><code>ollama pull gemma2:27b</code></td>\n<td style=\"text-align: left;\">~16 GB</td>\n<td style=\"text-align: left;\">placa de 24 GB ou mais</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Qwen 2.5</td>\n<td style=\"text-align: left;\"><code>ollama pull qwen2.5:14b</code></td>\n<td style=\"text-align: left;\">~9 GB</td>\n<td style=\"text-align: left;\">forte em texto técnico</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Gemma 4</td>\n<td style=\"text-align: left;\"><code>ollama pull gemma4:12b</code></td>\n<td style=\"text-align: left;\">~8 GB</td>\n<td style=\"text-align: left;\">geração mais recente</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Gemma 2 pequeno</td>\n<td style=\"text-align: left;\"><code>ollama pull gemma2:2b</code></td>\n<td style=\"text-align: left;\">~1,6 GB</td>\n<td style=\"text-align: left;\">máquina modesta</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — O modelo precisa caber na memória da placa de vídeo. Numa placa de 4 GB, o <code>gemma2</code> padrão já fica apertado — se a resposta demorar demais ou falhar, use <code>gemma2:2b</code>. O Ollama também roda no processador, mas fica bem mais lento.</p>\n</blockquote>\n<h3 id=\"verificar-se-o-ollama-está-pronto\">12.4 · Verificar se o Ollama está pronto</h3>\n<p>Três formas de conferir: pelo terminal, pelo notebook e pelo próprio sistema. Todas respondem à mesma pergunta — “o Ollama está no ar e o modelo que eu quero está baixado?”.</p>\n<p><strong>NO TERMINAL (PowerShell)</strong></p>\n<pre><code>ollama --version               # está instalado?\nollama list                    # quais modelos estão baixados?\nollama run gemma2 &quot;Diga olá&quot;   # o modelo responde?</code></pre>\n<p><strong>NO NOTEBOOK — forma rápida</strong></p>\n<p>A exclamação manda o comando para o terminal do sistema sem sair do notebook:</p>\n<pre><code>!ollama list</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Não use <code>!ollama run gemma2 \"Diga olá\"</code> no notebook. Esse comando abre uma sessão <strong>interativa</strong>, que fica esperando a próxima pergunta — e a célula trava, sem devolver o controle. Para testar a resposta do modelo pelo notebook, use uma das duas formas abaixo.</p>\n</blockquote>\n<p><strong>NO NOTEBOOK — a verificação que o próprio sistema faz</strong></p>\n<p>Esta é a melhor: usa exatamente o mesmo código que o assistente de glosas executa antes de trabalhar, e devolve a mesma mensagem de erro — já escrita para ser lida por quem vai resolver o problema.</p>\n<pre><code>import sys\nsys.path.insert(0, r&quot;C:\\0_Desenvolvimento\\CNPQ\\lattes_pipeline&quot;)\n\nfrom config import CFG\nfrom ia.provedores import Ollama\n\nprovedor = Ollama(modelo=CFG.ia.modelo, url=CFG.ia.ollama_url)\nok, mensagem = provedor.disponivel()\n\nprint(&quot;✅&quot; if ok else &quot;❌&quot;, mensagem)</code></pre>\n<p>Saída quando está tudo certo:</p>\n<pre><code>✅ Ollama ativo · modelo &#39;gemma2&#39; disponível</code></pre>\n<p>Saída quando o Ollama está rodando mas falta o modelo — repare que ele já entrega o comando da correção:</p>\n<pre><code>❌ O Ollama está rodando, mas o modelo &#39;gemma2&#39; não foi baixado.\n   Baixe com:  ollama pull gemma2\n   Modelos presentes: llama3:latest</code></pre>\n<p>Saída quando o serviço não está no ar:</p>\n<pre><code>❌ Não consegui falar com o Ollama em http://localhost:11434.\n   Confira se ele está instalado e rodando (veja o manual).\n   Teste rápido:  ollama list</code></pre>\n<p><strong>NO NOTEBOOK — testar a resposta do modelo de verdade</strong></p>\n<p>Se quiser ir além da checagem e ver o modelo escrever:</p>\n<pre><code>resposta = provedor.conversar(\n    sistema=&quot;Você responde em uma frase curta, em português.&quot;,\n    usuario=&quot;Diga olá.&quot;,\n)\nprint(resposta)</code></pre>\n<p>A primeira chamada demora mais: o Ollama carrega o modelo na memória da placa. As seguintes são rápidas.</p>\n<p><strong>NO NOTEBOOK — perguntar direto ao serviço, sem o projeto</strong></p>\n<p>Útil para depurar quando nem o <code>import</code> está funcionando:</p>\n<pre><code>import json, urllib.request\n\nwith urllib.request.urlopen(&quot;http://localhost:11434/api/tags&quot;, timeout=5) as r:\n    modelos = json.loads(r.read())[&quot;models&quot;]\n\nfor m in modelos:\n    print(f&quot;{m[&#39;name&#39;]:24s} {m[&#39;size&#39;] / 1e9:5.1f} GB&quot;)</code></pre>\n<p>Se esta célula levantar erro de conexão, o problema é o serviço do Ollama — não o Python, não o kernel, não o projeto.</p>\n<blockquote>\n<p><strong>CONFIRA</strong> — O assistente de glosas faz essa verificação sozinho, antes de qualquer trabalho, e diz exatamente o que falta:</p>\n<pre><code>🤖 Ollama ativo · modelo &#39;gemma2&#39; disponível</code></pre>\n<p>Se algo estiver errado, ele mostra o comando exato para corrigir. Ou seja: rodar o assistente é, por si só, um teste do Ollama.</p>\n</blockquote>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — O Ollama é um <strong>serviço</strong>, não uma biblioteca Python. Ele roda fora do ambiente virtual, sobe junto com o sistema operacional e responde por HTTP na porta 11434. Por isso ele não aparece no <code>pip list</code> e não é afetado por recriar o <code>venv</code>.</p>\n</blockquote>\n<h3 id=\"se-preferir-usar-um-serviço-de-nuvem\">12.5 · Se preferir usar um serviço de nuvem</h3>\n<p>O Ollama é o padrão porque é gratuito e privado. Mas modelos de nuvem são maiores e redigem melhor. O sistema aceita três:</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 10%\" />\n<col style=\"width: 19%\" />\n<col style=\"width: 26%\" />\n<col style=\"width: 41%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Provedor</th>\n<th style=\"text-align: left;\">Modelo padrão</th>\n<th style=\"text-align: left;\">Chave (variável de ambiente)</th>\n<th style=\"text-align: left;\">Onde obter</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Google</td>\n<td style=\"text-align: left;\"><code>gemini-2.0-flash</code></td>\n<td style=\"text-align: left;\"><code>GOOGLE_API_KEY</code></td>\n<td style=\"text-align: left;\"><a href=\"https://aistudio.google.com/apikey\" class=\"uri\">https://aistudio.google.com/apikey</a></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Anthropic</td>\n<td style=\"text-align: left;\"><code>claude-sonnet-4-5</code></td>\n<td style=\"text-align: left;\"><code>ANTHROPIC_API_KEY</code></td>\n<td style=\"text-align: left;\"><a href=\"https://console.anthropic.com/settings/keys\" class=\"uri\">https://console.anthropic.com/settings/keys</a></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">OpenAI</td>\n<td style=\"text-align: left;\"><code>gpt-4o-mini</code></td>\n<td style=\"text-align: left;\"><code>OPENAI_API_KEY</code></td>\n<td style=\"text-align: left;\"><a href=\"https://platform.openai.com/api-keys\" class=\"uri\">https://platform.openai.com/api-keys</a></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Instale a biblioteca do provedor escolhido:</strong></p>\n<pre><code>python -m pip install google-generativeai    # Google\npython -m pip install anthropic              # Anthropic\npython -m pip install openai                 # OpenAI</code></pre>\n<p><strong>Defina a chave.</strong> Só na sessão atual do PowerShell:</p>\n<pre><code>$env:ANTHROPIC_API_KEY = &quot;sua-chave-aqui&quot;</code></pre>\n<p>Permanentemente, para o seu usuário:</p>\n<pre><code>[Environment]::SetEnvironmentVariable(&quot;ANTHROPIC_API_KEY&quot;, &quot;sua-chave&quot;, &quot;User&quot;)</code></pre>\n<p><em>(Feche e reabra o PowerShell para a mudança valer.)</em></p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Nunca escreva a chave dentro de um arquivo do projeto.</strong> Chave em código vaza no primeiro <code>git push</code>, e chave vazada é chave usada por outra pessoa, na sua conta. O sistema lê as chaves <strong>exclusivamente</strong> de variáveis de ambiente, e não há como configurá-las de outro jeito — isso é proposital.</p>\n</blockquote>\n<p><strong>Escolha o provedor</strong> em <code>config.py</code>:</p>\n<pre><code>provedor: str = &quot;anthropic&quot;      # ollama | google | anthropic | openai\nmodelo:   str = &quot;claude-sonnet-4-5&quot;</code></pre>\n<p>Ou, sem editar arquivo:</p>\n<pre><code>python ferramentas/construir_glosas.py --provedor anthropic</code></pre>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Serviços de nuvem cobram por uso e <strong>enviam o texto para fora da sua máquina</strong>. Se a base contiver dado sensível, ou se houver restrição institucional de sigilo, use o Ollama.</p>\n</blockquote>\n<h2 id=\"o-assistente-de-glosas\">13. O assistente de glosas</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Ele escreve o rascunho de cada glosa; você revisa e aprova. O que você aprova, ele nunca mais toca.</p>\n</blockquote>\n<h3 id=\"o-que-ele-faz-e-o-que-não-faz\">13.1 · O que ele faz, e o que não faz</h3>\n<p><strong>Faz:</strong> percorre o dicionário, monta uma instrução técnica para cada categoria — incluindo as categorias <strong>irmãs</strong> do mesmo agrupador — e pede ao modelo uma glosa escrita de forma contrastiva.</p>\n<p><strong>Não faz:</strong> substituir a curadoria humana. Ele produz um rascunho qualificado, o que reduz muito o trabalho de escrever do zero. A revisão continua sendo o passo que determina a qualidade final.</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — É a diferença entre receber uma minuta e receber uma folha em branco. A minuta acelera; ela não decide.</p>\n</blockquote>\n<h3 id=\"a-regra-inviolável\">13.2 · A regra inviolável</h3>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Categoria com</strong> <code>revisado = SIM</code> <strong>nunca é alterada.</strong> Nem com <code>--aprimorar</code>, nem com qualquer outra opção.</p>\n<p>O motivo é de confiança: se o script pudesse sobrescrever o trabalho de revisão, ninguém o usaria. Uma tarde de curadoria apagada por engano custa mais do que toda a automação economiza.</p>\n<p>Para reescrever uma glosa já revisada, mude <code>revisado</code> para <code>NAO</code> na planilha. É um ato deliberado e visível.</p>\n</blockquote>\n<h3 id=\"por-que-o-assistente-recebe-as-categorias-irmãs\">13.3 · Por que o assistente recebe as categorias irmãs</h3>\n<p>Esta é a decisão de projeto que mais afeta a qualidade do resultado.</p>\n<p>Uma glosa escrita no vácuo sai genérica — não por incapacidade do modelo, mas por falta de informação. Ele não tem como saber de que precisa se distinguir.</p>\n<p>O assistente entrega, junto com o pedido, <strong>todas as categorias do mesmo agrupador</strong> com suas glosas atuais. O modelo então enxerga a vizinhança e consegue escrever a fronteira.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Ao redigir «Metalurgia e Siderurgia», o assistente informa que existem «Mineração e Beneficiamento Mineral» e «Metalmecânica e Bens de Capital» no mesmo grupo. A glosa resultante diz onde uma termina e a outra começa — que é exatamente o que separa os vetores.</p>\n<p>Passamos apenas as irmãs do mesmo agrupador porque é ali que a confusão acontece. Ninguém confunde «Metalurgia» com «Farmacêutica»; confunde-se «Metalurgia» com «Metalmecânica».</p>\n</blockquote>\n<h3 id=\"como-usar-no-terminal-powershell\">13.4 · Como usar — no terminal (PowerShell)</h3>\n<p><strong>Fluxo recomendado — não pule os dois primeiros passos:</strong></p>\n<pre><code># 1. Ver o que seria feito, sem alterar nada\npython ferramentas/construir_glosas.py --simular\n\n# 2. Testar a qualidade num eixo só, com poucas categorias\npython ferramentas/construir_glosas.py --taxonomia setor_industrial --limite 3\n\n# 3. Se gostou do resultado, rodar completo\npython ferramentas/construir_glosas.py\n\n# 4. Revisar na planilha e marcar revisado = SIM nas aprovadas\n\n# 5. Rodar de novo — as aprovadas ficam intocadas\npython ferramentas/construir_glosas.py --aprimorar</code></pre>\n<p><strong>Todas as opções:</strong></p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 26%\" />\n<col style=\"width: 71%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Opção</th>\n<th style=\"text-align: left;\">O que faz</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>--simular</code></td>\n<td style=\"text-align: left;\">Mostra o que seria feito; não altera nada</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>--aprimorar</code></td>\n<td style=\"text-align: left;\">Reescreve também as que já têm glosa (e não foram revisadas)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>--taxonomia &lt;nome&gt;</code></td>\n<td style=\"text-align: left;\">Limita a um eixo</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>--limite &lt;n&gt;</code></td>\n<td style=\"text-align: left;\">Processa no máximo N categorias</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>--provedor &lt;nome&gt;</code></td>\n<td style=\"text-align: left;\"><code>ollama</code> · <code>google</code> · <code>anthropic</code> · <code>openai</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>--modelo &lt;nome&gt;</code></td>\n<td style=\"text-align: left;\">Sobrepõe o modelo do <code>config.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>--dominio &lt;nome&gt;</code></td>\n<td style=\"text-align: left;\">Trabalha noutra área</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"como-usar-no-notebook\">13.5 · Como usar — no notebook</h3>\n<p>O assistente é um script de linha de comando, e por isso tem duas formas de ser chamado do notebook. A primeira é a mais simples; a segunda dá controle e devolve o resultado em memória.</p>\n<p><strong>Forma 1 — chamar o script pelo terminal, sem sair do notebook</strong></p>\n<p>Basta pôr a exclamação na frente. É o mesmo comando da seção 13.4, com o mesmo resultado:</p>\n<pre><code>!python ferramentas/construir_glosas.py --simular\n!python ferramentas/construir_glosas.py --taxonomia setor_industrial --limite 3\n!python ferramentas/construir_glosas.py --aprimorar</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — O <code>!</code> executa a partir da pasta em que o notebook foi aberto, não da pasta do projeto. Se der <code>No such file or directory</code>, confirme onde você está com <code>!cd</code> (Windows) ou passe o caminho completo: <code>!python C:\\0_Desenvolvimento\\CNPQ\\lattes_pipeline\\ferramentas\\construir_glosas.py --simular</code>.</p>\n</blockquote>\n<p><strong>Forma 2 — chamar a função Python diretamente</strong></p>\n<p>Aqui você monta as opções como um objeto e chama a mesma função <code>executar()</code> que a linha de comando chama. A vantagem é poder mudar um parâmetro e repetir a célula, sem redigitar o comando inteiro:</p>\n<pre><code>import sys\nsys.path.insert(0, r&quot;C:\\0_Desenvolvimento\\CNPQ\\lattes_pipeline&quot;)\n\nfrom argparse import Namespace\nfrom ferramentas import construir_glosas\nfrom config import CFG\n\nopcoes = Namespace(\n    dominio=CFG.dominio,      # &quot;industria&quot;\n    provedor=&quot;&quot;,              # &quot;&quot; = usa o do config.py\n    modelo=&quot;&quot;,                # &quot;&quot; = usa o do config.py\n    taxonomia=&quot;setor_industrial&quot;,\n    limite=3,\n    aprimorar=False,\n    simular=True,             # ⬅️ comece SEMPRE por aqui\n)\n\nconstruir_glosas.executar(opcoes)</code></pre>\n<p>Para valer de verdade, troque <code>simular=True</code> por <code>simular=False</code>. Para reescrever as glosas que já existem e ainda não foram revisadas, <code>aprimorar=True</code>.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — A regra inviolável da seção 13.2 vale igual nos dois modos: categoria com <code>revisado = SIM</code> <strong>nunca</strong> é alterada, nem pelo terminal, nem pelo notebook, nem com <code>--aprimorar</code>.</p>\n</blockquote>\n<p><strong>Conferir o resultado sem sair do notebook</strong></p>\n<p>Depois de rodar, o relatório e o dicionário podem ser abertos ali mesmo:</p>\n<pre><code>import pandas as pd\n\n# as glosas que a validação automática marcou como frágeis\nrel = pd.read_excel(CFG.caminhos.relatorios / &quot;glosas_geradas.xlsx&quot;,\n                    sheet_name=&quot;REVISAR_PRIMEIRO&quot;)\nrel.head(20)\n\n# o dicionário atualizado\nimport dominios\ndic = pd.read_excel(dominios.caminho_dicionario(CFG.dominio))\ndic[dic[&quot;taxonomia&quot;] == &quot;setor_industrial&quot;][[&quot;nivel2&quot;, &quot;glosa&quot;, &quot;revisado&quot;]]</code></pre>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — O ciclo de curadoria fica bom no notebook: rodar com <code>--limite 3</code>, ler as três glosas na tela, ajustar o prompt em <code>ia/prompts.py</code>, recarregar (<code>%autoreload 2</code> cuida disso) e rodar de novo. Só quando o padrão agradar é que se roda o dicionário inteiro.</p>\n</blockquote>\n<h3 id=\"o-que-ele-grava\">13.6 · O que ele grava</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 60%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Onde</th>\n<th style=\"text-align: left;\">O quê</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">O dicionário</td>\n<td style=\"text-align: left;\">glosa e exemplares novos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>origem</code></td>\n<td style=\"text-align: left;\"><code>ia:&lt;modelo&gt;</code> — a procedência fica registrada</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>revisado</code></td>\n<td style=\"text-align: left;\"><code>NAO</code> — sempre; nada gerado por máquina nasce aprovado</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Backup</td>\n<td style=\"text-align: left;\">cópia do dicionário anterior, com a data no nome</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>5_RELATORIOS/glosas_geradas.xlsx</code></td>\n<td style=\"text-align: left;\">o antes e o depois de cada glosa</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>CONFIRA</strong> — O relatório tem três abas. Comece pela <strong>REVISAR_PRIMEIRO</strong>: são as glosas que a validação automática apontou como frágeis. Se o tempo for curto, revise só essas.</p>\n</blockquote>\n<h3 id=\"a-validação-automática\">13.7 · A validação automática</h3>\n<p>Antes de gravar, o assistente confere cada glosa recebida:</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 36%\" />\n<col style=\"width: 61%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Verificação</th>\n<th style=\"text-align: left;\">Por quê</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Entre 25 e 55 palavras</td>\n<td style=\"text-align: left;\">Curta não dá sinal; longa dilui o foco</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Cita alguma categoria irmã</td>\n<td style=\"text-align: left;\">É o contraste que separa os vetores</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Não começa com metalinguagem</td>\n<td style=\"text-align: left;\">“Esta categoria abrange…” não carrega significado</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Não repete o rótulo no início</td>\n<td style=\"text-align: left;\">Redundante — o rótulo já entra separadamente</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Ao menos 4 exemplares</td>\n<td style=\"text-align: left;\">Termos de busca reforçam o vetor</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Os avisos <strong>não impedem a gravação</strong>. Eles vão para o relatório, sinalizando o que a revisão humana deve olhar primeiro. Só glosa vazia é descartada.</p>\n</blockquote>\n<h3 id=\"se-a-qualidade-não-agradar\">13.8 · Se a qualidade não agradar</h3>\n<p>Em ordem de eficácia:</p>\n<ol type=\"1\">\n<li><strong>Troque o modelo.</strong> <code>gemma2:27b</code> ou um provedor de nuvem redigem visivelmente melhor que modelos pequenos.</li>\n<li><strong>Escreva você mesmo 2 ou 3 glosas exemplares</strong> do domínio e marque-as como <code>revisado = SIM</code>. Elas passam a ser exibidas como irmãs, e o modelo imita o padrão.</li>\n<li><strong>Ajuste o prompt</strong> em <code>ia/prompts.py</code>. É o único lugar que define o estilo — mudar ali muda todas as glosas seguintes.</li>\n</ol>\n<h2 id=\"primeira-execução\">14. Primeira execução</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Dois comandos: um confere o ambiente, o outro roda tudo com dados simulados. Se os dois passarem, a instalação está correta — pelo terminal, pelo notebook ou por dois botões do Assistente (14.4).</p>\n</blockquote>\n<h3 id=\"os-dois-comandos-de-estreia\">14.1 · Os dois comandos de estreia</h3>\n<p><strong>NO TERMINAL (PowerShell)</strong></p>\n<pre><code># 1. Confira o ambiente. Ele diz exatamente o que falta.\npython pipeline.py --pre-voo\n\n# 2. Rode com dados simulados, para ver tudo funcionando.\npython pipeline.py --demonstracao 300</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>import sys\nsys.path.insert(0, r&quot;C:\\0_Desenvolvimento\\CNPQ\\lattes_pipeline&quot;)\n\nimport pipeline\npipeline.pre_voo()                    # 1. confere o ambiente\npipeline.executar(demonstracao=300)   # 2. roda com dados simulados</code></pre>\n<p>Se os dois funcionarem, a instalação está correta.</p>\n<p>Os dois modelos de IA — o de vetores (E5, 1,1 GB) e o de desempate (reranker, 2,2 GB) — são baixados uma vez só, de preferência <strong>antes</strong> desta estreia: 14.2 mostra como. Se ainda não estiverem no cache, a primeira classificação os baixa sozinha — e parece travada em «Carregando modelo vetorial» durante o download. Depois disso, o sistema funciona <strong>inteiramente offline</strong> — nenhum currículo sai da sua máquina.</p>\n<blockquote>\n<p><strong>CONFIRA</strong> — O <code>--pre-voo</code> é o primeiro comando a rodar em qualquer máquina nova. Ele confere caminhos, dicionário, dados de entrada, bibliotecas e os modelos de IA no cache (14.2), mostra o dispositivo detectado (GPU ou processador) e sai — sem processar nada. Cinco segundos ali evitam descobrir um problema no fim de uma execução de seis horas.</p>\n</blockquote>\n<h3 id=\"os-modelos-de-ia-baixar-antes-da-primeira-execução\">14.2 · Os modelos de IA: baixar antes da primeira execução</h3>\n<p>O pipeline usa dois modelos de IA que rodam na sua máquina. Eles não vêm com o <code>pip</code>: são arquivos grandes, baixados uma vez do Hugging Face — o repositório público de modelos — e guardados num cache local. Baixá-los antes da primeira execução evita duas surpresas: a primeira classificação parada por muitos minutos em «Carregando modelo vetorial», e a falha numa máquina sem internet.</p>\n<table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 35%\" />\n<col style=\"width: 11%\" />\n<col style=\"width: 17%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Modelo</th>\n<th>Para que serve</th>\n<th>Tamanho</th>\n<th>É preciso?</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>E5 · <code>intfloat/multilingual-e5-large-instruct</code></td>\n<td>transforma texto em vetor: classificação, vetorização e busca</td>\n<td>1,1 GB</td>\n<td>sempre</td>\n</tr>\n<tr class=\"even\">\n<td>reranker · <code>BAAI/bge-reranker-v2-m3</code></td>\n<td>o desempate de precisão (6)</td>\n<td>2,2 GB</td>\n<td>só com o desempate ligado</td>\n</tr>\n</tbody>\n</table>\n<p><strong>NO TERMINAL (PowerShell)</strong></p>\n<pre><code># os dois modelos (3,3 GB)\npython pipeline.py --baixar-modelos\n\n# ou um só\npython pipeline.py --baixar-modelos e5\npython pipeline.py --baixar-modelos reranker</code></pre>\n<p>O andamento sai arquivo por arquivo, com o percentual — e a última linha diz se deu certo:</p>\n<pre><code>⬇ E5 · intfloat/multilingual-e5-large-instruct → C:\\…\\huggingface\\hub\n  ⬇ E5 · 3/11 · model.safetensors (1,1 GB)\n  ✓ E5 · 37% · 412 MB de 1.120 MB\n✅ E5 pronto (1,1 GB, 11 arquivos)</code></pre>\n<p>Uns 10 minutos a 50 Mbit/s; até 1 hora numa conexão lenta. Antes de começar, o comando confere o espaço livre no disco do cache e para, sem baixar nada, se faltar. Se a internet cair no meio, rode de novo: ele continua de onde parou. Sem acesso, a resposta é uma linha só:</p>\n<pre><code>❌ sem acesso à internet (ou proxy bloqueando huggingface.co): nada foi gravado pela metade</code></pre>\n<p><strong>Onde ficam.</strong> No cache da Hugging Face — por padrão, dentro do seu perfil do Windows, em <code>C:\\Users\\&lt;conta&gt;\\.cache\\huggingface\\hub</code>. Para guardar em outro lugar, defina a variável <code>HF_HOME</code> com a pasta desejada: os modelos vão para <code>&lt;HF_HOME&gt;\\hub</code>. Pelo Assistente, é o campo «HF_HOME (cache dos modelos de IA)», na aba «6 · Ambiente». Numa máquina com mais de uma conta, leia antes o item 9 do capítulo 26.</p>\n<p><strong>Conferir.</strong> O pré-voo passou a dizer, logo abaixo do nome do modelo, se cada um está no cache:</p>\n<pre><code>  modelo ............ intfloat/multilingual-e5-large-instruct\n  cache do E5 ....... ✅ no cache (1,1 GB) — C:\\Users\\x\\.cache\\huggingface\\hub\n  cache do reranker . ○ não baixado (2,2 GB) — só é preciso com o desempate ligado</code></pre>\n<p>O ○ cinza não é erro: com o desempate desligado, o reranker não faz falta. Com o desempate ligado, a mesma linha vira ❌ e já traz o comando da correção — <code>python pipeline.py --baixar-modelos reranker</code>; sem o E5, <code>python pipeline.py --baixar-modelos</code> (ou o passo 5 do Assistente). E «○ não conferido (huggingface_hub ausente)» quer dizer que as bibliotecas ainda não foram instaladas (9.4).</p>\n<p><strong>Sem internet na máquina de trabalho.</strong> Baixe numa máquina com internet, com o mesmo comando, e copie as duas pastas do cache — <code>models--intfloat--multilingual-e5-large-instruct</code> e <code>models--BAAI--bge-reranker-v2-m3</code>, dentro de <code>hub</code> — para o <code>hub</code> do <code>HF_HOME</code> da máquina de trabalho. Lá, defina também <code>HF_HUB_OFFLINE=1</code>: se faltar algum arquivo, o pipeline falha na hora, com mensagem, em vez de tentar a internet.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Pelo Assistente, é o passo 5 da Primeira configuração (14.4): o botão «⬇ Baixar os modelos» roda este mesmo comando, depois de mostrar o destino, o espaço livre e o tempo estimado. Nenhum currículo é enviado — é só download.</p>\n</blockquote>\n<h3 id=\"com-dados-reais\">14.3 · Com dados reais</h3>\n<p><strong>NO TERMINAL (PowerShell)</strong></p>\n<pre><code># 1. Deposite os arquivos do Lattes na pasta de entrada.\n#    A pasta é mostrada por: python pipeline.py --config\n\n# 2. Rode.\npython pipeline.py\n\n# 3. Confira o primeiro relatório antes de qualquer coisa.\n#    5_RELATORIOS\\1_ingestao.xlsx</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>from config import CFG\nprint(&quot;deposite os arquivos em:&quot;, CFG.caminhos.entrada)\n\nimport pipeline\npipeline.executar()\n\n# conferir o primeiro relatório sem sair do notebook\nimport pandas as pd\npd.read_excel(CFG.caminhos.relatorios / &quot;1_ingestao.xlsx&quot;,\n              sheet_name=&quot;RESUMO&quot;)</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Confira o relatório da etapa 1 <strong>antes</strong> de olhar qualquer resultado de classificação. Se uma tabela veio vazia porque o caminho de tag mudou, tudo o que vier depois estará incompleto — e o defeito é muito mais
