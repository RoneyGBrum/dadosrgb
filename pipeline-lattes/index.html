barato de corrigir agora do que depois de uma execução completa. Ver a seção 24.</p>\n</blockquote>\n<h3 id=\"primeira-configuração-pelo-assistente-sem-terminal\">14.4 · Primeira configuração pelo Assistente (sem terminal)</h3>\n<p>Este é o caminho de quem nunca abriu um terminal. Com o Python instalado (8.1), dê dois cliques em <code>Assistente Lattes.vbs</code>, na raiz do repositório — ou no atalho da área de trabalho. A janela abre na aba «0 · Início», e o primeiro cartão, <strong>«Primeira configuração»</strong>, é o roteiro: nove passos numerados, de cima para baixo, na ordem em que um depende do outro — os sete primeiros obrigatórios, os dois últimos opcionais.</p>\n<p>O passo atual — o primeiro que falta — fica <strong>em azul</strong>, e o botão dele faz o que falta. Cada botão mostra antes o que vai fazer (o comando, o tamanho do download, o tempo) e só age depois da sua confirmação; o andamento aparece no log, à direita. Nada fica travado: os botões dos outros passos continuam clicáveis, e cada um confere a própria condição antes de agir. Os opcionais nunca seguram o resto.</p>\n<p>Numa máquina recém-instalada, o cartão mostra o Python pronto e o passo 2 em azul: ainda não há ambiente virtual, e os passos 3 a 5, que dependem dele, esperam com um traço.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0gAAAKyCAMAAADYRw4iAAADAFBMVEX///////L//+z//+j//+f//+X//+H//9///9f//9H//8r//8L//77n///i///d///c///g/+LQ///E///E/827//+5//+4//+4/9Ho8P719vjo8PDo8OTo8N7o8Nvo8Mro8L7X8P7P8P7P8OTK8P7J8P608P608Mqr8P6p8P7n6ezi4//f4+j/6uH/6cP/5Nn/47D/6qPi4+X/4Lr/3r7/3p3/1K/i19vo1q/n1K/o0Zz/yM7/yLD/waL/yJPiyJbc6uHc5P+56f/E4//A5cSm4/+m49PO1/y51cLZ2aS01q/EyNamyP+myLDcwILcwF/A0ZyU5f+X3v+W4sia1v6e0/+S4P+I1/6L0f6L0b6GyP+GyOWGyMpt1f9tyP9rwf9rwehEwOHovbjnvZnovZL/vHnov2nosXjiqpPiqnbWv7rQvZLcrcHEqoPOopfcoInQpoPdmp3PonbcplTdmlPGjYvEjFfKkVOcvLm7vHmGvet+vf5+vd9xvP9xvNq3qNq5kMq5kLSmjLCvp3S1jn+VnN9xmqGaonaIjJeUkzrBi3a0hle4fm+0cGmmbZOmbXambVfXiwq7dSjPcD69cD69 lustração: estado simulado numa máquina já configurada.</figcaption></figure>\n<ol type=\"1\">\n<li><strong>Python</strong> — nada a fazer: se a janela abriu, ele existe. A linha mostra a versão que abre a janela e a do ambiente virtual. Se disser «fora do medido (3.13)», instale o 3.13 (8.1) antes de seguir.</li>\n<li><strong>Ambiente virtual (venv)</strong> — botão «Criar venv». Cria a pasta <code>venv</code> na raiz do repositório, com o Python desta janela, em menos de um minuto (o que é um venv: 8.3). Ao terminar, pergunta <strong>«Reabrir o Assistente agora»</strong> ou «Depois»: a janela precisa reabrir para passar a usar o Python novo.</li>\n</ol>\n<p>Com o venv criado e a janela reaberta, o passo 3 é o torch: a linha já diz se há placa NVIDIA — «não instalado — placa … pronta para a versão com GPU» — e o botão monta o comando certo para esta máquina, o mesmo de 9.3.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0gAAAKeCAMAAACoKctvAAADAFBMVEX///////L//+z//+j//+f//+X//+H//9///9f//9H//8r//8L//77n///i///d///c///h/+TQ///E///E/8+7//+5//+4//+4/9Ho8P719vjo8Ovo8OTo8N7o8Nvo8Mro8L7X8P7P8P7P8OTK8P7J8P608P6r8P7n6ezi4//f4+j/6uH/6cP/5Nv/48r/47D/6qPi4+X/4Lr/3p3/1K/h19vo1q/n1K/o0Zz/yM7/yLD/yJPiyJX/waLovr/ovZLnvZnov2nc6uG56v+56f/E4/+66eHE47Cm4/+m49PO1/651cLY2aLEyNamyP+myLDZv6HNvZvcwF+U6v+U5P+S4P+X3v+W48uf1P+a1v6I1/6L0f6GyP+GyOWGyMqMvfGTvbxt1f9tyP9+vf5+vdVrwf9mv/dEwOH/vHnosXjiqpPiqnbXrL3EqnjOo57dmp3coInQpoPPonbXpmndmlPgpj7FjIrEjFfKkVOevKNxvP9xvNy0qN65kMi5kLSmjLCwqGy0jn2PqbiXmt9xmqGUkzqHjaDAi3m0hle4fm+0cGmmbZOmbXambVfXiwq7dSjPcD69cD69cAqrbyiZhbGfdoOGdoN+hsqUcc6UcbSHbrKKdDlosf5kquVroOhosd5kqsprptdgouRgosposb5kqrBtqYJgoq9tqV9Jmt9qj8RokZxtkzpErfI+pfI/oOg/oNETqcJEk4JEk18Tk6MTk3FEkd4TkOdBjMpBjJ1ghspBhspkbtpkbbBBbbBrdq9rdplrdoNkbZNkbXZreD5EfDpBbXYTiuYNftEbdb4TcdsTbtobb74TfIITfF8SfDqaale5UySSWm+XTSiGS5OGS3aGS1doXp9MTT5EUbR+S3Z+S1dkS5NkS3ZkS1dgS5JgS3ZgS1dBaq9BS5NBS5JBS3ZBS1eLSihQSkVrMolrMm9xIShoIShJIShEISg+UbQbTZ0rU2wbSpwbSl8/Mm8bIXkbIXgbIVMb nce-transformers e, para o painel, fastapi e uvicorn —, em alguns minutos. Vem depois do torch de propósito: nessa ordem, o <code>pip</code> não troca o torch com placa pela versão sem placa (9.2). Se o torch ainda não estiver instalado, o botão avisa e manda para o passo 3.</li>\n</ol>\n<p>O passo 5 baixa os modelos uma vez só: a linha diz o que falta — «E5 (1,1 GB, obrigatório) e reranker (2,2 GB, opcional) ainda não estão no cache» — e, depois do download, o pipeline não precisa mais de internet.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0gAAALMCAMAAADpb2KTAAADAFBMVEX///////L//+z//+j//+f//+X//+H//9///9v//9f//9H//8r//8L//77//7jy///n///i///d///i/9/c///c/+jQ///E///E/867//+5//+4//+5/+Po8P719vjo8PLo8OTo8N7o8Nvo8Mro8L7X8P7P8P7P8OTK8P608P608Mqr8P7t5fTf4+j/6cz/5Nv/48r/47Dl5OD/6qP/5JHn5JH/4Lr/3p3/1K/o19/o1q/kz8n/yZH/yWno0ZzyyWn/yL//yJPiyJb/waLovr/ovZLnvZrov2nc6uHc5P/b5P/c5PK66f/A5cOm4/+m49PO1/651cLa2aPPyf+w1KbLxc2myP+myLDcwGXOvZSU5f+S4P+X3v+W48yf1P+a1v6I1/6L0f6L0b6GyP+GyOWMvfGHx8lt1f9tyPx+vf5+vdlrwf5EwOH/vHnpsXbyrj7nrj7iqpPiqnbQrKXNo5/coInQpoPdmp3PonbcplTdmlPNj4DEjFfnkQrKkVLBrtvBrriZuKJxvP9xvNm2qda0kbi5kLWzn3WmjLCmjGOFmLeUkzrBinW0hle5fnC0c5G0c2m0cGmmbXembVfXiwq7dSjPcD7bcwqxby6Fg8WUccmUcbSIbruTeYyGbbCNdC1osf5kquVroOhrp9hgouRkqspkqrBgosptqYJtqV9Jmt9qj8BtkzpErPE/oOcTqcJEk4JEk18Tk48pkONBjMpBjJpghspBhspEcdtkbbBBbbBrdq9rdplrdoNBhq9tfDpEfDpkbZJkbXZlblZBbXYNftIbdb4Tcdsab8ETfIITfF8SfDrBU2nOUz7BUz60U2m1Uz7HUwq0UwmaanaaaleSWm+XTSiGS5OGS3aGS1diXIxEUbV+S5J+S3Z+S1dkS5NkS3ZkS1dgS5JgS3ZgS1dBaq9BS5NBS5JBS3ZBS1eLSihrMnBESj5xIShoIShJIShEISg+UbQbTZ0nUWktPoYbIXkbIXgbIVMbISkNWroTUc4TUcETUbQNMqINMokMMm9xYFxVAABUtElEQVR42u28DZhdV3nfu4GObTISeISux3KtG7emNJR77c6FGwnf0uZgi0upmBYTbNWxTduDbRQYu5wnNnom27IZ2yCKBb1Mp07Co4RTbBcGg8A+jWrZU3/kMgGrbS65jtA8bZGUhkGHRlGueIROUlLf9b7rXWu9a3+crxmN5uP/f6Q5e6/vtfb72+tda599kv8ZgqAFK8EQQBBAgiCABEEACYIggARBAAmCABIErWKQ/lcIgvpQFqQEgqCeBZAgCCBBEECCIIAEQRBAgiCABEEACYIAEgRBAAmCABIEASQIAkgQBAEkCAJIEASQIAggQRAEkCAIIEHQ6gfps698q+/ omínio padrão, <code>industria</code>, já traz o dicionário: em geral este passo já aparece ✅.</li>\n</ol>\n<p><strong>Opcionais</strong> — só para quem precisa deles:</p>\n<ol start=\"8\" type=\"1\">\n<li><strong>Ollama (opcional)</strong> — botão «Ver aba IA». Só faz falta para redigir glosas com IA local (12); nada do pipeline depende dele.</li>\n<li><strong>Git (opcional)</strong> — sem botão: só para quem versiona o código (aba «8 · Git»). Instale em <a href=\"https://git-scm.com/download/win\" class=\"uri\">https://git-scm.com/download/win</a>.</li>\n</ol>\n<p>Quando os sete passos estão feitos, o cartão recolhe numa linha (os opcionais 8 e 9 não contam): «✅ Primeira configuração completa», seguida da versão do Python, do torch, da placa, dos modelos no cache e da pasta das bases. «Mostrar os passos» abre a lista de novo, e «Ocultar os passos» a recolhe. Daí em diante, o que interessa são os outros dois cartões, «Estado dos dados» e «Próximo passo» (15.4).</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA0gAAAC/CAMAAADzRgzVAAABtlBMVEX//////+j//+X//+H//9H//8r//8Li///c///c/+jc/+Hi/8rc/8LE//+5//+4///E/+W4/9H19vj/6sL/6qPc6qO56qOU6v+U6uGU6sL/48ri4//i4+X/47Df4+jE4//E4+XE47Cm4/+m4+Wm48r/4Lr/1YLc4Lr/yLD/yJPiyMriyJP/waLcwKPcwILcwF/EyOXEyMqmyLCU1aOS4P+GyP+GyMqUwOG5wF+UwF9t1f9t1eFt1cJtwOFtwKPiqpPiqnbcoInEqrDEqpPEqna5qV+5qTqmqpO4oImUqTqUk4KUk1+UkzrEjHa4fm+mjLCmjJPEjFemjFeGqsqSoOiGjJNtqTptk19tkzqSfrptfDprwf9rwehEwOFEwMJkquVkqspkqrBEqcITqcJroOhBjMo/oOg/oNFEk6NEk4JEk19EkzoTk6MTk4ITk18NftFEfIJEfDoTfIITfF8SfDqmbZOmbXambVeSWm+GbVdkbbBkbZNkbXZkbVeGS5OGS3aGS1dkS5NkS3ZkS1dBbbBBbXZBS5NBS3ZBS1drMolrMm8/Wok/Wm8NWro/Mm8NMqINMokMMm9yn+DuAAAaoElEQVR42u1diX9cR1J+kaPYBOTl0G64xCHIgMAwu0uUZWcXVgYyEHAMAyyHwyASIbNkQ4ycIQ6bJVaIccSRZPUf00dVdVV3v5l5I8nWSN/3S+R5fVSfX1+vq17z4wAAnBgNqgAAQCQAAJEAAEQCAABEAgAQCQBAJAC4wET6OQAAFkBOpAYAgM4AkQAARAIAEAkAQCQAAEAkAACRAABEAgAQCQAAEAkAQCQAAJEAAEQCAABEAgAQCQBAJAAAkQAAAJEAAEQCgItPpNvH9xb2bcfN4+PPv7BA5Jsu2s1Pr6EpgXNOpNvHHp9 >\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>python pipeline.py</code></td>\n<td style=\"text-align: left;\">Roda as quatro etapas</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>python pipeline.py --demonstracao 300</code></td>\n<td style=\"text-align: left;\">Roda com 300 currículos simulados</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>python pipeline.py --etapas classificacao</code></td>\n<td style=\"text-align: left;\">Roda só uma etapa</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>python pipeline.py --pre-voo</code></td>\n<td style=\"text-align: left;\">Confere o ambiente e sai</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>python pipeline.py --baixar-modelos</code></td>\n<td style=\"text-align: left;\">Baixa os modelos de IA (E5 e reranker) antes da primeira execução (14.2)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>python pipeline.py --config</code></td>\n<td style=\"text-align: left;\">Mostra caminhos e parâmetros</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>python pipeline.py --dominios</code></td>\n<td style=\"text-align: left;\">Lista as áreas disponíveis</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>python pipeline.py --dominio saude</code></td>\n<td style=\"text-align: left;\">Usa outra área nesta execução</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>python testes/test_integracao.py</code></td>\n<td style=\"text-align: left;\">Bateria completa de verificação</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>python -m ingestao.adaptadores &lt;arq&gt;</code></td>\n<td style=\"text-align: left;\">Inspeciona uma amostra de dados</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>Assistente Lattes.vbs</code></td>\n<td style=\"text-align: left;\">Abre a janela única do Assistente (15.4)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>python ferramentas\\assistente.py</code></td>\n<td style=\"text-align: left;\">O mesmo, a partir do terminal</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>python -m ingestao.incremental</code></td>\n<td style=\"text-align: left;\">Ingestão em lote, para milhões de currículos (16.6)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>python -m ingestao.incremental --amostras</code></td>\n<td style=\"text-align: left;\">Regrava só as planilhas de conferência de <code>2_CURRICULOS</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>python -m ingestao.incremental --compactar</code></td>\n<td style=\"text-align: left;\">Funde os lotes e reescreve o manifesto (16.6)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>python ..\\sistema\\prospecta\\preparar.py --forcar</code></td>\n<td style=\"text-align: left;\">Refaz o pacote de <code>6_PROSPECTA</code> que o painel lê</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>python ..\\sistema\\prospecta\\servidor.py --sem-login</code></td>\n<td style=\"text-align: left;\">Sobe o painel em <code>http://127.0.0.1:8100</code> sem login (só em loopback)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Os mesmos comandos, no notebook.</strong> A tabela completa de equivalências está em 11.9; esta é a versão curta:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>No terminal</th>\n<th>No notebook</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>python pipeline.py</code></td>\n<td><code>pipeline.executar()</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>python pipeline.py --demonstracao 300</code></td>\n<td><code>pipeline.executar(demonstracao=300)</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>python pipeline.py --etapas classificacao</code></td>\n<td><code>pipeline.executar(etapas=[\"classificacao\"])</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>python pipeline.py --pre-voo</code></td>\n<td><code>pipeline.pre_voo()</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>python pipeline.py --config</code></td>\n<td><code>print(CFG.caminhos.como_texto())</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>python pipeline.py --dominios</code></td>\n<td><code>import dominios; dominios.listar()</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>python pipeline.py --dominio saude</code></td>\n<td><code>CFG.dominio = \"saude\"</code> antes de executar</td>\n</tr>\n<tr class=\"even\">\n<td><code>python testes/test_integracao.py</code></td>\n<td><code>!python testes/test_integracao.py</code></td>\n</tr>\n<tr class=\"odd\">\n<td><code>python -m ingestao.incremental --amostras</code></td>\n<td><code>!python -m ingestao.incremental --amostras</code></td>\n</tr>\n</tbody>\n</table>\n<p>A terceira porta para estes mesmos comandos é o Assistente (15.4): cada botão dele mostra, num cartão «Comando», a linha desta tabela que vai executar.</p>\n<h3 id=\"onde-ficam-os-arquivos\">15.2 · Onde ficam os arquivos</h3>\n<pre><code>raiz do projeto/\n├── 1_ENTRADA/          ← você deposita os dados aqui\n├── 2_CURRICULOS/          etapa 1: tabelas padronizadas (+ amostras .xlsx de 1.000 linhas)\n├── 3_CLASSIFICADO/        etapa 2: currículos com rótulos\n├── 4_RESULTADOS/          etapas 3 e 4: contagens e vetores\n├── 5_RELATORIOS/          relatórios em Excel, para leitura humana\n├── 6_PROSPECTA/           pacote que o painel Prospecta lê (preparar.py; ver 15.4)\n└── _trabalho/             cache e registros (pode apagar; será refeito)</code></pre>\n<p>A pasta raiz é definida em <code>config.py</code>, na função <code>_raiz_padrao()</code>. Também pode ser trocada pela variável de ambiente <code>LATTES_RAIZ</code>.</p>\n<p>Na ingestão em lote (16.6), <code>2_CURRICULOS</code> deixa de ser dez arquivos: cada tabela vira uma pasta com os lotes dentro, e ganha ao lado uma planilha <code>&lt;tabela&gt;.xlsx</code> de 1.000 linhas, para conferência. O pacote de <code>6_PROSPECTA/</code> é montado por <code>preparar.py</code>, e não pelas quatro etapas: é o que o painel Prospecta lê (15.4). O painel tem manual próprio, <code>sistema/Manual_Prospecta_1.7.docx</code>.</p>\n<h3 id=\"os-dois-formatos-em-4_resultados\">15.3 · Os dois formatos em <code>4_RESULTADOS</code></h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 11%\" />\n<col style=\"width: 86%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Formato</th>\n<th style=\"text-align: left;\">Para quê</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>.parquet</code></td>\n<td style=\"text-align: left;\">O dado completo. Preserva tipos, é compacto e rápido. É o que outras ferramentas devem consumir.</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>.xlsx</code></td>\n<td style=\"text-align: left;\">Visualização humana. Para abrir, conferir, filtrar e mostrar a alguém.</td>\n</tr>\n</tbody>\n</table>\n<p>As planilhas são limitadas a <strong>100.000 linhas</strong>. Não é o limite do Excel (1.048.576) — é um teto de usabilidade: uma planilha com centenas de milhares de linhas trava ao abrir.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Quando há truncamento, o próprio arquivo traz uma aba <strong>AVISO</strong> informando quantas linhas existem no total. Assim ninguém analisa uma amostra pensando que é o universo.</p>\n</blockquote>\n<p>O arquivo <code>curriculos_vetorizados.xlsx</code> sai <strong>sem a coluna de vetor</strong> — são centenas de números por linha, ilegíveis numa planilha. Quem precisa do vetor lê o Parquet.</p>\n<h3 id=\"o-assistente-a-janela-unica\">15.4 · O Assistente — a janela única</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Um arquivo, dois cliques, nenhuma janela preta: tudo o que este manual manda digitar também se faz aqui por botões — e o comando exato que vai rodar aparece na tela antes de rodar.</p>\n</blockquote>\n<p>O Assistente é uma janela <code>Tkinter</code>, o arquivo <code>lattes_pipeline/ferramentas/assistente.py</code>, lançada por <code>Assistente Lattes.vbs</code>, na raiz do repositório. Dez abas à esquerda, um log ao vivo à direita, mais de cem botões — cada um com uma dica que aparece ao pousar o mouse, inclusive nas ações irreversíveis.</p>\n<p><strong>O que ele não é:</strong> não é uma quinta etapa, não recalcula nada e não muda resultado nenhum. Cada botão monta uma das linhas de comando de 15.1 e a entrega a um subprocesso do Python do ambiente virtual. O motivo de existir é de alcance: quem opera o sistema nem sempre é quem o programou.</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — É o painel do carro. Os botões estão ali para você não precisar abrir o capô a cada viagem; o motor é exatamente o mesmo — e este painel ainda mostra, antes do arranque, o que vai acontecer.</p>\n</blockquote>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Duas regras do projeto que a janela não relaxa. Currículo é dado pessoal e só é processado nesta máquina: não existe botão que envie texto de currículo a serviço externo. E a chave de API nunca aparece em log, em preferências, em arquivo versionado nem em variável de ambiente registrada.</p>\n</blockquote>\n<h4 id=\"abrir-dois-cliques-no-lancador\">Abrir: dois cliques em <code>Assistente Lattes.vbs</code></h4>\n<p>O lançador fica na raiz do repositório, <code>C:\\0_Desenvolvimento\\CNPQ</code>, ao lado da pasta <code>lattes_pipeline</code>. Ele precisa ficar ali porque deriva todos os caminhos da própria posição.</p>\n<p>Por dentro, em ordem: confere se <code>lattes_pipeline\\ferramentas\\assistente.py</code> existe; procura um <code>pythonw.exe</code> — primeiro <code>venv\\Scripts</code> da raiz, depois <code>.venv</code>, depois <code>lattes_pipeline\\.venv</code>, depois os Pythons de usuário 3.13, 3.12 e 3.11 e o Anaconda; e roda com <code>lattes_pipeline</code> como pasta atual, sem console. O <code>pythonw.exe</code> é o Python que não abre janela preta; a janela que você vê é a do Tkinter.</p>\n<p><strong>Para um atalho na área de trabalho</strong>, o caminho mais curto é de dentro da própria janela: na aba «0 · Início», no rodapé, o botão «🔗 Criar atalho na área de trabalho» grava um <code>Assistente Lattes.lnk</code> na sua área de trabalho — a de verdade, perguntada ao Windows, que é o que faz o atalho aparecer também quando o OneDrive redireciona essa pasta. O atalho aponta para o <code>Assistente Lattes.vbs</code> da raiz (alvo, nunca cópia: nada é movido nem duplicado), roda a partir da raiz do repositório e usa o ícone do app — o bloco azul com a treliça de três nós, desenhado por <code>ferramentas/gerar_icone.py</code> e versionado em <code>ferramentas/assistente.ico</code> nos sete tamanhos que o Windows pede, de 16 a 256 px. O log da janela diz onde o arquivo ficou; se já existir um atalho com esse nome, ele é substituído, com aviso no log. Quem preferir o caminho manual continua com ele: botão direito no <code>.vbs</code> → «Enviar para → Área de trabalho (criar atalho)». Se o repositório mudar de pasta, refaça o atalho: ele guarda o caminho antigo.</p>\n<p>A mesma imagem é o ícone da janela, na barra de tarefas e no Alt+Tab. Num Tk que não leia arquivos <code>.ico</code>, o assistente abre <strong>sem</strong> ícone — nunca deixa de abrir.</p>\n<blockquote>\n<p><strong>CONFIRA</strong> — O <code>.lnk</code> é escrito pelo <code>WScript.Shell</code> do próprio Windows: com o pywin32 instalado, direto por COM (instantâneo); sem ele, por uma linha de PowerShell. O arquivo resultante é o mesmo.</p>\n</blockquote>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Se nada acontecer ao dar dois cliques, o lançador não falhou calado: ele avisa em caixa de mensagem. «Não encontrei o assistente em…» significa que o <code>.vbs</code> saiu da raiz — devolva-o. «Não consegui iniciar o Python» significa que ele não achou Python nenhum — nem o ambiente virtual do projeto, nem um Python instalado para o seu usuário: instale o Python 3.13 como em 8.1, marcando «Add python.exe to PATH», e dê os dois cliques de novo; o ambiente virtual e o resto se fazem pela aba «0 · Início» (14.4). Se nenhuma caixa apareceu, o duplo clique nem chegou a rodar — a associação do <code>.vbs</code> está desativada por política de segurança.</p>\n</blockquote>\n<p><strong>NO TERMINAL (PowerShell)</strong></p>\n<pre><code># O equivalente ao duplo clique — útil para ver a mensagem de erro de partida.\ncd C:\\0_Desenvolvimento\\CNPQ\\lattes_pipeline\npython ferramentas\\assistente.py</code></pre>\n<blockquote>\n<p><strong>CONFIRA</strong> — A janela depende do Tkinter, que vem com o instalador oficial do Python e não se instala com <code>pip</code>. Se o ambiente virtual foi criado por um Python sem Tk, o assistente não abre. O teste é <code>python -c &quot;import tkinter; print(tkinter.TkVersion)&quot;</code>, que deve imprimir 8.6.</p>\n</blockquote>\n<h4 id=\"a-janela-abas-e-log\">A janela: abas à esquerda, log à direita</h4>\n<p>A estrutura é fixa. As dez abas ficam à esquerda, na ordem em que se usam — «0 · Início», «1 · Ingestão», «2 · Pipeline», «3 · Prospecta», «4 · IA», «5 · Dicionário», «6 · Ambiente», «7 · Testes», «8 · Git» e «9 · Comandos» —, e o log de execução fica à direita, não embaixo: assim dá para acompanhar a etapa que roda enquanto se prepara a próxima. A divisória entre os dois é arrastável.</p>\n<p>O log é um só: tudo o que qualquer aba dispara escreve ali ao vivo, linha a linha, colorido por tipo — erro, aviso, conclusão, comando disparado, início de etapa. Na barra do log estão «Limpar» (que não cancela nada, só apaga a tela), «Salvar log…», «Pasta de logs» e a caixa «seguir o fim», que se desmarca para ler uma linha antiga enquanto o processo continua imprimindo.</p>\n<p>As preferências vivem fora do repositório, em <code>%LOCALAPPDATA%\\AssistenteLattes\\prefs.json</code>, ao lado do espelho diário do log. O que é perigoso nunca volta marcado de uma sessão anterior: a demonstração, o apagar a origem dos XML, o <code>--forcar</code>, o <code>--sem-login</code>, o endereço de rede, a base a servir e o aprimorar glosas nascem sempre desligados. É decisão consciente a cada vez, e não configuração esquecida.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — O log salvo costuma conter a resposta. Antes de pedir ajuda, clique em «Salvar log…» e anexe o arquivo: ele já sai com qualquer segredo mascarado.</p>\n</blockquote>\n<h4 id=\"aba-inicio\">Aba «0 · Início» — o que falta para esta máquina rodar</h4>\n<p>A aba responde uma pergunta só — o que falta para esta máquina rodar — em três cartões: «Primeira configuração», «Estado dos dados» e «Próximo passo».</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAOCCAMAAACS2p9RAAADAFBMVEX//////+r//+f//+X//+H//9f//8r//8L//7j9/f719vj19t/19sbt///i///c///z9vvp9+/l+8nZ9vjE///E/+W99vi5//+4//+z/Nfz8/Px9Pry8vPp7fPp7cz/5PLk6/bk6O7u6+f/4+f/6sLk6Njk6Mbk6L/+4cT/47D126z/6qP/5JHp45ve5ffi4//f4+jc5sTc2tXb5P/Y3OLa2/jW2+Ha2tvW28Pa26zW26bJ6e+63OXG58C528O526ar7fOx6O6x6Mum4/+m48+U6v+U6sWl6O2g2/id2+Gd28OS4f3U0tLP2enPzcj/1aP/1YL/yWnl0KjkzbHo0JLD1vXOyf/D1eTLzMj/w6//yJPxwZnjuYvcwF/Gwsy9v7/Wvoe5vofBvl7cpp/iqnbeqHXCrdHHm+rJoILyrj7WoGa5qV+5qTqo0NGX0O2N0+2GyP+GyMqnuc2hrJmfn66empFt1f9t1dCDze17wfVrw/1+vuF6ue55vbBqr/BkquVipt9sp7tEwOFEwMJgse1WrPVErfJdoOFcn9I+u8sTqcITqYI8oOPHk4bEjHbEjFfHh5C9iVepl8C0kbmUkMGuipKWko7ikReUkzq5eHu5gUTacw2vd26mbXambVerbiiedImga1nCVDy0UwmdYFidYByXaFiSWm+Rh9CRkZF7icSFjYGIgK5tfF+FkTptfDpLj7dEfIVEfF9EkzplfDpEfDpBjMpBhsJ7Y5Zgb6tBbbBBa6xBaKI3luUTk6M7gcMUh+MNftEmin8TfIITfHwTfF8TfFw+fDoSfDouar8TbNYTYKYNdcYqWb4NWroNVa9fUbQ5UbQTUckTUcATUbQSUbeGS5OGS3aGS1eCS3mCS1d8S1dkS2RiS4BgS1dBS5NBS5FBS41BS3ZBS3NBS1eLSDWRRxx+PRxhNG1gJztdFURdFRxXFRwdSZMTR7ETPYc8Mm8bJEk7FUQ7FRw4FRwTFWwTFWYTFUcTFUQST7MSFhwMS7INMp4NMokNMoYMMm8iHindAA ndo a pasta é mais antiga que a etapa anterior, «simulado» quando a base veio de uma demonstração, «lotes: N» na ingestão em lote e «compactar» quando alguma tabela tem dois ou mais lotes. Duplo clique numa linha abre aquela pasta.</p>\n<p>«Próximo passo» transforma as duas leituras acima numa recomendação e num botão. Enquanto a configuração não está completa, ele aponta o passo atual — «Primeira configuração: passo N — …» — e o botão aciona esse passo, com a mesma confirmação do cartão. Depois, o botão azul leva à aba certa com a ação já selecionada — nada roda sem um clique em ▶ lá. É também ele que avisa quando há arquivos esperando em <code>1_ENTRADA</code> («Ingerir N arquivo(s) em lote»), linha que antes ficava no primeiro cartão. Ao lado do botão, «▶ Rodar tudo que falta». No rodapé, «🔄 Verificar novamente» e «📂 Abrir a pasta das bases».</p>\n<blockquote>\n<p><strong>CONFIRA</strong> — O ⏳ numa linha não é falha: é uma checagem que ainda está chegando, porque roda no Python do venv, fora desta janela. E o ○ cinza também não é erro: os passos 8 e 9 só fazem falta a quem redige glosas com IA local ou versiona o código.</p>\n</blockquote>\n<h4 id=\"aba-ingestao\">Aba «1 · Ingestão» — o lote, a compactação e as amostras</h4>\n<p>É a seção 16.6 em botões. «Inventariar 1_ENTRADA» conta o que está esperando, separando XML, ZIP e tabulares com o tamanho total; «Currículos por lote» é o tamanho do lote, de 100 a 5.000, com 1.000 de padrão; «Ingerir em lote» processa; «Parar» interrompe sem corromper o que já foi gravado.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAOCCAMAAACS2p9RAAADAFBMVEX//////+///+j//+f//+X//+D//9///9f//9H//8r//7///77//7j9/f719vj19tXn///i///d///c///g/t7U+/vE///E/8q99vi7//+5//+4//+5/tDz8/Px9Pry8vPu8PPp7fPt7/Lq7c7u6+f/58//4Lv/47D/5pv/3p371bL005bk6/bk6O7j6O/k6Nbk6L/h5fTf4+jl5eXk0Kfb5e3Y3OLa297c2tXa2trM6u3W2+HO2+/W28PW26bR09HPzci56f+m4/+x6e+w5czK2O7D1vXD1uqz2ua90vDD1uC528Op1uC526Wg2/iX3v+d2+Gd28Ob0vWT5f trong> — A caixa «Apagar os arquivos de 1_ENTRADA depois de gravar» nasce desmarcada e nunca é herdada da sessão anterior. Apagar a origem depois da gravação conferida é o padrão do módulo e é proteção de dado pessoal em ação: o XML bruto do Lattes traz CPF, RG, data de nascimento e nome dos pais, campos que as dez tabelas canônicas nunca extraem. Manter os arquivos é para teste.</p>\n</blockquote>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — A primeira carga real, em 04/09/2026: 50 currículos — 2 ZIP e 48 XML em ISO-8859-1, alguns com 7,4 MB — ingeridos em 5 segundos, 35.436 linhas nas dez tabelas, nenhuma falha.</p>\n</blockquote>\n<h4 id=\"aba-pipeline\">Aba «2 · Pipeline» — as quatro etapas, o desempate e o «Avançado»</h4>\n<p>Lê-se de cima para baixo. Primeiro o que fazer: «Rodar tudo», «Rodar a seleção», «Parar agora», «Pré-voo» e «Mostrar configuração».</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAOCCAMAAACS2p9RAAADAFBMVEX///////D//+j//+f//+X//+H//9///9v//9f//9H//8r//8L//77//7j9/f719vj19tTo///i///d///c///o+O3V+vrE///E/8+7//+5//+4//+69/Tz8/Px9Pry8vPu8PPp7fPt7/Lw8PDq7c7u6+f/5Mr/5K7/3p395JL11qrk6/bk6O7j6O/k6Nbk6L/h5fTf4+jm5uXk0Kjc4ejY3OLa297c2tXa2trR4+7W2+HQ6cPW28PW26bS0tPPzci56f+85P/J6eur7fOx6O6x6Mum4/+m49HM2e3D1vXD1uq52+HC0+2528O526bE1duq1uqg2/iX3v+d2+Gc28Oa0vST4/+J0/H/w7H/yJPrwJ3aw5bWvqbWvoflwmP/vHrfsa/1tnbiqnbcoIrkq27WoGbGxtSvx+u3wrW8sMW1sJzHm+Sno7PNoHq1pm7dmlaempGpl8CXyPSGyP+GyOWCwfh+vuGIxLpxw/eAuupxvP9xvMuJosiWmaNqvflkquVkqrBmpttroOhdoOFgntNWrPU/qedWl+pJmt9Jmr43l+nIiI7EjHrEjFe0j6a4h1jZkSy4fm+5gUS7dSi5b0OmbXambVe5Uz60UwmTlJqQgbafdp2SkpKRkZGUkz6de4J3isOEdotrdqNrdoN3gkpOibSXbqGaaVedYUKdYBx1abGSWm+NWG+KalJecMVma3RBjMpBicY7gcNAg7YTkdU8edATgOATcdobdb4WfG1BbbBBaaUda8kqW8ETYKZgUbQ7UbQTUcwTUcETUcATUbQNftESfDoNWroOVreGS5OGS3aXTVOGS1eXTSiRSyiCS3qCS1d8S1dkS21dS4RfS1dJTU9BS5NBS41BS3ZBS3NBS1cbTZ0PTbMbTG2LSDSRRxx+PRxxIVZxISh1MBxWNW1pIUNJIWVJIShEIVBdFURdFRxXFRw7FUQ7FRwfR4wbIXgbIVMbIVEbISk4FRwTR7ETPYcTMIwTFWwTFWYTFUcTFUQS QwgBNoQQAmwIIQTYEEIIsCGEEGBDCAE2hBACbAghBNgQQgiwIYQQYEMIjSD9/26xiaRUvNoBAAAAAElFTkSuQmCC\" alt=\"A aba «2 · Pipeline» do Assistente Lattes\"><figcaption>Figura 15.3 — A aba «2 · Pipeline» do Assistente Lattes (captura de 15/09/2026).</figcaption></figure>\n<p>Depois as quatro etapas, uma por linha, na ordem de execução: «1 · Trazer (ingestão em remessa única)», «2 · Classificar (E5 + desempate opcional)», «3 · Medir (contagens por pesquisador)» e «4 · Vetorizar (texto consolidado → vetor E5)». Cada linha tem ícone de estado, caixa de seleção, barra de progresso, tempo estimado, um «Rodar só esta» e o arquivo que gera, com «já gerado» ou «ainda não»: <code>5_RELATORIOS/1_ingestao.xlsx</code>, <code>3_CLASSIFICADO/LATTES_RESUMO.csv</code>, <code>4_RESULTADOS/quantificacao.parquet</code> e <code>4_RESULTADOS/curriculos_vetorizados.parquet</code>.</p>\n<p>Valendo para a execução inteira: «Domínio», «Dispositivo» (auto, cuda ou cpu), «Desempate de precisão (reranker)» e «Demonstração com N currículos simulados». A demonstração gera currículos falsos numa raiz separada, <code>&lt;raiz&gt;/_demo_assistente</code>, e nunca se mistura à base real. Abaixo de tudo, o cartão «Comando» com a linha exata e o «Copiar».</p>\n<p>O botão «Mostrar avançado» abre a calibração fina — margem, limiares, zona cinzenta, <code>reranker_topk</code> e o «Lote do codificador (<code>LATTES_LOTE</code>)» —, com os números lidos do código-fonte, sem importar nada do pipeline. Os botões «Abrir config.py» e «Abrir classificador.py» levam aos arquivos onde esses valores são de fato editados: o assistente não inventa variável que o pipeline não lê.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Mudar o desempate invalida o cache de classificação — tudo é reclassificado. E a classificação domina o tempo total (17). Parar no meio não corrompe nada: o que já foi gravado em disco permanece, e o que não foi é refeito na execução seguinte.</p>\n</blockquote>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — r2N6NEBpvAbYJDlt01FUIofGWDIjQGNVodA+EEJoKAmwIIcCGEEKADSGEABtCCAE2hBACbAghwIYQQoANIYQAG0IIATaEEAJsCKFppP8f7L9dCUyMFqYAAAAASUVORK5CYII=\" alt=\"A aba «3 · Prospecta» do Assistente Lattes\"><figcaption>Figura 15.4 — A aba «3 · Prospecta» do Assistente Lattes (captura de 15/09/2026).</figcaption></figure>\n<p>«Ler estado do pacote» diz quando <code>6_PROSPECTA</code> foi preparada e com quantas pessoas. «Base a servir» escolhe a raiz — a real ou a de demonstração. «Refazer mesmo se já existir (--forcar)» é o que faz o preparar trabalhar quando <code>pessoas.parquet</code> já existe. «Preparar pacote» monta o pacote: lê <code>2_CURRICULOS</code> (inclusive as pastas de lote, deduplicadas pelo manifesto), <code>3_CLASSIFICADO</code> e <code>4_RESULTADOS</code>, e calcula dimensões, rede, BM25 e o índice denso.</p>\n<p>No cartão «Servidor»: «Endereço» (127.0.0.1 é só esta máquina), «Porta» (8100), «Entrar sem senha (só avaliação)», «Subir o Prospecta», «Reiniciar», «Encerrar» e «Abrir no navegador». O selo ao lado da porta é conferido contra a porta real a cada cinco segundos: «parado», «subindo…», «no ar :8100» ou «no ar :8100 (de fora)» — este último quando quem ocupa a porta não foi subido por esta janela. «Preparar e subir» faz as duas coisas de uma vez.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — «Entrar sem senha» só funciona escutando em 127.0.0.1: o servidor recusa fora do loopback, a cada requisição, e o assistente nem tenta. Escolher 0.0.0.0 expõe o painel em HTTP sem criptografia a quem estiver na rede local — e uma faixa de aviso fica à vista enquanto esse endereço estiver escolhido. Encerrar o servidor pede confirmação mostrando os PIDs.</p>\n</blockquote>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Rode «Preparar» de novo sempre que as etapas 3 ou 4 forem refeitas: o painel lê o pacote de <code>6_PROSPECTA</code>, não os Parquet. Ele mostra por conta própria a tarja BASE SIMULADA ou DESATUALIZADA quando for o caso.</p>\n</blockquote>\n<h4 id=\"aba-ia\ rrículo para fora, e a variável que ligaria IA em nuvem no Prospecta nunca é definida — ela é removida do ambiente de todo processo filho. A segunda: a chave fica cifrada pela proteção de dados do Windows em <code>%LOCALAPPDATA%\\AssistenteLattes\\chaves.bin</code>, fora do repositório e ilegível por outra conta ou máquina, e é injetada apenas no processo que redige as glosas. Se uma chave aparecer num log salvo, é defeito — avise.</p>\n</blockquote>\n<p>O mascaramento vale para tudo o que entra no log, e não só para a chave: a senha do primeiro administrador, que o Prospecta imprime em claro ao subir pela primeira vez, aparece uma única vez numa janela «Anote agora» e tem os bytes apagados do arquivo assim que são lidos. Ver também 12.5 e 26.</p>\n<h4 id=\"aba-dicionario\">Aba «5 · Dicionário» — planilha, cobertura e glosas</h4>\n<p>«Abrir a planilha» abre o dicionário do domínio; «Abrir pasta dos backups», as cópias anteriores; «Validar / cobertura» roda a validação e responde no próprio cartão. Depois vêm os controles do assistente de glosas de 13.4: «Taxonomia», «No máximo N categorias», «Reescrever também as que já têm glosa (não revisadas)», «Simular (nada muda)», «Redigir glosas com IA» e «Parar». «Abrir glosas_geradas.xlsx» abre o relatório, cuja aba REVISAR_PRIMEIRO está descrita em 13.6.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAOCCAMAAACS2p9RAAADAFBMVEX///////L//+z//+j//+f//+X//9///9f//9H//8r//779/f719vj19tXn///i///k/tHd///c///c/+jU+/vE///E/8q5//+4//+5/+C99vjz8/Px9Pry8vPu8PPp7fPr7s7/5PLk6/bk6O7u6+f+6cPk6Njk6Mbk6L/25OD/47D/4Lr/3p3y27Lh5+/i4//f4+ji4+Xc5+3Y3OLa3L3a2/jW2+Ha297W28PW26bJ7vPI6O656f/H6Mur7fOx6O6x6M7M3vC53eW528Ow3PO526am4/+m48qT4v+X3v+k6Oqg2/id2+Gd28Pc2tX/0bf/yJPl0KjjzLbozpb7wZzX2NjPzcjaxJnWvqbWvofL2O3D1vXD1uPIy9PDwdS+vr6f1P+o1uiT0++uxeKmx62Lz/OGyP+Dze52wfZsw/+Fyct+vuF+vqbvvY/fsaziqnbpsHTbooTWoGbdmlO6r8Cqp8+9p5HFm+PJnniempG5kKzFk4a5j4OolsGojKPGjXXEjFfLkFGnjVaxfp6gd4O4h1e4fm+5gUTFc2ymbXembVeldW+0c m por este botão, nem por nenhuma opção desta aba (13.2).</p>\n</blockquote>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — O ciclo curto: ponha o limite em 3, clique em «Simular (nada muda)», leia as três glosas no log, ajuste <code>ia/prompts.py</code> e repita. Só então rode com o limite de verdade.</p>\n</blockquote>\n<h4 id=\"aba-ambiente\">Aba «6 · Ambiente» — caminhos, venv, bibliotecas e GPU</h4>\n<p>Os cinco campos que mandam em tudo — «LATTES_RAIZ (pasta das bases)», «LATTES_TRABALHO (cache)», «PROSPECTA_RAIZ», «HF_HOME (cache dos modelos de IA)» e «LATTES_DOMINIO» — aparecem com o valor efetivo logo abaixo de cada campo, e campo em branco significa o padrão: o do <code>config.py</code> para os do projeto, o da Hugging Face para o <code>HF_HOME</code>. Ao lado, «💾 Salvar caminhos», «Conferir o que existe» e «Criar as pastas da raiz».</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAOCCAMAAACS2p9RAAADAFBMVEX///////L//+z//+j//+f//+X//+H//9///9f//9H//8r//779/f719vj19tXn///i///n/tzd///c///d/+LQ///Y+PLE//+7//+5//+5//K99vjz8/Px9Pry8vPp7fPp7c3u6+f/6ez/6cP/6qP+4tP/47D126z/3p3k6/bk6O7j6O/h5fLf4+jk6NPk6L/i47Dc5PHY3OLa2+Dc2tXa2trb3r/L7fO56f+56ezI5+/W2+G52+HW28PW26bF5Le528O526bM2OzD1vXD1uOm4/+r7fOx6O6t58eU5P+l2PKd2+Gg2suX3v+S4P+P1+z/1Nf/1K//1YLm0KHS0tHPzcj/xbznvZn/yJPYxMPywY7WvoffsLb+vHnpsHTiqnbRppnQpoPapnW+1NOf1P+f1ObEytm/wde0w7i5r8eyrZrIm+HSnn2moajWoGbdmlO7mlOempGS0PCGyP+Swf92wfaGveyUyOd+vuGIwb1+uOhxvP9xvNiKpduLn7drvfhlqtRWrPVBre9rptdipt9rpsJroOhdoOFfntNJmt8/n+dDm8a5kLS5j5nHh5C5j4PIjnXEjFfLkFG9iVepl8Cej8SGj8N1h+6TlJSRkZGljK2uhFmFjZqfdq+fdpmfdoO5gEvHc2y7dSisc2ymbWKga16rbCyKe7KHdo5+gaaVbIadYESdYByRWm9rj8Frdq9rdplrdoNHkNdBjMpIhsdXfsM7gcNBg7Uik+gUgOAOfrlua7NMctRBbbBGaqEbdb4vZsITcdkTadUTYKYQWLlfUbREUbQ1UbQTUc0TUcETUcATUbQSUbeGS5OGS3aGS1eXTSiCS3qCS1d8S1dkS19gS19xTShBS5NBS41JTXlBS3ZBS3NBS1dJTUaLSCyRRxx+PRxoNHB1MBxwITBJIWZJIShXMBxEIVVdFURdFRxXFRwbTZ0cSZQTR7ETPYcvMXYbIXgbIVMbIVEbISk7FUQ7FRw4FRwTFWwTFWYTFUcTFUQST7MSFhwMS7INMo4MMm/ «6 · Ambiente» do Assistente Lattes\"><figcaption>Figura 15.7 — A aba «6 · Ambiente» do Assistente Lattes (captura de 15/09/2026).</figcaption></figure>\n<p>«HF_HOME (cache dos modelos de IA)» é onde a Hugging Face guarda o E5 e o reranker depois de baixados (14.2). Vazio, vale o padrão, dentro do seu perfil do Windows; a linha cinza embaixo do campo mostra a pasta em uso e se cada modelo já está lá — «✓ E5 no cache · ○ reranker não baixado». O valor vai para todo processo que a janela dispara: o pipeline, o Prospecta, o download dos modelos e a conferência do passo 5. Numa máquina com várias contas, aponte para uma pasta fora do perfil, legível por todas (26, item 9) — nunca uma pasta sincronizada pelo OneDrive.</p>\n<p>Bibliotecas: «↻ Conferir bibliotecas» lê as versões de dentro do ambiente virtual — é o subcomando <code>--info-ambiente</code>, não um palpite —, «Instalar as que faltam» instala as do pipeline e do painel, e «Instalar o torch (GPU ou CPU)» instala o PyTorch com o índice certo para esta máquina: lê a placa pelo <code>nvidia-smi</code>, mostra o comando e o tamanho do download e só roda depois da confirmação — o mesmo botão do passo 3 da aba 0 (9.3). Completam a aba «🐍 Qual Python está em uso», «📂 Abrir pasta do assistente», «📂 Abrir raiz» e «📂 Abrir _trabalho».</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — A instalação errada do PyTorch, sem CUDA, é o erro que mais custa tempo (10.1). Confira a placa aqui ou na aba «4 · IA» antes da primeira execução longa, não depois dela.</p>\n</blockquote>\n<h4 id=\"aba-testes\">Aba «7 · Testes» — as baterias que não tocam em dado real</h4>\n<p>«Teste de integração do pipeline» roda <code>testes/test_integracao.py</code>, a bateria completa de 15.1; «Autoteste do assistente» roda <code>testes/test_assistente.py</code>; e «Teste do Prospecta (test_preparar.py)», o do painel. Os rápidos são «Pré-voo», «Simular glosas» e «Rodar os rápidos em sequência». «Fumaça ponta a ponta (60 simulados, GPU)» exercita o fluxo uém pedir, e sempre depois de conferir o dado sensível. O <code>.gitignore</code> não protege arquivo que já foi versionado uma vez.</p>\n</blockquote>\n<h4 id=\"aba-9-comandos\">Aba «9 · Comandos» — escrever um comando, sem sair da janela</h4>\n<p>As oito abas anteriores cobrem o que este manual manda fazer, cada botão montando uma linha conhecida. Esta cobre o resto: o comando que ainda não virou botão, uma pergunta específica ao <code>git log</code>, um script novo. Escreva no campo e tecle Enter — ou clique em «▶ Rodar». A saída vai para o mesmo log das outras abas, e «■ Parar» interrompe.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNgAAAOCCAMAAACS2p9RAAADAFBMVEX///////L//+j//+f//+X//9P//8r//7/9/f719vj19tXo///i///k/tXc///c/+DZ9vfE///E/8q5//+4//+89/Xz8/Px9Pry8vPp7fPp7dXp7bbu6+f/5O//5Nv/4Lr1287/47D536Xk6/bk6O7j6O/h5fTf4+jk6Nbk6L/i47Dc5PPc2tXc4Lrb5P/a2/jW2+Ha2tvW28PW26bL7fLI5+jO2++52+G528O526ar7fOx6O6x6Mum4/+m486U5f+S4P6g2/id2+Gd28Pt0rjpz5b/1YLk0KfS0tLP2enPzcjD1vXF1eD/yM7/waL/yJP2wo7FxNrFxMPWvofcwGHot5LiqqriqnbcrcHDrMvJs5fHm/DHm8PcoIrUm4jpsHHapnXWoGbLoHOp1umxye2px7Kztb6rrpipo5yempGO1/aLz/OV0uyGyP+HyM12wfV+vuGLvqGAtuaNnb5ty/lrwf9msu1trehWrPVErfFkquVkqrBroOhdoOFhotk9oOXQkHLEjHnEjFe4kLLGh5G4fm/Dc265h1fPkEe5gUSrkFHbcwqrblGrbiipl8ypl8CIkqaRkZGUk0GDkGOChMqPcraXiZ6mbZOmbXambVdkbbB1bnu4Uz60UwmgZlmdYByXaFiSWm91aK1ZlONEkN9EkNVBjMpciM5DhcJFhn02l+oTkN47gcM7gYcUf8QSfDoNftFMctNBbbA9ccREboVhan1Ba6xBaKdBaXY5XsATcdsTadUza8QbbrYbbo8TccgNes0tZsATYKYXVLcNWroNWLFtUbRWUbREUbQ1UbQTUc4TUcoTUcETUcATUbQSUbeGS5OGS3aGS1eCS3qCS1d8S1dkS4ZkS1diS4JfS1dBS5NBS5FBS41BS3ZBS3NBS1eJRV2LSSiRRxx+PRxkOWhsJThEIVVdFURdFRxXFRwcSZYTR7ETPYcTMJA8M20bIXQbIVEbISk7FUQ7FRw4FRwTFWwTFWYTFUcTFUQST7MSFhwMS7INMqINMokNMogMMm8GqAilAAB6R0lEQVR42u29D5hdVX3vfahx7sWb0karbULFN177WNtb36BUUBsRXmm5QTIYtAPaFJKGkEhHMZCUTEioJ400thGipAJagr5mwoVpG4JRQdGX0cfaluaFPNXQ1HBuGlCLKZKmIkZ5513/12+tvfeZc+Zfzsx8vg/k7D9rr7X2Ont/5rfW2vt7ai9DCKEpphpNgBACbAghBNgQQgiwIYQQYEMIIcCGEAJsCCEE2BBCqCPA9ku/9CvLVl1 ão executa nada. O <code>PYTHONIOENCODING</code> já vem em utf-8, sem o qual os emojis do pipeline derrubam a execução antes da primeira linha útil. E o comando roda na raiz do repositório, de modo que um «cd» colado na frente é reconhecido e retirado — se apontar para outra pasta, ele é obedecido e o log diz de onde veio.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — O que se digita aqui não passa pela trava de «um de cada vez». Os botões das outras abas declaram o que vão usar (a base, a placa de vídeo) e o assistente recusa dois trabalhos que disputariam o mesmo recurso. Um texto livre não dá para adivinhar: se você mandar o pipeline por aqui enquanto ele já roda pela aba 2, as duas execuções escreverão na mesma base. O assistente reconhece os nomes dos programas do projeto e AVISA quando há algo em andamento, mas não bloqueia — a decisão fica com você.</p>\n</blockquote>\n<p>O cartão «Comandos que você mais usa» traz seis atalhos de um clique: o pré-voo, a configuração efetiva, a conferência da raiz do Prospecta, as duas baterias de teste e o «Qual Python?». Pouse o mouse em qualquer um para ver o que ele faz e a linha exata que será executada. Acima deles, uma linha cinzenta mostra a pasta, o interpretador, a raiz das bases e qual PowerShell está instalado — é o que permite conferir em vez de confiar.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Comandos que apagam ou reescrevem pedem confirmação antes de rodar: <code>Remove-Item</code>, <code>git reset --hard</code>, <code>--forcar</code>, e também os dois nomes que neste projeto não têm volta — o manifesto <code>registro_curriculos</code> (a única prova de que um currículo foi ingerido, já que o XML de origem foi apagado) e a pasta <code>_cofre</code> (contas e auditoria do painel). O histórico guarda os 25 últimos comandos, entre sessões, e passa pela mesma máscara do log: um segredo colado por engano não fica em claro no disco.</p>\n</blockquote>\n<p>O último cartão abre uma janela de PowerShell de verdade, já preparada do mesmo jeito. Ela existe por um limite honesto: o log desta janela mostra a saída, mas não tem teclado. Um comando que PERGUNTA alguma coisa — um <code>git push</code> pedindo usuário e senha — ficaria pendurado esperando uma resposta que ninguém pode digitar. Para esses casos, a janela separada.</p>\n<h4 id=\"sem-janela-quatro-subcomandos\">Sem janela: quatro subcomandos</h4>\n<p>O mesmo arquivo responde a quatro perguntas em JSON, sem abrir janela nenhuma — úteis para diagnosticar uma máquina por telefone ou dentro de um script:</p>\n<pre><code>python ferramentas\\assistente.py --info-ambiente\npython ferramentas\\assistente.py --modelos-ia\npython ferramentas\\assistente.py --sonda &lt;raiz&gt;\npython ferramentas\\assistente.py --validar-dicionario industria</code></pre>\n<p><code>--info-ambiente</code> imprime as versões das bibliotecas, o torch, se o CUDA está visível e o nome e a memória da placa. <code>--modelos-ia</code> diz se o E5 e o reranker estão no cache da Hugging Face, com o tamanho e a pasta do cache, sem carregar o torch — é a leitura do passo 5 da Primeira configuração. <code>--sonda</code> imprime o estado de <code>2_CURRICULOS</code>: o formato da base, quantos ids há, se são simulados e quantos lotes existem por tabela. <code>--validar-dicionario</code> imprime a cobertura do dicionário do domínio. São exatamente as leituras que a janela usa para se pintar.</p>\n<h4 id=\"roteiro-do-primeiro-dia\">O roteiro do primeiro dia, pelo assistente</h4>\n<p>Sete passos, três abas, nenhum terminal.</p>\n<ol type=\"1\">\n<li>Instale o Python (8.1) — a única coisa que a janela não faz por você.</li>\n<li>Dois cliques em «Assistente Lattes.vbs» (ou no atalho da área de trabalho).</li>\n<li>Aba «0 · Início», cartão «Primeira configuração»: siga o passo em azul até o cartão virar uma linha verde — criar o venv (e reabrir), instalar o torch, instalar as bibliotecas, baixar os modelos, escolher a pasta das bases. Cada botão mostra o que vai fazer e pede confirmação; o andamento sai no log à direita.</li>\n<li>Aba «2 · Pipeline»: «Demonstração com N currículos simulados» = 300 e «▶ Rodar tudo» — é o <code>python pipeline.py --demonstracao 300</code> de 14.1.</li>\n<li>Aba «1 · Ingestão»: «📂 Abrir 1_ENTRADA», deposite os XML/ZIP, «↻ Inventariar 1_ENTRADA», «▶ Ingerir em lote».</li>\n<li>Aba «0 · Início»: «▶ Rodar tudo que falta» (classificar → quantificar → vetorizar → preparar → subir); confira <code>5_RELATORIOS/1_ingestao.xlsx</code> antes de olhar qualquer classificação.</li>\n<li>Aba «3 · Prospecta»: «🌐 Abrir no navegador».</li>\n</ol>\n<p>(Opcional, quando for redigir glosas: aba «4 · IA», «Verificar Ollama».)</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Cada botão desses roda um comando conhecido (15.1), e a linha exata aparece — no cartão «Comando» ou no log — antes de rodar. Copie-a para documentar um procedimento ou para agendar a execução.</p>\n</blockquote>\n"}, {"titulo": "PARTE III — AS ETAPAS EM DETALHE", "html": "<h1 id=\"parte-iii-as-etapas-em-detalhe\">PARTE III — AS ETAPAS EM DETALHE</h1>\n<p><em>Para cada etapa: o que faz, que arquivo executa, o que entra, o que sai e o que o código faz por dentro.</em></p>\n<h2 id=\"etapa-1-ingestão\">16. Etapa 1 · INGESTÃO</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Pega os dados no formato que vierem e os organiza em dez tabelas sempre iguais.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>etapas/e01_ingestao.py</code></p>\n<blockquote>\n<p><strong>NO TERMINAL</strong></p>\n<pre><code>python pipeline.py --etapas ingestao</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>from etapas import e01_ingestao\ne01_ingestao.executar()                       # lê 1_ENTRADA, grava 2_CURRICULOS\ntabelas = e01_ingestao.carregar_curriculos()  # as dez tabelas, em memória\ntabelas[&quot;identificacao&quot;].head()</code></pre>\n</blockquote>\n<h3 id=\"por-que-existe\">16.1 · Por que existe</h3>\n<p>O resto do sistema precisa saber onde encontrar cada informação. Concentrando a variação de formato aqui, tudo o que vem depois enxerga uma estrutura única.</p>\n<h3 id=\"entradas-e-saídas\">16.2 · Entradas e saídas</h3>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 21%\" />\n<col style=\"width: 75%\" />\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Entra</strong></td>\n<td style=\"text-align: left;\"><code>1_ENTRADA/</code> — XML, ZIP, CSV ou Parquet</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Sai</strong></td>\n<td style=\"text-align: left;\"><code>2_CURRICULOS/*.parquet</code> (10 arquivos) — na ingestão em lote, <code>2_CURRICULOS/&lt;tabela&gt;/lote_*.parquet</code> mais uma planilha <code>&lt;tabela&gt;.xlsx</code> de 1.000 linhas por tabela (16.6)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Relatório</strong></td>\n<td style=\"text-align: left;\"><code>5_RELATORIOS/1_ingestao.xlsx</code></td>\n</tr>\n</tbody>\n</table>\n<p>Para volumes grandes — a partir de dezenas de milhares de currículos, e principalmente para o alvo deste projeto (~1 milhão) — há um segundo caminho de ingestão, em lotes, que não reescreve tudo a cada execução e nunca mantém 1 milhão de XML em disco ao mesmo tempo. Ver 16.6.</p>\n<p>Nesse caminho a saída tem duas formas ao mesmo tempo: cada tabela vira uma pasta <code>2_CURRICULOS/&lt;tabela&gt;/lote_*.parquet</code> — que o <code>pd.read_parquet()</code> lê como se fosse um arquivo só — e ganha ao lado uma planilha <code>2_CURRICULOS/&lt;tabela&gt;.xlsx</code> com as 1.000 primeiras linhas, para conferência (16.6).</p>\n<h3 id=\"as-dez-tabelas-produzidas\">16.3 · As dez tabelas produzidas</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 38%\" />\n<col style=\"width: 38%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Tabela</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n<th style=\"text-align: left;\">De onde vem no Lattes</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>identificacao</code></td>\n<td style=\"text-align: left;\">nome, resumo, UF</td>\n<td style=\"text-align: left;\"><code>DADOS-GERAIS</code> + <code>RESUMO-CV</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>formacao</code></td>\n<td style=\"text-align: left;\">graduação, mestrado, doutorado</td>\n<td style=\"text-align: left;\"><code>FORMACAO-ACADEMICA-TITULACAO</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>atuacao</code></td>\n<td style=\"text-align: left;\">vínculos e atividades</td>\n<td style=\"text-align: left;\"><code>ATUACOES-PROFISSIONAIS</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>areas</code></td>\n<td style=\"text-align: left;\">áreas declaradas (CNPq)</td>\n<td style=\"text-align: left;\"><code>AREAS-DE-ATUACAO</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>publicacoes</code></td>\n<td style=\"text-align: left;\">artigos, livros, eventos</td>\n<td style=\"text-align: left;\"><code>PRODUCAO-BIBLIOGRAFICA</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>producao_tec</code></td>\n<td style=\"text-align: left;\">software, patente, produto</td>\n<td style=\"text-align: left;\"><code>PRODUCAO-TECNICA</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>projetos</code></td>\n<td style=\"text-align: left;\">projetos de P&amp;D</td>\n<td style=\"text-align: left;\"><code>PROJETO-DE-PESQUISA</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>orientacoes</code></td>\n<td style=\"text-align: left;\">orientações</td>\n<td style=\"text-align: left;\"><code>ORIENTACOES-*</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>idiomas</code></td>\n<td style=\"text-align: left;\">idiomas e proficiência</td>\n<td style=\"text-align: left;\"><code>IDIOMAS</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>premios</code></td>\n<td style=\"text-align: left;\">prêmios e títulos</td>\n<td style=\"text-align: left;\"><code>PREMIOS-TITULOS</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"o-que-o-código-faz-passo-a-passo\">16.4 · O que o código faz, passo a passo</h3>\n<p><strong>Passo 1 — obter os dados.</strong> <code>ingestao/adaptadores.py</code> inspeciona a pasta, descobre o formato e chama o leitor certo. O parser de XML percorre os módulos do currículo na mesma ordem em que aparecem na Plataforma, e toda leitura é defensiva: tag ausente vira texto vazio, nunca exceção.</p>\n<p><strong>Passo 2 — relatar problemas sem parar.</strong> Um arquivo corrompido no meio de cinquenta mil não pode derrubar a carga. Ele vira aviso e o processamento continua.</p>\n<p><strong>Passo 3 — descartar cadastros vazios.</strong> Currículos sem nenhuma produção, atuação ou resumo não têm o que classificar e só distorceriam as estatísticas. Controlado por <code>descartar_vazios</code>.</p>\n<p><strong>Passo 4 — gravar em Parquet.</strong> Preserva tipos, ocupa cerca de cinco vezes menos espaço e é lido numa fração do tempo do CSV.</p>\n<p><strong>Passo 5 — gerar o relatório.</strong> Inclui uma aba <code>CONTRATO</code> que documenta o esquema dentro do próprio arquivo.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Tabela ausente nunca derruba o pipeline.</strong> Se a extração não trouxer <code>premios</code>, a etapa avisa e segue. Uma análise com uma dimensão a menos é melhor que nenhuma análise.</p>\n</blockquote>\n<h3 id=\"o-que-conferir-depois\">16.5 · O que conferir depois</h3>\n<blockquote>\n<p><strong>CONFIRA</strong> — Abra <code>1_ingestao.xlsx</code>. A aba <code>RESUMO</code> mostra quantas linhas vieram de cada tabela. Tabela vazia que deveria estar cheia significa que o caminho de tag mudou — veja a seção 24.</p>\n</blockquote>\n<blockquote>\n<p><strong>CONFIRA</strong> — Uma coluna vazia para UM tipo só é o mesmo defeito, mais discreto. Na primeira carga real, <code>1_ingestao.xlsx</code> mostrava 19.884 publicações e 4.710 itens de produção técnica, e ninguém estranhou — mas os 584 capítulos de livro, os 195 produtos tecnológicos e os 164 processos estavam TODOS sem título: o XML chama os atributos de <code>TITULO-DO-CAPITULO-DO-LIVRO</code>, <code>TITULO-DO-PRODUTO</code> e <code>TITULO-DO-PROCESSO</code>, e o leitor pedia outros nomes (o do processo errava até o elemento, que é plural). Nada quebrou; cada item foi classificado só pelo que sobrava, com confiança de 0,82. Desde 14/09/2026 o relatório traz a aba <code>VAZIOS_POR_TIPO</code> (registros, vazios e % por tabela e tipo), o log avisa quando um tipo passa de 50% vazio, e a ingestão em lote repete o aviso por lote. Um tipo em 100% é nome de atributo (seção 24, passo 2); um tipo em 90% pode ser o próprio Lattes — a orientação de pós-doutorado vem sem título em 368 de 391. Conte os nomes de atributo no XML para saber qual dos dois.</p>\n</blockquote>\n\\1 — para milhões de currículos</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Quando são muitos currículos para caber na memória de uma vez, um segundo caminho processa em lotes de ~1.000, só apaga a origem depois de confirmar a gravação, e nunca perde nem duplica um currículo atualizado.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>ingestao/incremental.py</code></p>\n<h4 id=\"por-que-existe-separado-da-etapa-1\">Por que existe, separado da etapa 1</h4>\n<p><code>etapas/e01_ingestao.py</code> lê tudo que está em <code>1_ENTRADA/</code> de uma vez e reescreve as dez tabelas do zero a cada execução — perfeito para uma remessa pontual ou a demonstração, mas não escala para um download contínuo de ~1 milhão de currículos: não cabe tudo na memória ao mesmo tempo, e reprocessar currículos já vistos seria desperdício. O módulo em lote resolve os dois problemas: lotes pequenos e um controle do que já foi processado.</p>\n<h4 id=\"como-os-dados-ficam-organizados-em-disco\">Como os dados ficam organizados em disco</h4>\n<pre><code>2_CURRICULOS/\n  identificacao/\n    lote_000001.parquet      (~1000 currículos, gravado uma vez, imutável)\n    lote_000002.parquet\n  formacao/  atuacao/  publicacoes/  ...  (uma pasta por tabela)\n  _controle/\n    registro_curriculos.parquet   (o manifesto)</code></pre>\n<p><code>pd.read_parquet()</code> lê uma PASTA cheia de .parquet exatamente como lê um arquivo único — por isso <code>carregar_curriculos()</code> (seção 16, acima) e todo o resto do pipeline não precisam saber que existe lote nenhum.</p>\n<h4 id=\"o-manifesto\">O manifesto — o controle de atualização e modificação</h4>\n<p><code>registro_curriculos.parquet</code> guarda uma linha por <code>id_lattes</code>: o hash dos bytes crus do XML, a <code>DATA-ATUALIZACAO</code> do próprio Lattes, em qual lote a versão atual está gravada, e quantas vezes já foi atualizado. Antes de abrir e interpretar um XML inteiro, o sistema calcula o hash dos bytes e compara com o manifesto:</p>\n<ul>\n<li><strong>hash igual</strong> ao já registrado — é o MESMO currículo, sem mudança nenhuma. Nem vale a pena interpretar o XML: o arquivo só é apagado.</li>\n<li><strong>hash diferente (ou id novo)</strong> — currículo novo ou atualizado. Faz o parse, grava no lote atual, atualiza o manifesto.</li>\n</ul>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — O manifesto NÃO é descartável, ao contrário de <code>_trabalho/</code> (que o pipeline reconstrói sozinho a qualquer momento). Ele é a ÚNICA prova de que um currículo já foi processado, porque o XML de origem já foi apagado quando ele é consultado. Inclua-o na rotina de backup, com o mesmo cuidado dado às tabelas compactadas.</p>\n</blockquote>\n<h4 id=\"a-regra-de-segurança\">A regra de segurança: nunca apagar sem confirmar</h4>\n<p>Um arquivo de origem só é apagado depois que: <strong>(1)</strong> o parse funcionou; <strong>(2)</strong> o lote inteiro foi gravado em Parquet; <strong>(3)</strong> a gravação foi CONFERIDA — relida do disco, contagem de linhas bate; <strong>(4)</strong> o manifesto foi atualizado. Se qualquer passo falhar, os arquivos daquele lote são PRESERVADOS, e a próxima execução tenta de novo.</p>\n<h4 id=\"compactação\">Compactação</h4>\n<p>Sem compactação, um currículo atualizado 5 vezes deixaria 5 cópias espalhadas em 5 lotes diferentes — 4 delas já obsoletas. A compactação funde os lotes de uma tabela, mantendo apenas a versão que o manifesto aponta como atual, e reescreve como um número pequeno de arquivos maiores. Não precisa rodar a cada lote — semanalmente, ou a cada N lotes, é suficiente.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — testado com os dois currículos reais de amostra deste projeto: ao reenviar o mesmo arquivo sem mudança nenhuma, o sistema reconheceu a duplicata e não gravou nada de novo. Ao simular uma atualização (mudando a <code>DATA-ATUALIZACAO</code>), o sistema reconheceu como ATUALIZAÇÃO — não como currículo novo, não como duplicata —, e a compactação seguinte descartou a versão antiga automaticamente, mantendo só a mais recente.</p>\n</blockquote>\n<h4 id=\"as-planilhas-de-amostra\">As planilhas de amostra</h4>\n<p>Ao fim de cada processamento e de cada compactação, o módulo grava <code>2_CURRICULOS/&lt;tabela&gt;.xlsx</code> com as 1.000 primeiras linhas de cada uma das dez tabelas — para abrir, filtrar e mostrar a alguém. O Parquet continua sendo o dado completo.</p>\n<p>A amostra é barata de propósito: numa tabela espalhada por centenas de lotes, o sistema lê os lotes em ordem e para assim que junta 1.000 linhas, em vez de carregar tudo para mostrar o começo.</p>\n<blockquote>\n<p><strong>CONFIRA</strong> — Abra <code>2_CURRICULOS/identificacao.xlsx</code> logo depois da primeira ingestão. Se as colunas vieram vazias, o caminho de tag mudou (24) — e você descobre isso antes da classificação, não depois.</p>\n</blockquote>\n<p>Para regravar só as planilhas, sem processar nem compactar:</p>\n<pre><code>python -m ingestao.incremental --amostras</code></pre>\n<h4 id=\"como-usar-16-6\">Como usar</h4>\n<pre><code>python -m ingestao.incremental                    # processa 1_ENTRADA em lotes de 1000\npython -m ingestao.incremental --lote 500          # lotes menores\npython -m ingestao.incremental --manter-arquivos   # não apaga a origem (para testar em segurança)\npython -m ingestao.incremental --compactar         # funde os lotes, descarta versões supersedidas\npython -m ingestao.incremental --amostras          # só regrava as planilhas de conferência (1.000 linhas)</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Privacidade: o XML bruto do Lattes (formato “offline”) vem com CPF, RG, data de nascimento e nome dos pais preenchidos — dado sensível que a LGPD regula. As dez tabelas canônicas (<code>contrato.py</code>) NUNCA extraem esses campos; eles só existem enquanto o XML de origem existir em disco. Apagar o XML assim que a tabela é confirmada — o comportamento padrão deste módulo — não é só economia de espaço: é proteção de dado pessoal em ação. Ver também a seção 26, item 7.</p>\n</blockquote>\n<h2 id=\"etapa-2-classificação\">17. Etapa 2 · CLASSIFICAÇÃO</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Atribui a cada pedaço do currículo as categorias do dicionário.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>etapas/e02_classificacao.py</code></p>\n<blockquote>\n<p><strong>NO TERMINAL</strong></p>\n<pre><code>python pipeline.py --etapas classificacao</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>import pipeline\nfrom etapas import e02_classificacao\n\ntaxonomias, dominio = pipeline.carregar_taxonomias(CFG.dominio)\ncodificador, classificador = pipeline.montar_motor()\n\nclassificados = e02_classificacao.executar(\n    tabelas, taxonomias, dominio, classificador)\n\nclassificados[&quot;producao_tecnica&quot;].head()</code></pre>\n</blockquote>\n<h3 id=\"entradas-e-saídas-1\">17.1 · Entradas e saídas</h3>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 76%\" />\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Entra</strong></td>\n<td style=\"text-align: left;\">tabelas da etapa 1 + dicionário do domínio</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Sai</strong></td>\n<td style=\"text-align: left;\"><code>3_CLASSIFICADO/LATTES_&lt;BLOCO&gt;.csv</code> (um por bloco)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Relatório</strong></td>\n<td style=\"text-align: left;\"><code>5_RELATORIOS/2_classificacao.xlsx</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"o-que-é-um-bloco-a-anatomia-completa\">17.2 · O que é um bloco — a anatomia completa</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Um bloco é uma receita: pegue estas linhas desta tabela, monte o texto assim, e faça a ele estas perguntas.</p>\n</blockquote>\n<p>A seção 3.2 apresentou a palavra. Aqui ela é aberta por inteiro, porque o bloco é a unidade em torno da qual a etapa 2 gira: um arquivo CSV por bloco, um cache por bloco, um limiar por bloco, uma linha de diagnóstico por bloco.</p>\n<p><strong>Um bloco tem cinco partes.</strong> Todas declaradas em <code>dominios/&lt;área&gt;/blocos.py</code>:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Parte</th>\n<th>O que responde</th>\n<th>No bloco “produção técnica”</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>tabela</code></td>\n<td>de onde vêm as linhas</td>\n<td><code>producao_tec</code> (uma das dez tabelas da etapa 1)</td>\n</tr>\n<tr class=\"even\">\n<td><code>texto</code></td>\n<td>como o texto a classificar é montado</td>\n<td>tipo + título + finalidade + palavras-chave</td>\n</tr>\n<tr class=\"odd\">\n<td><code>texto_longo</code></td>\n<td>qual das duas réguas usar</td>\n<td><code>False</code> — é título, não prosa (limiar 0,78)</td>\n</tr>\n<tr class=\"even\">\n<td><code>eixos</code></td>\n<td>quais perguntas são feitas a esse texto</td>\n<td>setor, tecnologia, maturidade</td>\n</tr>\n<tr class=\"odd\">\n<td><code>porque</code></td>\n<td>por que este bloco existe</td>\n<td>“patente, software e produto registram aplicação prática”</td>\n</tr>\n</tbody>\n</table>\n<p><strong>O código, exatamente como está no projeto:</strong></p>\n<pre><code>Bloco(\n    nome=&quot;producao_tecnica&quot;,             # vira LATTES_PRODUCAO_TECNICA.csv\n    rotulo=&quot;Produção técnica&quot;,           # nome legível, para logs e relatórios\n    tabela=&quot;producao_tec&quot;,               # de qual tabela da etapa 1\n    texto=texto_producao_tecnica,        # a função que monta o texto\n    texto_longo=False,                   # título curto → limiar 0,78\n    eixos=[\n        Eixo(&quot;setor_industrial&quot;),                 # um rótulo só\n        Eixo(&quot;tecnologia&quot;, multirrotulo=True),    # pode receber vários\n        Eixo(&quot;maturidade&quot;),                       # um rótulo só\n    ],\n    porque=&quot;Patente, software e produto registram aplicação prática — &quot;\n           &quot;dimensão subvalorizada pela avaliação puramente acadêmica.&quot;,\n)</code></pre>\n<p><strong>Um item percorrido de ponta a ponta.</strong> Uma patente real, do começo ao CSV:</p>\n<div data-lab=\"bloco\">\n\n</div>\n<p><strong>① A linha bruta</strong>, como sai da etapa 1, na tabela <code>producao_tec</code>:</p>\n<pre><code>tipo ............. Patente\ntitulo ........... Processo de obtenção de liga metálica com\n                   resistência à corrosão aumentada\nfinalidade ....... Industrial\npalavras_chave ... liga metálica; corrosão; tratamento térmico</code></pre>\n<p><strong>② O texto montado</strong>, pela função declarada em <code>texto=</code>:</p>\n<pre><code>&quot;Tipo: Patente. Título: Processo de obtenção de liga metálica com\n resistência à corrosão aumentada. Finalidade: Industrial.\n Palavras-chave: liga metálica; corrosão; tratamento térmico&quot;</code></pre>\n<p>Os rótulos (<code>Tipo:</code>, <code>Título:</code>, <code>Finalidade:</code>) não são enfeite. Eles avisam ao modelo que cada trecho é de natureza diferente. Sem eles, isso vira uma sopa de palavras.</p>\n<p><strong>③ As perguntas</strong>, uma por eixo declarado:</p>\n<pre><code>setor      → &quot;em que setor da indústria isto se aplica?&quot;\ntecnologia → &quot;que tecnologia habilitadora aparece aqui?&quot;\nmaturidade → &quot;em que estágio da cadeia P&amp;D → mercado isto está?&quot;</code></pre>\n<p><strong>④ As respostas</strong>, com a confiança de cada uma:</p>\n<pre><code>Setor ........... Metalurgia e Siderurgia        0,83\nTecnologia ...... Novos Materiais                0,79\nMaturidade ...... Demonstração (TRL 7-8)         0,74</code></pre>\n<p><strong>⑤ A linha no CSV</strong> <code>3_CLASSIFICADO/LATTES_PRODUCAO_TECNICA.csv</code>, com quatro colunas por eixo (ver 17.4).</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — O bloco é o formulário; o eixo é cada pergunta do formulário; a categoria é a alternativa marcada. Um currículo preenche sete formulários diferentes, porque tem sete tipos de conteúdo.</p>\n</blockquote>\n<p><strong>Por que sete blocos, e não um texto só?</strong> Três razões:</p>\n<ol type=\"1\">\n<li><strong>Limiares diferentes.</strong> Um título de artigo e um resumo profissional exigem réguas diferentes (7.4). Num texto único, seria uma régua só para tudo.</li>\n<li><strong>Perguntas diferentes.</strong> Faz sentido perguntar a maturidade tecnológica de uma patente; não faz sentido perguntar a maturidade tecnológica de um nome de curso.</li>\n<li><strong>Rastreabilidade.</strong> Com blocos separados, dá para dizer <em>qual item</em> gerou cada rótulo. Num texto único, a resposta seria “o currículo inteiro” — e a auditoria ficaria impossível.</li>\n</ol>\n<p><strong>EIXO</strong> — uma pergunta feita ao texto de um bloco. Cada eixo corresponde a uma taxonomia do dicionário, e o mesmo texto responde a várias.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Uma patente de sensores para silos de grãos é <em>agroindústria</em> (setor), <em>Internet das Coisas</em> (tecnologia) e <em>TRL 7-8</em> (maturidade). São três eixos sobre um único item, três colunas diferentes no CSV, três contagens diferentes na etapa 3.</p>\n</blockquote>\n<h3 id=\"o-cruzamento-que-bloco-encontra-que-parte-do-dicionário-e-por-quê\">17.3 · O cruzamento — que bloco encontra que parte do dicionário, e por quê</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Cada bloco só é cruzado com os eixos que o seu conteúdo consegue responder; perguntar o que o texto não sabe só produziria ruído.</p>\n</blockquote>\n<p><strong>A matriz do domínio “indústria”.</strong> Sete blocos nas linhas, quatro taxonomias nas colunas:</p>\n<table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 10%\" />\n<col style=\"width: 18%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Bloco — tabela de origem</th>\n<th style=\"text-align: center;\">Setor</th>\n<th style=\"text-align: center;\">Competência</th>\n<th style=\"text-align: center;\">Tecnologia</th>\n<th style=\"text-align: center;\">Maturidade</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Resumo</strong> — <code>identificacao</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Formação</strong> — <code>formacao</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Atuação</strong> — <code>atuacao</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Produção técnica</strong> — <code>producao_tec</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Publicações</strong> — <code>publicacoes</code></td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Projetos</strong> — <code>projetos</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Áreas declaradas</strong> — <code>areas</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n</tbody>\n</table>\n<p>Vinte cruzamentos de vinte e oito possíveis. Os oito ausentes são tão informativos quanto os presentes — e é isso que a próxima parte explica.</p>\n<div data-lab=\"matriz\">\n\n</div>\n<p><strong>Bloco a bloco: por que estes eixos, e não os outros</strong></p>\n<p><strong>Resumo</strong> → <em>setor</em> + <em>competência</em></p>\n<p>O resumo é a única prosa autoral do currículo: a pessoa dizendo, com as próprias palavras, o que faz. Isso responde bem a “em que campo você atua” (setor) e “o que você sabe fazer” (competência). <strong>Não</strong> é cruzado com tecnologia nem com maturidade porque o resumo é uma declaração de trajetória, não a descrição de um artefato: quase nunca menciona uma tecnologia habilitadora específica, e nunca informa o estágio TRL de coisa alguma.</p>\n<p><strong>Formação</strong> → <em>competência</em> + <em>setor</em></p>\n<p>O texto é <code>\"Nível: Doutorado. Curso: Engenharia Metalúrgica. Trabalho: Escalonamento de processo fermentativo\"</code>. O título da tese é o que mais informa: “Engenharia Química” é genérico, mas o título do trabalho diz exatamente o que a pessoa sabe fazer — por isso o eixo de competência vem primeiro. O setor entra em segundo lugar, porque um curso muitas vezes já aponta para uma indústria. <strong>Não</strong> cruza com maturidade: um curso não está num estágio de TRL. <strong>Não</strong> cruza com tecnologia: o nome de um curso raramente identifica uma tecnologia habilitadora específica — e forçar o cruzamento produziria acertos por coincidência de vocabulário, exatamente o erro que o limiar mais exigente dos textos curtos existe para evitar.</p>\n<p><strong>Atuação</strong> → <em>os quatro eixos</em></p>\n<p>É o único bloco que recebe todas as perguntas, e a razão é o conteúdo: instituição + cargo + descrição das atividades. Esse texto conta a história completa — onde, em que posição, fazendo o quê. Uma descrição de atividades pode dizer o setor da empresa, a competência exercida, a tecnologia empregada e, quando descreve desenvolvimento, até o estágio de maturidade daquilo. É o bloco mais informativo do currículo, e por isso o mais caro de processar.</p>\n<p><strong>Produção técnica</strong> → <em>setor</em> + <em>tecnologia</em> + <em>maturidade</em></p>\n<p>Patente, software, produto e processo são a dimensão mais próxima da aplicação prática em todo o currículo — e é justamente aí que a pergunta de maturidade faz sentido: uma patente <strong>está</strong> num estágio de TRL, um artefato <strong>existe</strong> em algum grau de prontidão. O eixo de tecnologia também encaixa: um artefato incorpora tecnologias identificáveis. <strong>Não</strong> cruza com competência porque o título de uma patente descreve o <em>objeto</em>, não a habilidade de quem o fez. “Processo de obtenção de liga metálica” diz o que foi produzido; quem quer saber a competência exercida deve olhar a atuação profissional, que é onde ela está escrita.</p>\n<p><strong>Publicações</strong> → <em>competência</em> + <em>tecnologia</em></p>\n<p>O título de um artigo revela o tema de pesquisa: a competência técnica demonstrada e, muitas vezes, a tecnologia estudada. <strong>Não</strong> cruza com setor porque um título acadêmico raramente identifica o setor industrial de aplicação — “Análise de fadiga em juntas soldadas” pode ser naval, automotivo, aeronáutico ou nenhum dos três, e o modelo escolheria um por acaso. <strong>Não</strong> cruza com maturidade porque publicar não é um estágio da cadeia de inovação: publica-se tanto sobre pesquisa fundamental quanto sobre produto em operação.</p>\n<p><strong>Projetos</strong> → <em>setor</em> + <em>maturidade</em> + <em>tecnologia</em></p>\n<p>Título, natureza, descrição e financiador. O financiador é um sinal forte de setor e de maturidade: projeto com fomento de empresa ou de agência aplicada é outra coisa que projeto sem financiamento. A descrição costuma dizer em que ponto da cadeia o trabalho está — pesquisa exploratória, planta piloto, demonstração. <strong>Não</strong> cruza com competência porque o texto descreve o <em>objetivo</em> do projeto, não a habilidade individual de quem participou; e um projeto tem muitos participantes, com competências diferentes.</p>\n<p><strong>Áreas declaradas</strong> → <em>competência</em> + <em>setor</em></p>\n<p>Aqui a pessoa já se classificou, na taxonomia oficial do CNPq: <code>\"Engenharias &gt; Engenharia Mecânica &gt; Processos de Fabricação\"</code>. O sistema reclassifica mesmo assim, e de propósito: a função é <strong>traduzir</strong> do vocabulário acadêmico do CNPq para o vocabulário do domínio. <strong>Não</strong> cruza com tecnologia nem com maturidade: a taxonomia do CNPq é uma classificação de áreas do conhecimento, e não carrega nenhuma informação sobre tecnologia habilitadora ou estágio de prontidão.</p>\n<p><strong>O princípio geral, em uma linha:</strong> <em>só se pergunta ao texto o que ele pode responder.</em> Cruzar um bloco com um eixo que o seu conteúdo não informa não gera erro nem aviso — gera algo pior: um rótulo plausível, escolhido por semelhança superficial de vocabulário, que entra nas contagens da etapa 3 como se fosse um dado.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Cada cruzamento tem um custo real. São 20 cruzamentos, cada um vetorizando os textos do bloco contra as categorias daquela taxonomia. Acrescentar um eixo a um bloco grande aumenta o tempo da etapa 2 e, se o eixo não for adequado ao conteúdo, aumenta também a taxa de indefinidos e de ambíguos no relatório — fazendo parecer que a taxonomia está ruim, quando o problema é a pergunta ter sido feita ao texto errado.</p>\n</blockquote>\n<p><strong>Como mudar um cruzamento.</strong> Acrescentar ou remover uma dimensão é editar uma lista em <code>dominios/industria/blocos.py</code> — não escrever código:</p>\n<pre><code>Bloco(\n    nome=&quot;publicacoes&quot;,\n    ...\n    eixos=[\n        Eixo(&quot;competencia_tec&quot;),\n        Eixo(&quot;tecnologia&quot;, multirrotulo=True),\n        Eixo(&quot;setor_industrial&quot;),      # ⬅️ acrescentar é isto\n    ],\n)</code></pre>\n<blockquote>\n<p><strong>CONFIRA</strong> — Depois de mexer num cruzamento, rode <code>python pipeline.py --etapas classificacao</code> e abra a aba <code>QUALIDADE</code> de <code>2_classificacao.xlsx</code>. Se o eixo novo aparecer com indefinido acima de ~40%, a resposta é clara: aquele texto não sabe responder àquela pergunta. Remova o eixo em vez de culpar a taxonomia.</p>\n</blockquote>\n<h3 id=\"colunas-acrescentadas-a-cada-csv\">17.4 · Colunas acrescentadas a cada CSV</h3>\n<p>Para cada eixo, quatro colunas:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 59%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Coluna</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>&lt;Sigla&gt;_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">a categoria escolhida</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>&lt;Sigla&gt;_Grupo_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">o agrupador dessa categoria</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>CONFIANCA_&lt;Sigla&gt;_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">a proximidade, de 0 a 1</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>TOPK_&lt;Sigla&gt;_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">JSON com as melhores candidatas e suas notas</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — A coluna <code>TOPK</code> é o que torna a decisão <strong>auditável</strong>. Abra o arquivo e veja exatamente por que aquele rótulo venceu, e por quanto. Sem ela, o sistema seria uma caixa-preta.</p>\n</blockquote>\n<h3 id=\"o-que-o-código-faz-passo-a-passo-1\">17.5 · O que o código faz, passo a passo</h3>\n<p><strong>Passo 1 — montar o texto.</strong> Cada bloco tem uma função no arquivo do domínio. Ela junta os campos com rótulos explícitos: <code>\"Instituição: … Cargo: … Atividades: …\"</code>. Os rótulos não são enfeite — avisam ao modelo que cada trecho é de natureza diferente.</p>\n<p><strong>Passo 2 — traduzir os eixos.</strong> A função <code>_montar_eixos()</code> converte a declaração do domínio (<em>“cruze com a taxonomia de setor”</em>) nos parâmetros que o motor precisa (nomes de coluna, limiar, margem).</p>\n<p><strong>Passo 3 — classificar.</strong> Uma única chamada resolve tudo: deduplica, consulta o cache, vetoriza as categorias, aplica limiar e margem, aciona o desempate na zona cinzenta e escreve as colunas.</p>\n<p><strong>Passo 4 — medir a qualidade.</strong> Calcula, por eixo, a taxa de indefinidos e de ambíguos.</p>\n<p><strong>Passo 5 — gravar.</strong></p>\n<h3 id=\"duas-economias-importantes\">17.6 · Duas economias importantes</h3>\n<p><strong>Deduplicação.</strong> Textos idênticos são processados uma vez só. Numa base grande há muita repetição (mesmo curso, mesmo cargo), e isso costuma cortar de 60% a 80% do trabalho. É de graça: textos iguais recebem o mesmo rótulo de qualquer forma.</p>\n<p><strong>Cache.</strong> O que já foi classificado não é refeito. A chave é o <strong>conteúdo</strong> do texto, não um identificador.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Se o pesquisador atualizar o currículo, o conteúdo muda, a chave muda e o item é reclassificado sozinho. Não existe “limpar o cache” manual — o sistema percebe a mudança por conta própria.</p>\n</blockquote>\n<h3 id=\"o-que-conferir-depois-1\">17.7 · O que conferir depois</h3>\n<blockquote>\n<p><strong>CONFIRA</strong> — Abra <code>2_classificacao.xlsx</code>, aba <code>QUALIDADE</code>:</p>\n</blockquote>\n<table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 16%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 56%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Sintoma</th>\n<th style=\"text-align: left;\">Significado</th>\n<th style=\"text-align: left;\">O que fazer</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Indefinido acima de ~40%</td>\n<td style=\"text-align: left;\">A taxonomia não cobre o material</td>\n<td style=\"text-align: left;\">Acrescentar categorias</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ambíguo acima de ~30%</td>\n<td
