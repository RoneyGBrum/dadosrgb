=\"estrutura-do-código\">23. Estrutura do código</h2>\n<pre><code>lattes_pipeline/\n├── config.py               ⭐ toda a configuração\n├── pipeline.py             o orquestrador (linha de comando)\n│\n├── nucleo/                 infraestrutura, sem regra de negócio\n│   ├── texto.py            canonicalização e hash\n│   ├── arquivos.py         leitura, escrita segura e exportação XLSX\n│   ├── cache.py            cache por conteúdo\n│   ├── registro.py         registro de execuções\n│   └── falhas.py           fila de reprocessamento\n│\n├── ingestao/\n│   ├── contrato.py         ⭐ o esquema das dez tabelas\n│   ├── adaptadores.py      ⭐ XML / ZIP / CSV → esquema\n│   └── simulador.py        dados simulados para demonstração\n│\n├── semantica/\n│   ├── blocos.py           as estruturas Bloco e Eixo\n│   ├── taxonomia.py        monta os textos das categorias\n│   ├── vetores.py          o modelo de vetores e a escolha do dispositivo\n│   ├── classificador.py    limiar, margem, multirrótulo\n│   ├── reranker.py         o desempate de precisão\n│   ├── descoberta.py       encontra o que a taxonomia não cobre\n│   └── planilha.py         leitura e escrita do dicionário\n│\n├── dominios/               ⭐ as áreas de aplicação\n│   ├── __init__.py         registro automático\n│   └── industria/\n│       ├── blocos.py\n│       └── dicionario_industria.xlsx\n│\n├── etapas/\n│   ├── e01_ingestao.py\n│   ├── e02_classificacao.py\n│   ├── e03_quantificacao.py\n│   └── e04_vetorizacao.py\n│\n└── testes/\n    └── test_integracao.py  bateria de ponta a ponta</code></pre>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — <strong>A regra das camadas:</strong> cada uma só conhece as de baixo. <code>nucleo/</code> não sabe o que é um currículo. <code>semantica/</code> não sabe o que é o Lattes. <code>dominios/</code> não sabe o que é um Parquet. É isso que permite mexer numa parte sem quebrar as outras.</p>\n</blockquote>\n<h2 id=\"quando-o-dado-real-chegar\">24. Quando o dado real chegar</h2>\n<p><strong>Passo 1 — inspecionar uma amostra.</strong></p>\n<pre><code>python -m ingestao.adaptadores C:\\caminho\\amostra.xml</code></pre>\n<p>O comando imprime quantas linhas saíram de cada tabela. Se todas vierem preenchidas, o leitor encaixou e não há nada a fazer.</p>\n<p><strong>Passo 2 — se alguma tabela vier vazia</strong>, o caminho da tag mudou. Abra <code>ingestao/adaptadores.py</code>, ache o bloco correspondente (estão numerados de 1 a 10, na ordem dos módulos da Plataforma) e ajuste o nome. A função <code>_attr()</code> aceita vários nomes candidatos justamente para lidar com variações entre versões.</p>\n<p><strong>Passo 3 — se o formato não for XML</strong> (um dump tabular, uma API, uma tabela num data lake), escreva uma função nova:</p>\n<pre><code>def de_minha_fonte(caminho) -&gt; BaseLattes:\n    # leia como quiser\n    return BaseLattes(\n        tabelas={&quot;identificacao&quot;: df1, &quot;producao_tec&quot;: df2},\n        origem=&quot;minha_fonte&quot;,\n    )</code></pre>\n<p>e registre-a no dicionário <code>ADAPTADORES</code>. Nenhuma outra linha do sistema muda.</p>\n<p><strong>Passo 4 — calibrar</strong> (seção 21).</p>\n<h2 id=\"problemas-comuns\">25. Problemas comuns</h2>\n<table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 31%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Sintoma</th>\n<th style=\"text-align: left;\">Causa provável</th>\n<th style=\"text-align: left;\">Solução</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>ModuleNotFoundError</code> em biblioteca instalada</td>\n<td style=\"text-align: left;\">ambiente virtual não ativo, ou kernel errado no Jupyter</td>\n<td style=\"text-align: left;\">seções 8 e 11; confira <code>sys.executable</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>Activate.ps1 não pode ser carregado</code></td>\n<td style=\"text-align: left;\">política de execução do PowerShell</td>\n<td style=\"text-align: left;\"><code>Set-ExecutionPolicy -Scope CurrentUser RemoteSigned</code> (8.4)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Instalação “deu certo” mas o projeto não acha a biblioteca</td>\n<td style=\"text-align: left;\">usou <code>pip</code> em vez de <code>python -m pip</code></td>\n<td style=\"text-align: left;\">seção 9</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Execução muito mais lenta que o esperado</td>\n<td style=\"text-align: left;\">rodando no processador sem perceber</td>\n<td style=\"text-align: left;\">seção 10.2 — confira <code>torch.cuda.is_available()</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>CUDA out of memory</code></td>\n<td style=\"text-align: left;\">lote grande demais</td>\n<td style=\"text-align: left;\"><code>lote = 16</code> em <code>config.py</code> (20.6)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">PyTorch de GPU virou de CPU sozinho</td>\n<td style=\"text-align: left;\"><code>sentence-transformers</code> instalado antes do PyTorch</td>\n<td style=\"text-align: left;\">reinstale na ordem da seção 9.2</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>dicionário não encontrado</code></td>\n<td style=\"text-align: left;\">domínio errado ou arquivo movido</td>\n<td style=\"text-align: left;\"><code>python pipeline.py --dominios</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Quase tudo <code>Indefinido</code></td>\n<td style=\"text-align: left;\">limiar alto demais para o modelo em uso</td>\n<td style=\"text-align: left;\">conferir o modelo; reduzir limiares (20.2)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Um bloco muito pior que os outros</td>\n<td style=\"text-align: left;\"><code>texto_longo</code> marcado errado</td>\n<td style=\"text-align: left;\">20.11</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Muitos ambíguos</td>\n<td style=\"text-align: left;\">margem apertada para uma taxonomia grande</td>\n<td style=\"text-align: left;\">aumentar a margem (20.3)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Contagens dobraram sem motivo</td>\n<td style=\"text-align: left;\"><code>multirrotulo</code> foi ligado num eixo</td>\n<td style=\"text-align: left;\">20.11</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Tabela vazia após ingestão</td>\n<td style=\"text-align: left;\">caminho de tag mudou</td>\n<td style=\"text-align: left;\">seção 24, passo 2</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">XLSX diz que foi truncado</td>\n<td style=\"text-align: left;\">mais de 100.000 linhas</td>\n<td style=\"text-align: left;\">normal; o total está no Parquet (15.3)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Download do modelo falha</td>\n<td style=\"text-align: left;\">sem internet na 1ª execução</td>\n<td style=\"text-align: left;\">é necessário só uma vez; depois roda offline</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"decisões-que-dependem-de-vocês\">26. Decisões que dependem de vocês</h2>\n<p><strong>1. Revisão das glosas.</strong> As categorias estão marcadas como <em>não revisadas</em> na planilha, aguardando validação técnica. É a tarefa de maior impacto sobre a qualidade — a glosa é o classificador.</p>\n<p><strong>2. Calibração dos limiares e da margem</strong> (seção 21). Sem isso, as taxas de indefinidos e ambíguos não são interpretáveis.</p>\n<p><strong>3. Medir o ganho do desempate</strong> (seção 6). Ele está ligado; vale rodar uma vez sem ele para dimensionar a diferença.</p>\n<p><strong>4. Ampliar ou reduzir as taxonomias.</strong> As quatro atuais são uma proposta. Rodar a descoberta de temas (20.13) mostra o que não está sendo coberto.</p>\n<p><strong>5. Tratamento de textos de comprimentos díspares</strong> (seção 7).</p>\n<p>Esta é a decisão mais delicada da lista, porque envolve mexer no classificador. Ela está detalhada aqui de propósito.</p>\n<p><strong>O que está em jogo, em três frases.</strong> O sistema aplica uma régua de exigência (o limiar) escolhida <strong>por bloco</strong>, e não por linha. Dentro do mesmo bloco, uma entrada de três palavras e uma de cinquenta são julgadas com a mesma régua. Como as duas têm naturezas diferentes, o erro que cada uma comete também é diferente — e previsível.</p>\n<p><strong>O efeito, nas duas pontas:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Tipo de entrada</th>\n<th>Para onde tende</th>\n<th>Por quê</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Curta</strong> — “Engenheiro de Processos”</td>\n<td><code>Indefinido</code></td>\n<td>pouco contexto; nenhuma categoria alcança o limiar</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Longa</strong> — descrição com quatro assuntos</td>\n<td><code>ambíguo</code></td>\n<td>várias categorias empatam; nenhuma vence com margem</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Por que isso não é uma emergência.</strong> Três atenuantes reais, todos já implementados:</p>\n<ol type=\"1\">\n<li><strong>A etapa 3 conta por pesquisador</strong>, não por linha. Quem tem várias entradas curtas acumula sinal ao longo delas.</li>\n<li><strong>Os <code>Indefinido</code> ficam numa coluna separada</strong> (<code>sem_rotulo</code>) e não contaminam o cálculo do predominante nem da concentração.</li>\n<li><strong>O problema é visível e mensurável.</strong> A coluna <code>sem_rotulo</code> diz, currículo a currículo, quantos itens ficaram de fora — então dá para identificar exatamente quem está sub-representado antes de concluir qualquer coisa sobre essa pessoa.</li>\n</ol>\n<p><strong>Onde o atenuante falha.</strong> Em quem tem <em>apenas</em> entradas curtas — currículos enxutos, em que a pessoa registrou os cargos e não descreveu as atividades. São comuns em perfis de indústria, justamente o público de interesse deste projeto. Esse grupo fica com poucos itens classificados, e todas as medidas da etapa 3 passam a ser calculadas sobre uma base pequena.</p>\n<p><strong>A medição que decide.</strong> Antes de qualquer mudança, façam esta conta sobre a amostra rotulada da seção 21 — separando as linhas por faixa de tamanho:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Faixa de tamanho</th>\n<th>Nº de linhas</th>\n<th><code>Indefinido</code> (%)</th>\n<th>Acerto (%)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1 a 5 palavras</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"even\">\n<td>6 a 20 palavras</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n<tr class=\"odd\">\n<td>21 palavras ou mais</td>\n<td></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>Com esse quadro preenchido, a decisão praticamente se toma sozinha:</p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>O que o quadro mostrar</th>\n<th>O que fazer</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Taxas parecidas entre as faixas</td>\n<td><strong>Nada.</strong> A limitação é teórica; o método está adequado.</td>\n</tr>\n<tr class=\"even\">\n<td>Faixa curta com <code>Indefinido</code> um pouco maior</td>\n<td><strong>Nada ainda.</strong> Reavaliar quando a base real crescer.</td>\n</tr>\n<tr class=\"odd\">\n<td>Faixa curta com <code>Indefinido</code> desproporcional, e o grupo afetado for relevante para a análise</td>\n<td>Considerar o caminho A ou o B, medindo cada um contra a mesma amostra.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Há dois caminhos, detalhados em 7.6:</strong></p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 40%\" />\n<col style=\"width: 43%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th style=\"text-align: left;\">Caminho A · limiar por tamanho</th>\n<th style=\"text-align: left;\">Caminho B · agregar antes</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>O que faz</strong></td>\n<td style=\"text-align: left;\">limiar varia com o número de palavras</td>\n<td style=\"text-align: left;\">junta as entradas curtas do mesmo pesquisador</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Ganho</strong></td>\n<td style=\"text-align: left;\">trata cada linha pelo que ela é</td>\n<td style=\"text-align: left;\">resolve na raiz, sem parâmetro novo</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Custo</strong></td>\n<td style=\"text-align: left;\">mais um parâmetro para calibrar</td>\n<td style=\"text-align: left;\">perde a rastreabilidade item a item</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Risco</strong></td>\n<td style=\"text-align: left;\">curva precisa ser ajustada com dados reais</td>\n<td style=\"text-align: left;\">pode criar diluição (7.3)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>A decisão não é técnica, é de uso.</strong> Se vocês precisam saber <em>qual item</em> gerou cada rótulo — para auditoria ou rastreabilidade —, o caminho B destrói essa informação e está descartado de saída. Se o que importa é o retrato do pesquisador, B é mais simples e mais eficaz.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Não implementem nenhum dos dois preventivamente.</strong> Cada acréscimo de esperteza ao classificador cobra um pedaço do que ele tem de melhor: ser determinístico, auditável e explicável a um comitê. Um limiar que varia com o número de palavras é mais um número para calibrar, mais uma curva para justificar e mais uma linha na explicação de por que aquele currículo recebeu aquele rótulo. Enquanto a medição não mostrar distorção relevante, <strong>confiem no método</strong> — com a limitação conhecida, documentada e visível no próprio resultado.</p>\n</blockquote>\n<p><strong>O que deve ser decidido, em uma frase:</strong> rodar a medição por faixa de tamanho, olhar o quadro e registrar a decisão — inclusive se ela for “não mexer”, que é a resposta esperada até que os números digam o contrário.</p>\n<p><strong>6. Novos domínios.</strong> Se a aplicação for além da indústria, cada área nova precisa do seu dicionário (seção 22).</p>\n<p><strong>7. Proteção de dados.</strong> O Lattes é público, mas o cruzamento em escala cria um produto novo. Convém definir o que pode ser exibido nominalmente e o que só agregado.</p>\n<p>Confirmado em amostra real: o XML bruto do Lattes (formato “offline”) contém CPF, RG, data de nascimento e nome dos pais preenchidos. O parser deste projeto (<code>ingestao/contrato.py</code>) nunca extrai esses campos para as dez tabelas canônicas — eles só sobrevivem enquanto o arquivo de origem existir em disco. A ingestão em lote (16.6) apaga o XML assim que a tabela está confirmada; isso é, ao mesmo tempo, economia de espaço e proteção de dado pessoal.</p>\n<p><strong>8. Ligar o <code>reranker_topk</code> ao código</strong> (ver 6.5). O parâmetro existe em <code>config.py</code> e não é lido por ninguém: o número efetivo de candidatos do desempate está fixado em <code>semantica/classificador.py</code>. Hoje os dois coincidem em 5, então o comportamento está correto — mas quem tentar calibrar o parâmetro vai concluir, com razão, que ele não faz nada. É uma linha em <code>etapas/e02_classificacao.py</code>, função <code>_montar_eixos()</code>: passar <code>top_k=CFG.semantica.reranker_topk - 2</code> ao criar o eixo. Correção de baixo risco, e vale fazer antes da calibração da seção 21, para que o parâmetro esteja disponível quando for preciso.</p>\n<h2 id=\"dados-de-demonstração\">27. Dados de demonstração</h2>\n<p>A pasta de demonstração traz uma base simulada de <strong>300 currículos</strong>, processada pelas quatro etapas:</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 62%\" />\n<col style=\"width: 35%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Arquivo</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>curriculo_*.csv</code></td>\n<td style=\"text-align: left;\">as dez tabelas da etapa 1</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>classificado_*.csv</code></td>\n<td style=\"text-align: left;\">os sete blocos com rótulos (etapa 2)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>quantificacao.csv</code> / <code>.xlsx</code></td>\n<td style=\"text-align: left;\">uma linha por pesquisador (etapa 3)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>contagens_detalhadas.csv</code> / <code>.xlsx</code></td>\n<td style=\"text-align: left;\">formato longo, para tabela dinâmica</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>curriculos_vetorizados.parquet</code></td>\n<td style=\"text-align: left;\">com os vetores (etapa 4)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>1_ingestao.xlsx</code>, <code>2_classificacao.xlsx</code>, <code>3_quantificacao.xlsx</code></td>\n<td style=\"text-align: left;\">os relatórios</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Estes dados são simulados.</strong> Foram gerados por <code>ingestao/simulador.py</code> para exercitar o sistema antes da extração real. A classificação usou similaridade lexical, não o modelo de vetores de produção. <strong>Nenhum número descreve pessoas reais.</strong> Servem para demonstrar o formato da entrega, não para produzir conclusões.</p>\n</blockquote>\n<h2 id=\"o-que-mudou-na-versão-1.4\">28. O que mudou na versão 1.4</h2>\n<p>Esta versão nasceu de uma revisão dirigida: treze pontos do manual 1.3 foram marcados como insuficientes por quem o leu, e cada um deles foi reescrito contra o código-fonte do pipeline — não contra a versão anterior do texto.</p>\n<p><strong>Explicações reescritas ou criadas</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Onde</th>\n<th>O que mudou</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>3.2</td>\n<td><strong>Novo.</strong> Vocabulário do sistema — bloco, eixo, categoria e glosa — apresentado logo no início, antes de as palavras serem usadas.</td>\n</tr>\n<tr class=\"even\">\n<td>6.4</td>\n<td><strong>Novo.</strong> O que é exatamente a “zona cinzenta”: uma faixa de pontuação (0,60 a 0,85), e não o conjunto dos itens ambíguos.</td>\n</tr>\n<tr class=\"odd\">\n<td>6.5</td>\n<td><strong>Novo.</strong> O que é o método top-K, com exemplo numérico, o motivo de <code>argpartition</code> e os quatro lugares em que ele aparece no pipeline.</td>\n</tr>\n<tr class=\"even\">\n<td>7.1</td>\n<td><strong>Reescrito.</strong> O que significa normalizar um vetor, com a conta de Pitágoras feita passo a passo.</td>\n</tr>\n<tr class=\"odd\">\n<td>7.2</td>\n<td><strong>Reescrito.</strong> O exemplo prático da normalização, agora com todas as multiplicações à vista e cinco passos numerados.</td>\n</tr>\n<tr class=\"even\">\n<td>7.4</td>\n<td><strong>Reescrito.</strong> Como o sistema decide o que é texto longo e o que é curto — resposta: não decide, é declarado por uma pessoa, por bloco.</td>\n</tr>\n<tr class=\"odd\">\n<td>7.5</td>\n<td><strong>Reescrito.</strong> A limitação real, com o caso concreto de duas linhas do mesmo bloco e a lista do que o sistema não faz.</td>\n</tr>\n<tr class=\"even\">\n<td>7.6</td>\n<td><strong>Reescrito.</strong> Os dois caminhos possíveis, precedidos da recomendação explícita de não implementar nenhum sem medida.</td>\n</tr>\n<tr class=\"odd\">\n<td>9.1</td>\n<td><strong>Novo.</strong> Para que serve cada biblioteca instalada, separadas em obrigatórias, notebook, descoberta e nuvem.</td>\n</tr>\n<tr class=\"even\">\n<td>11.6 a 11.12</td>\n<td><strong>Novo.</strong> Operar pelo Jupyter: célula de abertura, execução etapa a etapa, tabela de equivalências com o terminal, mudança de parâmetros em memória, armadilhas do notebook e um notebook mínimo de cinco células.</td>\n</tr>\n<tr class=\"odd\">\n<td>12.4</td>\n<td><strong>Reescrito.</strong> Verificação do Ollama nas duas formas, incluindo a checagem pelo próprio código do projeto dentro do notebook.</td>\n</tr>\n<tr class=\"even\">\n<td>13.5</td>\n<td><strong>Novo.</strong> Como rodar o assistente de glosas pelo notebook, nas duas formas.</td>\n</tr>\n<tr class=\"odd\">\n<td>17.2</td>\n<td><strong>Reescrito.</strong> Anatomia completa de um bloco, com um item percorrido de ponta a ponta.</td>\n</tr>\n<tr class=\"even\">\n<td>17.3</td>\n<td><strong>Reescrito.</strong> O cruzamento bloco × taxonomia em matriz, com a justificativa de cada cruzamento presente <strong>e de cada ausência</strong>.</td>\n</tr>\n<tr class=\"odd\">\n<td>26, item 5</td>\n<td><strong>Reescrito.</strong> A decisão pendente sobre textos de comprimentos díspares, com o quadro de medição e o critério de decisão.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Correções</strong></p>\n<ul>\n<li><strong>Numeração das subseções.</strong> Na versão 1.3, as seções 12, 13, 15, 16 e 18 traziam subseções numeradas com o prefixo de outra seção (12 usava “20.1”, 13 usava “17.1”, 16 usava “20.1”). Todas foram renumeradas para seguir a seção-mãe, e as referências cruzadas do texto foram ajustadas.</li>\n<li><strong>Referências cruzadas</strong> para 7.2, 7.5, 9.1, 9.2, 20.11 e 22 corrigidas em consequência da renumeração.</li>\n<li><strong><code>reranker_topk</code>.</strong> Registrada a discrepância entre o parâmetro documentado e o comportamento do código (6.5, 20.4 e a pendência 8 da seção 26).</li>\n</ul>\n<p><strong>Blocos “NO TERMINAL / NO NOTEBOOK”</strong> foram acrescentados a cada uma das quatro etapas da Parte III, à primeira execução (14) e à tabela de comandos (15.1).</p>\n<p><em>Pipeline Lattes · Manual de referência · Versão 1.4 · CNPq × CNI</em></p>"}];
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   LABORATÓRIOS — as peças que só existem no HTML.

   Cada função monta um widget dentro de um <div class="lab" data-lab="nome">
   que o texto do manual traz como marcador. Nenhuma delas altera o conteúdo
   escrito: elas acrescentam uma forma de manipular o que o texto explica.

   Todos os números usados aqui são ilustrativos e coerentes com os exemplos
   do manual — não são medições da base real, que ainda não foi processada.
   ═══════════════════════════════════════════════════════════════════════════ */

const LABS = {};
const fmt = (n, c = 3) => n.toFixed(c).replace('.', ',');
const el = (t, cls, html) => {
  const n = document.createElement(t);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
};
function moldura(host, selo, titulo, sub) {
  host.innerHTML = '';
  const topo = el('div', 'lab-topo');
  topo.append(el('span', 'lab-selo', selo), el('span', 'lab-tit', titulo));
  if (sub) topo.append(el('span', 'lab-sub', sub));
  const corpo = el('div', 'lab-corpo');
  host.append(topo, corpo);
  return corpo;
}
function controle(rotulo, min, max, passo, valor, formatar) {
  const item = el('div', 'ctrl-item');
  const rot = el('div', 'ctrl-rot');
  const val = el('span', 'ctrl-val', formatar(valor));
  rot.append(el('span', '', rotulo), val);
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = passo; inp.value = valor;
  inp.setAttribute('aria-label', rotulo);
  item.append(rot, inp);
  return { item, inp, val, formatar };
}

/* ───────────────────────────────────────────────────────────────────────────
   1 · AS QUATRO ETAPAS — o caminho dos dados, clicável
   ─────────────────────────────────────────────────────────────────────────── */
const ETAPAS = [
  { n: 'ETAPA 1', t: 'Ingestão', d: 'arruma a casa',
    entra: '1_ENTRADA/ — XML, ZIP, CSV ou Parquet, no formato que vier',
    sai: '2_CURRICULOS/*.parquet — dez tabelas sempre iguais',
    arquivo: 'etapas/e01_ingestao.py', tempo: 'segundos a minutos',
    porque: 'Concentra toda a variação de formato num lugar só. Tudo o que vem depois enxerga uma estrutura única — e trocar a fonte de dados não afeta mais nada.',
    conferir: '5_RELATORIOS/1_ingestao.xlsx, aba RESUMO' },
  { n: 'ETAPA 2', t: 'Classificação', d: 'coloca rótulos',
    entra: 'as dez tabelas + o dicionário do domínio',
    sai: '3_CLASSIFICADO/LATTES_&lt;BLOCO&gt;.csv — um por bloco',
    arquivo: 'etapas/e02_classificacao.py', tempo: 'a mais demorada — domina o total',
    porque: 'É o coração do sistema: cada pedaço do currículo vira vetor, é comparado com o vetor de cada categoria e recebe um rótulo, se passar no limiar e na margem.',
    conferir: '5_RELATORIOS/2_classificacao.xlsx, aba QUALIDADE' },
  { n: 'ETAPA 3', t: 'Quantificação', d: 'conta os rótulos',
    entra: 'os CSVs classificados da etapa 2',
    sai: '4_RESULTADOS/quantificacao.parquet — uma linha por pesquisador',
    arquivo: 'etapas/e03_quantificacao.py', tempo: 'segundos',
    porque: 'Transforma milhares de linhas num retrato de uma linha por pessoa: predominante, concentração e diversidade. Contagem pura, sem peso e sem índice composto.',
    conferir: '5_RELATORIOS/3_quantificacao.xlsx' },
  { n: 'ETAPA 4', t: 'Vetorização', d: 'condensa num vetor',
    entra: 'tudo — tabelas, rótulos e contagens',
    sai: '4_RESULTADOS/curriculos_vetorizados.parquet — com o vetor',
    arquivo: 'etapas/e04_vetorizacao.py', tempo: 'minutos',
    porque: 'Condensa o currículo inteiro num texto único e o converte num vetor, gravado para uso posterior por qualquer aplicação que precise comparar perfis.',
    conferir: 'curriculos_vetorizados.xlsx (sai sem a coluna de vetor)' }
];

LABS.etapas = host => {
  const c = moldura(host, 'interativo', 'O caminho dos dados', 'clique numa etapa');
  const fluxo = el('div', 'fluxo');
  const painel = el('div', 'passo-corpo');
  painel.style.marginTop = '16px';
  const bts = ETAPAS.map((e, i) => {
    const b = el('button', 'et' + (i === 0 ? ' on' : ''),
      `<span class="n">${e.n}</span><span class="t">${e.t}</span><span class="d">${e.d}</span>`);
    b.onclick = () => { bts.forEach(x => x.classList.remove('on')); b.classList.add('on'); pinta(i); };
    fluxo.append(b);
    return b;
  });
  function pinta(i) {
    const e = ETAPAS[i];
    painel.innerHTML = `<h5>${e.n} · ${e.t}</h5>
      <p>${e.porque}</p>
      <table><tbody>
        <tr><td style="width:96px"><b>Entra</b></td><td>${e.entra}</td></tr>
        <tr><td><b>Sai</b></td><td>${e.sai}</td></tr>
        <tr><td><b>Arquivo</b></td><td><code>${e.arquivo}</code></td></tr>
        <tr><td><b>Tempo</b></td><td>${e.tempo}</td></tr>
        <tr><td><b>Conferir</b></td><td>${e.conferir}</td></tr>
      </tbody></table>`;
  }
  c.append(fluxo, painel);
  pinta(0);
  c.append(el('div', 'lab-nota',
    'As quatro rodam em fila e cada uma grava o próprio resultado em disco. Por isso dá para rodar só uma delas — <code>--etapas classificacao</code> — sem refazer as anteriores.'));
};

/* ───────────────────────────────────────────────────────────────────────────
   2 · LIMIAR E MARGEM — o simulador da decisão

LABS.decisao = host => {
  const c = moldura(host, 'simulador', 'Limiar e margem — veja a decisão mudar', 'arraste os controles');
  const ctrl = el('div', 'ctrl');
  const cl = controle('Limiar — o mínimo para aceitar', 0.5, 0.95, 0.01, 0.78, v => fmt(+v, 2));
  const cm = controle('Margem — distância mínima entre 1º e 2º', 0, 0.09, 0.005, 0.015, v => fmt(+v, 3));
  ctrl.append(cl.item, cm.item);

  const tabela = el('div', 'rolagem');
  const barras = el('div', 'barras');
  const nota = el('div', 'lab-nota');

  function calcula() {
    const L = +cl.inp.value, M = +cm.inp.value;
    cl.val.textContent = cl.formatar(L); cm.val.textContent = cm.formatar(M);
    let ok = 0, amb = 0, ind = 0;
    const linhas = ITENS.map(it => {
      const marg = it.s1 - it.s2;
      let est, chip;
      if (it.s1 < L) { est = 'Indefinido'; chip = 'ind'; ind++; }
      else if (marg < M) { est = 'ambíguo'; chip = 'amb'; amb++; }
      else { est = it.c1; chip = 'ok'; ok++; }
      return `<tr>
        <td style="max-width:280px">${it.t}</td>
        <td class="num">${fmt(it.s1)}</td>
        <td class="num ${marg < M ? '' : 'apagado'}">${fmt(marg)}</td>
        <td><span class="chip ${chip}">${est}</span></td></tr>`;
    }).join('');
    tabela.innerHTML = `<table><thead><tr>
      <th>Texto do currículo</th><th>Nota 1º</th><th>Margem</th><th>Resultado</th>
      </tr></thead><tbody>${linhas}</tbody></table>`;

    const n = ITENS.length;
    const b = (rot, v, cor) => `<div class="barra">
      <div class="barra-rot"><span>${rot}</span><b>${Math.round(100 * v / n)}%</b></div>
      <div class="barra-tri"><i style="width:${100 * v / n}%;background:${cor}"></i></div></div>`;
    barras.innerHTML = b('classificados', ok, 'var(--verde)') +
      b('ambíguos', amb, 'var(--cobre)') + b('indefinidos', ind, 'var(--tinta-3)');

    let msg = '';
    if (ind / n > 0.4) msg = '<b>Indefinido acima de 40%.</b> No relatório, isso significa que a taxonomia não cobre o material — ou que o limiar está alto demais para o modelo em uso. Ver 20.2.';
    else if (amb / n > 0.3) msg = '<b>Ambíguo acima de 30%.</b> Suspeite da margem antes de suspeitar das glosas: é a causa mais frequente e a mais fácil de corrigir. Ver 20.3.';
    else msg = 'Taxas dentro do esperado. Com <b>limiar 0,78</b> e <b>margem 0,015</b> — os padrões do projeto — repare quais itens ficam de fora: são os textos curtos, exatamente como descrito em 7.5.';
    nota.innerHTML = msg + ' <i>Os dez itens são ilustrativos e coerentes com os exemplos do manual.</i>';
  }
  cl.inp.oninput = calcula; cm.inp.oninput = calcula;
  c.append(ctrl, tabela, barras, nota);
  calcula();
};

const CANDIDATOS = [
  { c: 'Metalurgia e Siderurgia', bi: 0.842, cross: 0.61 },
  { c: 'Metalmecânica e Bens de Capital', bi: 0.838, cross: 0.44 },
  { c: 'Automotiva e Mobilidade', bi: 0.791, cross: 0.22 },
  { c: 'Mineração e Beneficiamento Mineral', bi: 0.774, cross: 0.18 },
  { c: 'Química e Petroquímica Fina', bi: 0.762, cross: 0.09 },
  { c: 'Materiais e Caracterização', bi: 0.759, cross: 0.93 },
  { c: 'Alimentos e Bebidas', bi: 0.655, cross: 0.04 },
  { c: 'Têxtil, Couro e Calçados', bi: 0.601, cross: 0.02 }
];
const CERTO = 'Materiais e Caracterização';

LABS.topk = host => {
  const c = moldura(host, 'simulador', 'Top-K e o desempate', 'mude o K e rode o cross-encoder');
  const ctrl = el('div', 'ctrl');
  const ck = controle('K — quantos candidatos seguem para o desempate', 1, 8, 1, 5, v => v);
  ctrl.append(ck.item);
  const linha = el('div', 'btn-linha');
  const bRodar = el('button', 'btn acento', 'Rodar o desempate');
  const bVoltar = el('button', 'btn', 'Recomeçar');
  linha.append(bRodar, bVoltar);
  ctrl.append(el('div', 'ctrl-item'));
  const tabela = el('div', 'rolagem');
  const nota = el('div', 'lab-nota');
  let rodou = false;

  function pinta() {
    const K = +ck.inp.value;
    ck.val.textContent = K;
    const base = CANDIDATOS.slice();
    const sel = base.slice(0, K);
    let ordem = base;
    if (rodou) {
      const reord = sel.slice().sort((a, b) => b.cross - a.cross);
      ordem = reord.concat(base.slice(K));
    }
    tabela.innerHTML = `<table><thead><tr>
      <th style="width:34px">#</th><th>Categoria candidata</th>
      <th>Nota do bi-encoder</th><th>${rodou ? 'Nota do cross-encoder' : 'No top-K?'}</th>
      </tr></thead><tbody>${ordem.map((r, i) => {
      const dentro = rodou ? i < K : base.indexOf(r) < K;
      const vencedor = i === 0 && dentro;
      return `<tr class="${vencedor ? 'destaque' : ''}">
        <td class="num">${i + 1}</td>
        <td class="${dentro ? '' : 'apagado'}">${r.c}${r.c === CERTO ? ' <span class="chip neutro">rótulo correto</span>' : ''}</td>
        <td class="num ${dentro ? '' : 'apagado'}">${fmt(r.bi)}</td>
        <td>${rodou
          ? (dentro ? `<span class="num">${fmt(r.cross, 2)}</span>${vencedor ? ' <span class="chip ok">vence</span>' : ''}` : '<span class="apagado">—</span>')
          : (dentro ? '<span class="chip neutro">sim</span>' : '<span class="chip ind">fora</span>')}</td>
      </tr>`;
    }).join('')}</tbody></table>`;

    const K2 = +ck.inp.value;
    const posCerto = CANDIDATOS.findIndex(x => x.c === CERTO) + 1;
    let msg;
    if (!rodou) {
      msg = `O bi-encoder pôs <b>${CANDIDATOS[0].c}</b> em primeiro, por 0,004 de vantagem. O rótulo correto — <b>${CERTO}</b> — está em ${posCerto}º lugar. Com <b>K = ${K2}</b>, ele ${K2 >= posCerto ? '<b>entra</b> na lista que vai ao desempate' : '<b>fica de fora</b>, e o desempate não terá como escolhê-lo'}.`;
    } else if (K2 >= posCerto) {
      msg = `<b>O desempate corrigiu a decisão.</b> O cross-encoder leu cada par (texto + definição da categoria) junto e deu 0,93 a <b>${CERTO}</b>, contra 0,61 do primeiro colocado do bi-encoder. É exatamente para isso que ele existe: o bi-encoder nunca lê os dois textos ao mesmo tempo.`;
    } else {
      msg = `<b>O desempate não teve como acertar.</b> Com K = ${K2}, o rótulo correto (${posCerto}º) nem chegou ao cross-encoder. É o custo de um K pequeno demais — e a razão de o padrão do projeto ser 5.`;
    }
    nota.innerHTML = msg + ' <i>Notas ilustrativas; a escala do cross-encoder é diferente da do bi-encoder de propósito — só a ordem importa.</i>';
    bRodar.disabled = rodou;
  }
  ck.inp.oninput = () => { rodou = false; pinta(); };
  bRodar.onclick = () => { rodou = true; pinta(); };
  bVoltar.onclick = () => { rodou = false; pinta(); };
  c.append(ctrl, linha, el('div', '', '<div style="height:14px"></div>'), tabela, nota);
  pinta();
};

/* ───────────────────────────────────────────────────────────────────────────
   4 · NORMALIZAÇÃO DOS VETORES
   ─────────────────────────────────────────────────────────────────────────── */
LABS.normalizacao = host => {
  const c = moldura(host, 'simulador', 'Normalização — a mesma direção, comprimentos diferentes', 'com e sem');
  const ctrl = el('div', 'ctrl');
  const cf = controle('Tamanho do texto B (múltiplo do A)', 1, 15, 1, 10, v => v + '×');
  ctrl.append(cf.item);
  const linha = el('div', 'btn-linha');
  const bSem = el('button', 'btn on', 'Sem normalizar');
  const bCom = el('button', 'btn', 'Com normalização');
  linha.append(bSem, bCom);
  let normalizado = false;

  const plano = el('div', 'plano');
  const svgWrap = el('div');
  const lado = el('div');
  plano.append(svgWrap, lado);
  const nota = el('div', 'lab-nota');

  const O = { x: 34, y: 266 }, EIXO = 232;
  const CORES = { A: '#2C5282', B: '#B05A22', M: '#1F6B4A', T: '#5B4B8A' };

  function desenha() {
    const f = +cf.inp.value;
    cf.val.textContent = cf.formatar(f);
    const V = {
      A: [3, 1], B: [3 * f, 1 * f], M: [4, 1], T: [1, 4]
    };
    const norma = v => Math.sqrt(v[0] * v[0] + v[1] * v[1]);
    const unit = v => { const n = norma(v); return [v[0] / n, v[1] / n]; };
    const mostra = {};
    let escala;
    if (normalizado) {
      escala = EIXO * 0.86;
      for (const k in V) mostra[k] = unit(V[k]).map(x => x * escala);
      // A e B viram exatamente a mesma seta — é o ponto do exercício.
    } else {
      const maxc = Math.max(...Object.values(V).flat());
      escala = (EIXO * 0.86) / maxc;
      for (const k in V) mostra[k] = V[k].map(x => x * escala);
    }
    // O rótulo sai deslocado na perpendicular à seta: em «sem normalizar» os
    // quatro vetores apontam quase para o mesmo lado, e sem esse desvio os
    // textos se sobrepõem exatamente onde o leitor precisa ler.
    const seta = (k, rot, desvio) => {
      const [x, y] = mostra[k];
      const comp = Math.hypot(x, y) || 1;
      const px = -y / comp, py = x / comp;                 // perpendicular unitária
      const lx = O.x + x + (x / comp) * 9 + px * desvio;
      const ly = O.y - y - (y / comp) * 9 - py * desvio;
      const anc = x > 150 ? 'end' : 'start';
      return `<line class="seta" x1="${O.x}" y1="${O.y}" x2="${O.x + x}" y2="${O.y - y}"
        stroke="${CORES[k]}" stroke-width="2.4" stroke-linecap="round" marker-end="url(#p${k})"/>
        <circle class="seta" cx="${O.x + x}" cy="${O.y - y}" r="2.6" fill="${CORES[k]}"/>
        <text class="seta" x="${lx}" y="${ly}" font-size="10.5" font-weight="750"
        text-anchor="${anc}" fill="${CORES[k]}">${rot}</text>`;
    };
    const pontas = Object.entries(CORES).map(([k, cor]) =>
      `<marker id="p${k}" markerWidth="7" markerHeight="7" refX="5.4" refY="3" orient="auto">
         <path d="M0,0 L6,3 L0,6 z" fill="${cor}"/></marker>`).join('');
    const circulo = normalizado
      ? `<circle cx="${O.x}" cy="${O.y}" r="${EIXO * 0.86}" fill="none"
           stroke="var(--linha)" stroke-width="1.2" stroke-dasharray="3 4"/>` : '';
    svgWrap.innerHTML = `<svg viewBox="0 0 300 300" role="img"
      aria-label="Plano com os vetores dos dois textos e das duas categorias">
      <defs>${pontas}</defs>
      <line x1="${O.x}" y1="${O.y}" x2="${O.x + EIXO}" y2="${O.y}" stroke="var(--linha)" stroke-width="1.2"/>
      <line x1="${O.x}" y1="${O.y}" x2="${O.x}" y2="${O.y - EIXO}" stroke="var(--linha)" stroke-width="1.2"/>
      <text x="${O.x + EIXO - 4}" y="${O.y + 15}" font-size="9.5" fill="var(--tinta-3)" text-anchor="end">metalurgia →</text>
      <text x="${O.x - 6}" y="${O.y - EIXO + 6}" font-size="9.5" fill="var(--tinta-3)" transform="rotate(-90 ${O.x - 6} ${O.y - EIXO + 6})" text-anchor="end">automação →</text>
      ${circulo}
      ${seta('M', 'Metalurgia', -15)}${seta('T', 'Automação', 12)}
      ${normalizado
        ? seta('B', 'Texto A = Texto B', 16)
        : seta('B', 'Texto B', 14) + seta('A', 'Texto A', 16)}
    </svg>`;

    const escalar = (a, b) => a[0] * b[0] + a[1] * b[1];
    const cos = (a, b) => escalar(a, b) / (norma(a) * norma(b));
    const casas = normalizado ? 3 : 1;
    const val = (a, b) => normalizado ? fmt(cos(a, b), 3) : fmt(escalar(a, b), casas);
    lado.innerHTML = `
      <div class="legenda" style="margin-bottom:12px">
        <i style="background:${CORES.A}"></i><b>Texto A</b> — "Soldagem de aços", 3 palavras &nbsp;<span class="num">(${V.A[0]} ; ${V.A[1]})</span><br>
        <i style="background:${CORES.B}"></i><b>Texto B</b> — o mesmo assunto, ${f}× mais longo &nbsp;<span class="num">(${V.B[0]} ; ${V.B[1]})</span><br>
        <i style="background:${CORES.M}"></i><b>Categoria «Metalurgia»</b> &nbsp;<span class="num">(4 ; 1)</span><br>
        <i style="background:${CORES.T}"></i><b>Categoria «Automação»</b> &nbsp;<span class="num">(1 ; 4)</span>
      </div>
      <table><thead><tr><th></th><th>Metalurgia</th><th>Automação</th><th>Comprimento</th></tr></thead>
      <tbody>
        <tr><td><b>Texto A</b></td><td class="num">${val(V.A, V.M)}</td><td class="num">${val(V.A, V.T)}</td><td class="num">${normalizado ? '1,000' : fmt(norma(V.A), 2)}</td></tr>
        <tr><td><b>Texto B</b></td><td class="num">${val(V.B, V.M)}</td><td class="num">${val(V.B, V.T)}</td><td class="num">${normalizado ? '1,000' : fmt(norma(V.B), 2)}</td></tr>
      </tbody></table>`;

    if (normalizado) {
      nota.innerHTML = `<b>Com normalização, A e B são o mesmo vetor.</b> Cada um foi dividido pelo próprio comprimento — ${fmt(norma(V.A), 2)} e ${fmt(norma(V.B), 2)} — e os dois caíram exatamente sobre o mesmo ponto do círculo de raio 1. As notas ficaram idênticas, entre 0 e 1, e o limiar volta a significar a mesma coisa para os dois. Arraste o tamanho de B: nada muda.`;
    } else {
      nota.innerHTML = `<b>Sem normalizar, o tamanho vira nota.</b> B é ${f}× mais longo e recebe notas ${f}× maiores — inclusive na categoria errada: ${fmt(escalar(V.B, V.T), 1)} em «Automação», contra ${fmt(escalar(V.A, V.M), 1)} que A obteve na categoria <i>certa</i>. Com um limiar fixo em 20, A seria descartado e B aceito nas duas. Aumente o multiplicador e veja o absurdo crescer.`;
    }
  }
  bSem.onclick = () => { normalizado = false; bSem.classList.add('on'); bCom.classList.remove('on'); desenha(); };
  bCom.onclick = () => { normalizado = true; bCom.classList.add('on'); bSem.classList.remove('on'); desenha(); };
  cf.inp.oninput = desenha;
  c.append(ctrl, linha, el('div', '', '<div style="height:16px"></div>'), plano, nota);
  desenha();
};

/* As quinze entradas do que mudou na 1.4 — viram atalhos na capa. */
const MUDOU = [

const capaHTML = `
<div class="capa">
  <div class="inst">CNPq &nbsp;·&nbsp; CNI</div>
  <div class="inst-sub">Conselho Nacional de Desenvolvimento Científico e Tecnológico<br>

let atual = 0;

/* ── Nudges: converte as citações do markdown em caixas coloridas ────────── */
function aplicarNudges(raiz) {
  raiz.querySelectorAll('blockquote').forEach(bq => {
    const texto = bq.textContent.trim();
    const achado = NUDGES.find(([r]) => texto.startsWith(r));
    const div = document.createElement('div');
    div.className = 'nudge ' + (achado ? achado[1] : 'n-lembre');
    if (achado) {
      const rotulo = achado[0];
      const p1 = bq.querySelector('p');
      if (p1) {
        p1.innerHTML = p1.innerHTML
          .replace(new RegExp('^\\s*<strong>' + rotulo + '</strong>\\s*(—|-|–)?\\s*'),
            `<span class="rot">${rotulo}</span>`)
          .replace(new RegExp('^' + rotulo + '\\s*(—|-|–)?\\s*'),
            `<span class="rot">${rotulo}</span>`);
      }
    }
    while (bq.firstChild) div.appendChild(bq.firstChild);
    bq.replaceWith(div);
    div.dataset.rot = achado ? achado[0] : '';
  });
}

/* ── Abas terminal ↔ notebook ────────────────────────────────────────────
   O manual mostra o mesmo comando nas duas formas de operar. No papel eles
   ficam empilhados; aqui ocupam o mesmo espaço, e a comparação é imediata.

   Dois formatos são reconhecidos:
     A) uma única caixa contendo "NO TERMINAL" e "NO NOTEBOOK";
     B) um parágrafo em negrito "NO TERMINAL…" seguido de código, e depois
        um parágrafo "NO NOTEBOOK…" seguido de código.                       */

function rotuloDuo(txt) {
  const t = txt.replace(/\s+/g, ' ').trim();
  const extra = t.replace(/^NO (TERMINAL|NOTEBOOK)\s*/i, '')
    .replace(/^[—–-]\s*/, '').replace(/^\((.*)\)$/, '$1').trim();
  const base = /^NO TERMINAL/i.test(t) ? 'Terminal' : 'Notebook';
  if (!extra) return base === 'Terminal' ? 'Terminal · PowerShell' : 'Jupyter Notebook';
  return base + ' · ' + extra.charAt(0).toLowerCase() + extra.slice(1);
}

function criarDuo(pares) {
  const duo = document.createElement('div');
  duo.className = 'duo';
  const abas = document.createElement('div'); abas.className = 'duo-abas';
  const corpo = document.createElement('div'); corpo.className = 'duo-corpo';
  pares.forEach(([rot, nos], i) => {
    const b = document.createElement('button');
    b.className = 'duo-aba' + (i === 0 ? ' on' : '');
    b.type = 'button'; b.textContent = rot;
    const painel = document.createElement('div');
    if (i === 0) painel.className = 'on';
    nos.forEach(n => painel.appendChild(n));
    b.onclick = () => {
      abas.querySelectorAll('.duo-aba').forEach(x => x.classList.remove('on'));
      [...corpo.children].forEach(x => x.classList.remove('on'));
      b.classList.add('on'); painel.classList.add('on');
    };
    abas.appendChild(b); corpo.appendChild(painel);
  });
  duo.append(abas, corpo);
  return duo;
}

function montarDuos(raiz) {
  /* ── formato A: uma caixa só, com os dois rótulos dentro ───────────── */
  [...raiz.querySelectorAll('.nudge')].forEach(cx => {
    if (!/^NO TERMINAL/i.test(cx.textContent.trim())) return;
    const filhos = [...cx.children];
    const corte = filhos.findIndex(f => /^NO NOTEBOOK/i.test(f.textContent.trim()));
    if (corte < 1) return;
    const rotT = cx.querySelector('.rot');
    const rotN = filhos[corte].textContent.trim();
    if (rotT) rotT.remove();
    const antes = filhos.slice(1, corte).filter(f => f.textContent.trim() || f.tagName === 'PRE');
    const depois = filhos.slice(corte + 1).filter(f => f.textContent.trim() || f.tagName === 'PRE');
    const primeiro = filhos[0];
    if (!primeiro.textContent.trim()) primeiro.remove(); else antes.unshift(primeiro);
    if (!antes.length || !depois.length) return;
    cx.replaceWith(criarDuo([[rotuloDuo('NO TERMINAL'), antes], [rotuloDuo(rotN), depois]]));
  });

  /* ── formato B: parágrafos em negrito, cada um seguido de código ────── */
  const ehMarca = (n, palavra) => n && n.tagName === 'P' &&
    n.children.length === 1 && n.children[0].tagName === 'STRONG' &&
    new RegExp('^NO ' + palavra, 'i').test(n.textContent.trim());
  const juntarPres = n => {
    const out = [];
    while (n && (n.tagName === 'PRE' || n.tagName === 'UL' || n.tagName === 'OL')) {
      out.push(n); n = n.nextElementSibling;
    }
    return [out, n];
  };

  let no = raiz.firstElementChild;
  while (no) {
    const seguinte = no.nextElementSibling;
    if (ehMarca(no, 'TERMINAL')) {
      const rotT = rotuloDuo(no.textContent);
      const [presT, apos] = juntarPres(no.nextElementSibling);
      if (presT.length && ehMarca(apos, 'NOTEBOOK')) {
        const rotN = rotuloDuo(apos.textContent);
        const [presN, fim] = juntarPres(apos.nextElementSibling);
        if (presN.length) {
          const duo = criarDuo([[rotT, presT], [rotN, presN]]);
          no.parentNode.insertBefore(duo, no);
          no.remove(); apos.remove();
          no = fim; continue;
        }
      }
    }
    no = seguinte;
  }
}

/* ── Tabelas roláveis ────────────────────────────────────────────────────
   As tabelas do manual têm muitas colunas. Num telefone elas empurrariam a
   página inteira para o lado; embrulhadas, rolam sozinhas.                  */
function montarTabelas(raiz) {
  raiz.querySelectorAll('table').forEach(t => {
    if (t.closest('.lab, .rolagem')) return;
    const caixa = document.createElement('div');
    caixa.className = 'rolagem-tab';
    t.parentNode.insertBefore(caixa, t);
    caixa.appendChild(t);
  });
}

/* ── Botão de copiar em cada bloco de código ────────────────────────────── */
function montarCopiar(raiz) {
  raiz.querySelectorAll('pre').forEach(pre => {
    if (pre.closest('.lab')) return;
    const caixa = document.createElement('div');
    caixa.className = 'pre-caixa';
    pre.parentNode.insertBefore(caixa, pre);
    caixa.appendChild(pre);
    const b = document.createElement('button');
    b.className = 'copiar'; b.type = 'button'; b.textContent = 'copiar';
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(pre.innerText); }
      catch (e) {
        const t = document.createElement('textarea');
        t.value = pre.innerText; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); } catch (_) { }
        t.remove();
      }
      b.textContent = 'copiado'; b.classList.add('feito');
      setTimeout(() => { b.textContent = 'copiar'; b.classList.remove('feito'); }, 1600);
    };
    caixa.appendChild(b);
  });
}

/* ── Laboratórios ───────────────────────────────────────────────────────── */
function montarLabs(raiz) {
  raiz.querySelectorAll('[data-lab]').forEach(host => {
    const nome = host.dataset.lab;
    host.classList.add('lab');
    if (LABS[nome]) {
      try { LABS[nome](host); }
      catch (e) { host.innerHTML = '<div class="lab-corpo">Não foi possível montar este painel.</div>'; }
    }
  });
}

/* ── Sumário lateral ────────────────────────────────────────────────────── */
function montarSumario(painel) {
  const alvo = document.getElementById('sumario');
  const itens = painel.querySelectorAll('h2, h3');
  alvo.innerHTML = '';
  itens.forEach((h, i) => {
    if (!h.id) h.id = 'sec-' + atual + '-' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'n3';
    a.addEventListener('click', e => {
      e.preventDefault();
      h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', '#' + h.id);
    });
    alvo.appendChild(a);
  });
  observarTitulos(itens);
}

let observador = null;
function observarTitulos(itens) {
  if (typeof IntersectionObserver === 'undefined') return;
  if (observador) observador.disconnect();
  const links = [...document.querySelectorAll('#sumario a')];
  observador = new IntersectionObserver(entradas => {
    entradas.forEach(e => {
      if (e.isIntersecting) {
        const i = [...itens].indexOf(e.target);
        links.forEach(l => l.classList.remove('ativo'));
        if (links[i]) {
          links[i].classList.add('ativo');
          const cx = document.querySelector('aside');
          if (cx && links[i].offsetTop > cx.scrollTop + cx.clientHeight - 40)
            cx.scrollTop = links[i].offsetTop - cx.clientHeight / 2;
        }
      }
    });
  }, { rootMargin: '-140px 0px -72% 0px' });
  itens.forEach(h => observador.observe(h));
}

/* ── Troca de parte ─────────────────────────────────────────────────────── */
function mostrar(i, rolarTopo = true) {
  atual = i;
  const cont = document.getElementById('conteudo');
  cont.innerHTML = (i === 0 ? capaHTML : '') +
    `<div class="painel ativo" id="painel">${PARTES[i].html}</div>`;
  const painel = document.getElementById('painel');
  aplicarNudges(painel);
  montarDuos(painel);
  montarLabs(painel);
  montarTabelas(painel);
  montarCopiar(painel);
  montarSumario(painel);
  montarRodape(painel);
  if (i === 0) montarMudou();

  document.querySelectorAll('.aba').forEach((b, j) =>
    b.setAttribute('aria-selected', j === i ? 'true' : 'false'));
  if (rolarTopo) window.scrollTo({ top: 0, behavior: 'instant' });
  const campo = document.getElementById('campoBusca');
  if (campo.value) buscar();
}

/* ── Atalhos "novo na 1.4" ──────────────────────────────────────────────── */
function montarMudou() {
  const alvo = document.getElementById('mudouLista');
  if (!alvo) return;
  alvo.innerHTML = '';
  MUDOU.forEach(([num, txt, parte]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<b>${num}</b> · ${txt}`;
    b.onclick = () => irPara(parte, num);
    alvo.appendChild(b);
  });
}

/* Vai para uma parte e rola até a seção cujo título começa com `num`. */
function irPara(parte, num) {
  mostrar(parte, true);
  setTimeout(() => {
    const painel = document.getElementById('painel');
    const alvo = [...painel.querySelectorAll('h2, h3')]
      .find(h => h.textContent.trim().replace('·', '').startsWith(num + ' ') ||
        h.textContent.trim().startsWith(num + '.') ||
        h.textContent.trim().startsWith(num + ' '));
    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 90);
}

function montarRodape(painel) {
  const nav = document.createElement('div');
  nav.className = 'rodape-nav';
  const ant = document.createElement('button');
  ant.disabled = atual === 0;
  ant.innerHTML = `<span class="l">Anterior</span><span class="t">${atual > 0 ? CURTO[PARTES[atual - 1].titulo] : '—'}</span>`;
  ant.onclick = () => mostrar(atual - 1);
  const prox = document.createElement('button');
  prox.className = 'dir';
  prox.disabled = atual === PARTES.length - 1;
  prox.innerHTML = `<span class="l">Próxima</span><span class="t">${atual < PARTES.length - 1 ? CURTO[PARTES[atual + 1].titulo] : '—'}</span>`;
  prox.onclick = () => mostrar(atual + 1);
  nav.append(ant, prox);
  painel.appendChild(nav);
}

/* ── Busca dentro da parte visível ──────────────────────────────────────── */
function limparMarcas(raiz) {
  raiz.querySelectorAll('mark').forEach(m => {
    const pai = m.parentNode;
    pai.replaceChild(document.createTextNode(m.textContent), m);
    pai.normalize();
  });
}
function buscar() {
  const termo = document.getElementById('campoBusca').value.trim();
  const painel = document.getElementById('painel');
  if (!painel) return;
  limparMarcas(painel);
  const cont = document.getElementById('contaBusca');
  if (termo.length < 2) { cont.textContent = ''; return; }
  const re = new RegExp('(' + termo.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  const andar = document.createTreeWalker(painel, NodeFilter.SHOW_TEXT);
  const nos = [];
  while (andar.nextNode()) {
    const n = andar.currentNode;
    if (n.parentElement.closest('script, .rot, .lab')) continue;
    if (re.test(n.nodeValue)) nos.push(n);
  }
  nos.forEach(n => {
    const span = document.createElement('span');
    span.innerHTML = n.nodeValue.replace(re, '<mark>$1</mark>');
    n.parentNode.replaceChild(span, n);
  });
  const achados = painel.querySelectorAll('mark');
  cont.textContent = achados.length ? `${achados.length} nesta parte` : 'nada nesta parte';
  if (achados[0] && achados[0].scrollIntoView)
    achados[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ── Inicialização ──────────────────────────────────────────────────────── */
const abas = document.getElementById('abas');
PARTES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'aba'; b.setAttribute('role', 'tab'); b.type = 'button';
  b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  b.textContent = CURTO[p.titulo] || p.titulo;
  b.onclick = () => mostrar(i);
  abas.appendChild(b);
});

document.getElementById('btnTema').onclick = e => {
  const esc = document.documentElement.dataset.tema === 'escuro';
  document.documentElement.dataset.tema = esc ? '' : 'escuro';
  e.target.textContent = esc ? 'Escuro' : 'Claro';
};
document.getElementById('btnImprimir').onclick = () => window.print();
document.getElementById('campoBusca').addEventListener('input', () => {
  clearTimeout(window._t); window._t = setTimeout(buscar, 240);
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' && atual < PARTES.length - 1) mostrar(atual + 1);
  if (e.key === 'ArrowLeft' && atual > 0) mostrar(atual - 1);
  if (e.key === '/') { e.preventDefault(); document.getElementById('campoBusca').focus(); }
});

/* Barra de progresso de leitura. */
const barraProg = document.getElementById('progresso');
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  barraProg.style.width = (h > 0 ? Math.min(100, 100 * window.scrollY / h) : 0) + '%';
}, { passive: true });

mostrar(0);

</script>
</body>
