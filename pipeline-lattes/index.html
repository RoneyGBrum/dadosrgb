/* ═══════════════════════════════════════════════════════════════════════════
   SISTEMA VISUAL
   Azul institucional profundo como cor de autoridade; cobre como acento — a
   mesma dupla da capa impressa. Tudo o mais é grafite neutro, para que a cor
   apareça só onde carrega significado.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --azul:#1B365D; --azul-2:#2C5282; --azul-claro:#EEF2F8;
  --cobre:#B05A22; --cobre-claro:#FBF0E8;
  --verde:#1F6B4A; --verde-claro:#EBF5F0;
  --roxo:#5B4B8A;  --roxo-claro:#F2EFF8;
  --teal:#14607A;  --teal-claro:#E9F3F7;

  --bg:#FFFFFF; --bg-2:#FAFAFB; --bg-3:#F3F4F6;
  --tinta:#1A1D23; --tinta-2:#4A5058; --tinta-3:#868D96;
  --linha:#E5E7EB; --linha-2:#EFF0F2;
  --sombra-s:0 1px 2px rgba(16,24,40,.04);
  --sombra-m:0 4px 16px rgba(16,24,40,.07);
  --sombra-g:0 12px 40px rgba(16,24,40,.10);
  --raio:12px;
  --topo:126px;
}
[data-tema="escuro"]{
  --bg:#0D0F12; --bg-2:#14171C; --bg-3:#1C2027;
  --tinta:#F0F2F5; --tinta-2:#A6ACB6; --tinta-3:#6B7280;
  --linha:#242931; --linha-2:#1C2027;
  --azul:#7FA3D4; --azul-2:#9DBBE4; --azul-claro:#161E2B;
  --cobre:#E08B4C; --cobre-claro:#241A12;
  --verde:#57B187; --verde-claro:#12211A;
  --roxo:#A08FD0;  --roxo-claro:#1B1726;
  --teal:#5AA9C4;  --teal-claro:#12212A;
  --sombra-s:0 1px 2px rgba(0,0,0,.3);
  --sombra-m:0 4px 16px rgba(0,0,0,.4);
  --sombra-g:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
  font-size:16px; line-height:1.62;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .35s ease,color .35s ease;
}
::selection{background:var(--azul);color:#fff}

/* ── BARRA SUPERIOR ──────────────────────────────────────────────────────── */
header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:var(--bg);                       /* fallback: navegadores antigos */
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--linha);
}
.marca{max-width:1160px;margin:0 auto;padding:13px 28px 0;
  display:flex;align-items:center;justify-content:space-between;gap:18px}
.marca-esq{display:flex;align-items:baseline;gap:13px;min-width:0}
.titulo{font-size:16.5px;font-weight:650;letter-spacing:-.021em;white-space:nowrap}
.orgs{font-size:11px;color:var(--tinta-3);letter-spacing:.1em;font-weight:600;
  white-space:nowrap;padding-left:13px;border-left:1px solid var(--linha)}
.ferramentas{display:flex;gap:7px;align-items:center}
.ferr{background:transparent;border:1px solid var(--linha);color:var(--tinta-2);
  border-radius:99px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer;
  transition:.18s;white-space:nowrap}
.ferr:hover{background:var(--bg-3);color:var(--tinta);border-color:var(--tinta-3)}
.ferr:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* ── ABAS ────────────────────────────────────────────────────────────────── */
nav{max-width:1160px;margin:0 auto;padding:0 28px;
  display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.aba{
  background:none;border:none;font:inherit;font-size:13.5px;font-weight:520;
  color:var(--tinta-3); padding:14px 15px 13px; cursor:pointer;
  border-bottom:2.5px solid transparent; white-space:nowrap;
  transition:color .18s,border-color .18s;
}
.aba:hover{color:var(--tinta-2)}
.aba[aria-selected="true"]{color:var(--azul);border-bottom-color:var(--azul);font-weight:620}
.aba:focus-visible{outline:2px solid var(--azul);outline-offset:-3px;border-radius:5px}

/* ── LAYOUT ──────────────────────────────────────────────────────────────── */
main{max-width:1160px;margin:0 auto;padding:calc(var(--topo) + 26px) 28px 96px;
  display:grid;grid-template-columns:1fr 232px;gap:52px;align-items:start}
.conteudo{min-width:0}

/* sumário lateral */
aside{position:sticky;top:calc(var(--topo) + 26px);max-height:calc(100vh - var(--topo) - 60px);
  overflow-y:auto;font-size:12.5px;scrollbar-width:thin}
aside .rot{font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--tinta-3);font-weight:700;margin-bottom:11px}
aside a{display:block;color:var(--tinta-2);text-decoration:none;padding:5px 0 5px 12px;
  border-left:2px solid var(--linha);line-height:1.4;transition:.15s}
aside a:hover{color:var(--tinta);border-left-color:var(--tinta-3)}
aside a.n3{padding-left:24px;font-size:11.5px;color:var(--tinta-3)}
aside a.ativo{color:var(--azul);border-left-color:var(--azul);font-weight:600}

/* ── CAPA ────────────────────────────────────────────────────────────────── */
.capa{text-align:center;padding:64px 0 78px;border-bottom:1px solid var(--linha);
  margin-bottom:46px}
.capa .inst{font-size:12px;letter-spacing:.18em;color:var(--tinta-3);font-weight:650}
.capa .inst-sub{font-size:11.5px;color:var(--tinta-3);margin-top:7px;line-height:1.7}
.capa h1{font-size:clamp(40px,6.4vw,68px);font-weight:700;letter-spacing:-.035em;
  line-height:1.02;margin:38px 0 16px;color:var(--azul)}
.capa .lead{font-size:18px;color:var(--tinta-2);max-width:32ch;margin:0 auto;line-height:1.5}
.regua{width:64px;height:2.5px;background:var(--cobre);margin:30px auto;border-radius:2px}
.capa .meta{font-size:12.5px;color:var(--tinta-3);letter-spacing:.05em}
.rgb{margin-top:44px;font-size:9.5px;letter-spacing:.32em;color:var(--tinta-3);opacity:.42}

/* ── TIPOGRAFIA DO CONTEÚDO ──────────────────────────────────────────────── */
.conteudo h1{font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cobre);font-weight:700;margin:0 0 6px;padding-bottom:0;border:none}
.conteudo h2{font-size:29px;font-weight:660;letter-spacing:-.024em;line-height:1.2;
  margin:56px 0 6px;padding-top:20px;border-top:1px solid var(--linha);scroll-margin-top:calc(var(--topo) + 18px)}
.conteudo h2:first-of-type{margin-top:14px;border-top:none;padding-top:0}
.conteudo h3{font-size:18px;font-weight:640;letter-spacing:-.015em;margin:36px 0 10px;
  color:var(--azul);scroll-margin-top:calc(var(--topo) + 18px)}
.conteudo h4{font-size:15px;font-weight:650;margin:26px 0 8px;color:var(--tinta)}
.conteudo p{margin:0 0 15px;max-width:74ch}
.conteudo em{color:var(--tinta-2)}
.conteudo strong{font-weight:640}
.conteudo hr{border:none;border-top:1px solid var(--linha);margin:44px 0}
.conteudo ul,.conteudo ol{margin:0 0 17px 21px;max-width:72ch}
.conteudo li{margin-bottom:6px}
.conteudo a{color:var(--azul-2)}

/* código */
code{font-family:"SF Mono",ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,monospace;
  font-size:.875em;background:var(--bg-3);padding:2px 6px;border-radius:5px;
  color:var(--cobre);word-break:break-word}
pre{background:var(--bg-2);border:1px solid var(--linha);border-radius:var(--raio);
  padding:17px 19px;overflow-x:auto;margin:0 0 19px;box-shadow:var(--sombra-s);
  line-height:1.58}
pre code{background:none;padding:0;color:var(--tinta);font-size:12.9px}
[data-tema="escuro"] pre{background:#0A0C0F}

/* tabelas */
.conteudo table{width:100%;border-collapse:collapse;margin:8px 0 24px;font-size:14.2px;
  border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;
  box-shadow:var(--sombra-s)}
.conteudo th{background:var(--bg-3);text-align:left;padding:11px 15px;font-weight:640;
  font-size:12.5px;color:var(--tinta-2);border-bottom:1px solid var(--linha)}
.conteudo td{padding:11px 15px;border-bottom:1px solid var(--linha-2);vertical-align:top}
.conteudo tbody tr:last-child td{border-bottom:none}
.conteudo tbody tr:hover{background:var(--bg-2)}

/* ── NUDGES ──────────────────────────────────────────────────────────────── */
/* Cada caixa tem um papel didático próprio; a cor é o atalho de leitura. */
.nudge{border-left:3px solid var(--azul);background:var(--azul-claro);
  border-radius:0 var(--raio) var(--raio) 0;padding:15px 19px;margin:20px 0;
  max-width:76ch}
.nudge > p{margin-bottom:9px}
.nudge > p:last-child{margin-bottom:0}
.nudge .rot{display:inline-block;font-size:10px;letter-spacing:.13em;font-weight:750;
  text-transform:uppercase;color:var(--azul);margin-right:9px;vertical-align:1px}
.nudge pre{background:var(--bg);margin:9px 0}
.nudge pre{background:color-mix(in srgb,var(--bg) 60%,transparent)}
.nudge table{margin:9px 0;background:var(--bg)}
.n-frase{border-color:var(--azul);background:var(--azul-claro)}
.n-frase .rot{color:var(--azul)}
.n-analogia{border-color:var(--roxo);background:var(--roxo-claro)}
.n-analogia .rot{color:var(--roxo)}
.n-pratica{border-color:var(--verde);background:var(--verde-claro)}
.n-pratica .rot{color:var(--verde)}
.n-atencao{border-color:var(--cobre);background:var(--cobre-claro)}
.n-atencao .rot{color:var(--cobre)}
.n-confira{border-color:var(--teal);background:var(--teal-claro)}
.n-confira .rot{color:var(--teal)}
.n-lembre{border-color:var(--tinta-3);background:var(--bg-3)}
.n-lembre .rot{color:var(--tinta-2)}

/* ── PAINÉIS ─────────────────────────────────────────────────────────────── */
.painel{display:none;animation:entra .38s cubic-bezier(.16,1,.3,1)}
.painel.ativo{display:block}
@keyframes entra{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* navegação inferior */
.rodape-nav{display:flex;justify-content:space-between;gap:14px;margin-top:62px;
  padding-top:26px;border-top:1px solid var(--linha)}
.rodape-nav button{background:var(--bg-2);border:1px solid var(--linha);border-radius:var(--raio);
  padding:14px 19px;font:inherit;cursor:pointer;text-align:left;color:var(--tinta);
  transition:.18s;max-width:47%;box-shadow:var(--sombra-s)}
.rodape-nav button:hover{border-color:var(--azul);box-shadow:var(--sombra-m);transform:translateY(-1px)}
.rodape-nav button:disabled{opacity:.32;cursor:default;transform:none;box-shadow:none;border-color:var(--linha)}
.rodape-nav .dir{text-align:right;margin-left:auto}
.rodape-nav .l{display:block;font-size:10.5px;color:var(--tinta-3);letter-spacing:.1em;
  text-transform:uppercase;font-weight:650;margin-bottom:3px}
.rodape-nav .t{font-size:14px;font-weight:590}

footer{border-top:1px solid var(--linha);padding:32px 0 62px;margin-top:52px;
  color:var(--tinta-3);font-size:12.5px;text-align:center}

/* ── BUSCA NO DOCUMENTO ──────────────────────────────────────────────────── */
.busca{position:relative}
#campoBusca{background:var(--bg-2);border:1px solid var(--linha);border-radius:99px;
  padding:6px 14px;font:inherit;font-size:12.5px;color:var(--tinta);width:168px;
  transition:.2s}
#campoBusca:focus{outline:none;border-color:var(--azul);width:212px;background:var(--bg)}
#campoBusca::placeholder{color:var(--tinta-3)}
mark{background:#FEF3C7;color:#78350F;padding:1px 2px;border-radius:3px}
[data-tema="escuro"] mark{background:#78350F;color:#FEF3C7}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}}
@media(max-width:1000px){
  main{grid-template-columns:1fr;gap:0}
  aside{display:none}
}
@media(max-width:640px){
  :root{--topo:118px}
  main{padding-left:18px;padding-right:18px}
  .marca{padding:11px 18px 0}
  nav{padding:0 18px}
  .orgs{display:none}
  #campoBusca{width:120px}
  .conteudo h2{font-size:24px}
  .conteudo table{font-size:13px}
  .rodape-nav{flex-direction:column}
  .rodape-nav button{max-width:100%}
  .rodape-nav .dir{text-align:left;margin-left:0}
}
@media print{
  header,aside,.rodape-nav,.ferramentas{display:none}
  main{display:block;padding:0;max-width:none}
  .painel{display:block!important}
  .nudge{break-inside:avoid}
}

/* ═══════════════════════════════════════════════════════════════════════════
   LABORATÓRIOS INTERATIVOS
   Cada "lab" é uma peça que só existe no HTML: o mesmo conteúdo do Word,
   mas manipulável. A regra visual é a mesma do resto do documento — azul
   institucional para estrutura, cobre para o que exige atenção.
   ═══════════════════════════════════════════════════════════════════════════ */
.lab{
  scroll-margin-top:calc(var(--topo) + 22px);
  border:1px solid var(--linha); border-radius:var(--raio);
  background:var(--bg-2); margin:26px 0 30px; overflow:hidden;
  box-shadow:var(--sombra-m);
}
.lab-topo{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:13px 19px; border-bottom:1px solid var(--linha);
  background:var(--bg-3);
}
.lab-selo{
  font-size:9.5px; letter-spacing:.15em; font-weight:750; text-transform:uppercase;
  color:#fff; background:var(--azul); padding:3px 8px; border-radius:99px;
}
.lab-tit{font-size:14px;font-weight:640;letter-spacing:-.01em}
.lab-sub{font-size:12px;color:var(--tinta-3);margin-left:auto}
.lab-corpo{padding:19px}
.lab-nota{font-size:12.5px;color:var(--tinta-2);margin-top:14px;line-height:1.55}
.lab-nota b{color:var(--tinta)}

/* ── controles ──────────────────────────────────────────────────────────── */
.ctrl{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;margin-bottom:18px}
.ctrl-item{flex:1 1 200px;min-width:170px}
.ctrl-rot{display:flex;justify-content:space-between;align-items:baseline;
  font-size:11.5px;color:var(--tinta-2);margin-bottom:6px;font-weight:560}
.ctrl-val{font-family:"SF Mono",ui-monospace,monospace;font-size:12.5px;
  color:var(--azul);font-weight:650;font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;
  background:var(--linha);outline:none;cursor:pointer
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;
  background:var(--azul);border:2.5px solid var(--bg);box-shadow:var(--sombra-s);cursor:grab
}
input[type=range]::-moz-range-thumb{
  width:17px;height:17px;border-radius:50%;background:var(--azul);
  border:2.5px solid var(--bg);box-shadow:var(--sombra-s);cursor:grab;border-color:var(--bg)
}
input[type=range]:focus-visible{outline:2px solid var(--azul);outline-offset:4px}

.btn{background:var(--bg);border:1px solid var(--linha);color:var(--tinta);
  border-radius:99px;padding:7px 15px;font:inherit;font-size:12.5px;cursor:pointer;
  transition:.16s;font-weight:560;white-space:nowrap}
.btn:hover{border-color:var(--azul);color:var(--azul)}
.btn:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.btn.on{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.acento{background:var(--cobre);border-color:var(--cobre);color:#fff}
.btn.acento:hover{filter:brightness(1.08);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn-linha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ── chips de resultado ─────────────────────────────────────────────────── */
.chip{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.02em;
  padding:2.5px 9px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--verde-claro);color:var(--verde)}
.chip.amb{background:var(--cobre-claro);color:var(--cobre)}
.chip.ind{background:var(--bg-3);color:var(--tinta-3)}
.chip.neutro{background:var(--azul-claro);color:var(--azul)}

/* ── barras de proporção ────────────────────────────────────────────────── */
.barras{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.barra{flex:1 1 150px;min-width:130px}
.barra-rot{display:flex;justify-content:space-between;font-size:11.5px;
  color:var(--tinta-2);margin-bottom:5px}
.barra-rot b{font-variant-numeric:tabular-nums;font-size:13px}
.barra-tri{height:7px;border-radius:99px;background:var(--linha);overflow:hidden}
.barra-tri i{display:block;height:100%;border-radius:99px;transition:width .35s cubic-bezier(.16,1,.3,1)}

/* ── tabela viva ────────────────────────────────────────────────────────── */
.lab table{width:100%;border-collapse:collapse;font-size:13px;margin:0}
.lab th{text-align:left;padding:8px 11px;font-size:11px;font-weight:680;
  color:var(--tinta-3);text-transform:uppercase;letter-spacing:.06em;
  border-bottom:1px solid var(--linha)}
.lab td{padding:9px 11px;border-bottom:1px solid var(--linha-2);vertical-align:middle}
.lab tbody tr:last-child td{border-bottom:none}
.lab tr.destaque td{background:var(--azul-claro)}
.lab .num{font-family:"SF Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
  font-size:12.5px}
.lab .apagado{opacity:.4}
.lab .rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ── plano cartesiano (normalização) ────────────────────────────────────── */
.plano{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:24px;align-items:start}
@media(max-width:720px){.plano{grid-template-columns:1fr}}
.plano svg{width:100%;height:auto;display:block;
  background:var(--bg);border:1px solid var(--linha);border-radius:var(--raio)}
.plano .legenda{font-size:12px;color:var(--tinta-2);line-height:1.75}
.plano .legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;
  margin-right:7px;vertical-align:-1px}
.seta{transition:all .5s cubic-bezier(.16,1,.3,1)}

/* ── matriz bloco × taxonomia ───────────────────────────────────────────── */
.matriz{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.matriz th{padding:9px 8px;font-size:11px;text-align:center;color:var(--tinta-2);
  font-weight:680;letter-spacing:.04em}
.matriz th.bl{text-align:left;padding-left:12px}
.matriz td{text-align:center;padding:0;border-top:1px solid var(--linha-2)}
.matriz td.bl{text-align:left;padding:10px 12px;font-weight:580;font-size:13px}
.cel{
  width:100%;height:100%;min-height:40px;border:none;background:none;cursor:pointer;
  font:inherit;font-size:16px;color:var(--verde);transition:.15s;padding:10px 4px;
  border-radius:7px
}
.cel.vazia{color:var(--tinta-3);opacity:.5;font-size:14px}
.cel:hover{background:var(--azul-claro);transform:scale(1.06)}
.cel.sel{background:var(--azul);color:#fff}
.cel.vazia.sel{background:var(--cobre);color:#fff;opacity:1}
.cel:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
.matriz tr.linha-sel td{background:var(--bg-3)}
.explica{
  margin-top:18px;border-left:3px solid var(--azul);background:var(--azul-claro);
  border-radius:0 var(--raio) var(--raio) 0;padding:15px 18px;font-size:13.5px;
  line-height:1.62;min-height:96px
}
.explica.ausente{border-color:var(--cobre);background:var(--cobre-claro)}
.explica h5{font-size:13px;font-weight:700;margin:0 0 7px;letter-spacing:-.01em}
.explica .ex{font-family:"SF Mono",ui-monospace,monospace;font-size:11.8px;
  background:var(--bg);border:1px solid var(--linha);border-radius:8px;
  padding:9px 11px;margin-top:10px;white-space:pre-wrap;line-height:1.5;color:var(--tinta-2)}

/* ── passo a passo ──────────────────────────────────────────────────────── */
.passos{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.passo-b{flex:1 1 0;min-width:60px;background:var(--bg);border:1px solid var(--linha);
  border-radius:9px;padding:9px 6px;font:inherit;font-size:11px;cursor:pointer;
  color:var(--tinta-3);transition:.16s;text-align:center;font-weight:600}
.passo-b:hover{border-color:var(--azul-2);color:var(--tinta-2)}
.passo-b.on{background:var(--azul);border-color:var(--azul);color:#fff}
.passo-b .n{display:block;font-size:15px;font-weight:700;margin-bottom:2px}
.passo-corpo{background:var(--bg);border:1px solid var(--linha);border-radius:var(--raio);
  padding:17px 19px;min-height:190px;font-size:13.5px;line-height:1.62}
.passo-corpo h5{font-size:13.5px;font-weight:680;margin:0 0 9px;color:var(--azul)}
.passo-corpo pre{margin:10px 0 0;font-size:12px;background:var(--bg-2)}
.passo-corpo p{margin:0 0 10px}
.passo-corpo p:last-child{margin-bottom:0}

/* ── fluxo das etapas ───────────────────────────────────────────────────── */
.fluxo{display:flex;gap:9px;align-items:stretch;flex-wrap:wrap}
.et{flex:1 1 130px;min-width:120px;background:var(--bg);border:1px solid var(--linha);
  border-radius:var(--raio);padding:14px 13px;cursor:pointer;transition:.18s;text-align:left;
  font:inherit;color:var(--tinta);position:relative}
.et:hover{border-color:var(--azul);transform:translateY(-2px);box-shadow:var(--sombra-m)}
.et.on{border-color:var(--azul);background:var(--azul-claro);box-shadow:var(--sombra-m)}
.et .n{font-size:10px;letter-spacing:.14em;font-weight:750;color:var(--tinta-3)}
.et.on .n{color:var(--azul)}
.et .t{font-size:13.5px;font-weight:650;margin:5px 0 4px;letter-spacing:-.01em}
.et .d{font-size:11.5px;color:var(--tinta-3);line-height:1.45}

/* ── abas terminal / notebook ───────────────────────────────────────────── */
.duo{border:1px solid var(--linha);border-radius:var(--raio);overflow:hidden;
  margin:20px 0;background:var(--bg-2)}
.duo-abas{display:flex;gap:0;background:var(--bg-3);border-bottom:1px solid var(--linha)}
.duo-aba{flex:0 0 auto;background:none;border:none;font:inherit;font-size:12px;
  font-weight:620;padding:10px 17px;cursor:pointer;color:var(--tinta-3);
  border-bottom:2px solid transparent;transition:.15s;letter-spacing:.02em}
.duo-aba:hover{color:var(--tinta-2)}
.duo-aba.on{color:var(--azul);border-bottom-color:var(--azul)}
.duo-aba:focus-visible{outline:2px solid var(--azul);outline-offset:-3px}
.duo-corpo{padding:0}
.duo-corpo pre{margin:0;border:none;border-radius:0;box-shadow:none;background:var(--bg-2)}
[data-tema="escuro"] .duo-corpo pre{background:#0A0C0F}
.duo-corpo > div{display:none}
.duo-corpo > div.on{display:block}

/* ── copiar código ──────────────────────────────────────────────────────── */
.pre-caixa{position:relative}
.copiar{position:absolute;top:8px;right:8px;background:var(--bg);border:1px solid var(--linha);
  color:var(--tinta-3);border-radius:7px;padding:3.5px 9px;font:inherit;font-size:10.5px;
  cursor:pointer;opacity:0;transition:.16s;font-weight:620;letter-spacing:.03em}
.pre-caixa:hover .copiar{opacity:1}
.copiar:hover{color:var(--azul);border-color:var(--azul)}
.copiar:focus-visible{opacity:1;outline:2px solid var(--azul);outline-offset:1px}
.copiar.feito{color:var(--verde);border-color:var(--verde)}

/* ── barra de progresso de leitura ──────────────────────────────────────── */
#progresso{position:fixed;top:0;left:0;height:2.5px;background:var(--cobre);
  width:0;z-index:200;transition:width .1s linear}

/* ── painel "o que mudou" na capa ───────────────────────────────────────── */
.mudou{margin:44px auto 0;max-width:760px;text-align:left;
  border:1px solid var(--linha);border-radius:var(--raio);background:var(--bg-2);
  padding:20px 22px}
.mudou h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--cobre);
  font-weight:750;margin:0 0 4px}
.mudou p{font-size:13px;color:var(--tinta-2);margin:0 0 14px;line-height:1.6}
.mudou-lista{display:flex;flex-wrap:wrap;gap:7px}
.mudou-lista button{background:var(--bg);border:1px solid var(--linha);border-radius:99px;
  padding:6px 13px;font:inherit;font-size:12px;cursor:pointer;color:var(--tinta-2);
  transition:.15s}
.mudou-lista button:hover{border-color:var(--azul);color:var(--azul);
  transform:translateY(-1px);box-shadow:var(--sombra-s)}
.mudou-lista button b{color:var(--azul);font-weight:680}

/* ── nudge terminal/notebook ────────────────────────────────────────────── */
.n-terminal{border-color:var(--tinta-2);background:var(--bg-3)}
.n-terminal .rot{color:var(--tinta-2)}

@media(max-width:640px){
  .lab-corpo{padding:15px}
  .lab-sub{display:none}
  .matriz th{font-size:9.5px;padding:7px 3px}
  .matriz td.bl{font-size:12px;padding:8px}
  .cel{font-size:14px;min-height:34px}
}
@media print{
  .lab,.duo-abas,.copiar,#progresso,.mudou{display:none}
  .duo-corpo > div{display:block!important}
}

/* ── correções de especificidade sobre a folha base ─────────────────────── */
.conteudo .capa h1{
  font-size:clamp(40px,6.4vw,68px);font-weight:700;letter-spacing:-.035em;
  line-height:1.02;margin:38px 0 16px;color:var(--azul);
  text-transform:none;border:none;padding:0
}
.conteudo .capa p.lead{font-size:18px;color:var(--tinta-2);max-width:32ch;
  margin:0 auto;line-height:1.5}
.conteudo .capa{padding-bottom:56px}

/* ── tabelas do texto: rolagem própria em telas estreitas ───────────────── */
.rolagem-tab{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0 24px;
  max-width:100%}
.rolagem-tab > table{margin:0}
@media(max-width:640px){
  .rolagem-tab > table{min-width:520px}
  .conteudo pre{font-size:11.5px}
}

figure.captura{margin:1.2em 0;text-align:center}figure.captura img{max-width:100%;height:auto;border:1px solid #d0d5dd;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.08)}figure.captura figcaption{font-size:.9em;color:#555;margin-top:.4em}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CONTEÚDO — o manual inteiro embutido, idêntico ao documento em Word.
   Arquivo único, offline, sem servidor e sem CDN.

const PARTES = [{"titulo": "Como ler este manual", "html": "<h1 id=\"como-ler-este-manual\">Como ler este manual</h1>\n<p>Este documento é ao mesmo tempo um <strong>guia de instalação</strong>, um <strong>manual de operação</strong> e a <strong>documentação técnica</strong> do sistema. Você não precisa lê-lo inteiro para começar.</p>\n<h2 id=\"escolha-o-seu-caminho\">Escolha o seu caminho</h2>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Se você quer…</th>\n<th>Vá direto para</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Entender o que o sistema faz, sem detalhe técnico</td>\n<td><strong>Parte I</strong> — seções 1 a 3</td>\n</tr>\n<tr class=\"even\">\n<td>Entender o mecanismo por dentro, com a matemática</td>\n<td><strong>Parte I</strong> — seções 4 a 7</td>\n</tr>\n<tr class=\"odd\">\n<td>Instalar e rodar hoje</td>\n<td><strong>Parte II</strong> — seções 8 a 15</td>\n</tr>\n<tr class=\"even\">\n<td>Trabalhar pelo Jupyter Notebook em vez do terminal</td>\n<td><strong>Parte II</strong> — seção 11</td>\n</tr>\n<tr class=\"odd\">\n<td>Operar por uma janela com botões, sem terminal</td>\n<td><strong>Parte II</strong> — seção 15.4</td>\n</tr>\n<tr class=\"odd\">\n<td>Saber o que cada etapa faz por dentro</td>\n<td><strong>Parte III</strong> — seções 16 a 19</td>\n</tr>\n<tr class=\"even\">\n<td>Ajustar o comportamento do sistema</td>\n<td><strong>Parte IV</strong> — seções 20 e 21</td>\n</tr>\n<tr class=\"odd\">\n<td>Adaptar para outra área ou resolver um problema</td>\n<td><strong>Parte V</strong> — seções 22 a 27</td>\n</tr>\n<tr class=\"even\">\n<td>Saber o que mudou desde a versão anterior</td>\n<td><strong>Parte V</strong> — seções 28 a 30</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"as-cinco-partes\">As cinco partes</h2>\n<p><strong>Parte I — Entender.</strong> O problema, o mecanismo de classificação e por que a glosa é a peça central.</p>\n<p><strong>Parte II — Instalar e usar.</strong> Ambiente virtual, GPU, Ollama, assistente de glosas, Jupyter, primeiros comandos e o Assistente — a janela única que dispara tudo isso por botões.</p>\n<p><strong>Parte III — As etapas em detalhe.</strong> Cada uma das quatro etapas: o que faz, o que entra, o que sai, o que o código faz.</p>\n<p><strong>Parte IV — Calibrar.</strong> Todos os números ajustáveis, com o efeito de aumentar ou diminuir cada um.</p>\n<p><strong>Parte V — Adaptar e operar.</strong> Trocar de área, estrutura do código, problemas comuns, decisões pendentes e o registro do que mudou nesta versão.</p>\n<h2 id=\"os-avisos-que-aparecem-ao-longo-do-texto\">Os avisos que aparecem ao longo do texto</h2>\n<p>Ao longo do manual você encontrará caixas destacadas. Cada uma tem um papel:</p>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — o resumo da seção, para quem tem pressa.</p>\n<p><strong>ANALOGIA</strong> — uma comparação do cotidiano, quando o conceito é abstrato.</p>\n<p><strong>NA PRÁTICA</strong> — um exemplo concreto, com números reais.</p>\n<p><strong>ATENÇÃO</strong> — uma armadilha conhecida. Vale ler mesmo se estiver pulando o resto.</p>\n<p><strong>CONFIRA</strong> — como verificar, na sua máquina, se aquilo deu certo.</p>\n<p><strong>LEMBRE-SE</strong> — um ponto já dito antes, repetido porque é fácil de esquecer.</p>\n<p><strong>NO TERMINAL / NO NOTEBOOK</strong> — o mesmo comando nas duas formas de operar.</p>\n</blockquote>\n<h2 id=\"duas-formas-de-operar-terminal-e-notebook\">Duas formas de operar: terminal e notebook</h2>\n<p>Tudo neste manual pode ser feito de dois jeitos, e os dois produzem exatamente o mesmo resultado — são a mesma função Python, chamada de lugares diferentes.</p>\n<p><strong>Pelo terminal (PowerShell).</strong> É o modo de produção: um comando, o pipeline roda do começo ao fim, grava os arquivos e devolve o controle. É o que se agenda, o que se repete, o que se documenta num procedimento.</p>\n<p><strong>Pelo Jupyter Notebook.</strong> É o modo de inspeção: cada etapa vira uma célula, e o resultado intermediário fica na memória, disponível para você abrir, filtrar e conferir antes de seguir. É o modo de quem está calibrando, investigando um resultado estranho ou aprendendo o sistema.</p>\n<p>Sempre que houver diferença, o manual mostra os dois caminhos lado a lado, com esta marcação:</p>\n<blockquote>\n<p><strong>NO TERMINAL</strong> — o comando do PowerShell.</p>\n<p><strong>NO NOTEBOOK</strong> — a célula equivalente, em Python.</p>\n</blockquote>\n<p>A seção 11 reúne tudo o que é específico do notebook — registro do kernel, execução etapa a etapa e as armadilhas próprias desse ambiente.</p>\n<p>Há ainda uma <strong>terceira porta</strong>, que não é um terceiro modo: o Assistente (15.4) monta e dispara os mesmos comandos do terminal por botões, e mostra na tela o comando exato antes de rodar. Quem prefere não digitar começa por ele.</p>"}, {"titulo": "PARTE I — ENTENDER", "html": "<h1 id=\"parte-i-entender\">PARTE I — ENTENDER</h1>\n<p><em>O problema, o mecanismo e a peça central do sistema.</em></p>\n<h2 id=\"o-que-este-sistema-faz\">1. O que este sistema faz</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Ele lê currículos Lattes, atribui categorias de um dicionário que você controla, e conta.</p>\n</blockquote>\n<p>O sistema responde a uma pergunta:</p>\n<blockquote>\n<p><strong>“Em que este pesquisador atua, e quanto do trabalho dele está ali?”</strong></p>\n</blockquote>\n<p>Ele lê cada pedaço do currículo, atribui categorias de um dicionário que você controla, e conta. Ao final, condensa cada currículo num vetor — uma representação numérica do seu significado — que fica gravado nos resultados para uso posterior.</p>\n<h3 id=\"o-que-ele-não-faz\">O que ele não faz</h3>\n<p>Não classifica pessoas, classifica <strong>textos</strong>. Não emite juízo de valor, não pontua, não ranqueia. Entrega contagem e categoria; a interpretação é humana.</p>\n<h2 id=\"por-que-não-basta-buscar-por-palavra-chave\">2. Por que não basta buscar por palavra-chave</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Buscar palavras perde sinônimos e confunde homônimos; comparar significado resolve os dois.</p>\n</blockquote>\n<p>A abordagem tradicional — procurar termos no texto — erra de dois jeitos opostos.</p>\n<p><strong>Perde quem deveria achar.</strong> Você procura <em>“soldagem”</em> e não encontra quem escreveu <em>“união de metais por fusão”</em>. É a mesma coisa, com outras palavras.</p>\n<p><strong>Traz quem não deveria.</strong> Você procura <em>“rede”</em> e recebe rede neural, rede elétrica, rede social e rede de pesca.</p>\n<p>Este sistema compara <strong>significado</strong>, não letras. Texto do currículo e texto da categoria viram vetores — listas de números que representam sentido — e a proximidade entre eles mede a semelhança real.</p>\n<h2 id=\"as-quatro-etapas-e-o-vocabulário-do-sistema\">3. As quatro etapas e o vocabulário do sistema</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Quatro etapas em fila; e quatro palavras — bloco, eixo, categoria e glosa — que voltam em todas as páginas seguintes.</p>\n</blockquote>\n<h3 id=\"o-caminho-dos-dados\">3.1 · O caminho dos dados</h3>\n<div data-lab=\"etapas\">\n\n</div>\n<pre><code>   você deposita              o sistema entrega\n   os dados aqui              os resultados aqui\n        │                            ▲\n        ▼                            │\n   ┌─────────┐  ┌──────────┐  ┌──────────┐  ┌───────────┐\n   │ 1       │→ │ 2        │→ │ 3        │→ │ 4         │\n   │ INGESTÃO│  │CLASSIFI- │  │QUANTIFI- │  │VETORIZA-  │\n   │         │  │CAÇÃO     │  │CAÇÃO     │  │ÇÃO        │\n   └─────────┘  └──────────┘  └──────────┘  └───────────┘\n   arruma a     coloca        conta os      condensa num\n   casa         rótulos       rótulos       vetor</code></pre>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 24%\" />\n<col style=\"width: 24%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Etapa</th>\n<th style=\"text-align: left;\">Entra</th>\n<th style=\"text-align: left;\">Sai</th>\n<th style=\"text-align: left;\">Tempo aproximado*</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">1 · Ingestão</td>\n<td style=\"text-align: left;\">XML/ZIP/CSV</td>\n<td style=\"text-align: left;\">10 tabelas</td>\n<td style=\"text-align: left;\">segundos a minutos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">2 · Classificação</td>\n<td style=\"text-align: left;\">tabelas + dicionário</td>\n<td style=\"text-align: left;\">rótulos</td>\n<td style=\"text-align: left;\">a mais demorada</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">3 · Quantificação</td>\n<td style=\"text-align: left;\">rótulos</td>\n<td style=\"text-align: left;\">contagens</td>\n<td style=\"text-align: left;\">segundos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">4 · Vetorização</td>\n<td style=\"text-align: left;\">tudo</td>\n<td style=\"text-align: left;\">vetor por currículo</td>\n<td style=\"text-align: left;\">minutos</td>\n</tr>\n</tbody>\n</table>\n<p>* Para 10 mil currículos, com placa de vídeo. A etapa 2 domina o tempo total.</p>\n<h3 id=\"quatro-palavras-que-voltam-o-tempo-todo\">3.2 · Quatro palavras que voltam o tempo todo</h3>\n<p>Quase toda a documentação seguinte usa estas quatro palavras. Vale fixá-las agora — sobretudo <strong>bloco</strong>, que é a unidade de trabalho do sistema inteiro.</p>\n<p><strong>BLOCO — um pedaço do currículo, tratado como unidade de análise.</strong></p>\n<p>Um currículo Lattes não é um texto só: é um conjunto de seções de naturezas muito diferentes. O resumo é prosa autoral; a formação é uma lista de cursos; a produção técnica é uma lista de títulos de patente. Misturar tudo num texto só apagaria essas diferenças. O sistema, por isso, trata cada seção separadamente — e cada uma dessas seções é um <strong>bloco</strong>.</p>\n<p>No domínio “indústria” existem sete blocos: resumo, formação, atuação, produção técnica, publicações, projetos e áreas declaradas.</p>\n<p>Um bloco não é apenas um nome. Ele é uma declaração com cinco informações, escrita em <code>dominios/&lt;área&gt;/blocos.py</code>:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>O bloco declara</th>\n<th>Significa</th>\n<th>Exemplo (bloco “atuação”)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>tabela</code></td>\n<td>de qual das dez tabelas da etapa 1 as linhas vêm</td>\n<td><code>atuacao</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>texto</code></td>\n<td>qual função monta o texto a classificar</td>\n<td>junta instituição + cargo + atividades</td>\n</tr>\n<tr class=\"odd\">\n<td><code>texto_longo</code></td>\n<td>se aquele texto é prosa (<code>True</code>) ou título curto (<code>False</code>)</td>\n<td><code>True</code></td>\n</tr>\n<tr class=\"even\">\n<td><code>eixos</code></td>\n<td>contra quais taxonomias esse texto será cruzado</td>\n<td>setor, competência, tecnologia, maturidade</td>\n</tr>\n<tr class=\"odd\">\n<td><code>porque</code></td>\n<td>a justificativa da escolha, registrada no próprio código</td>\n<td>“onde a experiência prática aparece”</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ANALOGIA</strong> — Pense num formulário de papel com sete campos. Cada campo é um bloco. Você não faria as mesmas perguntas ao campo “resumo profissional” e ao campo “título da patente” — e o sistema também não faz.</p>\n</blockquote>\n<p><strong>EIXO — uma pergunta feita ao texto de um bloco.</strong></p>\n<p>O mesmo texto responde a várias perguntas diferentes. Uma patente de sensores para silos de grãos é, ao mesmo tempo, «agroindústria» (pergunta de setor), «Internet das Coisas» (pergunta de tecnologia) e «TRL 7-8» (pergunta de maturidade). São três eixos sobre um único item. Cada eixo corresponde a uma taxonomia do dicionário.</p>\n<p><strong>CATEGORIA — uma resposta possível a um eixo.</strong></p>\n<p>É uma linha do dicionário, organizada em dois níveis: o agrupador (<code>nivel1</code>, ex.: «Indústrias Extrativas e de Base») e a categoria propriamente dita (<code>nivel2</code>, ex.: «Metalurgia e Siderurgia»).</p>\n<p><strong>GLOSA — a definição em prosa daquela categoria.</strong></p>\n<p>É o texto que descreve o que a categoria abrange e o que ela não abrange. É ele que o sistema compara com o currículo. Por isso a frase que se repete ao longo do manual: <strong>a glosa é o classificador</strong> (seção 5).</p>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Um <strong>bloco</strong> (pedaço do currículo) é cruzado com um <strong>eixo</strong> (pergunta), e a resposta é uma <strong>categoria</strong>, escolhida pela semelhança entre o texto do currículo e a <strong>glosa</strong>.</p>\n</blockquote>\n<p>A seção 17.2 detalha a anatomia completa de um bloco, com um exemplo percorrido de ponta a ponta; a seção 17.3 mostra, bloco a bloco, por que cada um é cruzado com aqueles eixos e não com outros.</p>\n<h2 id=\"como-a-classificação-decide\">4. Como a classificação decide</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — O texto e cada categoria viram vetores; vence a categoria mais próxima, se passar em dois testes.</p>\n</blockquote>\n<p>Este é o mecanismo central. Vale entender antes de ajustar qualquer coisa.</p>\n<p><strong>Passo 1.</strong> O texto do currículo vira um vetor.</p>\n<blockquote>\n<p><em>“Processo de obtenção de liga metálica resistente à corrosão”</em></p>\n</blockquote>\n<p><strong>Passo 2.</strong> O texto de cada categoria do dicionário também vira um vetor. Esse texto tem três partes:</p>\n<blockquote>\n<p><strong>rótulo:</strong> Metalurgia e Siderurgia</p>\n<p><strong>glosa:</strong> Transformação de minério e sucata em metal e semiacabados: redução, aciaria, fundição, laminação, tratamento térmico e desenvolvimento de ligas…</p>\n<p><strong>exemplos:</strong> siderurgia; aciaria; fundição; laminação; liga metálica</p>\n</blockquote>\n<p><strong>Passo 3.</strong> Compara-se o vetor do currículo com o de cada categoria.</p>\n<p><strong>Passo 4.</strong> Vence a mais próxima — se passar em dois testes:</p>\n<ul>\n<li><strong>LIMIAR:</strong> está perto o bastante? Se não, o resultado é <code>Indefinido</code>.</li>\n<li><strong>MARGEM:</strong> está claramente à frente da segunda colocada? Se não, é marcado como <code>ambíguo</code> e vai para o desempate (seção 6).</li>\n</ul>\n<p>Nenhum exemplo rotulado foi usado para treinar nada. Isso se chama classificação <em>zero-shot</em>.</p>\n<div data-lab=\"decisao\">\n\n</div>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>A glosa é o classificador.</strong> Reescrever uma glosa muda o resultado da execução seguinte. Sem treinar, sem programar, sem reinstalar. O dicionário é a peça mais valiosa do sistema — mais que o código.</p>\n</blockquote>\n<h2 id=\"como-escrever-uma-boa-glosa\">5. Como escrever uma boa glosa</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Diga o que a categoria é <strong>e o que ela não é</strong>, citando a categoria vizinha pelo nome.</p>\n</blockquote>\n<p>Categorias vizinhas produzem vetores parecidos e o sistema empata. A solução é escrever de forma <strong>contrastiva</strong>.</p>\n<p>❌ <strong>Fraca:</strong></p>\n<blockquote>\n<p>“Trata de análise de dados.”</p>\n</blockquote>\n<p>✅ <strong>Boa:</strong></p>\n<blockquote>\n<p>“Extração de conhecimento a partir de dados para gerar análise e predição: modelagem estatística, aprendizado de máquina e visualização. O foco é produzir modelos — <strong>não operar a infraestrutura do banco, que é «Administração de Banco de Dados»</strong>.”</p>\n</blockquote>\n<p>A menção explícita à vizinha é o que separa as duas no espaço vetorial. Sem ela, os textos ficam quase idênticos e o empate é inevitável.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Ao escrever uma glosa, pergunte-se: <em>“com qual outra categoria esta pode ser confundida?”</em> Cite essa categoria pelo nome, dentro da glosa, dizendo o que fica com ela. Se você não consegue nomear a concorrente, provavelmente a categoria está bem isolada — ou está mal definida.</p>\n</blockquote>\n<h2 id=\"o-desempate-de-precisão-reranker\">6. O desempate de precisão (reranker)</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Um segundo modelo, mais preciso e mais lento, reexamina apenas os casos que ficaram empatados.</p>\n</blockquote>\n<p><strong>Está ligado por padrão neste projeto.</strong></p>\n<h3 id=\"o-problema-que-ele-resolve\">6.1 · O problema que ele resolve</h3>\n<p>O modelo principal é um <strong>bi-encoder</strong>: ele transforma o currículo num vetor e a categoria noutro, separadamente, e depois compara. É rápido justamente porque os vetores das categorias são calculados uma vez só e reaproveitados.</p>\n<p>O preço dessa velocidade é que os dois textos nunca “se olham”. O modelo nunca lê a frase do currículo <em>em conjunto</em> com a definição da categoria. Quando duas categorias são parecidas, ele empata — e o empate vira <code>ambíguo</code>.</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — O bi-encoder é como comparar duas pessoas pela ficha de cada uma, separadamente. O reranker é entrevistar as duas juntas, na mesma sala. Custa muito mais tempo, e é bem mais confiável quando elas se parecem.</p>\n</blockquote>\n<h3 id=\"o-que-o-reranker-faz\">6.2 · O que o reranker faz</h3>\n<p>Ele é um <strong>cross-encoder</strong>: lê o par (texto do currículo + texto da categoria) <strong>juntos</strong>, numa única passagem, e devolve uma nota de compatibilidade. É substancialmente mais preciso, porque enxerga a relação entre as duas frases.</p>\n<h3 id=\"por-que-ele-só-age-na-zona-cinzenta\">6.3 · Por que ele só age na zona cinzenta</h3>\n<p>Porque é caro. Um cross-encoder é de dezenas a centenas de vezes mais lento por item que um bi-encoder. Rodá-lo em toda a base seria proibitivo.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Medido na base real em 14/09/2026, com o reranker ligado: a zona cinzenta (0,60–0,85 de similaridade) pega quase tudo — 1.191 de 1.195 textos na Atuação, 4.470 de 4.539 na Produção técnica, 19.394 de 19.885 nas Publicações. «Só onde vale a pena» é, hoje, ~98% dos textos: com o E5 de instrução, as similaridades se concentram nessa faixa. Isso não muda a decisão (o reranker é mais preciso) — muda o custo: 96.970 pares por eixo nas Publicações. E havia um erro que multiplicava esse custo: até 14/09 o motor chamava o reranker <strong>um texto por vez</strong> (5 pares por chamada), pagando tokenização, lançamento na GPU e sincronização a cada texto, e as linhas de andamento, que só existem para lotes acima de 2.048 pares, nunca apareciam — a primeira carga real ficou 5 horas cega. Corrigido: um lote por eixo, ~100 pares/s na RTX 2050 em meia precisão, 16 minutos por eixo nas Publicações, com «reranking 8,4% · 100 pares/s · faltam ~15 min» a cada 30 s no log. Recalibrar a zona (por percentil da margem, em vez de limites fixos) é o próximo passo natural — decisão de projeto, com o ganho medido como em 6.7.</p>\n</blockquote>\n<p>A solução é o desenho em dois estágios:</p>\n<pre><code>   TODOS os itens  ──►  bi-encoder (rápido)\n                              │\n                    ┌─────────┴─────────┐\n                    │                   │\n            decisão clara         empate técnico\n            (fica como está)      (zona cinzenta)\n                                        │\n                                        ▼\n                               reranker (preciso)\n                               reexamina os top-K</code></pre>\n<p>Como a zona cinzenta costuma ser uma fração pequena do total, o custo fica contido e o ganho se concentra exatamente onde havia dúvida.</p>\n<h3 id=\"o-que-é-exatamente-a-zona-cinzenta\">6.4 · O que é, exatamente, a “zona cinzenta”</h3>\n<p>Vale ser preciso, porque a expressão sugere uma coisa e o código faz outra — ligeiramente diferente.</p>\n<p>A zona cinzenta <strong>não</strong> é “todo item marcado como ambíguo”. Ela é uma <strong>faixa de pontuação</strong>: o item entra no desempate quando a nota do primeiro colocado fica entre <strong>0,60 e 0,85</strong>.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Nota do 1º colocado</th>\n<th>O que o sistema entende</th>\n<th>O que acontece</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>abaixo de 0,60</td>\n<td>ruído: nada ali se parece de verdade com o texto</td>\n<td>não vale gastar o cross-encoder</td>\n</tr>\n<tr class=\"even\">\n<td><strong>entre 0,60 e 0,85</strong></td>\n<td><strong>plausível, mas não convincente</strong></td>\n<td><strong>vai para o desempate</strong></td>\n</tr>\n<tr class=\"odd\">\n<td>acima de 0,85</td>\n<td>decisão já confiável</td>\n<td>fica como está</td>\n</tr>\n</tbody>\n</table>\n<p>A lógica é de custo-benefício. Abaixo de 0,60, reexaminar não salva nada — o texto simplesmente não pertence à taxonomia. Acima de 0,85, o bi-encoder já decidiu bem, e reexaminar só gastaria tempo para confirmar. O refinamento compensa no meio.</p>\n<p>Os dois valores estão em <code>semantica/classificador.py</code>, no campo <code>zona_cinzenta</code> do eixo:</p>\n<pre><code>zona_cinzenta: tuple[float, float] = (0.60, 0.85)</code></pre>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Na prática as duas noções quase sempre coincidem: itens ambíguos costumam ter nota nessa faixa. Mas não são a mesma coisa, e saber disso evita uma conclusão errada quando o relatório mostrar ambíguos que não passaram pelo desempate.</p>\n</blockquote>\n<h3 id=\"o-que-é-o-top-k-o-método-por-trás-do-desempate\">6.5 · O que é o top-K — o método por trás do desempate</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Top-K é “me dê os K maiores desta lista, em ordem” — e o K é quanta dúvida o sistema aceita carregar para a etapa seguinte.</p>\n</blockquote>\n<p><strong>O ponto de partida.</strong> Depois de vetorizar, o sistema tem uma lista de notas: a semelhança do texto do currículo com <strong>cada</strong> categoria candidata. Se a taxonomia de setor tem 24 categorias, essa lista tem 24 números entre 0 e 1.</p>\n<pre><code>Metalurgia e Siderurgia ............ 0,842\nMetalmecânica e Bens de Capital .... 0,838\nAutomotiva e Mobilidade ............ 0,791\nMineração e Beneficiamento ......... 0,774\nQuímica e Petroquímica Fina ........ 0,701\nAlimentos e Bebidas ................ 0,655\n... mais 18 categorias ...</code></pre>\n<p><strong>A operação top-K.</strong> Escolher os <strong>K maiores</strong> dessa lista e devolvê-los em ordem decrescente, junto com a posição de cada um. Com K = 3, o resultado é:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Posição</th>\n<th>Categoria</th>\n<th>Nota</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1ª</td>\n<td>Metalurgia e Siderurgia</td>\n<td>0,842</td>\n</tr>\n<tr class=\"even\">\n<td>2ª</td>\n<td>Metalmecânica e Bens de Capital</td>\n<td>0,838</td>\n</tr>\n<tr class=\"odd\">\n<td>3ª</td>\n<td>Automotiva e Mobilidade</td>\n<td>0,791</td>\n</tr>\n</tbody>\n</table>\n<p>É só isso. “Top-K” não é um modelo, não é um algoritmo de aprendizado e não decide nada sozinho: é a operação de <strong>seleção dos K melhores</strong>. O que muda de um sistema para outro é <em>o que se faz</em> com esses K.</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — É a lista tríplice de um concurso. A banca avalia todos os candidatos, mas encaminha só os três primeiros para a decisão final. Top-K é montar essa lista; quem escolhe entre os três é outra instância.</p>\n</blockquote>\n<p><strong>Como o código faz isso, e por que importa.</strong> A forma ingênua seria ordenar as 24 notas inteiras e pegar as três primeiras. O sistema usa <code>numpy.argpartition</code>, que apenas <em>separa</em> os K maiores do resto sem ordená-los entre si, e só depois ordena esses K.</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Método</th>\n<th>O que faz</th>\n<th>Custo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>argsort</code> (ordenar tudo)</td>\n<td>coloca as 24 notas em ordem</td>\n<td>proporcional a n × log(n)</td>\n</tr>\n<tr class=\"even\">\n<td><code>argpartition</code> (top-K)</td>\n<td>separa as 3 maiores; ordena só elas</td>\n<td>proporcional a n</td>\n</tr>\n</tbody>\n</table>\n<p>Numa matriz de 500 mil textos × 295 categorias, essa troca economiza vários segundos <strong>por chamada</strong> — e a chamada acontece muitas vezes. Está em <code>semantica/vetores.py</code>, na função <code>topk()</code>.</p>\n<p><strong>Onde o top-K aparece no pipeline.</strong> Em quatro lugares, com finalidades distintas:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Onde</th>\n<th>K</th>\n<th>Para quê</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Estágio 1 (hierárquico)</td>\n<td>2 agrupadores</td>\n<td>restringe a disputa a ~10 candidatos, em vez de todas as categorias</td>\n</tr>\n<tr class=\"even\">\n<td>Multirrótulo</td>\n<td>até 3 rótulos</td>\n<td>permite que um item receba mais de uma categoria (seção 20.11)</td>\n</tr>\n<tr class=\"odd\">\n<td>Desempate (reranker)</td>\n<td>5 candidatos</td>\n<td>o que o cross-encoder reexamina</td>\n</tr>\n<tr class=\"even\">\n<td>Coluna <code>TOPK_…</code> no CSV</td>\n<td>os melhores</td>\n<td>registro auditável de <em>por que</em> aquele rótulo venceu</td>\n</tr>\n</tbody>\n</table>\n<div data-lab=\"topk\">\n\n</div>\n<p><strong>O efeito de aumentar ou diminuir o K do desempate:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Aumentar (ex.: 10)</th>\n<th>Diminuir (ex.: 3)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>✅ mais chance de o rótulo certo estar na lista</td>\n<td>✅ mais rápido</td>\n</tr>\n<tr class=\"even\">\n<td>❌ custo cresce de forma linear</td>\n<td>❌ o rótulo certo pode ficar de fora</td>\n</tr>\n</tbody>\n</table>\n<p>O custo cresce <strong>linearmente</strong> porque o cross-encoder é chamado uma vez por par (texto, categoria): dobrar o K dobra o número de pares. Acima de ~10 o ganho costuma ser marginal — se o rótulo correto não estava entre os dez primeiros do bi-encoder, o problema está na glosa, não no desempate.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Discrepância entre documentação e código, encontrada na revisão 1.4 e <strong>corrigida em 11/09/2026 (versão 1.6)</strong>. Até então o parâmetro <code>reranker_topk</code> existia em <code>config.py</code> com o valor 5, mas nenhuma linha do sistema o lia: o número efetivo de candidatos enviados ao cross-encoder era calculado em <code>semantica/classificador.py</code> como <code>top_k + 2</code>, onde <code>top_k</code> vale 3 por padrão — 5 candidatos, por coincidência o mesmo número. Alterar o parâmetro não produzia efeito nenhum. Hoje <code>_montar_eixos()</code>, em <code>etapas/e02_classificacao.py</code>, repassa <code>reranker_topk</code> ao eixo como <code>rerank_candidatos</code>, e é esse número que o motor usa. Ele é separado de <code>top_k</code> de propósito: <code>top_k</code> governa o multirrótulo (quantos rótulos um item pode receber), e amarrar os dois faria «10 candidatos no desempate» virar, em silêncio, «até 8 rótulos por item». O parâmetro entra na assinatura do eixo só quando o desempate está ligado — mudá-lo reclassifica sozinho, como limiar e margem; desligado, mudá-lo não invalida cache nenhum. Um teste de integração falha se alguém desfizer a ligação.</p>\n</blockquote>\n<h3 id=\"os-parâmetros\">6.6 · Os parâmetros</h3>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Parâmetro</th>\n<th>Onde</th>\n<th>Padrão</th>\n<th>O que faz</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>reranker_ativo</code></td>\n<td><code>config.py</code></td>\n<td><code>True</code></td>\n<td>liga e desliga o desempate</td>\n</tr>\n<tr class=\"even\">\n<td><code>reranker_modelo</code></td>\n<td><code>config.py</code></td>\n<td><code>BAAI/bge-reranker-v2-m3</code></td>\n<td>qual modelo faz o desempate</td>\n</tr>\n<tr class=\"odd\">\n<td><code>zona_cinzenta</code></td>\n<td><code>semantica/classificador.py</code></td>\n<td><code>(0.60, 0.85)</code></td>\n<td>a faixa de nota que aciona o desempate</td>\n</tr>\n<tr class=\"even\">\n<td><code>top_k</code></td>\n<td><code>semantica/classificador.py</code></td>\n<td><code>3</code></td>\n<td>quantos rótulos um item pode receber num eixo multirrótulo — desde 11/09/2026 não afeta o desempate</td>\n</tr>\n<tr class=\"odd\">\n<td><code>reranker_topk</code></td>\n<td><code>config.py</code></td>\n<td><code>5</code></td>\n<td>quantos candidatos o cross-encoder reexamina — ligado ao motor em 11/09/2026, ver 6.5</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Sobre o modelo.</strong> São ~560 milhões de parâmetros — cabe folgado numa placa de vídeo de 4 GB. Baixa cerca de 2,2 GB na primeira execução e depois roda offline. É o <code>bge-reranker-v2-m3</code>, multilíngue, treinado especificamente para a tarefa de reordenar candidatos.</p>\n<p><strong>Sobre quantos candidatos são reexaminados.</strong> Hoje são 5 — o <code>reranker_topk</code> de <code>config.py</code>, ligado ao motor em 11/09/2026 (6.5). Mais que o 1º e o 2º de propósito: o cross-encoder pode descobrir que o 4º ou o 5º colocado do bi-encoder era o rótulo certo — e é justamente para isso que ele existe. O mínimo efetivo é 2: com um candidato só, não há o que reexaminar. Ver 6.5 para o efeito de aumentar ou diminuir esse número.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Desde a versão 1.6 o reranker é carregado em meia precisão na GPU, como o E5 já era, e sai da placa ao fim da classificação: cerca de 1,1 GB residentes em vez de 2,3 GB, e a vetorização (etapa 4) não divide mais a placa com ele. Numa placa de 4 GB isso é a diferença entre caber e transbordar para a memória do sistema — o que não dá erro, só deixa tudo ~6x mais lento. Em processador continua em precisão simples: lá a meia precisão é emulada, e mais lenta.</p>\n</blockquote>\n<h3 id=\"como-medir-o-ganho\">6.7 · Como medir o ganho</h3>\n<pre><code>$env:LATTES_RERANKER = &quot;0&quot;\npython pipeline.py --etapas classificacao     # sem desempate\n# anote o %_ambiguo em 5_RELATORIOS\\2_classificacao.xlsx\n\n$env:LATTES_RERANKER = &quot;1&quot;\npython pipeline.py --etapas classificacao     # com desempate\n# compare</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Ligar ou desligar o reranker <strong>muda a assinatura dos eixos</strong>. Na execução seguinte, a classificação é refeita sozinha, sem precisar de <code>--forcar</code>. Isso é proposital: o resultado passa a ser outro, e o cache antigo não vale mais.</p>\n</blockquote>\n<h3 id=\"se-ele-não-estiver-disponível\">6.8 · Se ele não estiver disponível</h3>\n<p>Se a biblioteca faltar ou o download falhar, o pipeline <strong>avisa e segue sem ele</strong> — com mais casos marcados como ambíguos, mas sem interromper o processamento.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Até a versão 1.5, «seguir sem ele» não era verdade. Com o modelo ausente, o desempate devolvia uma lista de zeros, o motor escolhia o primeiro candidato da lista global — que não é o vencedor da decisão hierárquica — e ainda carimbava <code>motivo=\"rerank\"</code> num desempate que não aconteceu. Medido em 11/09/2026, com 200 currículos simulados e o reranker sem conexão: 8.515 de 9.160 decisões carimbadas e 491 rótulos (5,4%) trocados, até 41% num eixo. Corrigido na versão 1.6: reranker ausente não altera mais a decisão, e o log diz «desempate pulado: reranker indisponível». Se um CSV gerado antes de setembro de 2026, numa máquina sem o modelo, tiver muitos <code>motivo=\"rerank\"</code>, é este defeito — reclassifique.</p>\n</blockquote>\n\\1\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — A normalização resolve o efeito do tamanho; a diluição de assunto, não.</p>\n</blockquote>\n<p>Uma pergunta legítima: um currículo descreve uma experiência em 50 palavras, outro descreve a mesma coisa em 3. Como o sistema lida com isso?</p>\n<h3 id=\"o-que-significa-normalizar-um-vetor\">7.1 · O que significa “normalizar” um vetor</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Normalizar é encolher ou esticar a seta até o comprimento 1, sem mudar para onde ela aponta.</p>\n</blockquote>\n<p>Todo texto vira um vetor — uma <strong>seta</strong> apontando para algum lugar num espaço de significados. Essa seta tem duas propriedades, e só uma delas interessa:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Propriedade</th>\n<th>O que é</th>\n<th>Serve para quê</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Direção</strong></td>\n<td>para onde a seta aponta</td>\n<td>diz <em>sobre o que</em> o texto fala — é o que interessa</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Comprimento</strong></td>\n<td>o tamanho da seta</td>\n<td>não diz nada de útil, e <strong>atrapalha</strong> a comparação</td>\n</tr>\n</tbody>\n</table>\n<p>O comprimento cresce com o tamanho e a densidade do texto. Um parágrafo de 50 palavras produz uma seta mais longa que uma frase de 3 — mesmo que as duas falem exatamente da mesma coisa.</p>\n<p><strong>O comprimento de um vetor é a distância dele até a origem.</strong> Em duas dimensões, é o velho teorema de Pitágoras: a raiz quadrada da soma dos quadrados. Para um vetor (3, 1):</p>\n<pre><code>comprimento = √(3² + 1²) = √(9 + 1) = √10 ≈ 3,162</code></pre>\n<p><strong>Normalizar é dividir cada coordenada por esse comprimento.</strong> Nada mais que isso:</p>\n<pre><code>vetor original ....... (3 ; 1)\ncomprimento .......... 3,162\nvetor normalizado .... (3 ÷ 3,162 ; 1 ÷ 3,162) = (0,949 ; 0,316)</code></pre>\n<p>Confira que deu certo: √(0,949² + 0,316²) = √(0,901 + 0,100) = √1,001 ≈ <strong>1</strong>. A seta agora tem comprimento 1, e continua apontando exatamente para o mesmo lugar — porque as duas coordenadas foram divididas <strong>pelo mesmo número</strong>, e dividir os dois lados de uma proporção pelo mesmo valor não muda a proporção.</p>\n<p>Agora o mesmo cálculo para um vetor dez vezes maior, (30, 10):</p>\n<pre><code>comprimento = √(30² + 10²) = √(900 + 100) = √1000 ≈ 31,623\nnormalizado = (30 ÷ 31,623 ; 10 ÷ 31,623) = (0,949 ; 0,316)</code></pre>\n<p><strong>Exatamente o mesmo resultado.</strong> É esse o efeito que se quer: dois textos que falam da mesma coisa, um telegráfico e outro detalhado, produzem setas de comprimentos diferentes — e, depois de normalizadas, viram a <strong>mesma seta</strong>.</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — Uma bússola. O que informa é para onde a agulha aponta, não o tamanho da agulha. Normalizar é trocar todas as agulhas do mundo por agulhas de um centímetro: elas continuam apontando para o mesmo lugar, e agora dá para comparar duas bússolas quaisquer.</p>\n</blockquote>\n<p><strong>No sistema isso é uma linha só.</strong> Em <code>semantica/vetores.py</code>, na chamada ao modelo:</p>\n<pre><code>modelo.encode(textos, normalize_embeddings=True, ...)</code></pre>\n<p>Com todos os vetores de comprimento 1, a semelhança por cosseno — que mede o <strong>ângulo</strong> entre duas setas — vira uma simples multiplicação, e o pipeline economiza tempo e memória. A fórmula do cosseno é:</p>\n<pre><code>cos(a, b) = (a · b) ÷ (comprimento de a × comprimento de b)</code></pre>\n<p>Como os dois comprimentos valem 1, o denominador vale 1 e a fórmula desaba para <code>a · b</code> — o produto escalar puro. É a otimização descrita na função <code>similaridade()</code>.</p>\n<h3 id=\"por-que-isso-importa-o-exemplo-passo-a-passo\">7.2 · Por que isso importa — o exemplo, passo a passo</h3>\n<p>Vamos acompanhar um caso inteiro, com todas as contas à vista. Para caber numa tabela, imagine um espaço de significados com apenas <strong>duas dimensões</strong>: <em>metalurgia</em> e <em>automação</em>. (Os vetores reais têm mais de mil dimensões; a aritmética é idêntica.)</p>\n<p><strong>Passo 1 — os quatro vetores.</strong> Dois textos de currículo, que dizem a mesma coisa com tamanhos diferentes, e duas categorias do dicionário:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>O que é</th>\n<th>Vetor</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Texto A</strong></td>\n<td>“Soldagem de aços” — 3 palavras</td>\n<td>(3 ; 1)</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Texto B</strong></td>\n<td>a mesma coisa, descrita em 50 palavras</td>\n<td>(30 ; 10)</td>\n</tr>\n<tr class=\"odd\">\n<td><strong>Categoria «Metalurgia»</strong></td>\n<td>rótulo + glosa + exemplos</td>\n<td>(4 ; 1)</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Categoria «Automação»</strong></td>\n<td>rótulo + glosa + exemplos</td>\n<td>(1 ; 4)</td>\n</tr>\n</tbody>\n</table>\n<p>Repare que <strong>A e B apontam para a mesma direção</strong>: a proporção entre as duas dimensões é idêntica, 3 para 1. Só o comprimento difere — B é dez vezes mais longo, porque tem dez vezes mais texto.</p>\n<p><strong>Passo 2 — o que acontece SEM normalizar.</strong> A comparação seria feita pelo produto escalar puro: multiplicar coordenada por coordenada e somar.</p>\n<pre><code>Texto A × Metalurgia  =  (3 × 4) + (1 × 1)  =  12 + 1   =   13\nTexto A × Automação   =  (3 × 1) + (1 × 4)  =   3 + 4   =    7\nTexto B × Metalurgia  = (30 × 4) + (10 × 1) = 120 + 10  =  130\nTexto B × Automação   = (30 × 1) + (10 × 4) =  30 + 40  =   70</code></pre>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Metalurgia</th>\n<th>Automação</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Texto A</td>\n<td>13</td>\n<td>7</td>\n</tr>\n<tr class=\"even\">\n<td>Texto B</td>\n<td><strong>130</strong></td>\n<td><strong>70</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Passo 3 — por que isso é um desastre.</strong> Três problemas, em ordem crescente de gravidade:</p>\n<ol type=\"1\">\n<li><strong>B parece dez vezes mais metalúrgico que A</strong> — e os dois dizem a mesma coisa. A nota virou uma medida de quanto a pessoa escreveu, não de sobre o que ela escreveu.</li>\n<li><strong>B pontua 70 em «Automação»</strong> — mais que os 13 que A obteve na categoria <em>correta</em>. Um texto longo fica mais próximo de <strong>tudo</strong>: ele não fica mais preciso, ele infla indiscriminadamente.</li>\n<li><strong>O limiar deixa de significar qualquer coisa.</strong> Com um corte fixo em 20, o texto A seria descartado como <code>Indefinido</code> (13 &lt; 20) e o texto B seria aceito nas <strong>duas</strong> categorias (130 e 70, ambos &gt; 20). O mesmo conteúdo, dois destinos opostos.</li>\n</ol>\n<p><strong>Passo 4 — o que acontece COM normalização.</strong> Cada vetor é dividido pelo próprio comprimento, como em 7.1:</p>\n<pre><code>Texto A ......  (3 ; 1)  ÷ 3,162  = (0,949 ; 0,316)\nTexto B ...... (30 ; 10) ÷ 31,623 = (0,949 ; 0,316)   ← idêntico ao A\nMetalurgia ...  (4 ; 1)  ÷ 4,123  = (0,970 ; 0,243)\nAutomação ....  (1 ; 4)  ÷ 4,123  = (0,243 ; 0,970)</code></pre>\n<p>Agora a mesma multiplicação, com os vetores normalizados:</p>\n<pre><code>A × Metalurgia = (0,949 × 0,970) + (0,316 × 0,243) = 0,920 + 0,077 = 0,997\nA × Automação  = (0,949 × 0,243) + (0,316 × 0,970) = 0,230 + 0,307 = 0,537</code></pre>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Metalurgia</th>\n<th>Automação</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Texto A</td>\n<td><strong>0,997</strong></td>\n<td>0,537</td>\n</tr>\n<tr class=\"even\">\n<td>Texto B</td>\n<td><strong>0,997</strong></td>\n<td>0,537</td>\n</tr>\n</tbody>\n</table>\n<div data-lab=\"normalizacao\">\n\n</div>\n<p><strong>Passo 5 — o que se ganhou.</strong> Três coisas:</p>\n<ul>\n<li><strong>A e B recebem a nota idêntica</strong>, porque de fato dizem a mesma coisa. O tamanho do texto deixou de influenciar.</li>\n<li><strong>A categoria certa vence com folga</strong>: 0,997 contra 0,537. A margem entre 1ª e 2ª colocada agora é informativa.</li>\n<li><strong>Todas as notas cabem entre 0 e 1</strong>, o que faz um limiar como 0,78 significar a mesma coisa em qualquer texto da base — e é o que torna a calibração da seção 21 possível.</li>\n</ul>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — É por isso que as pontuações de confiança do sistema estão sempre entre 0 e 1, e por isso que um limiar de 0,78 pode ser comparado entre blocos, entre eixos e entre execuções. Sem normalização, cada linha teria a sua própria escala, e nenhum número seria comparável com nenhum outro.</p>\n</blockquote>\n<h3 id=\"o-que-a-normalização-não-resolve\">7.3 · O que a normalização NÃO resolve</h3>\n<p>Ela elimina o efeito da <strong>magnitude</strong>, não o da <strong>diluição</strong>.</p>\n<p>Um texto longo que toca em vários assuntos produz uma seta que aponta para uma <strong>média</strong> entre eles — e uma média não fica perto de nenhum dos extremos.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Uma descrição de atividade que menciona soldagem, controle estatístico, treinamento de equipe e segurança do trabalho gera um vetor que fica a meio caminho de quatro categorias. Nenhuma delas vence com folga, e o item vira <code>ambíguo</code>. Não é erro do sistema: o texto realmente fala de quatro coisas.</p>\n</blockquote>\n<h3 id=\"as-outras-quatro-proteções\">7.4 · As outras quatro proteções</h3>\n<p>Além da normalização, o sistema tem quatro mecanismos que atenuam o efeito do tamanho do texto.</p>\n<h4 id=\"proteção-1-dois-limiares-escolhidos-pelo-bloco\">Proteção 1 — Dois limiares, escolhidos pelo bloco</h4>\n<p>O sistema tem dois níveis de exigência, e aplica um ou outro conforme a natureza do texto:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Limiar</th>\n<th>Valor</th>\n<th>Aplicado a</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>limiar_curto</code></td>\n<td><strong>0,78</strong> — mais exigente</td>\n<td>títulos, nomes de curso, cargos, nomes de patente</td>\n</tr>\n<tr class=\"even\">\n<td><code>limiar_longo</code></td>\n<td><strong>0,72</strong> — mais permissivo</td>\n<td>resumos, descrições de atividade, descrições de projeto</td>\n</tr>\n</tbody>\n</table>\n<p>A lógica: um texto de três palavras tem pouco contexto e pode bater alto com uma categoria por mera coincidência de vocabulário — por isso se <strong>exige mais</strong> dele. Um texto de cinquenta palavras espalha o significado por muitos termos e naturalmente pontua mais baixo — por isso se <strong>exige menos</strong>.</p>\n<p><strong>Como o sistema decide o que é longo e o que é curto</strong></p>\n<p>Esta é a pergunta que mais gera mal-entendido, e a resposta é mais simples — e mais limitada — do que se imagina:</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Não há nenhuma contagem de palavras em lugar nenhum do código.</strong> A distinção entre “longo” e “curto” <strong>não é medida</strong>: ela é <strong>declarada por uma pessoa</strong>, uma única vez, para o bloco inteiro.</p>\n</blockquote>\n<p>Quem escreve o domínio olha para a natureza do campo do Lattes e decide. A decisão fica registrada numa chave verdadeiro/falso chamada <code>texto_longo</code>, dentro de <code>dominios/&lt;área&gt;/blocos.py</code>:</p>\n<pre><code>Bloco(\n    nome=&quot;atuacao&quot;,\n    rotulo=&quot;Atuação profissional&quot;,\n    tabela=&quot;atuacao&quot;,\n    texto=texto_atuacao,\n    texto_longo=True,      # ⬅️ AQUI. Prosa → usa limiar_longo (0,72)\n    eixos=[...],\n)</code></pre>\n<p>Na etapa 2, o pipeline lê essa chave e escolhe o limiar. São literalmente duas linhas, em <code>etapas/e02_classificacao.py</code>, função <code>_montar_eixos()</code>:</p>\n<pre><code>limiar = (CFG.semantica.limiar_longo if bloco.texto_longo\n          else CFG.semantica.limiar_curto)</code></pre>\n<p><strong>O caminho completo da decisão</strong>, do domínio até a linha do currículo:</p>\n<pre><code>1. o curador olha o campo do Lattes\n   &quot;descrição de atividades é prosa&quot; → texto_longo=True\n                      │\n                      ▼\n2. a chave fica gravada em dominios/industria/blocos.py\n                      │\n                      ▼\n3. na etapa 2, _montar_eixos() lê a chave\n   texto_longo=True → limiar = 0,72\n                      │\n                      ▼\n4. TODAS as linhas daquele bloco usam 0,72 —\n   a de 3 palavras e a de 50, sem distinção</code></pre>\n<p><strong>Como está declarado hoje, no domínio “indústria”:</strong></p>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Bloco</th>\n<th><code>texto_longo</code></th>\n<th>Limiar</th>\n<th>Por que essa escolha</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Resumo</td>\n<td><code>True</code></td>\n<td>0,72</td>\n<td>prosa autoral, texto corrido</td>\n</tr>\n<tr class=\"even\">\n<td>Atuação</td>\n<td><code>True</code></td>\n<td>0,72</td>\n<td>descrição de atividades, em frases</td>\n</tr>\n<tr class=\"odd\">\n<td>Projetos</td>\n<td><code>True</code></td>\n<td>0,72</td>\n<td>título + natureza + descrição + financiador</td>\n</tr>\n<tr class=\"even\">\n<td>Formação</td>\n<td><code>False</code></td>\n<td>0,78</td>\n<td>“Engenharia Mecânica” — nome de curso</td>\n</tr>\n<tr class=\"odd\">\n<td>Produção técnica</td>\n<td><code>False</code></td>\n<td>0,78</td>\n<td>título de patente ou software</td>\n</tr>\n<tr class=\"even\">\n<td>Publicações</td>\n<td><code>False</code></td>\n<td>0,78</td>\n<td>título de artigo</td>\n</tr>\n<tr class=\"odd\">\n<td>Áreas declaradas</td>\n<td><code>False</code></td>\n<td>0,78</td>\n<td>“Engenharias &gt; Mecânica” — rótulo taxonômico</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>CONFIRA</strong> — Para ver a declaração de todos os blocos do domínio ativo, sem abrir o código: <code>python pipeline.py --config</code> mostra os parâmetros, e o arquivo <code>dominios/&lt;área&gt;/blocos.py</code> traz a lista completa com o campo <code>porque</code> de cada bloco.</p>\n</blockquote>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Marcar errado é uma causa <strong>silenciosa</strong> de problema. Um bloco de títulos marcado como longo aceita classificações frágeis, que ninguém percebe porque não geram erro nenhum. Um bloco de prosa marcado como curto produz <code>Indefinido</code> em excesso, e a taxonomia leva a culpa sem motivo. Diagnóstico: se um bloco específico tem taxa de indefinidos muito fora do padrão dos demais, confira o <code>texto_longo</code> dele <strong>antes</strong> de mexer em qualquer outra coisa.</p>\n</blockquote>\n<h4 id=\"proteção-2-rótulos-explícitos-na-montagem-do-texto\">Proteção 2 — Rótulos explícitos na montagem do texto</h4>\n<p>O texto nunca chega ao modelo “nu”. A função de montagem de cada bloco junta os campos com etiquetas explícitas:</p>\n<pre><code>&quot;Instituição: Vale Verde S.A. Cargo: Engenheiro de Processos.\n Atividades: (vazio)&quot;</code></pre>\n<p>Isso dá um piso de estrutura mesmo à entrada de três palavras. O modelo sabe que “Vale Verde S.A.” é uma instituição e que “Engenheiro de Processos” é um cargo — informação que ele não teria se recebesse as duas coisas soltas, como uma sopa de palavras.</p>\n<h4 id=\"proteção-3-descarte-do-vazio-real\">Proteção 3 — Descarte do vazio real</h4>\n<p>Antes de classificar, o sistema remove os rótulos e a pontuação e mede o que sobrou de conteúdo verdadeiro. Se sobrou apenas o esqueleto (<code>\"Instituição: . Cargo: . Atividades:\"</code>), a linha nem é enviada ao modelo. Mandá-la só gastaria tempo para produzir ruído — e o ruído entraria nas estatísticas como se fosse um caso real.</p>\n<h4 id=\"proteção-4-teto-de-itens-por-bloco-na-etapa-4\">Proteção 4 — Teto de itens por bloco, na etapa 4</h4>\n<p>Na montagem do texto consolidado (etapa 4), <code>pesos_blocos</code> limita quantos itens de cada bloco entram — 10 publicações, 8 atuações, 5 projetos e assim por diante. Sem esse teto, um pesquisador com 300 publicações teria o próprio vetor dominado por elas, e o resumo e a atuação profissional seriam empurrados para fora da janela do modelo. Ver 19.3.</p>\n<h3 id=\"a-limitação-real-explicada-devagar\">7.5 · A limitação real, explicada devagar</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — O limiar é escolhido <strong>por bloco</strong>, não por linha — então, dentro do mesmo bloco, um texto de 3 palavras e um de 50 são julgados com a mesma régua, apesar de terem naturezas diferentes.</p>\n</blockquote>\n<p><strong>O que a normalização resolveu.</strong> Que um texto longo tivesse nota inflada só por ser longo (7.2). Isso está resolvido: as notas são comparáveis.</p>\n<p><strong>O que continua sem solução.</strong> Que a <strong>exigência</strong> aplicada a cada linha seja adequada àquela linha. E aqui está o ponto:</p>\n<ul>\n<li>A escolha entre <code>limiar_curto</code> (0,78) e <code>limiar_longo</code> (0,72) é feita <strong>uma vez, para o bloco inteiro</strong> (7.4).</li>\n<li>Mas um bloco não é homogêneo. O bloco “atuação” é declarado como prosa (<code>texto_longo=True</code>, limiar 0,72) — e, na base real, ele contém tanto descrições de meia página quanto linhas com três palavras.</li>\n</ul>\n<p><strong>O caso concreto.</strong> Duas linhas do <strong>mesmo</strong> bloco “atuação”, do <strong>mesmo</strong> currículo:</p>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Linha</th>\n<th>Texto montado</th>\n<th>Palavras</th>\n<th>Limiar aplicado</th>\n<th>Adequado?</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>1</td>\n<td>“Instituição: Vale Verde S.A. Cargo: Engenheiro de Processos. Atividades: <em>(vazio)</em>”</td>\n<td>7</td>\n<td>0,72</td>\n<td>❌ <strong>frouxo demais</strong> para um texto tão curto</td>\n</tr>\n<tr class=\"even\">\n<td>2</td>\n<td>“Instituição: Vale Verde S.A. Cargo: Coordenador. Atividades: desenvolvimento de ligas resistentes à corrosão para tubulações de transporte de gás, com ensaios de fadiga e caracterização metalográfica…”</td>\n<td>60</td>\n<td>0,72</td>\n<td>✅ adequado</td>\n</tr>\n</tbody>\n</table>\n<p>A linha 1 recebe a régua desenhada para prosa, quando deveria receber a régua mais exigente dos títulos curtos. E não há nada no sistema que perceba isso: o <code>texto_longo</code> é atributo do <strong>bloco</strong>, não medição de cada <strong>linha</strong>.</p>\n<p><strong>O que o sistema NÃO faz</strong> — e é importante ser explícito, para ninguém procurar por algo que não existe:</p>\n<ul>\n<li>❌ não há limiar que varie com o número de palavras da linha;</li>\n<li>❌ não há penalização ou bônus por comprimento de texto;</li>\n<li>❌ não há junção das entradas curtas de um mesmo pesquisador antes de classificar;</li>\n<li>❌ não há detecção automática de que um bloco foi marcado errado.</li>\n</ul>\n<p><strong>O efeito é assimétrico e previsível.</strong> As duas pontas do problema erram para lados opostos:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Tipo de entrada</th>\n<th>O que costuma acontecer</th>\n<th>Por quê</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>Curta</strong> (“Engenheiro de Processos”)</td>\n<td>vira <code>Indefinido</code></td>\n<td>pouco contexto: nenhuma categoria consegue passar do limiar</td>\n</tr>\n<tr class=\"even\">\n<td><strong>Longa</strong> (descrição detalhada de várias atividades)</td>\n<td>vira <code>ambíguo</code></td>\n<td>toca em vários temas: nenhuma categoria vence com margem</td>\n</tr>\n</tbody>\n</table>\n<pre><code>entrada curta   ──►  nota baixa em tudo   ──►  Indefinido\nentrada longa   ──►  nota média em vários ──►  ambíguo\nentrada média   ──►  nota alta em uma     ──►  classificada ✓</code></pre>\n<p><strong>Há um amortecedor parcial.</strong> A etapa 3 conta <strong>por pesquisador</strong>, não por linha. Quem tem várias entradas curtas ainda acumula sinal: as que viraram <code>Indefinido</code> vão para a coluna <code>sem_rotulo</code> e <strong>não contaminam</strong> o cálculo do predominante. O retrato final continua utilizável.</p>\n<p><strong>Mas o amortecedor tem limite.</strong> Quem tem <em>apenas</em> entradas curtas — currículos enxutos, comuns em perfis de indústria, em que a pessoa registrou os cargos e não descreveu as atividades — fica <strong>sub-representado</strong>: poucos itens classificados, contagem baixa, concentração calculada sobre uma base pequena.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Isso não é um defeito escondido: é uma característica conhecida, medida e documentada. O sistema informa quantos itens ficaram sem rótulo em cada currículo (coluna <code>sem_rotulo</code>), o que permite identificar exatamente quem está sub-representado antes de tirar qualquer conclusão sobre essa pessoa.</p>\n</blockquote>\n<h3 id=\"os-dois-caminhos-possíveis-e-por-que-nenhum-deles-deve-ser-tomado-a
