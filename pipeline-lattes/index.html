antiga enquanto o processo continua imprimindo.</p>\n<p>As preferências vivem fora do repositório, em <code>%LOCALAPPDATA%\\AssistenteLattes\\prefs.json</code>, ao lado do espelho diário do log. O que é perigoso nunca volta marcado de uma sessão anterior: a demonstração, o apagar a origem dos XML, o <code>--forcar</code>, o <code>--sem-login</code>, o endereço de rede, a base a servir e o aprimorar glosas nascem sempre desligados. É decisão consciente a cada vez, e não configuração esquecida.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — O log salvo costuma conter a resposta. Antes de pedir ajuda, clique em «Salvar log…» e anexe o arquivo: ele já sai com qualquer segredo mascarado.</p>\n</blockquote>\n<h4 id=\"aba-inicio\">Aba «0 · Início» — o que falta para esta máquina rodar</h4>\n<p>A aba responde uma pergunta só, em três cartões: «Ambiente», «Estado dos dados» e «Próximo passo».</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOoAAAOLCAMAAADZ05ycAAADAFBMVEX//////+r//+X//+H//9///9v//9H//8r//8L//77//7j9/f719vj19tjt///i///d///c///b9/TF//+99vi7//+7/8m5//+4/s3z8/Px9Pry8vPp7fPp7c7/5PLk6/bk6O7/5Ofu6+f/6uH/6qP/4rv/3p3y5Nvk6NDk6L/1263/5JHe5ffi4//f4+jc6eDc2tXb5P/Y3OLa2/jW2+Ha2tvW28Pa26zW26bI6e+63OXE5by527iw6e6m4/+U6P+j6OyX3v+g2/id2+Gd28PnzNLP2enPzcj/1YL/yWn/yJPl0KPkzbHL2O3D1vXD1uPKy+e71L/4wJf/vHnvr1DawZXWvofktpK/wMm+s8XcwGDeu3bCumDcpZ7iqnbapnXWoGbEod7DoYfdmlO5qTq7mlOc0+yHz/CPyOqCwfScv8l+vuF+vqaaqcecpJiXmt+empGXmlNt1f9t1cJywvZxvP9xvNF1scFltPFEwOBWrPVkqspErOwTqcITqYJmpNxfntVdoOFdoMNJmt9Jmro/n+bIk4LEjHbEjFfHh5C9iVfikRi7dXm7dSipl8C0kbiYlpSogpiUkzq2gkmRkZJ6iclvkz99fY1tfDq3cVfbcwqmbWCga1nCVDy0Uwl5a7WVaVyNWW+LblGdYESdYByRXkdJkNZBjMpBicZSfsg7gcNEhmpAg7ZEfDpJdb43leQbdb4bdX4Tk6MTh+MTk3ERe54TfF8SfDpbcMlBbbBlbX49ccRBa6w4X89GaJspa74TbNYTYKYPV7VfUbQ5UbQTUckTUcATUbQSUbeGS5OGS3Z7TJaGS1p8S1eXTSiLSDGRRxx+PRxrMm9jS2taS2NJTVNBS5JBS41BS3ZBS3NBS1dcNmwbTZ0RTrMbTXkdSZMTR7ETPYc7Mm8QSLAKSrINMpEMMm9xIXlxIVN1MBxxIShnIj5JIXlJIVNJIShdFURdFRxXFRxDIlg7FUQ7FRw  «compactar» quando alguma tabela tem dois ou mais lotes. Duplo clique numa linha abre aquela pasta.</p>\n<p><strong>Próximo passo</strong> transforma as duas leituras acima numa recomendação e num botão. O botão azul apenas leva você à aba certa com a ação já selecionada — nada roda sem um clique em ▶ lá. Ao lado dele, «Rodar tudo que falta». No rodapé, «Verificar novamente» e «Abrir a pasta das bases».</p>\n<blockquote>\n<p><strong>CONFIRA</strong> — O ⏳ numa linha não é falha: é uma checagem que ainda está chegando, porque roda no Python do venv, fora desta janela. E item desmarcado também não é erro — você só precisa do que as etapas que vai usar exigem.</p>\n</blockquote>\n<h4 id=\"aba-ingestao\">Aba «1 · Ingestão» — o lote, a compactação e as amostras</h4>\n<p>É a seção 16.6 em botões. «Inventariar 1_ENTRADA» conta o que está esperando, separando XML, ZIP e tabulares com o tamanho total; «Currículos por lote» é o tamanho do lote, de 100 a 5.000, com 1.000 de padrão; «Ingerir em lote» processa; «Parar» interrompe sem corromper o que já foi gravado.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOoAAAOLCAMAAADZ05ycAAADAFBMVEX//////+///+j//+f//+X//+D//9///9f//9H//8r//7///77//7j9/f719vj19tXn///i///d///c///f/uDU+/vE///E/8q99vi7//+5//+5/szz8/Px9Pry8vPu8PPp7fPt7/Lp7djp7b/u6+f/5cj/47D/5p3/3p3/5JH11rPx0pbk6/bk6O7j6O/k6Nbk6L/h5fPf4+jl5eXk0Kfb5e3Y3OLa297c2tXa2trV7fLW2+HW28PW26bS09XPzcjH7fO06vrL6O6x6O7D6c2r7bam4/+m48zM2e3D1vXD1uq/2/fE0+u42+Os1/C82c2p1uC62qWg2/iX3v+d2+Gd28Ob0vWT5f+S4P+T492N0vBrzfv/w7H/yJPnwaH0wo7Wvof/vHrfsa/iqnbcoInirmjWoGbGxtC0w8TLrqeysrjHm+DOoXupo6TdmlS/mm+empGZx/OGyP+Cwfh+vuGIxLxxw/iCu+txvP9xvMOEq+CEnLdqufZWrPVDsOhjqeNoqMVroOhdoOFgntNJmt8/oOhDncTIiI3EjHbEjFe9iVepl8Cxj7azkIyuhGXRkEK5hj+rkFHIc2y7dXm7dSi4fm/bcwqwdXmmbXmmbVerbiyeb3+dYBy3VUC0UwmUk5uRkZF8j7uGgbtsfquRgDmEdoNrdoOJdUJKj9ZBjMpEhL0jk+g7gcM7gYc2gOAbdb4TgOAbdXl+bbV2bZCSWm+TaVttbW1rXyxZcMdBbbBXXrFBaalJY0ckbLoTbdcTYKYqWb9fUbQ7UbQTUckTUcATUbQNhswOfZ0OX2EOXywNWr  de conferência, sem processar nem compactar. «Conferir o parse» roda o inspetor sobre um arquivo ou pasta à sua escolha, antes de ingerir de verdade. E «Remessa única (pipeline.py --etapas ingestao)» é o outro caminho, o da etapa 1 clássica.</p>\n<p>Abaixo dos botões há sempre o cartão «Comando», com a linha exata que será executada e um «Copiar». Nos atalhos, «Abrir 1_ingestao.xlsx» e «Abrir 2_CURRICULOS».</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — A caixa «Apagar os arquivos de 1_ENTRADA depois de gravar» nasce desmarcada e nunca é herdada da sessão anterior. Apagar a origem depois da gravação conferida é o padrão do módulo e é proteção de dado pessoal em ação: o XML bruto do Lattes traz CPF, RG, data de nascimento e nome dos pais, campos que as dez tabelas canônicas nunca extraem. Manter os arquivos é para teste.</p>\n</blockquote>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — A primeira carga real, em 04/09/2026: 50 currículos — 2 ZIP e 48 XML em ISO-8859-1, alguns com 7,4 MB — ingeridos em 5 segundos, 35.436 linhas nas dez tabelas, nenhuma falha.</p>\n</blockquote>\n<h4 id=\"aba-pipeline\">Aba «2 · Pipeline» — as quatro etapas, o desempate e o «Avançado»</h4>\n<p>Lê-se de cima para baixo. Primeiro o que fazer: «Rodar tudo», «Rodar a seleção», «Parar agora», «Pré-voo» e «Mostrar configuração».</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOoAAAOLCAMAAADZ05ycAAADAFBMVEX///////D//+j//+f//+X//+H//9///9v//9f//9H//8r//8L//77//7j9/f719vj19tTo///i///d///c///o+O3U+/vE///E/8+7//+99vi4//7z8/Px9Pry8vPu8PPp7fPt7/Lw8O7q7c7u6+f/5Mr/5K//3p395JL01qz/yM7/yJP/z3Xk6/bk6O7j6O/k6Nbk6L/h5fXf4+jm5uXk0Kjc4efY3OLa297c2tXa2trcy8fQ5O7W2+HQ6cPW28PW26bS0tPPzci56f/J6uyw6e+x6Mum4/+m49HM2e3D1vXD1uq52+G82cy526ar1+y+y9CT4/+X3v+V4NKg2/id2+Gd28OX0/KPzfOGyP+GyM5tyv7/waL/vHnqvJXmtG/WvqbWvofcrLzcoIndmpDiqnbfqGnWoGbdmlPAwdTArs25urq1rorHm+SlorPKoHqempHIiI3EjHrEjFe9iVepl8C4kLevin/XkDG4fm+fdpi5gUS7dSi4b0GmbXambVega125Uz60UwmEwfl+vuFzwfWLvqSIveNxvP9xvMyA x9RIrsBKt1b0HbbWDOpirSkTdeVagOWjrlD4p4UZqFN/rCcrfNrTa8Xe7FfEzjxR6/4fnFVTeysKBem5tocub7tOU1kdKsNUqwB18VvpoK5eUBfBLXfBpsUR6gqKdMVQV4bCtYs6UQM/Vzfr0Z77JXemberp2SER1iMgpg9mPfrA7J79C2fLFLXfs00wShZQfx/4I1OnWDPGqptnM3XduGwMw/JQVyh8bV4CdbNflgATOJv2vDjqEJxaIVn2sVtUwrTnf3SLWcu45crlt/iCVxp7cMXZ602WsupMNSKb1DPq5iKERlqgbsyDOF30EYTQSMs6TWiYGnpkE4QQagSBOoQQqEMIIVCHEEKgDiGEQB1CCIE6hBACdQghBOoQQgjUIYRAHUIIgTqEEKp/1CGEUMMK1CGEQB1CCIE6hBACdQghBOoQQgjUIYQQqEMIIVCHEEJe/z8gcQogq13QAAAAAABJRU5ErkJggg==\" alt=\"A aba «2 · Pipeline» do Assistente Lattes\"><figcaption>Figura 15.3 — A aba «2 · Pipeline» do Assistente Lattes (captura de 14/09/2026).</figcaption></figure>\n<p>Depois as quatro etapas, uma por linha, na ordem de execução: «1 · Trazer (ingestão em remessa única)», «2 · Classificar (E5 + desempate opcional)», «3 · Medir (contagens por pesquisador)» e «4 · Vetorizar (texto consolidado → vetor E5)». Cada linha tem ícone de estado, caixa de seleção, barra de progresso, tempo estimado, um «Rodar só esta» e o arquivo que gera, com «já gerado» ou «ainda não»: <code>5_RELATORIOS/1_ingestao.xlsx</code>, <code>3_CLASSIFICADO/LATTES_RESUMO.csv</code>, <code>4_RESULTADOS/quantificacao.parquet</code> e <code>4_RESULTADOS/curriculos_vetorizados.parquet</code>.</p>\n<p>Valendo para a execução inteira: «Domínio», «Dispositivo» (auto, cuda ou cpu), «Desempate de precisão (reranker)» e «Demonstração com N currículos simulados». A demonstração gera currículos falsos numa raiz separada, <code>&lt;raiz&gt;/_demo_assistente</code>, e nunca se mistura à base real. Abaixo de tudo, o cartão «Comando» com a linha exata e o «Copiar».</p>\n<p>O botão «Mostrar avançado» abre a calibração fina — margem, limiares, zona cinzenta, <code>reranker_topk</code> e o «Lote do codificador (<code>LATTES_LOTE</code>)» —, com os números lidos do código-fonte, sem importar nada do pipeline. Os botões «Abrir config.py» e «Abrir classificador.py» levam aos arquivos onde esses valores são de fato editados: o assistente não inventa variável que o pipeline não lê.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Mudar o desempate invalida o cache de classificação — tudo é reclassificado. E a classificação domina o tempo total (17). Parar no meio não corrompe nada: o que já foi gravado em disco permanece, e o que não foi é refeito na execução seguinte.</p>\n</blockquote>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Confira <code>5_RELATORIOS/1_ingestao.xlsx</code> antes de olhar qualquer resultado de classificação (14.2).</p>\n</blockquote>\n<h4 id=\"aba-prospecta\">Aba «3 · Prospecta» — preparar o pacote e subir o painel</h4>\n<p>O Prospecta é o painel web que lê o que o pipeline gerou. Vive em <code>sistema/prospecta/</code> e tem manual próprio, <code>sistema/Manual_Prospecta_1.7.docx</code>; aqui ficam só os botões.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOoAAAOLCAMAAADZ05ycAAADAFBMVEX//////+///+j//+X//+H//9///9b//8r//8L//779/f719vj19tXz9vvp9+/p98Ln///i///d///c///g/9nQ///E///U9/O99vi7//+5//+4//+r+Orz8/Px9Pry8vPu8PPp7fPt7/Lq7s3u6+f/587/4rP/6qP/3p3p45v617H304b/yM//yJPk6/bk6O7j6O/k6Nbk6L/h5fLf4+jm5ubk0Kfc5ujY3OLa297c2tXa2trcyNbL6ezW2+HO2+/W28PW26bR0tDPzcjLy8u56f+m4/+y6O6758qr7PDK2O7D1vXD1uqz2ua+y+m528O526az0MuU5/+S4P+X3v+L4+mg2/id2+Gd28Of1P+GyP+T0PGP0eBt1f5py/f6wZr/vHnmvZncwGHWvqbWvofesLTiqnbpsHTbo4LWoGbdmla+wM3Arcuzsqq+rkTHm+GlorPOoXywpFqempG5kLapl8Cgjsa/jI2ojKXIjnXEjFfLkFG8iVefdp60gWK5gUS7dSjFc2ymbXembVerbiiiaVqEwfd+vuFzwfWCuu1xvP+Fs71ruvNWrPVEwOFDseloqN1ipt9kqrGHlctll81doOFdoMOXl5eUkzqRkZGFjmhWl+pJmt88meU/n9BBjMpCjLiNfKp6gsNrdqBrdoOJcbNweztbcsBNfDqYZlidYBxzabSRWm9vUq9PU7BBg787gcM7dcwbdb5BbbAbbrY+fU5BaakyasNBaHU3Vr0aV7gTqb8Tk6ITkZcTiOMTfIATfF8TfFwTbtcTYKYTUc4TUcoTUcATUbSGS5OGS3aGS1eXTVOXTSiCS3qCS1d8S1dkS2BgS15xTShJTZ1BS5NBS41JTXlBS3ZBS3NBS1dJTUgbTZ0bTXkNftESfDoNWbmKSDSRRxx+PRxxITt1MBxRNGxpIUZJIWdJIShEIVEbSZYbIXkbIVwbISkTR7ETPYcTMIwSFhwJSLANMpEMMm9dFURdFRxXFRw7FUQ7FRw4FRwTFWwTFWYTFUcTFUQAAACCxoZHAAB7QUlEQVR42u29DZxdVX3vfUIa0ly8YEDCS+u1vTU EQB1CCIE6hBACdQghBOoQQgjUIYRQ0P8PQAXAQ+PS7jkAAAAASUVORK5CYII=\" alt=\"A aba «3 · Prospecta» do Assistente Lattes\"><figcaption>Figura 15.4 — A aba «3 · Prospecta» do Assistente Lattes (captura de 14/09/2026).</figcaption></figure>\n<p>«Ler estado do pacote» diz quando <code>6_PROSPECTA</code> foi preparada e com quantas pessoas. «Base a servir» escolhe a raiz — a real ou a de demonstração. «Refazer mesmo se já existir (--forcar)» é o que faz o preparar trabalhar quando <code>pessoas.parquet</code> já existe. «Preparar pacote» monta o pacote: lê <code>2_CURRICULOS</code> (inclusive as pastas de lote, deduplicadas pelo manifesto), <code>3_CLASSIFICADO</code> e <code>4_RESULTADOS</code>, e calcula dimensões, rede, BM25 e o índice denso.</p>\n<p>No cartão «Servidor»: «Endereço» (127.0.0.1 é só esta máquina), «Porta» (8100), «Entrar sem senha (só avaliação)», «Subir o Prospecta», «Reiniciar», «Encerrar» e «Abrir no navegador». O selo ao lado da porta é conferido contra a porta real a cada cinco segundos: «parado», «subindo…», «no ar :8100» ou «no ar :8100 (de fora)» — este último quando quem ocupa a porta não foi subido por esta janela. «Preparar e subir» faz as duas coisas de uma vez.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — «Entrar sem senha» só funciona escutando em 127.0.0.1: o servidor recusa fora do loopback, a cada requisição, e o assistente nem tenta. Escolher 0.0.0.0 expõe o painel em HTTP sem criptografia a quem estiver na rede local — e uma faixa de aviso fica à vista enquanto esse endereço estiver escolhido. Encerrar o servidor pede confirmação mostrando os PIDs.</p>\n</blockquote>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Rode «Preparar» de novo sempre que as etapas 3 ou 4 forem refeitas: o painel lê o pacote de <code>6_PROSPECTA</code>, não os Parquet. Ele mostra por conta própria a tarja BASE SIMULADA ou DESATUALIZADA quando for o caso.</p>\n</blockquote>\n<h4 id=\"aba-ia\">Aba «4 · IA» — o Ollama, o provedor das glosas e a chave</h4>\n<p>Cartão «Ollama (local)»: «URL do Ollama», «Verificar Ollama», «Iniciar Ollama» (habilitado só quando ele não responde), «Modelo a baixar» com «Baixar (ollama pull)», «Testar o modelo» e «Descarregar da GPU». É a seção 12 em botões.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOoAAAOLCAMAAADZ05ycAAADAFBMVEX//////+r//+X//+D//9///9H//8r//7///779/f719vj19tXz9vvp9+/p98Li///d///c///f/9PE///V9vS99vi7//+7/8C0/frz8/P+8+L+88P+86Ly8vTu8PPt7/Lp7fPk6/bk6O7u6+fp8+Lp7dfk6Nfp7rnk6Mbk6L/U8uXL6+/E6+ux6O2p6/Dw5PTf5e7f4+jc5Pv/4rz/5p3/3p3m463t1t3c2tXx2rPk0Kf+2IDrzpja2/jY3OLR3fDW2+HP2enY2NnPzcjW28PW26bU2IC65P/B1vWm4//M2e2/2OLA26u53OK528Ov3PGu2fO526a61eCX3v+X3sKg2/id2+Gd28OX0O6T5v+Q4fuM0fB4zfD/w7L/yJP/vHntw53WvofdvHngsa3iqnbpsHTbooPWoGb6ulzpnjXGxtOrvuPFvKOxv7W+rMnFm+PNoXmoppjdmoPdmlPBmmuempGql8C9kZqmjK/KkHTEjFe5fYe2e264h1embVfIkUy5gUTUgAe7dSirbii1Yyy0UwmJx/x+vuGMwrVrwv9xvP9zwfJ/tulpsfNtqOd7pMOXnZCUlJiRkZGTjcVzisOLjU1WrPVhquRdoOFdoMNfntU6qNpJmt9Jmr4OmL9EkNVBjMpEhcJbgcU7gcM7gYckk9qSeq57f52QZ316YICWa1GdYESdYByOYEyPWW9ccslBbbBiarFVbppkclxqX1Q2gOAbdb44bsQRetgedIwRfEoxaMETadUTYKYoWcQNWbgQXkFdUbQ4UbQTUcUTUbQSUbeGS5OGS3aGS1eXTSiCS3qCS1d8S1dkS2JeS11BS5NBS41BS3ZBS3NBS1eoPl2oPjWORVWfQAqLSSh6PkZ+PRx6PgZMR2VjMm9vIVR1MBxxIShpIShIIWZEIVFJIShdFURdFRxXFRw4R7EbTZ0bSZUTR7E8Mm0TPYcTMIwbIXkbIXQbIVMbISk7FUQ7FRw4FRwTFWwTFWYTFUcTFUQST7MSFhwMS7INMpMMMm8AAACeF7kgAAB9SklEQVR42u29D5xdZX3nf41sNsuvu0CjcQ20vyyKKFS2Nhv9UfjtZoluiWmokpUiWWaMBALEIGGEYgxknNSEjImUhJKAgwmMTUDSFrSOwTAtSgrkVQrFadcILyhCfnZRA2bqipg6+3v+P9/n/Llz78ydydw7788rmXvO8/8859z3/T7Pc873VN6KEEItrwpdgBACdQghBOoQQgjUIYQQqEMIIVCHEEKgDiGEQB1CCFVD3a/92m8uvzlq4/m/+Wu/RkchhFoNdf/15ru+sTfoG3dt/K+gDiHUaqj7zZu/8ddae+++e6/Z+MbNv0lHIYRaDHXLe//6r/ft+8XeWz/4wVv3/mLfvr/+67vOp6MQQi2GOmXU7du371/uOr9SOf+uf1GbyqyjoxBCY6F5t2x2umVenVmvPcdvnXPtiFC316Cud3mlsrzXoG6vRN3mlbkcKzfX2cSVK0bXO+fojlnx1nmuLZtVF5m+4rpBqMl0y5XnOF15S70cuOWczMaIUPeN5b/yKwWoW3FLVaBsLgLzipXVUXfLivrwt3KzPrCVCnW2OoO6eSNALkLoKGtzNM3q/v46xNVCuiqou/v85cvPv/UXWdStXFGVSeOBuhW+R+Zt Tpwm5eASofGez3CoQ6PUyD2bIIRQKwjUIYRAHUIIgTqEEAJ1CCEE6hBCCNQhhBCoQwghUIcQQqAOIQTqEEII1CGEUPOjDiGEWlagDiEE6hBCCNQhhBCoQwghUIcQQqAOIYRAHUIIgTqEEIr6/wHwHsWCwp2rzgAAAABJRU5ErkJggg==\" alt=\"A aba «4 · IA» do Assistente Lattes\"><figcaption>Figura 15.5 — A aba «4 · IA» do Assistente Lattes (captura de 14/09/2026).</figcaption></figure>\n<p>Cartão «Quem redige as glosas»: «Provedor das glosas», «Modelo», «Chave de API» — o campo nasce vazio a cada sessão e nunca mostra o que se digita —, «Guardar chave protegida» e «Esquecer chave». Cartão «Dispositivo e GPU»: «Dispositivo do pipeline» e «Ler GPU», que roda o <code>nvidia-smi</code> e mostra a placa e a memória usada — útil para descobrir quem ainda está carregado antes de uma execução longa.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Duas regras, e são do projeto, não da configuração. A primeira: o provedor de nuvem vale só para a redação das glosas do dicionário, que é texto público de categorias. Não existe botão que envie currículo para fora, e a variável que ligaria IA em nuvem no Prospecta nunca é definida — ela é removida do ambiente de todo processo filho. A segunda: a chave fica cifrada pela proteção de dados do Windows em <code>%LOCALAPPDATA%\\AssistenteLattes\\chaves.bin</code>, fora do repositório e ilegível por outra conta ou máquina, e é injetada apenas no processo que redige as glosas. Se uma chave aparecer num log salvo, é defeito — avise.</p>\n</blockquote>\n<p>O mascaramento vale para tudo o que entra no log, e não só para a chave: a senha do primeiro administrador, que o Prospecta imprime em claro ao subir pela primeira vez, aparece uma única vez numa janela «Anote agora» e tem os bytes apagados do arquivo assim que são lidos. Ver também 12.5 e 26.</p>\n<h4 id=\"aba-dicionario\">Aba «5 · Dicionário» — planilha, cobertura e glosas</h4>\n<p>«Abrir a planilha» abre o dicionário do domínio; «Abrir pasta dos backups», as cópias anteriores; «Validar / cobertura» roda a validação e responde no próprio cartão. Depois vêm os controles do assistente de glosas de 13.4: «Taxonomia», «No máximo N categorias», «Reescrever também as que já têm glosa (não revisadas)», «Simular (nada muda)», «Redigir glosas com IA» e «Parar». «Abrir glosas_geradas.xlsx» abre o relatório, cuja aba REVISAR_PRIMEIRO está descrita em 13.6.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOoAAAOLCAMAAADZ05ycAAADAFBMVEX///////L//+z//+j//+f//+X//9///9f//9H//8r//779/f719vj19tXn///i///l/tPd///c///d/+TU+/vE///E/8q7//+5//+4//+5/+C99vjz8/Px9Pry8vPu8PPp7fPr7s7/5PLk6/bk6O7u6+f+6cPk6Njk6Mbk6L/z5eH/4rP/3p3y27Ld5fbi4//f4+jd3/Td4+Xc2tXd36fa8PDY3OLa3L3a2/jW2+Ha2tvW28PW26bI6u+56f/H6Muw6e+x6M7M3vC53eW528Ow3PO526am4/+m48qT4v+X3v+k6Oqg2/id2+Gd28P706vkzbHk0KfS0tLP2enPzcjD1vXE1d7/w7LnvZn/yJP1wZHcxsHWvof+vHnGytfDwdW+v77gsK/iqnbpsHTcoInIrbrSp3/GoIbWoGbHm+rNnX/cmlOj1PiozMGvtLinoqmempGT0fCUyP+GyP+HyM2Swf+Dzet2wfVsw/9+vuGLvqGGvex8uO6Jur1xvP9su+B2p9tlq+eMnrZmqLZgse5ip95fntRWrPVdoOFdoMNBpOtImt65kKzHh5DBkYTEjFe9iVe7g0amlcGbkp+lk4aRkZGuhmWAjMWLgLK8e26mbXembVefdpyldW+7dSirbiigZlmdYByUcbVzabSPcHWSWm+EVXCRXlNYkNBBjMpFhMNji7VrdqFrdoNddb5xdSgpk+Q7gcM7gYccdb8TgOANectecMVBbbBBaalZa3ovY8ATcdkTadUTYKYNWroWVLoPVbFgUbQ6UbQTUc0TUcETUcATUbQSUbeXTXmGS5OGS3aGS1eXTSmCS3qCS1d8S1dkS2eKSDGRRxx+PRxpST1rMm9fS19BS5NBS41BS3ZBS3NBS1dJTUtfM284R7EbTZ0cSY0TR7ETPYcPTLM8Mm8NMp4NMokNMoYMMm8ISLBwITd0MBxJIWZJIShdFURdFRxXFRxCI1M7FUQ7FRw4FRwbIXgbIVMbIVEbISkTMIwTFWwTFWYTFUcTFUQSFhwAAADwM2HJAAB0sklEQVR42u29D7xdVXnnfbRGGweNIqntaPtWJ8qfQOunM9N5QwUdQ02xMmgnkFxKJFwDRBKJvHFqQmiGDARiglwSSE2IRFJQcpE43CYpGL1tUZp5SfxUra8gnjqMEe3VGepYBycVybzrWWs968/e+5x7zr3n3txz8v19knv2Xn+etfbae3/Ps9bae53a6xFCqOdVowkQQqAOIYRAHUIIgTqEEAJ1CCEE6hBCCNQhhBCoQwihZqj7tV+bddkNiS6e9Wu/RkMhhHoNdf/+hgcOJHrghn8P6hBCvYa6WTcc+EvRgd273cbQDbNoKIRQj6Husgf+8i8PHvzugZsvuujmA989ePAv//KB99FQCKEeQ51x6gzffvDAxbXaxQ/8QLYP3EBDIYQmQvO3Bs1vM+sdf6Bbf3DHeFB3Wa12WQXqtq4o5Vixtc0qrrhmfK1ztrTLYtNIri7SRLapuG4Q6jJtXXy21+J2b+A/2PoHhY0xoW5oza/+6rVl1C2+o2l9KsF8zYrmqLtjcXv4W7H1bPkr3wfzA ahrs1cnpAN1CHXItMQw0xIT0YENpAN1CDED29VjdZ50oA4hUNfd0xLDTEsgBOqYgQV1CE0O6vK30kEdqEOIlU3QZKBuHkJoogXqjvoiTiduQAhNtKTThMapsa9sghBC3SBQhxACdQghBOoQQgjUIYQQqEMIIVCHEEKgDiGEQB1CCIE6hBCoQwghUIcQQlMfdQgh1LUCdQghUIcQQqAOIYRAHUIIgTqEEAJ1CCEE6hBCCNQhhFDS/w/Jeg9tiW207wAAAABJRU5ErkJggg==\" alt=\"A aba «8 · Git» do Assistente Lattes\"><figcaption>Figura 15.9 — A aba «8 · Git» do Assistente Lattes (captura de 14/09/2026).</figcaption></figure>\n<p>Depois a barreira. «Conferir dado sensível» cruza os arquivos alterados e novos com os padrões proibidos — <code>CNPQ_bases/</code>, <code>Documentos GECC/</code>, <code>*.parquet</code>, <code>*.xml</code>, <code>*.zip</code>, <code>chaves*</code>, <code>prefs.json</code>, <code>*.log</code>, <code>.env</code>, <code>usuarios.json</code>, <code>auditoria.jsonl</code> e <code>_cofre/</code> — e varre o diff atrás de trechos com cara de chave. A tabela mostra, arquivo por arquivo, se ele entra ou não no commit, e o que estiver marcado como SENSÍVEL fica de fora do <code>git add</code>. Só então «Mensagem do commit», «Gravar (add + commit)» e «Enviar (push)».</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Commit e push só quando alguém pedir, e sempre depois de conferir o dado sensível. O <code>.gitignore</code> não protege arquivo que já foi versionado uma vez.</p>\n</blockquote>\n<h4 id=\"aba-9-comandos\">Aba «9 · Comandos» — escrever um comando, sem sair da janela</h4>\n<p>As oito abas anteriores cobrem o que este manual manda fazer, cada botão montando uma linha conhecida. Esta cobre o resto: o comando que ainda não virou botão, uma pergunta específica ao <code>git log</code>, um script novo. Escreva no campo e tecle Enter — ou clique em «▶ Rodar». A saída vai para o mesmo log das outras abas, e «■ Parar» interrompe.</p>\n<figure class=\"captura\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABOoAAAOLCAMAAADZ05ycAAADAFBMVEX///////L//+j//+f//+X//9P//8r//7/9/f719vj19tXo///i///l/dnc///c/+DZ9vfE///E/8q5//+4//+4/9G99vjz8/Px9Pry  do repositório, de modo que um «cd» colado na frente é reconhecido e retirado — se apontar para outra pasta, ele é obedecido e o log diz de onde veio.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — O que se digita aqui não passa pela trava de «um de cada vez». Os botões das outras abas declaram o que vão usar (a base, a placa de vídeo) e o assistente recusa dois trabalhos que disputariam o mesmo recurso. Um texto livre não dá para adivinhar: se você mandar o pipeline por aqui enquanto ele já roda pela aba 2, as duas execuções escreverão na mesma base. O assistente reconhece os nomes dos programas do projeto e AVISA quando há algo em andamento, mas não bloqueia — a decisão fica com você.</p>\n</blockquote>\n<p>O cartão «Comandos que você mais usa» traz seis atalhos de um clique: o pré-voo, a configuração efetiva, a conferência da raiz do Prospecta, as duas baterias de teste e o «Qual Python?». Pouse o mouse em qualquer um para ver o que ele faz e a linha exata que será executada. Acima deles, uma linha cinzenta mostra a pasta, o interpretador, a raiz das bases e qual PowerShell está instalado — é o que permite conferir em vez de confiar.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Comandos que apagam ou reescrevem pedem confirmação antes de rodar: <code>Remove-Item</code>, <code>git reset --hard</code>, <code>--forcar</code>, e também os dois nomes que neste projeto não têm volta — o manifesto <code>registro_curriculos</code> (a única prova de que um currículo foi ingerido, já que o XML de origem foi apagado) e a pasta <code>_cofre</code> (contas e auditoria do painel). O histórico guarda os 25 últimos comandos, entre sessões, e passa pela mesma máscara do log: um segredo colado por engano não fica em claro no disco.</p>\n</blockquote>\n<p>O último cartão abre uma janela de PowerShell de verdade, já preparada do mesmo jeito. Ela existe por um limite honesto: o log desta janela mostra a saída, mas não tem teclado. Um comando que PERGUNTA alguma coisa — um <code>git push</code> pedindo usuário e senha — ficaria pendurado esperando uma resposta que ninguém pode digitar. Para esses casos, a janela separada.</p>\n<h4 id=\"sem-janela-tres-subcomandos\">Sem janela: três subcomandos</h4>\n<p>O mesmo arquivo responde a três perguntas em JSON, sem abrir janela nenhuma — úteis para diagnosticar uma máquina por telefone ou dentro de um script:</p>\n<pre><code>python ferramentas\\assistente.py --info-ambiente\npython ferramentas\\assistente.py --sonda &lt;raiz&gt;\npython ferramentas\\assistente.py --validar-dicionario industria</code></pre>\n<p><code>--info-ambiente</code> imprime as versões das bibliotecas, o torch, se o CUDA está visível e o nome e a memória da placa. <code>--sonda</code> imprime o estado de <code>2_CURRICULOS</code>: o formato da base, quantos ids há, se são simulados e quantos lotes existem por tabela. <code>--validar-dicionario</code> imprime a cobertura do dicionário do domínio. São exatamente as leituras que a janela usa para se pintar.</p>\n<h4 id=\"roteiro-do-primeiro-dia\">O roteiro do primeiro dia, pelo assistente</h4>\n<p>Nove passos, cada um com aba e botão, nenhum com terminal.</p>\n<ol type=\"1\">\n<li>Dois cliques em <code>Assistente Lattes.vbs</code>.</li>\n<li>Aba «6 · Ambiente»: «Criar as pastas da raiz», se precisar; «Conferir bibliotecas»; «Instalar as que faltam».</li>\n<li>Aba «4 · IA»: «Verificar Ollama» e, se faltar o modelo, «Baixar (ollama pull)».</li>\n<li>Aba «0 · Início»: «Verificar novamente», até as linhas do «Ambiente» ficarem prontas.</li>\n<li>Aba «2 · Pipeline»: ponha «Demonstração com N currículos simulados» em 300 e clique em «Rodar tudo». É o <code>python pipeline.py --demonstracao 300</code> de 14.1.</li>\n<li>Aba «1 · Ingestão»: deposite os arquivos em <code>1_ENTRADA</code>, clique em «Inventariar 1_ENTRADA» e em «Ingerir em lote»; depois «Abrir 2_CURRICULOS» e abra as planilhas de amostra (16.6).</li>\n<li>Aba «2 · Pipeline»: demonstração de volta em 0 e «Rodar tudo»; confira <code>5_RELATORIOS/1_ingestao.xlsx</code> antes de olhar qualquer classificação.</li>\n<li>Aba «3 · Prospecta»: «Preparar e subir» e «Abrir no navegador».</li>\n<li>Aba «7 · Testes»: «Rodar os rápidos em sequência».</li>\n</ol>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Cada passo acima é um comando de 15.1, e o cartão «Comando» mostra qual. Copie-o para documentar um procedimento ou para agendar a execução.</p>\n</blockquote>\n"}, {"titulo": "PARTE III — AS ETAPAS EM DETALHE", "html": "<h1 id=\"parte-iii-as-etapas-em-detalhe\">PARTE III — AS ETAPAS EM DETALHE</h1>\n<p><em>Para cada etapa: o que faz, que arquivo executa, o que entra, o que sai e o que o código faz por dentro.</em></p>\n<h2 id=\"etapa-1-ingestão\">16. Etapa 1 · INGESTÃO</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Pega os dados no formato que vierem e os organiza em dez tabelas sempre iguais.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>etapas/e01_ingestao.py</code></p>\n<blockquote>\n<p><strong>NO TERMINAL</strong></p>\n<pre><code>python pipeline.py --etapas ingestao</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>from etapas import e01_ingestao\ne01_ingestao.executar()                       # lê 1_ENTRADA, grava 2_CURRICULOS\ntabelas = e01_ingestao.carregar_curriculos()  # as dez tabelas, em memória\ntabelas[&quot;identificacao&quot;].head()</code></pre>\n</blockquote>\n<h3 id=\"por-que-existe\">16.1 · Por que existe</h3>\n<p>O resto do sistema precisa saber onde encontrar cada informação. Concentrando a variação de formato aqui, tudo o que vem depois enxerga uma estrutura única.</p>\n<h3 id=\"entradas-e-saídas\">16.2 · Entradas e saídas</h3>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 21%\" />\n<col style=\"width: 75%\" />\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Entra</strong></td>\n<td style=\"text-align: left;\"><code>1_ENTRADA/</code> — XML, ZIP, CSV ou Parquet</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Sai</strong></td>\n<td style=\"text-align: left;\"><code>2_CURRICULOS/*.parquet</code> (10 arquivos) — na ingestão em lote, <code>2_CURRICULOS/&lt;tabela&gt;/lote_*.parquet</code> mais uma planilha <code>&lt;tabela&gt;.xlsx</code> de 1.000 linhas por tabela (16.6)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Relatório</strong></td>\n<td style=\"text-align: left;\"><code>5_RELATORIOS/1_ingestao.xlsx</code></td>\n</tr>\n</tbody>\n</table>\n<p>Para volumes grandes — a partir de dezenas de milhares de currículos, e principalmente para o alvo deste projeto (~1 milhão) — há um segundo caminho de ingestão, em lotes, que não reescreve tudo a cada execução e nunca mantém 1 milhão de XML em disco ao mesmo tempo. Ver 16.6.</p>\n<p>Nesse caminho a saída tem duas formas ao mesmo tempo: cada tabela vira uma pasta <code>2_CURRICULOS/&lt;tabela&gt;/lote_*.parquet</code> — que o <code>pd.read_parquet()</code> lê como se fosse um arquivo só — e ganha ao lado uma planilha <code>2_CURRICULOS/&lt;tabela&gt;.xlsx</code> com as 1.000 primeiras linhas, para conferência (16.6).</p>\n<h3 id=\"as-dez-tabelas-produzidas\">16.3 · As dez tabelas produzidas</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 38%\" />\n<col style=\"width: 38%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Tabela</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n<th style=\"text-align: left;\">De onde vem no Lattes</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>identificacao</code></td>\n<td style=\"text-align: left;\">nome, resumo, UF</td>\n<td style=\"text-align: left;\"><code>DADOS-GERAIS</code> + <code>RESUMO-CV</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>formacao</code></td>\n<td style=\"text-align: left;\">graduação, mestrado, doutorado</td>\n<td style=\"text-align: left;\"><code>FORMACAO-ACADEMICA-TITULACAO</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>atuacao</code></td>\n<td style=\"text-align: left;\">vínculos e atividades</td>\n<td style=\"text-align: left;\"><code>ATUACOES-PROFISSIONAIS</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>areas</code></td>\n<td style=\"text-align: left;\">áreas declaradas (CNPq)</td>\n<td style=\"text-align: left;\"><code>AREAS-DE-ATUACAO</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>publicacoes</code></td>\n<td style=\"text-align: left;\">artigos, livros, eventos</td>\n<td style=\"text-align: left;\"><code>PRODUCAO-BIBLIOGRAFICA</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>producao_tec</code></td>\n<td style=\"text-align: left;\">software, patente, produto</td>\n<td style=\"text-align: left;\"><code>PRODUCAO-TECNICA</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>projetos</code></td>\n<td style=\"text-align: left;\">projetos de P&amp;D</td>\n<td style=\"text-align: left;\"><code>PROJETO-DE-PESQUISA</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>orientacoes</code></td>\n<td style=\"text-align: left;\">orientações</td>\n<td style=\"text-align: left;\"><code>ORIENTACOES-*</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>idiomas</code></td>\n<td style=\"text-align: left;\">idiomas e proficiência</td>\n<td style=\"text-align: left;\"><code>IDIOMAS</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>premios</code></td>\n<td style=\"text-align: left;\">prêmios e títulos</td>\n<td style=\"text-align: left;\"><code>PREMIOS-TITULOS</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"o-que-o-código-faz-passo-a-passo\">16.4 · O que o código faz, passo a passo</h3>\n<p><strong>Passo 1 — obter os dados.</strong> <code>ingestao/adaptadores.py</code> inspeciona a pasta, descobre o formato e chama o leitor certo. O parser de XML percorre os módulos do currículo na mesma ordem em que aparecem na Plataforma, e toda leitura é defensiva: tag ausente vira texto vazio, nunca exceção.</p>\n<p><strong>Passo 2 — relatar problemas sem parar.</strong> Um arquivo corrompido no meio de cinquenta mil não pode derrubar a carga. Ele vira aviso e o processamento continua.</p>\n<p><strong>Passo 3 — descartar cadastros vazios.</strong> Currículos sem nenhuma produção, atuação ou resumo não têm o que classificar e só distorceriam as estatísticas. Controlado por <code>descartar_vazios</code>.</p>\n<p><strong>Passo 4 — gravar em Parquet.</strong> Preserva tipos, ocupa cerca de cinco vezes menos espaço e é lido numa fração do tempo do CSV.</p>\n<p><strong>Passo 5 — gerar o relatório.</strong> Inclui uma aba <code>CONTRATO</code> que documenta o esquema dentro do próprio arquivo.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Tabela ausente nunca derruba o pipeline.</strong> Se a extração não trouxer <code>premios</code>, a etapa avisa e segue. Uma análise com uma dimensão a menos é melhor que nenhuma análise.</p>\n</blockquote>\n<h3 id=\"o-que-conferir-depois\">16.5 · O que conferir depois</h3>\n<blockquote>\n<p><strong>CONFIRA</strong> — Abra <code>1_ingestao.xlsx</code>. A aba <code>RESUMO</code> mostra quantas linhas vieram de cada tabela. Tabela vazia que deveria estar cheia significa que o caminho de tag mudou — veja a seção 24.</p>\n</blockquote>\n<blockquote>\n<p><strong>CONFIRA</strong> — Uma coluna vazia para UM tipo só é o mesmo defeito, mais discreto. Na primeira carga real, <code>1_ingestao.xlsx</code> mostrava 19.884 publicações e 4.710 itens de produção técnica, e ninguém estranhou — mas os 584 capítulos de livro, os 195 produtos tecnológicos e os 164 processos estavam TODOS sem título: o XML chama os atributos de <code>TITULO-DO-CAPITULO-DO-LIVRO</code>, <code>TITULO-DO-PRODUTO</code> e <code>TITULO-DO-PROCESSO</code>, e o leitor pedia outros nomes (o do processo errava até o elemento, que é plural). Nada quebrou; cada item foi classificado só pelo que sobrava, com confiança de 0,82. Desde 14/09/2026 o relatório traz a aba <code>VAZIOS_POR_TIPO</code> (registros, vazios e % por tabela e tipo), o log avisa quando um tipo passa de 50% vazio, e a ingestão em lote repete o aviso por lote. Um tipo em 100% é nome de atributo (seção 24, passo 2); um tipo em 90% pode ser o próprio Lattes — a orientação de pós-doutorado vem sem título em 368 de 391. Conte os nomes de atributo no XML para saber qual dos dois.</p>\n</blockquote>\n\\1 — para milhões de currículos</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Quando são muitos currículos para caber na memória de uma vez, um segundo caminho processa em lotes de ~1.000, só apaga a origem depois de confirmar a gravação, e nunca perde nem duplica um currículo atualizado.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>ingestao/incremental.py</code></p>\n<h4 id=\"por-que-existe-separado-da-etapa-1\">Por que existe, separado da etapa 1</h4>\n<p><code>etapas/e01_ingestao.py</code> lê tudo que está em <code>1_ENTRADA/</code> de uma vez e reescreve as dez tabelas do zero a cada execução — perfeito para uma remessa pontual ou a demonstração, mas não escala para um download contínuo de ~1 milhão de currículos: não cabe tudo na memória ao mesmo tempo, e reprocessar currículos já vistos seria desperdício. O módulo em lote resolve os dois problemas: lotes pequenos e um controle do que já foi processado.</p>\n<h4 id=\"como-os-dados-ficam-organizados-em-disco\">Como os dados ficam organizados em disco</h4>\n<pre><code>2_CURRICULOS/\n  identificacao/\n    lote_000001.parquet      (~1000 currículos, gravado uma vez, imutável)\n    lote_000002.parquet\n  formacao/  atuacao/  publicacoes/  ...  (uma pasta por tabela)\n  _controle/\n    registro_curriculos.parquet   (o manifesto)</code></pre>\n<p><code>pd.read_parquet()</code> lê uma PASTA cheia de .parquet exatamente como lê um arquivo único — por isso <code>carregar_curriculos()</code> (seção 16, acima) e todo o resto do pipeline não precisam saber que existe lote nenhum.</p>\n<h4 id=\"o-manifesto\">O manifesto — o controle de atualização e modificação</h4>\n<p><code>registro_curriculos.parquet</code> guarda uma linha por <code>id_lattes</code>: o hash dos bytes crus do XML, a <code>DATA-ATUALIZACAO</code> do próprio Lattes, em qual lote a versão atual está gravada, e quantas vezes já foi atualizado. Antes de abrir e interpretar um XML inteiro, o sistema calcula o hash dos bytes e compara com o manifesto:</p>\n<ul>\n<li><strong>hash igual</strong> ao já registrado — é o MESMO currículo, sem mudança nenhuma. Nem vale a pena interpretar o XML: o arquivo só é apagado.</li>\n<li><strong>hash diferente (ou id novo)</strong> — currículo novo ou atualizado. Faz o parse, grava no lote atual, atualiza o manifesto.</li>\n</ul>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — O manifesto NÃO é descartável, ao contrário de <code>_trabalho/</code> (que o pipeline reconstrói sozinho a qualquer momento). Ele é a ÚNICA prova de que um currículo já foi processado, porque o XML de origem já foi apagado quando ele é consultado. Inclua-o na rotina de backup, com o mesmo cuidado dado às tabelas compactadas.</p>\n</blockquote>\n<h4 id=\"a-regra-de-segurança\">A regra de segurança: nunca apagar sem confirmar</h4>\n<p>Um arquivo de origem só é apagado depois que: <strong>(1)</strong> o parse funcionou; <strong>(2)</strong> o lote inteiro foi gravado em Parquet; <strong>(3)</strong> a gravação foi CONFERIDA — relida do disco, contagem de linhas bate; <strong>(4)</strong> o manifesto foi atualizado. Se qualquer passo falhar, os arquivos daquele lote são PRESERVADOS, e a próxima execução tenta de novo.</p>\n<h4 id=\"compactação\">Compactação</h4>\n<p>Sem compactação, um currículo atualizado 5 vezes deixaria 5 cópias espalhadas em 5 lotes diferentes — 4 delas já obsoletas. A compactação funde os lotes de uma tabela, mantendo apenas a versão que o manifesto aponta como atual, e reescreve como um número pequeno de arquivos maiores. Não precisa rodar a cada lote — semanalmente, ou a cada N lotes, é suficiente.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — testado com os dois currículos reais de amostra deste projeto: ao reenviar o mesmo arquivo sem mudança nenhuma, o sistema reconheceu a duplicata e não gravou nada de novo. Ao simular uma atualização (mudando a <code>DATA-ATUALIZACAO</code>), o sistema reconheceu como ATUALIZAÇÃO — não como currículo novo, não como duplicata —, e a compactação seguinte descartou a versão antiga automaticamente, mantendo só a mais recente.</p>\n</blockquote>\n<h4 id=\"as-planilhas-de-amostra\">As planilhas de amostra</h4>\n<p>Ao fim de cada processamento e de cada compactação, o módulo grava <code>2_CURRICULOS/&lt;tabela&gt;.xlsx</code> com as 1.000 primeiras linhas de cada uma das dez tabelas — para abrir, filtrar e mostrar a alguém. O Parquet continua sendo o dado completo.</p>\n<p>A amostra é barata de propósito: numa tabela espalhada por centenas de lotes, o sistema lê os lotes em ordem e para assim que junta 1.000 linhas, em vez de carregar tudo para mostrar o começo.</p>\n<blockquote>\n<p><strong>CONFIRA</strong> — Abra <code>2_CURRICULOS/identificacao.xlsx</code> logo depois da primeira ingestão. Se as colunas vieram vazias, o caminho de tag mudou (24) — e você descobre isso antes da classificação, não depois.</p>\n</blockquote>\n<p>Para regravar só as planilhas, sem processar nem compactar:</p>\n<pre><code>python -m ingestao.incremental --amostras</code></pre>\n<h4 id=\"como-usar-16-6\">Como usar</h4>\n<pre><code>python -m ingestao.incremental                    # processa 1_ENTRADA em lotes de 1000\npython -m ingestao.incremental --lote 500          # lotes menores\npython -m ingestao.incremental --manter-arquivos   # não apaga a origem (para testar em segurança)\npython -m ingestao.incremental --compactar         # funde os lotes, descarta versões supersedidas\npython -m ingestao.incremental --amostras          # só regrava as planilhas de conferência (1.000 linhas)</code></pre>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Privacidade: o XML bruto do Lattes (formato “offline”) vem com CPF, RG, data de nascimento e nome dos pais preenchidos — dado sensível que a LGPD regula. As dez tabelas canônicas (<code>contrato.py</code>) NUNCA extraem esses campos; eles só existem enquanto o XML de origem existir em disco. Apagar o XML assim que a tabela é confirmada — o comportamento padrão deste módulo — não é só economia de espaço: é proteção de dado pessoal em ação. Ver também a seção 26, item 7.</p>\n</blockquote>\n<h2 id=\"etapa-2-classificação\">17. Etapa 2 · CLASSIFICAÇÃO</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Atribui a cada pedaço do currículo as categorias do dicionário.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>etapas/e02_classificacao.py</code></p>\n<blockquote>\n<p><strong>NO TERMINAL</strong></p>\n<pre><code>python pipeline.py --etapas classificacao</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>import pipeline\nfrom etapas import e02_classificacao\n\ntaxonomias, dominio = pipeline.carregar_taxonomias(CFG.dominio)\ncodificador, classificador = pipeline.montar_motor()\n\nclassificados = e02_classificacao.executar(\n    tabelas, taxonomias, dominio, classificador)\n\nclassificados[&quot;producao_tecnica&quot;].head()</code></pre>\n</blockquote>\n<h3 id=\"entradas-e-saídas-1\">17.1 · Entradas e saídas</h3>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 76%\" />\n</colgroup>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Entra</strong></td>\n<td style=\"text-align: left;\">tabelas da etapa 1 + dicionário do domínio</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Sai</strong></td>\n<td style=\"text-align: left;\"><code>3_CLASSIFICADO/LATTES_&lt;BLOCO&gt;.csv</code> (um por bloco)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Relatório</strong></td>\n<td style=\"text-align: left;\"><code>5_RELATORIOS/2_classificacao.xlsx</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"o-que-é-um-bloco-a-anatomia-completa\">17.2 · O que é um bloco — a anatomia completa</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Um bloco é uma receita: pegue estas linhas desta tabela, monte o texto assim, e faça a ele estas perguntas.</p>\n</blockquote>\n<p>A seção 3.2 apresentou a palavra. Aqui ela é aberta por inteiro, porque o bloco é a unidade em torno da qual a etapa 2 gira: um arquivo CSV por bloco, um cache por bloco, um limiar por bloco, uma linha de diagnóstico por bloco.</p>\n<p><strong>Um bloco tem cinco partes.</strong> Todas declaradas em <code>dominios/&lt;área&gt;/blocos.py</code>:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Parte</th>\n<th>O que responde</th>\n<th>No bloco “produção técnica”</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>tabela</code></td>\n<td>de onde vêm as linhas</td>\n<td><code>producao_tec</code> (uma das dez tabelas da etapa 1)</td>\n</tr>\n<tr class=\"even\">\n<td><code>texto</code></td>\n<td>como o texto a classificar é montado</td>\n<td>tipo + título + finalidade + palavras-chave</td>\n</tr>\n<tr class=\"odd\">\n<td><code>texto_longo</code></td>\n<td>qual das duas réguas usar</td>\n<td><code>False</code> — é título, não prosa (limiar 0,78)</td>\n</tr>\n<tr class=\"even\">\n<td><code>eixos</code></td>\n<td>quais perguntas são feitas a esse texto</td>\n<td>setor, tecnologia, maturidade</td>\n</tr>\n<tr class=\"odd\">\n<td><code>porque</code></td>\n<td>por que este bloco existe</td>\n<td>“patente, software e produto registram aplicação prática”</td>\n</tr>\n</tbody>\n</table>\n<p><strong>O código, exatamente como está no projeto:</strong></p>\n<pre><code>Bloco(\n    nome=&quot;producao_tecnica&quot;,             # vira LATTES_PRODUCAO_TECNICA.csv\n    rotulo=&quot;Produção técnica&quot;,           # nome legível, para logs e relatórios\n    tabela=&quot;producao_tec&quot;,               # de qual tabela da etapa 1\n    texto=texto_producao_tecnica,        # a função que monta o texto\n    texto_longo=False,                   # título curto → limiar 0,78\n    eixos=[\n        Eixo(&quot;setor_industrial&quot;),                 # um rótulo só\n        Eixo(&quot;tecnologia&quot;, multirrotulo=True),    # pode receber vários\n        Eixo(&quot;maturidade&quot;),                       # um rótulo só\n    ],\n    porque=&quot;Patente, software e produto registram aplicação prática — &quot;\n           &quot;dimensão subvalorizada pela avaliação puramente acadêmica.&quot;,\n)</code></pre>\n<p><strong>Um item percorrido de ponta a ponta.</strong> Uma patente real, do começo ao CSV:</p>\n<div data-lab=\"bloco\">\n\n</div>\n<p><strong>① A linha bruta</strong>, como sai da etapa 1, na tabela <code>producao_tec</code>:</p>\n<pre><code>tipo ............. Patente\ntitulo ........... Processo de obtenção de liga metálica com\n                   resistência à corrosão aumentada\nfinalidade ....... Industrial\npalavras_chave ... liga metálica; corrosão; tratamento térmico</code></pre>\n<p><strong>② O texto montado</strong>, pela função declarada em <code>texto=</code>:</p>\n<pre><code>&quot;Tipo: Patente. Título: Processo de obtenção de liga metálica com\n resistência à corrosão aumentada. Finalidade: Industrial.\n Palavras-chave: liga metálica; corrosão; tratamento térmico&quot;</code></pre>\n<p>Os rótulos (<code>Tipo:</code>, <code>Título:</code>, <code>Finalidade:</code>) não são enfeite. Eles avisam ao modelo que cada trecho é de natureza diferente. Sem eles, isso vira uma sopa de palavras.</p>\n<p><strong>③ As perguntas</strong>, uma por eixo declarado:</p>\n<pre><code>setor      → &quot;em que setor da indústria isto se aplica?&quot;\ntecnologia → &quot;que tecnologia habilitadora aparece aqui?&quot;\nmaturidade → &quot;em que estágio da cadeia P&amp;D → mercado isto está?&quot;</code></pre>\n<p><strong>④ As respostas</strong>, com a confiança de cada uma:</p>\n<pre><code>Setor ........... Metalurgia e Siderurgia        0,83\nTecnologia ...... Novos Materiais                0,79\nMaturidade ...... Demonstração (TRL 7-8)         0,74</code></pre>\n<p><strong>⑤ A linha no CSV</strong> <code>3_CLASSIFICADO/LATTES_PRODUCAO_TECNICA.csv</code>, com quatro colunas por eixo (ver 17.4).</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — O bloco é o formulário; o eixo é cada pergunta do formulário; a categoria é a alternativa marcada. Um currículo preenche sete formulários diferentes, porque tem sete tipos de conteúdo.</p>\n</blockquote>\n<p><strong>Por que sete blocos, e não um texto só?</strong> Três razões:</p>\n<ol type=\"1\">\n<li><strong>Limiares diferentes.</strong> Um título de artigo e um resumo profissional exigem réguas diferentes (7.4). Num texto único, seria uma régua só para tudo.</li>\n<li><strong>Perguntas diferentes.</strong> Faz sentido perguntar a maturidade tecnológica de uma patente; não faz sentido perguntar a maturidade tecnológica de um nome de curso.</li>\n<li><strong>Rastreabilidade.</strong> Com blocos separados, dá para dizer <em>qual item</em> gerou cada rótulo. Num texto único, a resposta seria “o currículo inteiro” — e a auditoria ficaria impossível.</li>\n</ol>\n<p><strong>EIXO</strong> — uma pergunta feita ao texto de um bloco. Cada eixo corresponde a uma taxonomia do dicionário, e o mesmo texto responde a várias.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Uma patente de sensores para silos de grãos é <em>agroindústria</em> (setor), <em>Internet das Coisas</em> (tecnologia) e <em>TRL 7-8</em> (maturidade). São três eixos sobre um único item, três colunas diferentes no CSV, três contagens diferentes na etapa 3.</p>\n</blockquote>\n<h3 id=\"o-cruzamento-que-bloco-encontra-que-parte-do-dicionário-e-por-quê\">17.3 · O cruzamento — que bloco encontra que parte do dicionário, e por quê</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Cada bloco só é cruzado com os eixos que o seu conteúdo consegue responder; perguntar o que o texto não sabe só produziria ruído.</p>\n</blockquote>\n<p><strong>A matriz do domínio “indústria”.</strong> Sete blocos nas linhas, quatro taxonomias nas colunas:</p>\n<table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 10%\" />\n<col style=\"width: 18%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Bloco — tabela de origem</th>\n<th style=\"text-align: center;\">Setor</th>\n<th style=\"text-align: center;\">Competência</th>\n<th style=\"text-align: center;\">Tecnologia</th>\n<th style=\"text-align: center;\">Maturidade</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Resumo</strong> — <code>identificacao</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Formação</strong> — <code>formacao</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Atuação</strong> — <code>atuacao</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Produção técnica</strong> — <code>producao_tec</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Publicações</strong> — <code>publicacoes</code></td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Projetos</strong> — <code>projetos</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Áreas declaradas</strong> — <code>areas</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n</tbody>\n</table>\n<p>Vinte cruzamentos de vinte e oito possíveis. Os oito ausentes são tão informativos quanto os presentes — e é isso que a próxima parte explica.</p>\n<div data-lab=\"matriz\">\n\n</div>\n<p><strong>Bloco a bloco: por que estes eixos, e não os outros</strong></p>\n<p><strong>Resumo</strong> → <em>setor</em> + <em>competência</em></p>\n<p>O resumo é a única prosa autoral do currículo: a pessoa dizendo, com as próprias palavras, o que faz. Isso responde bem a “em que campo você atua” (setor) e “o que você sabe fazer” (competência). <strong>Não</strong> é cruzado com tecnologia nem com maturidade porque o resumo é uma declaração de trajetória, não a descrição de um artefato: quase nunca menciona uma tecnologia habilitadora específica, e nunca informa o estágio TRL de coisa alguma.</p>\n<p><strong>Formação</strong> → <em>competência</em> + <em>setor</em></p>\n<p>O texto é <code>\"Nível: Doutorado. Curso: Engenharia Metalúrgica. Trabalho: Escalonamento de processo fermentativo\"</code>. O título da tese é o que mais informa: “Engenharia Química” é genérico, mas o título do trabalho diz exatamente o que a pessoa sabe fazer — por isso o eixo de competência vem primeiro. O setor entra em segundo lugar, porque um curso muitas vezes já aponta para uma indústria. <strong>Não</strong> cruza com maturidade: um curso não está num estágio de TRL. <strong>Não</strong> cruza com tecnologia: o nome de um curso raramente identifica uma tecnologia habilitadora específica — e forçar o cruzamento produziria acertos por coincidência de vocabulário, exatamente o erro que o limiar mais exigente dos textos curtos existe para evitar.</p>\n<p><strong>Atuação</strong> → <em>os quatro eixos</em></p>\n<p>É o único bloco que recebe todas as perguntas, e a razão é o conteúdo: instituição + cargo + descrição das atividades. Esse texto conta a história completa — onde, em que posição, fazendo o quê. Uma descrição de atividades pode dizer o setor da empresa, a competência exercida, a tecnologia empregada e, quando descreve desenvolvimento, até o estágio de maturidade daquilo. É o bloco mais informativo do currículo, e por isso o mais caro de processar.</p>\n<p><strong>Produção técnica</strong> → <em>setor</em> + <em>tecnologia</em> + <em>maturidade</em></p>\n<p>Patente, software, produto e processo são a dimensão mais próxima da aplicação prática em todo o currículo — e é justamente aí que a pergunta de maturidade faz sentido: uma patente <strong>está</strong> num estágio de TRL, um artefato <strong>existe</strong> em algum grau de prontidão. O eixo de tecnologia também encaixa: um artefato incorpora tecnologias identificáveis. <strong>Não</strong> cruza com competência porque o título de uma patente descreve o <em>objeto</em>, não a habilidade de quem o fez. “Processo de obtenção de liga metálica” diz o que foi produzido; quem quer saber a competência exercida deve olhar a atuação profissional, que é onde ela está escrita.</p>\n<p><strong>Publicações</strong> → <em>competência</em> + <em>tecnologia</em></p>\n<p>O título de um artigo revela o tema de pesquisa: a competência técnica demonstrada e, muitas vezes, a tecnologia estudada. <strong>Não</strong> cruza com setor porque um título acadêmico raramente identifica o setor industrial de aplicação — “Análise de fadiga em juntas soldadas” pode ser naval, automotivo, aeronáutico ou nenhum dos três, e o modelo escolheria um por acaso. <strong>Não</strong> cruza com maturidade porque publicar não é um estágio da cadeia de inovação: publica-se tanto sobre pesquisa fundamental quanto sobre produto em operação.</p>\n<p><strong>Projetos</strong> → <em>setor</em> + <em>maturidade</em> + <em>tecnologia</em></p>\n<p>Título, natureza, descrição e financiador. O financiador é um sinal forte de setor e de maturidade: projeto com fomento de empresa ou de agência aplicada é outra coisa que projeto sem financiamento. A descrição costuma dizer em que ponto da cadeia o trabalho está — pesquisa exploratória, planta piloto, demonstração. <strong>Não</strong> cruza com competência porque o texto descreve o <em>objetivo</em> do projeto, não a habilidade individual de quem participou; e um projeto tem muitos participantes, com competências diferentes.</p>\n<p><strong>Áreas declaradas</strong> → <em>competência</em> + <em>setor</em></p>\n<p>Aqui a pessoa já se classificou, na taxonomia oficial do CNPq: <code>\"Engenharias &gt; Engenharia Mecânica &gt; Processos de Fabricação\"</code>. O sistema reclassifica mesmo assim, e de propósito: a função é <strong>traduzir</strong> do vocabulário acadêmico do CNPq para o vocabulário do domínio. <strong>Não</strong> cruza com tecnologia nem com maturidade: a taxonomia do CNPq é uma classificação de áreas do conhecimento, e não carrega nenhuma informação sobre tecnologia habilitadora ou estágio de prontidão.</p>\n<p><strong>O princípio geral, em uma linha:</strong> <em>só se pergunta ao texto o que ele pode responder.</em> Cruzar um bloco com um eixo que o seu conteúdo não informa não gera erro nem aviso — gera algo pior: um rótulo plausível, escolhido por semelhança superficial de vocabulário, que entra nas contagens da etapa 3 como se fosse um dado.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Cada cruzamento tem um custo real. São 20 cruzamentos, cada um vetorizando os textos do bloco contra as categorias daquela taxonomia. Acrescentar um eixo a um bloco grande aumenta o tempo da etapa 2 e, se o eixo não for adequado ao conteúdo, aumenta também a taxa de indefinidos e de ambíguos no relatório — fazendo parecer que a taxonomia está ruim, quando o problema é a pergunta ter sido feita ao texto errado.</p>\n</blockquote>\n<p><strong>Como mudar um cruzamento.</strong> Acrescentar ou remover uma dimensão é editar uma lista em <code>dominios/industria/blocos.py</code> — não escrever código:</p>\n<pre><code>Bloco(\n    nome=&quot;publicacoes&quot;,\n    ...\n    eixos=[\n        Eixo(&quot;competencia_tec&quot;),\n        Eixo(&quot;tecnologia&quot;, multirrotulo=True),\n        Eixo(&quot;setor_industrial&quot;),      # ⬅️ acrescentar é isto\n    ],\n)</code></pre>\n<blockquote>\n<p><strong>CONFIRA</strong> — Depois de mexer num cruzamento, rode <code>python pipeline.py --etapas classificacao</code> e abra a aba <code>QUALIDADE</code> de <code>2_classificacao.xlsx</code>. Se o eixo novo aparecer com indefinido acima de ~40%, a resposta é clara: aquele texto não sabe responder àquela pergunta. Remova o eixo em vez de culpar a taxonomia.</p>\n</blockquote>\n<h3 id=\"colunas-acrescentadas-a-cada-csv\">17.4 · Colunas acrescentadas a cada CSV</h3>\n<p>Para cada eixo, quatro colunas:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 59%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Coluna</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>&lt;Sigla&gt;_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">a categoria escolhida</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>&lt;Sigla&gt;_Grupo_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">o agrupador dessa categoria</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>CONFIANCA_&lt;Sigla&gt;_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">a proximidade, de 0 a 1</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>TOPK_&lt;Sigla&gt;_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">JSON com as melhores candidatas e suas notas</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — A coluna <code>TOPK</code> é o que torna a decisão <strong>auditável</strong>. Abra o arquivo e veja exatamente por que aquele rótulo venceu, e por quanto. Sem ela, o sistema seria uma caixa-preta.</p>\n</blockquote>\n<h3 id=\"o-que-o-código-faz-passo-a-passo-1\">17.5 · O que o código faz, passo a passo</h3>\n<p><strong>Passo 1 — montar o texto.</strong> Cada bloco tem uma função no arquivo do domínio. Ela junta os campos com rótulos explícitos: <code>\"Instituição: … Cargo: … Atividades: …\"</code>. Os rótulos não são enfeite — avisam ao modelo que cada trecho é de natureza diferente.</p>\n<p><strong>Passo 2 — traduzir os eixos.</strong> A função <code>_montar_eixos()</code> converte a declaração do domínio (<em>“cruze com a taxonomia de setor”</em>) nos parâmetros que o motor precisa (nomes de coluna, limiar, margem).</p>\n<p><strong>Passo 3 — classificar.</strong> Uma única chamada resolve tudo: deduplica, consulta o cache, vetoriza as categorias, aplica limiar e margem, aciona o desempate na zona cinzenta e escreve as colunas.</p>\n<p><strong>Passo 4 — medir a qualidade.</strong> Calcula, por eixo, a taxa de indefinidos e de ambíguos.</p>\n<p><strong>Passo 5 — gravar.</strong></p>\n<h3 id=\"duas-economias-importantes\">17.6 · Duas economias importantes</h3>\n<p><strong>Deduplicação.</strong> Textos idênticos são processados uma vez só. Numa base grande há muita repetição (mesmo curso, mesmo cargo), e isso costuma cortar de 60% a 80% do trabalho. É de graça: textos iguais recebem o mesmo rótulo de qualquer forma.</p>\n<p><strong>Cache.</strong> O que já foi classificado não é refeito. A chave é o <strong>conteúdo</strong> do texto, não um identificador.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Se o pesquisador atualizar o currículo, o conteúdo muda, a chave muda e o item é reclassificado sozinho. Não existe “limpar o cache” manual — o sistema percebe a mudança por conta própria.</p>\n</blockquote>\n<h3 id=\"o-que-conferir-depois-1\">17.7 · O que conferir depois</h3>\n<blockquote>\n<p><strong>CONFIRA</strong> — Abra <code>2_classificacao.xlsx</code>, aba <code>QUALIDADE</code>:</p>\n</blockquote>\n<table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 16%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 56%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Sintoma</th>\n<th style=\"text-align: left;\">Significado</th>\n<th style=\"text-align: left;\">O que fazer</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Indefinido acima de ~40%</td>\n<td style=\"text-align: left;\">A taxonomia não cobre o material</td>\n<td style=\"text-align: left;\">Acrescentar categorias</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ambíguo acima de ~30%</td>\n<td style=\"text-align: left;\">As categorias se confundem</td>\n<td style=\"text-align: left;\">Reescrever glosas de forma contrastiva; rever a margem; conferir se o desempate está ativo</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Indefinido perto de 100%</td>\n<td style=\"text-align: left;\">Limiar alto demais para o modelo em uso</td>\n<td style=\"text-align: left;\">Conferir o modelo; reduzir limiares</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ambos baixos</td>\n<td style=\"text-align: left;\">Taxonomia adequada</td>\n<td style=\"text-align: left;\">Nada</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"etapa-3-quantificação\">18. Etapa 3 · QUANTIFICAÇÃO</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Transforma milhares de linhas classificadas num retrato de uma linha por pesquisador.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>etapas/e03_quantificacao.py</code></p>\n<blockquote>\n<p><strong>NO TERMINAL</strong></p>\n<pre><code>python pipeline.py --etapas quantificacao</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>from etapas import e03_quantificacao\n\nquantificacao = e03_quantificacao.executar(\n    tabelas, classificados, taxonomias, dominio)\n\nquantificacao[[&quot;nome&quot;, &quot;setor_industrial_predominante&quot;,\n               &quot;setor_industrial_concentracao&quot;]].head()</code></pre>\n</blockquote>\n<h3 id=\"o-problema-que-ela-resolve\">18.1 · O problema que ela resolve</h3>\n<p>Depois da etapa 2, um pesquisador com 12 patentes e 30 artigos aparece em 42 linhas. Ninguém lê isso. A pergunta natural é: <em>“afinal, em que esta pessoa atua, e quanto do trabalho dela está ali?”</em></p>\n<h3 id=\"exemplo\">18.2 · Exemplo</h3>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Pesquisadora com 20 itens classificados no eixo “setor”:</p>\n<pre><code>Metalurgia e Siderurgia ........ 12 itens   (60%)\nAutomotiva e Mobilidade ......... 5 itens   (25%)\nMeio Ambiente ................... 2 itens   (10%)\nIndefinido ...................... 1 item     (5%)</code></pre>\n<p>Resultado:</p>\n<pre><code>setor_industrial_predominante .. Metalurgia e Siderurgia\nsetor_industrial_concentracao .. 0,60\nsetor_industrial_diversidade ... 3\nsetor_industrial_itens ......... 19\nsetor_industrial_sem_rotulo .... 1</code></pre>\n</blockquote>\n<h3 id=\"as-três-medidas\">18.3 · As três medidas</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 17%\" />\n<col style=\"width: 31%\" />\n<col style=\"width: 48%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Medida</th>\n<th style=\"text-align: left;\">Pergunta</th>\n<th style=\"text-align: left;\">Como ler</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Predominante</strong></td>\n<td style=\"text-align: left;\">Onde a pessoa atua?</td>\n<td style=\"text-align: left;\">a categoria mais frequente</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Concentração</strong></td>\n<td style=\"text-align: left;\">Quão especialista ela é?</td>\n<td style=\"text-align: left;\">0 a 1. Perto de 1 = focada; perto de 0 = dispersa</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Diversidade</strong></td>\n<td style=\"text-align: left;\">Qual a amplitude do repertório?</td>\n<td style=\"text-align: left;\">em quantas categorias distintas aparece</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Leia concentração e predominante juntos.</strong> Alguém com concentração 0,30 tem um predominante fraco, que pode ser quase um empate. O predominante sozinho esconde isso.</p>\n</blockquote>\n<h3 id=\"por-que-não-há-índice-composto\">18.4 · Por que não há índice composto</h3>\n<p>As três medidas são <strong>contagem pura</strong>. Nenhum peso, nenhuma constante escolhida, nenhum julgamento de valor embutido. Qualquer número desta etapa pode ser reconferido à mão a partir dos CSVs da etapa 2 — e é isso que torna o resultado defensável diante de um comitê.</p>\n<p>Se, mais adiante, houver interesse em um índice sintético, ele deve ser construído <strong>sobre</strong> esta camada, com pesos discutidos e explícitos — nunca embutido nela.</p>\n<h3 id=\"saídas\">18.5 · Saídas</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 46%\" />\n<col style=\"width: 52%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Arquivo</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/quantificacao.parquet</code></td>\n<td style=\"text-align: left;\">uma linha por pesquisador</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/quantificacao.xlsx</code></td>\n<td style=\"text-align: left;\">o mesmo, para abrir no Excel</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/contagens_detalhadas.parquet</code></td>\n<td style=\"text-align: left;\">uma linha por (pesquisador, taxonomia, categoria)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/contagens_detalhadas.xlsx</code></td>\n<td style=\"text-align: left;\">o mesmo, em planilha</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>5_RELATORIOS/3_quantificacao.xlsx</code></td>\n<td style=\"text-align: left;\">panorama agregado</td>\n</tr>\n</tbody>\n</table>\n<p>O arquivo de contagens detalhadas está em <strong>formato longo</strong> de propósito: ele alimenta qualquer tabela dinâmica diretamente, e não muda de estrutura quando o dicionário cresce.</p>\n<p>Desde 14/09/2026 há também <code>n_trabalhos</code>: as publicações descontada a segunda ocorrência do mesmo trabalho (a marca <code>repetida</code>, posta na ingestão). <code>n_publicacoes</code> continua contando registros, como o Lattes mostra; <code>n_trabalhos</code> é a contagem honesta para quem contrata. As duas ficam lado a lado de propósito.</p>\n\\1</h3>\n<p>Quando duas categorias empatam em contagem, vence a primeira em ordem alfabética. Não é a “melhor” escolha — é a <strong>reprodutível</strong>.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Sem essa regra, rodar duas vezes poderia dar resultados diferentes, e nada destrói mais rápido a confiança num sistema analítico.</p>\n</blockquote>\n<h2 id=\"etapa-4-vetorização\">19. Etapa 4 · VETORIZAÇÃO</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Condensa o currículo inteiro num texto único e o converte num vetor.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>etapas/e04_vetorizacao.py</code></p>\n<blockquote>\n<p><strong>NO TERMINAL</strong></p>\n<pre><code>python pipeline.py --etapas vetorizacao</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>from etapas import e04_vetorizacao\n\nbase = e04_vetorizacao.executar(tabelas, quantificacao, codificador)\nlen(base[&quot;vetor&quot;].iloc[0])        # quantas dimensões tem o vetor</code></pre>\n</blockquote>\n<h3 id=\"o-que-é-um-vetor-e-para-que-serve\">19.1 · O que é um vetor, e para que serve</h3>\n<p>É uma lista de números que representa o <strong>significado</strong> do texto. Dois currículos que falam de coisas parecidas produzem vetores próximos, mesmo usando palavras completamente diferentes.</p>\n<p>O vetor é gravado no arquivo de resultados e fica disponível para uso posterior. Qualquer aplicação que precise comparar currículos por semelhança de conteúdo pode consumi-lo diretamente, sem reprocessar nada.</p>\n<h3 id=\"os-três-passos\">19.2 · Os três passos</h3>\n<p><strong>1. Texto consolidado.</strong> Todos os blocos reunidos, com rótulos explícitos:</p>\n<pre><code>Resumo: … || Atuação profissional: … || Produção técnica: … || Projetos: …</code></pre>\n<p><strong>2. Vetor.</strong> O texto vira a lista de números.</p>\n<p><strong>3. Base final.</strong> Vetor + rótulos da etapa 2 + contagens da etapa 3.</p>\n<h3 id=\"a-ordem-dos-blocos-é-a-ponderação\">19.3 · A ordem dos blocos é a ponderação</h3>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Modelos de vetores dão mais importância ao <strong>início</strong> do texto e cortam o fim quando ele fica longo. Portanto a ordem de montagem <strong>é</strong> o peso de cada bloco no vetor final.</p>\n</blockquote>\n<p>Essa ordem não está escondida no código. Está em <code>config.py</code>:</p>\n<pre><code>pesos_blocos = {\n    &quot;resumo&quot;: 1,          # a autodescrição, primeiro\n    &quot;atuacao&quot;: 8,         # onde trabalhou e o que fazia\n    &quot;producao_tec&quot;: 10,   # patentes, software, produtos\n    &quot;projetos&quot;: 5,\n    &quot;formacao&quot;: 6,\n    &quot;publicacoes&quot;: 10,\n    &quot;areas&quot;: 5,\n}</code></pre>\n<p>O número é <strong>quantos itens</strong> daquele bloco entram no texto. Mais itens = mais espaço = mais peso.</p>\n<div data-lab=\"pesos\">\n\n</div>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Para um uso acadêmico, faria sentido subir <code>publicacoes</code> e descer <code>producao_tec</code>. É uma linha de configuração, não uma reescrita.</p>\n</blockquote>\n<h3 id=\"saída\">19.4 · Saída</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 58%\" />\n<col style=\"width: 39%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Arquivo</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/curriculos_vetorizados.parquet</code></td>\n<td style=\"text-align: left;\">com o vetor</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/curriculos_vetorizados.xlsx</code></td>\n<td style=\"text-align: left;\">sem o vetor, para conferência</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"detalhe-de-implementação\">19.5 · Detalhe de implementação</h3>\n<p>O vetor é gravado como <strong>lista de números</strong>, não como array binário. O formato Parquet não tem tipo nativo para array; gravá-lo como binário impediria a leitura por outras ferramentas e linguagens.</p>"}, {"titulo": "PARTE IV — CALIBRAR", "html": "<h1 id=\"parte-iv-calibrar\">PARTE IV — CALIBRAR</h1>\n<p><em>Todos os números ajustáveis, com o efeito de aumentar ou diminuir cada um.</em></p>\n<h2 id=\"todos-os-números-que-você-pode-ajustar\">20. Todos os números que você pode ajustar</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Nenhum valor padrão é uma medição; todos são ponto de partida.</p>\n</blockquote>\n<h3 id=\"visão-geral\">20.1 · Visão geral</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 15%\" />\n<col style=\"width: 37%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Parâmetro</th>\n<th style=\"text-align: left;\">Onde</th>\n<th style=\"text-align: left;\">Padrão</th>\n<th style=\"text-align: left;\">Afeta</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>limiar_curto</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>0.78</code></td>\n<td style=\"text-align: left;\">quantos itens viram <code>Indefinido</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>limiar_longo</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>0.72</code></td>\n<td style=\"text-align: left;\">idem, para textos em prosa</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>margem</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>0.015</code></td>\n<td style=\"text-align: left;\">quantos itens viram <code>ambíguo</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>reranker_ativo</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>True</code></td>\n<td style=\"text-align: left;\">precisão nos casos ambíguos</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>reranker_topk</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>5</code></td>\n<td style=\"text-align: left;\">alcance do desempate (ver 6.5)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>dispositivo</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>\"auto\"</code></td>\n<td style=\"text-align: left;\">GPU ou processador</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>lote</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>32</code></td>\n<td style=\"text-align: left;\">velocidade e memória de vídeo</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>modelo</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\">E5-large</td>\n<td style=\"text-align: left;\">qualidade geral e escala dos limiares</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>pesos_blocos</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\">ver 19.3</td>\n<td style=\"text-align: left;\">composição do vetor</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>descartar_vazios</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>True</code></td>\n<td style=\"text-align: left;\">quantos currículos entram</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>formato</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>\"auto\"</code></td>\n<td style=\"text-align: left;\">como os dados são lidos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>versao</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>\"2026.08-v1\"</code></td>\n<td style=\"text-align: left;\">invalidação do cache</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>dominio</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>\"industria\"</code></td>\n<td style=\"text-align: left;\">qual dicionário e quais blocos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>texto_longo</code></td>\n<td style=\"text-align: left;\"><code>dominios/…/blocos.py</code></td>\n<td style=\"text-align: left;\">por bloco</td>\n<td style=\"text-align: left;\">qual limiar cada bloco usa</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>multirrotulo</code></td>\n<td style=\"text-align: left;\"><code>dominios/…/blocos.py</code></td>\n<td style=\"text-align: left;\">por eixo</td>\n<td style=\"text-align: left;\">um ou vários rótulos por item</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>ativo</code></td>\n<td style=\"text-align: left;\"><code>dominios/…/blocos.py</code></td>\n<td style=\"text-align: left;\"><code>True</code></td>\n<td style=\"text-align: left;\">se o bloco é processado</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>TETO_XLSX</code></td>\n<td style=\"text-align: left;\"><code>nucleo/arquivos.py</code></td>\n<td style=\"text-align: left;\"><code>100_000</code></td>\n<td style=\"text-align: left;\">tamanho das planilhas</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>min_cluster_size</code></td>\n<td style=\"text-align: left;\"><code>semantica/descoberta.py</code></td>\n<td style=\"text-align: left;\"><code>25</code></td>\n<td style=\"text-align: left;\">tamanho mínimo dos grupos</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>n_vizinhos</code></td>\n<td style=\"text-align: left;\"><code>semantica/descoberta.py</code></td>\n<td style=\"text-align: left;\"><code>15</code></td>\n<td style=\"text-align: left;\">granularidade do agrupamento</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>n_componentes</code></td>\n<td style=\"text-align: left;\"><code>semantica/descoberta.py</code></td>\n<td style=\"text-align: left;\"><code>10</code></td>\n<td style=\"text-align: left;\">dimensões após a redução</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>max_amostra</code></td>\n<td style=\"text-align: left;\"><code>semantica/descoberta.py</code></td>\n<td style=\"text-align: left;\"><code>60_000</code></td>\n<td style=\"text-align: left;\">teto da descoberta</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"limiares-limiar_curto-e-limiar_longo\">20.2 · Limiares — <code>limiar_curto</code> e <code>limiar_longo</code></h3>\n<p><strong>O que controlam.</strong> A proximidade mínima para aceitar uma classificação. Abaixo disso, o resultado é <code>Indefinido</code>.</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 55%\" />\n<col style=\"width: 41%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Se você AUMENTAR (ex.: 0,85)</th>\n<th style=\"text-align: left;\">Se você DIMINUIR (ex.: 0,65)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ menos rótulos errados</td>\n<td style=\"text-align: left;\">✅ menos <code>Indefinido</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">❌ muito mais <code>Indefinido</code></td>\n<td style=\"text-align: left;\">❌ muito mais rótulo errado</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ pesquisadores sub-representados na etapa 3</td>\n<td style=\"text-align: left;\">❌ contagens infladas e enganosas</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">postura conservadora</td>\n<td style=\"text-align: left;\">postura arriscada</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Por que são dois.</strong> Textos curtos têm pouco contexto e produzem proximidade alta por acaso — exigem mais. Textos longos diluem o sinal em muitas palavras — exigem menos. Qual dos dois se aplica é decidido pelo <code>texto_longo</code> de cada bloco.</p>\n<p><strong>Sintoma de valor alto demais:</strong> <code>%_indefinido</code> acima de 40% no relatório. <strong>Sintoma de valor baixo demais:</strong> rótulos visivelmente errados com confiança alta, ao inspecionar o CSV.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>A escala depende do modelo.</strong> Trocar o modelo de vetores muda a faixa típica das pontuações, e os limiares precisam ser recalibrados junto. Um valor de 0,78 num modelo pode equivaler a 0,55 noutro.</p>\n</blockquote>\n<h3 id=\"margem-margem\">20.3 · Margem — <code>margem</code></h3>\n<p><strong>O que controla.</strong> A distância mínima entre o primeiro e o segundo colocado para a decisão ser considerada confiante. Abaixo disso, o item é marcado como <code>ambíguo</code> e enviado ao desempate.</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 55%\" />\n<col style=\"width: 42%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Se você AUMENTAR (ex.: 0,05)</th>\n<th style=\"text-align: left;\">Se você DIMINUIR (ex.: 0,005)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ muito mais itens marcados ambíguos</td>\n<td style=\"text-align: left;\">✅ menos ambíguos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">✅ mais itens passam pelo desempate (mais preciso)</td>\n<td style=\"text-align: left;\">❌ empates reais passam despercebidos</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ processamento mais lento</td>\n<td style=\"text-align: left;\">✅ mais rápido</td>\n</tr>\n</tbody>\n</table>\n<p><strong>A armadilha mais comum deste parâmetro.</strong> Em taxonomias grandes (100 ou mais categorias), as pontuações ficam comprimidas numa faixa estreita — quase tudo entre 0,80 e 0,90. Nesse cenário, uma margem fixa dispara em massa e a taxa de ambíguos explode.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Se <code>%_ambiguo</code> passar de ~30%, <strong>suspeite deste parâmetro antes de suspeitar das glosas</strong>. É a causa mais frequente, e a mais fácil de corrigir.</p>\n</blockquote>\n<p><strong
