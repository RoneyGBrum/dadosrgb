s=\"odd\">\n<td style=\"text-align: left;\"><strong>Entra</strong></td>\n<td style=\"text-align: left;\">tabelas da etapa 1 + dicionário do domínio</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Sai</strong></td>\n<td style=\"text-align: left;\"><code>3_CLASSIFICADO/LATTES_&lt;BLOCO&gt;.csv</code> (um por bloco)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Relatório</strong></td>\n<td style=\"text-align: left;\"><code>5_RELATORIOS/2_classificacao.xlsx</code></td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"o-que-é-um-bloco-a-anatomia-completa\">17.2 · O que é um bloco — a anatomia completa</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Um bloco é uma receita: pegue estas linhas desta tabela, monte o texto assim, e faça a ele estas perguntas.</p>\n</blockquote>\n<p>A seção 3.2 apresentou a palavra. Aqui ela é aberta por inteiro, porque o bloco é a unidade em torno da qual a etapa 2 gira: um arquivo CSV por bloco, um cache por bloco, um limiar por bloco, uma linha de diagnóstico por bloco.</p>\n<p><strong>Um bloco tem cinco partes.</strong> Todas declaradas em <code>dominios/&lt;área&gt;/blocos.py</code>:</p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th>Parte</th>\n<th>O que responde</th>\n<th>No bloco “produção técnica”</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td><code>tabela</code></td>\n<td>de onde vêm as linhas</td>\n<td><code>producao_tec</code> (uma das dez tabelas da etapa 1)</td>\n</tr>\n<tr class=\"even\">\n<td><code>texto</code></td>\n<td>como o texto a classificar é montado</td>\n<td>tipo + título + finalidade + palavras-chave</td>\n</tr>\n<tr class=\"odd\">\n<td><code>texto_longo</code></td>\n<td>qual das duas réguas usar</td>\n<td><code>False</code> — é título, não prosa (limiar 0,78)</td>\n</tr>\n<tr class=\"even\">\n<td><code>eixos</code></td>\n<td>quais perguntas são feitas a esse texto</td>\n<td>setor, tecnologia, maturidade</td>\n</tr>\n<tr class=\"odd\">\n<td><code>porque</code></td>\n<td>por que este bloco existe</td>\n<td>“patente, software e produto registram aplicação prática”</td>\n</tr>\n</tbody>\n</table>\n<p><strong>O código, exatamente como está no projeto:</strong></p>\n<pre><code>Bloco(\n    nome=&quot;producao_tecnica&quot;,             # vira LATTES_PRODUCAO_TECNICA.csv\n    rotulo=&quot;Produção técnica&quot;,           # nome legível, para logs e relatórios\n    tabela=&quot;producao_tec&quot;,               # de qual tabela da etapa 1\n    texto=texto_producao_tecnica,        # a função que monta o texto\n    texto_longo=False,                   # título curto → limiar 0,78\n    eixos=[\n        Eixo(&quot;setor_industrial&quot;),                 # um rótulo só\n        Eixo(&quot;tecnologia&quot;, multirrotulo=True),    # pode receber vários\n        Eixo(&quot;maturidade&quot;),                       # um rótulo só\n    ],\n    porque=&quot;Patente, software e produto registram aplicação prática — &quot;\n           &quot;dimensão subvalorizada pela avaliação puramente acadêmica.&quot;,\n)</code></pre>\n<p><strong>Um item percorrido de ponta a ponta.</strong> Uma patente real, do começo ao CSV:</p>\n<div data-lab=\"bloco\">\n\n</div>\n<p><strong>① A linha bruta</strong>, como sai da etapa 1, na tabela <code>producao_tec</code>:</p>\n<pre><code>tipo ............. Patente\ntitulo ........... Processo de obtenção de liga metálica com\n                   resistência à corrosão aumentada\nfinalidade ....... Industrial\npalavras_chave ... liga metálica; corrosão; tratamento térmico</code></pre>\n<p><strong>② O texto montado</strong>, pela função declarada em <code>texto=</code>:</p>\n<pre><code>&quot;Tipo: Patente. Título: Processo de obtenção de liga metálica com\n resistência à corrosão aumentada. Finalidade: Industrial.\n Palavras-chave: liga metálica; corrosão; tratamento térmico&quot;</code></pre>\n<p>Os rótulos (<code>Tipo:</code>, <code>Título:</code>, <code>Finalidade:</code>) não são enfeite. Eles avisam ao modelo que cada trecho é de natureza diferente. Sem eles, isso vira uma sopa de palavras.</p>\n<p><strong>③ As perguntas</strong>, uma por eixo declarado:</p>\n<pre><code>setor      → &quot;em que setor da indústria isto se aplica?&quot;\ntecnologia → &quot;que tecnologia habilitadora aparece aqui?&quot;\nmaturidade → &quot;em que estágio da cadeia P&amp;D → mercado isto está?&quot;</code></pre>\n<p><strong>④ As respostas</strong>, com a confiança de cada uma:</p>\n<pre><code>Setor ........... Metalurgia e Siderurgia        0,83\nTecnologia ...... Novos Materiais                0,79\nMaturidade ...... Demonstração (TRL 7-8)         0,74</code></pre>\n<p><strong>⑤ A linha no CSV</strong> <code>3_CLASSIFICADO/LATTES_PRODUCAO_TECNICA.csv</code>, com quatro colunas por eixo (ver 17.4).</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — O bloco é o formulário; o eixo é cada pergunta do formulário; a categoria é a alternativa marcada. Um currículo preenche sete formulários diferentes, porque tem sete tipos de conteúdo.</p>\n</blockquote>\n<p><strong>Por que sete blocos, e não um texto só?</strong> Três razões:</p>\n<ol type=\"1\">\n<li><strong>Limiares diferentes.</strong> Um título de artigo e um resumo profissional exigem réguas diferentes (7.4). Num texto único, seria uma régua só para tudo.</li>\n<li><strong>Perguntas diferentes.</strong> Faz sentido perguntar a maturidade tecnológica de uma patente; não faz sentido perguntar a maturidade tecnológica de um nome de curso.</li>\n<li><strong>Rastreabilidade.</strong> Com blocos separados, dá para dizer <em>qual item</em> gerou cada rótulo. Num texto único, a resposta seria “o currículo inteiro” — e a auditoria ficaria impossível.</li>\n</ol>\n<p><strong>EIXO</strong> — uma pergunta feita ao texto de um bloco. Cada eixo corresponde a uma taxonomia do dicionário, e o mesmo texto responde a várias.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Uma patente de sensores para silos de grãos é <em>agroindústria</em> (setor), <em>Internet das Coisas</em> (tecnologia) e <em>TRL 7-8</em> (maturidade). São três eixos sobre um único item, três colunas diferentes no CSV, três contagens diferentes na etapa 3.</p>\n</blockquote>\n<h3 id=\"o-cruzamento-que-bloco-encontra-que-parte-do-dicionário-e-por-quê\">17.3 · O cruzamento — que bloco encontra que parte do dicionário, e por quê</h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Cada bloco só é cruzado com os eixos que o seu conteúdo consegue responder; perguntar o que o texto não sabe só produziria ruído.</p>\n</blockquote>\n<p><strong>A matriz do domínio “indústria”.</strong> Sete blocos nas linhas, quatro taxonomias nas colunas:</p>\n<table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 10%\" />\n<col style=\"width: 18%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 16%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Bloco — tabela de origem</th>\n<th style=\"text-align: center;\">Setor</th>\n<th style=\"text-align: center;\">Competência</th>\n<th style=\"text-align: center;\">Tecnologia</th>\n<th style=\"text-align: center;\">Maturidade</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Resumo</strong> — <code>identificacao</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Formação</strong> — <code>formacao</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Atuação</strong> — <code>atuacao</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Produção técnica</strong> — <code>producao_tec</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Publicações</strong> — <code>publicacoes</code></td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Projetos</strong> — <code>projetos</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Áreas declaradas</strong> — <code>areas</code></td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">✅</td>\n<td style=\"text-align: center;\">—</td>\n<td style=\"text-align: center;\">—</td>\n</tr>\n</tbody>\n</table>\n<p>Vinte cruzamentos de vinte e oito possíveis. Os oito ausentes são tão informativos quanto os presentes — e é isso que a próxima parte explica.</p>\n<div data-lab=\"matriz\">\n\n</div>\n<p><strong>Bloco a bloco: por que estes eixos, e não os outros</strong></p>\n<p><strong>Resumo</strong> → <em>setor</em> + <em>competência</em></p>\n<p>O resumo é a única prosa autoral do currículo: a pessoa dizendo, com as próprias palavras, o que faz. Isso responde bem a “em que campo você atua” (setor) e “o que você sabe fazer” (competência). <strong>Não</strong> é cruzado com tecnologia nem com maturidade porque o resumo é uma declaração de trajetória, não a descrição de um artefato: quase nunca menciona uma tecnologia habilitadora específica, e nunca informa o estágio TRL de coisa alguma.</p>\n<p><strong>Formação</strong> → <em>competência</em> + <em>setor</em></p>\n<p>O texto é <code>\"Nível: Doutorado. Curso: Engenharia Metalúrgica. Trabalho: Escalonamento de processo fermentativo\"</code>. O título da tese é o que mais informa: “Engenharia Química” é genérico, mas o título do trabalho diz exatamente o que a pessoa sabe fazer — por isso o eixo de competência vem primeiro. O setor entra em segundo lugar, porque um curso muitas vezes já aponta para uma indústria. <strong>Não</strong> cruza com maturidade: um curso não está num estágio de TRL. <strong>Não</strong> cruza com tecnologia: o nome de um curso raramente identifica uma tecnologia habilitadora específica — e forçar o cruzamento produziria acertos por coincidência de vocabulário, exatamente o erro que o limiar mais exigente dos textos curtos existe para evitar.</p>\n<p><strong>Atuação</strong> → <em>os quatro eixos</em></p>\n<p>É o único bloco que recebe todas as perguntas, e a razão é o conteúdo: instituição + cargo + descrição das atividades. Esse texto conta a história completa — onde, em que posição, fazendo o quê. Uma descrição de atividades pode dizer o setor da empresa, a competência exercida, a tecnologia empregada e, quando descreve desenvolvimento, até o estágio de maturidade daquilo. É o bloco mais informativo do currículo, e por isso o mais caro de processar.</p>\n<p><strong>Produção técnica</strong> → <em>setor</em> + <em>tecnologia</em> + <em>maturidade</em></p>\n<p>Patente, software, produto e processo são a dimensão mais próxima da aplicação prática em todo o currículo — e é justamente aí que a pergunta de maturidade faz sentido: uma patente <strong>está</strong> num estágio de TRL, um artefato <strong>existe</strong> em algum grau de prontidão. O eixo de tecnologia também encaixa: um artefato incorpora tecnologias identificáveis. <strong>Não</strong> cruza com competência porque o título de uma patente descreve o <em>objeto</em>, não a habilidade de quem o fez. “Processo de obtenção de liga metálica” diz o que foi produzido; quem quer saber a competência exercida deve olhar a atuação profissional, que é onde ela está escrita.</p>\n<p><strong>Publicações</strong> → <em>competência</em> + <em>tecnologia</em></p>\n<p>O título de um artigo revela o tema de pesquisa: a competência técnica demonstrada e, muitas vezes, a tecnologia estudada. <strong>Não</strong> cruza com setor porque um título acadêmico raramente identifica o setor industrial de aplicação — “Análise de fadiga em juntas soldadas” pode ser naval, automotivo, aeronáutico ou nenhum dos três, e o modelo escolheria um por acaso. <strong>Não</strong> cruza com maturidade porque publicar não é um estágio da cadeia de inovação: publica-se tanto sobre pesquisa fundamental quanto sobre produto em operação.</p>\n<p><strong>Projetos</strong> → <em>setor</em> + <em>maturidade</em> + <em>tecnologia</em></p>\n<p>Título, natureza, descrição e financiador. O financiador é um sinal forte de setor e de maturidade: projeto com fomento de empresa ou de agência aplicada é outra coisa que projeto sem financiamento. A descrição costuma dizer em que ponto da cadeia o trabalho está — pesquisa exploratória, planta piloto, demonstração. <strong>Não</strong> cruza com competência porque o texto descreve o <em>objetivo</em> do projeto, não a habilidade individual de quem participou; e um projeto tem muitos participantes, com competências diferentes.</p>\n<p><strong>Áreas declaradas</strong> → <em>competência</em> + <em>setor</em></p>\n<p>Aqui a pessoa já se classificou, na taxonomia oficial do CNPq: <code>\"Engenharias &gt; Engenharia Mecânica &gt; Processos de Fabricação\"</code>. O sistema reclassifica mesmo assim, e de propósito: a função é <strong>traduzir</strong> do vocabulário acadêmico do CNPq para o vocabulário do domínio. <strong>Não</strong> cruza com tecnologia nem com maturidade: a taxonomia do CNPq é uma classificação de áreas do conhecimento, e não carrega nenhuma informação sobre tecnologia habilitadora ou estágio de prontidão.</p>\n<p><strong>O princípio geral, em uma linha:</strong> <em>só se pergunta ao texto o que ele pode responder.</em> Cruzar um bloco com um eixo que o seu conteúdo não informa não gera erro nem aviso — gera algo pior: um rótulo plausível, escolhido por semelhança superficial de vocabulário, que entra nas contagens da etapa 3 como se fosse um dado.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Cada cruzamento tem um custo real. São 20 cruzamentos, cada um vetorizando os textos do bloco contra as categorias daquela taxonomia. Acrescentar um eixo a um bloco grande aumenta o tempo da etapa 2 e, se o eixo não for adequado ao conteúdo, aumenta também a taxa de indefinidos e de ambíguos no relatório — fazendo parecer que a taxonomia está ruim, quando o problema é a pergunta ter sido feita ao texto errado.</p>\n</blockquote>\n<p><strong>Como mudar um cruzamento.</strong> Acrescentar ou remover uma dimensão é editar uma lista em <code>dominios/industria/blocos.py</code> — não escrever código:</p>\n<pre><code>Bloco(\n    nome=&quot;publicacoes&quot;,\n    ...\n    eixos=[\n        Eixo(&quot;competencia_tec&quot;),\n        Eixo(&quot;tecnologia&quot;, multirrotulo=True),\n        Eixo(&quot;setor_industrial&quot;),      # ⬅️ acrescentar é isto\n    ],\n)</code></pre>\n<blockquote>\n<p><strong>CONFIRA</strong> — Depois de mexer num cruzamento, rode <code>python pipeline.py --etapas classificacao</code> e abra a aba <code>QUALIDADE</code> de <code>2_classificacao.xlsx</code>. Se o eixo novo aparecer com indefinido acima de ~40%, a resposta é clara: aquele texto não sabe responder àquela pergunta. Remova o eixo em vez de culpar a taxonomia.</p>\n</blockquote>\n<h3 id=\"colunas-acrescentadas-a-cada-csv\">17.4 · Colunas acrescentadas a cada CSV</h3>\n<p>Para cada eixo, quatro colunas:</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 59%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Coluna</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>&lt;Sigla&gt;_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">a categoria escolhida</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>&lt;Sigla&gt;_Grupo_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">o agrupador dessa categoria</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>CONFIANCA_&lt;Sigla&gt;_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">a proximidade, de 0 a 1</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>TOPK_&lt;Sigla&gt;_&lt;BLOCO&gt;</code></td>\n<td style=\"text-align: left;\">JSON com as melhores candidatas e suas notas</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — A coluna <code>TOPK</code> é o que torna a decisão <strong>auditável</strong>. Abra o arquivo e veja exatamente por que aquele rótulo venceu, e por quanto. Sem ela, o sistema seria uma caixa-preta.</p>\n</blockquote>\n<h3 id=\"o-que-o-código-faz-passo-a-passo-1\">17.5 · O que o código faz, passo a passo</h3>\n<p><strong>Passo 1 — montar o texto.</strong> Cada bloco tem uma função no arquivo do domínio. Ela junta os campos com rótulos explícitos: <code>\"Instituição: … Cargo: … Atividades: …\"</code>. Os rótulos não são enfeite — avisam ao modelo que cada trecho é de natureza diferente.</p>\n<p><strong>Passo 2 — traduzir os eixos.</strong> A função <code>_montar_eixos()</code> converte a declaração do domínio (<em>“cruze com a taxonomia de setor”</em>) nos parâmetros que o motor precisa (nomes de coluna, limiar, margem).</p>\n<p><strong>Passo 3 — classificar.</strong> Uma única chamada resolve tudo: deduplica, consulta o cache, vetoriza as categorias, aplica limiar e margem, aciona o desempate na zona cinzenta e escreve as colunas.</p>\n<p><strong>Passo 4 — medir a qualidade.</strong> Calcula, por eixo, a taxa de indefinidos e de ambíguos.</p>\n<p><strong>Passo 5 — gravar.</strong></p>\n<h3 id=\"duas-economias-importantes\">17.6 · Duas economias importantes</h3>\n<p><strong>Deduplicação.</strong> Textos idênticos são processados uma vez só. Numa base grande há muita repetição (mesmo curso, mesmo cargo), e isso costuma cortar de 60% a 80% do trabalho. É de graça: textos iguais recebem o mesmo rótulo de qualquer forma.</p>\n<p><strong>Cache.</strong> O que já foi classificado não é refeito. A chave é o <strong>conteúdo</strong> do texto, não um identificador.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Se o pesquisador atualizar o currículo, o conteúdo muda, a chave muda e o item é reclassificado sozinho. Não existe “limpar o cache” manual — o sistema percebe a mudança por conta própria.</p>\n</blockquote>\n<h3 id=\"o-que-conferir-depois-1\">17.7 · O que conferir depois</h3>\n<blockquote>\n<p><strong>CONFIRA</strong> — Abra <code>2_classificacao.xlsx</code>, aba <code>QUALIDADE</code>:</p>\n</blockquote>\n<table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 16%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 56%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Sintoma</th>\n<th style=\"text-align: left;\">Significado</th>\n<th style=\"text-align: left;\">O que fazer</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Indefinido acima de ~40%</td>\n<td style=\"text-align: left;\">A taxonomia não cobre o material</td>\n<td style=\"text-align: left;\">Acrescentar categorias</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ambíguo acima de ~30%</td>\n<td style=\"text-align: left;\">As categorias se confundem</td>\n<td style=\"text-align: left;\">Reescrever glosas de forma contrastiva; rever a margem; conferir se o desempate está ativo</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Indefinido perto de 100%</td>\n<td style=\"text-align: left;\">Limiar alto demais para o modelo em uso</td>\n<td style=\"text-align: left;\">Conferir o modelo; reduzir limiares</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ambos baixos</td>\n<td style=\"text-align: left;\">Taxonomia adequada</td>\n<td style=\"text-align: left;\">Nada</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"etapa-3-quantificação\">18. Etapa 3 · QUANTIFICAÇÃO</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Transforma milhares de linhas classificadas num retrato de uma linha por pesquisador.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>etapas/e03_quantificacao.py</code></p>\n<blockquote>\n<p><strong>NO TERMINAL</strong></p>\n<pre><code>python pipeline.py --etapas quantificacao</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>from etapas import e03_quantificacao\n\nquantificacao = e03_quantificacao.executar(\n    tabelas, classificados, taxonomias, dominio)\n\nquantificacao[[&quot;nome&quot;, &quot;setor_industrial_predominante&quot;,\n               &quot;setor_industrial_concentracao&quot;]].head()</code></pre>\n</blockquote>\n<h3 id=\"o-problema-que-ela-resolve\">18.1 · O problema que ela resolve</h3>\n<p>Depois da etapa 2, um pesquisador com 12 patentes e 30 artigos aparece em 42 linhas. Ninguém lê isso. A pergunta natural é: <em>“afinal, em que esta pessoa atua, e quanto do trabalho dela está ali?”</em></p>\n<h3 id=\"exemplo\">18.2 · Exemplo</h3>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Pesquisadora com 20 itens classificados no eixo “setor”:</p>\n<pre><code>Metalurgia e Siderurgia ........ 12 itens   (60%)\nAutomotiva e Mobilidade ......... 5 itens   (25%)\nMeio Ambiente ................... 2 itens   (10%)\nIndefinido ...................... 1 item     (5%)</code></pre>\n<p>Resultado:</p>\n<pre><code>setor_industrial_predominante .. Metalurgia e Siderurgia\nsetor_industrial_concentracao .. 0,60\nsetor_industrial_diversidade ... 3\nsetor_industrial_itens ......... 19\nsetor_industrial_sem_rotulo .... 1</code></pre>\n</blockquote>\n<h3 id=\"as-três-medidas\">18.3 · As três medidas</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 17%\" />\n<col style=\"width: 31%\" />\n<col style=\"width: 48%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Medida</th>\n<th style=\"text-align: left;\">Pergunta</th>\n<th style=\"text-align: left;\">Como ler</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Predominante</strong></td>\n<td style=\"text-align: left;\">Onde a pessoa atua?</td>\n<td style=\"text-align: left;\">a categoria mais frequente</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><strong>Concentração</strong></td>\n<td style=\"text-align: left;\">Quão especialista ela é?</td>\n<td style=\"text-align: left;\">0 a 1. Perto de 1 = focada; perto de 0 = dispersa</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><strong>Diversidade</strong></td>\n<td style=\"text-align: left;\">Qual a amplitude do repertório?</td>\n<td style=\"text-align: left;\">em quantas categorias distintas aparece</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>Leia concentração e predominante juntos.</strong> Alguém com concentração 0,30 tem um predominante fraco, que pode ser quase um empate. O predominante sozinho esconde isso.</p>\n</blockquote>\n<h3 id=\"por-que-não-há-índice-composto\">18.4 · Por que não há índice composto</h3>\n<p>As três medidas são <strong>contagem pura</strong>. Nenhum peso, nenhuma constante escolhida, nenhum julgamento de valor embutido. Qualquer número desta etapa pode ser reconferido à mão a partir dos CSVs da etapa 2 — e é isso que torna o resultado defensável diante de um comitê.</p>\n<p>Se, mais adiante, houver interesse em um índice sintético, ele deve ser construído <strong>sobre</strong> esta camada, com pesos discutidos e explícitos — nunca embutido nela.</p>\n<h3 id=\"saídas\">18.5 · Saídas</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 46%\" />\n<col style=\"width: 52%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Arquivo</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/quantificacao.parquet</code></td>\n<td style=\"text-align: left;\">uma linha por pesquisador</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/quantificacao.xlsx</code></td>\n<td style=\"text-align: left;\">o mesmo, para abrir no Excel</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/contagens_detalhadas.parquet</code></td>\n<td style=\"text-align: left;\">uma linha por (pesquisador, taxonomia, categoria)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/contagens_detalhadas.xlsx</code></td>\n<td style=\"text-align: left;\">o mesmo, em planilha</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>5_RELATORIOS/3_quantificacao.xlsx</code></td>\n<td style=\"text-align: left;\">panorama agregado</td>\n</tr>\n</tbody>\n</table>\n<p>O arquivo de contagens detalhadas está em <strong>formato longo</strong> de propósito: ele alimenta qualquer tabela dinâmica diretamente, e não muda de estrutura quando o dicionário cresce.</p>\n<h3 id=\"detalhe-de-implementação-desempate\">18.6 · Detalhe de implementação: desempate</h3>\n<p>Quando duas categorias empatam em contagem, vence a primeira em ordem alfabética. Não é a “melhor” escolha — é a <strong>reprodutível</strong>.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Sem essa regra, rodar duas vezes poderia dar resultados diferentes, e nada destrói mais rápido a confiança num sistema analítico.</p>\n</blockquote>\n<h2 id=\"etapa-4-vetorização\">19. Etapa 4 · VETORIZAÇÃO</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Condensa o currículo inteiro num texto único e o converte num vetor.</p>\n</blockquote>\n<p><strong>Arquivo:</strong> <code>etapas/e04_vetorizacao.py</code></p>\n<blockquote>\n<p><strong>NO TERMINAL</strong></p>\n<pre><code>python pipeline.py --etapas vetorizacao</code></pre>\n<p><strong>NO NOTEBOOK</strong></p>\n<pre><code>from etapas import e04_vetorizacao\n\nbase = e04_vetorizacao.executar(tabelas, quantificacao, codificador)\nlen(base[&quot;vetor&quot;].iloc[0])        # quantas dimensões tem o vetor</code></pre>\n</blockquote>\n<h3 id=\"o-que-é-um-vetor-e-para-que-serve\">19.1 · O que é um vetor, e para que serve</h3>\n<p>É uma lista de números que representa o <strong>significado</strong> do texto. Dois currículos que falam de coisas parecidas produzem vetores próximos, mesmo usando palavras completamente diferentes.</p>\n<p>O vetor é gravado no arquivo de resultados e fica disponível para uso posterior. Qualquer aplicação que precise comparar currículos por semelhança de conteúdo pode consumi-lo diretamente, sem reprocessar nada.</p>\n<h3 id=\"os-três-passos\">19.2 · Os três passos</h3>\n<p><strong>1. Texto consolidado.</strong> Todos os blocos reunidos, com rótulos explícitos:</p>\n<pre><code>Resumo: … || Atuação profissional: … || Produção técnica: … || Projetos: …</code></pre>\n<p><strong>2. Vetor.</strong> O texto vira a lista de números.</p>\n<p><strong>3. Base final.</strong> Vetor + rótulos da etapa 2 + contagens da etapa 3.</p>\n<h3 id=\"a-ordem-dos-blocos-é-a-ponderação\">19.3 · A ordem dos blocos é a ponderação</h3>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Modelos de vetores dão mais importância ao <strong>início</strong> do texto e cortam o fim quando ele fica longo. Portanto a ordem de montagem <strong>é</strong> o peso de cada bloco no vetor final.</p>\n</blockquote>\n<p>Essa ordem não está escondida no código. Está em <code>config.py</code>:</p>\n<pre><code>pesos_blocos = {\n    &quot;resumo&quot;: 1,          # a autodescrição, primeiro\n    &quot;atuacao&quot;: 8,         # onde trabalhou e o que fazia\n    &quot;producao_tec&quot;: 10,   # patentes, software, produtos\n    &quot;projetos&quot;: 5,\n    &quot;formacao&quot;: 6,\n    &quot;publicacoes&quot;: 10,\n    &quot;areas&quot;: 5,\n}</code></pre>\n<p>O número é <strong>quantos itens</strong> daquele bloco entram no texto. Mais itens = mais espaço = mais peso.</p>\n<div data-lab=\"pesos\">\n\n</div>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Para um uso acadêmico, faria sentido subir <code>publicacoes</code> e descer <code>producao_tec</code>. É uma linha de configuração, não uma reescrita.</p>\n</blockquote>\n<h3 id=\"saída\">19.4 · Saída</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 58%\" />\n<col style=\"width: 39%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Arquivo</th>\n<th style=\"text-align: left;\">Conteúdo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/curriculos_vetorizados.parquet</code></td>\n<td style=\"text-align: left;\">com o vetor</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>4_RESULTADOS/curriculos_vetorizados.xlsx</code></td>\n<td style=\"text-align: left;\">sem o vetor, para conferência</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"detalhe-de-implementação\">19.5 · Detalhe de implementação</h3>\n<p>O vetor é gravado como <strong>lista de números</strong>, não como array binário. O formato Parquet não tem tipo nativo para array; gravá-lo como binário impediria a leitura por outras ferramentas e linguagens.</p>"}, {"titulo": "PARTE IV — CALIBRAR", "html": "<h1 id=\"parte-iv-calibrar\">PARTE IV — CALIBRAR</h1>\n<p><em>Todos os números ajustáveis, com o efeito de aumentar ou diminuir cada um.</em></p>\n<h2 id=\"todos-os-números-que-você-pode-ajustar\">20. Todos os números que você pode ajustar</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Nenhum valor padrão é uma medição; todos são ponto de partida.</p>\n</blockquote>\n<h3 id=\"visão-geral\">20.1 · Visão geral</h3>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 15%\" />\n<col style=\"width: 37%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Parâmetro</th>\n<th style=\"text-align: left;\">Onde</th>\n<th style=\"text-align: left;\">Padrão</th>\n<th style=\"text-align: left;\">Afeta</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>limiar_curto</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>0.78</code></td>\n<td style=\"text-align: left;\">quantos itens viram <code>Indefinido</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>limiar_longo</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>0.72</code></td>\n<td style=\"text-align: left;\">idem, para textos em prosa</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>margem</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>0.015</code></td>\n<td style=\"text-align: left;\">quantos itens viram <code>ambíguo</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>reranker_ativo</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>True</code></td>\n<td style=\"text-align: left;\">precisão nos casos ambíguos</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>reranker_topk</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>5</code></td>\n<td style=\"text-align: left;\">alcance do desempate (ver 6.5 — não lido hoje)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>dispositivo</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>\"auto\"</code></td>\n<td style=\"text-align: left;\">GPU ou processador</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>lote</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>32</code></td>\n<td style=\"text-align: left;\">velocidade e memória de vídeo</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>modelo</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\">E5-large</td>\n<td style=\"text-align: left;\">qualidade geral e escala dos limiares</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>pesos_blocos</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\">ver 19.3</td>\n<td style=\"text-align: left;\">composição do vetor</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>descartar_vazios</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>True</code></td>\n<td style=\"text-align: left;\">quantos currículos entram</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>formato</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>\"auto\"</code></td>\n<td style=\"text-align: left;\">como os dados são lidos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>versao</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>\"2026.08-v1\"</code></td>\n<td style=\"text-align: left;\">invalidação do cache</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>dominio</code></td>\n<td style=\"text-align: left;\"><code>config.py</code></td>\n<td style=\"text-align: left;\"><code>\"industria\"</code></td>\n<td style=\"text-align: left;\">qual dicionário e quais blocos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>texto_longo</code></td>\n<td style=\"text-align: left;\"><code>dominios/…/blocos.py</code></td>\n<td style=\"text-align: left;\">por bloco</td>\n<td style=\"text-align: left;\">qual limiar cada bloco usa</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>multirrotulo</code></td>\n<td style=\"text-align: left;\"><code>dominios/…/blocos.py</code></td>\n<td style=\"text-align: left;\">por eixo</td>\n<td style=\"text-align: left;\">um ou vários rótulos por item</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>ativo</code></td>\n<td style=\"text-align: left;\"><code>dominios/…/blocos.py</code></td>\n<td style=\"text-align: left;\"><code>True</code></td>\n<td style=\"text-align: left;\">se o bloco é processado</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>TETO_XLSX</code></td>\n<td style=\"text-align: left;\"><code>nucleo/arquivos.py</code></td>\n<td style=\"text-align: left;\"><code>100_000</code></td>\n<td style=\"text-align: left;\">tamanho das planilhas</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>min_cluster_size</code></td>\n<td style=\"text-align: left;\"><code>semantica/descoberta.py</code></td>\n<td style=\"text-align: left;\"><code>25</code></td>\n<td style=\"text-align: left;\">tamanho mínimo dos grupos</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>n_vizinhos</code></td>\n<td style=\"text-align: left;\"><code>semantica/descoberta.py</code></td>\n<td style=\"text-align: left;\"><code>15</code></td>\n<td style=\"text-align: left;\">granularidade do agrupamento</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>n_componentes</code></td>\n<td style=\"text-align: left;\"><code>semantica/descoberta.py</code></td>\n<td style=\"text-align: left;\"><code>10</code></td>\n<td style=\"text-align: left;\">dimensões após a redução</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>max_amostra</code></td>\n<td style=\"text-align: left;\"><code>semantica/descoberta.py</code></td>\n<td style=\"text-align: left;\"><code>60_000</code></td>\n<td style=\"text-align: left;\">teto da descoberta</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"limiares-limiar_curto-e-limiar_longo\">20.2 · Limiares — <code>limiar_curto</code> e <code>limiar_longo</code></h3>\n<p><strong>O que controlam.</strong> A proximidade mínima para aceitar uma classificação. Abaixo disso, o resultado é <code>Indefinido</code>.</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 55%\" />\n<col style=\"width: 41%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Se você AUMENTAR (ex.: 0,85)</th>\n<th style=\"text-align: left;\">Se você DIMINUIR (ex.: 0,65)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ menos rótulos errados</td>\n<td style=\"text-align: left;\">✅ menos <code>Indefinido</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">❌ muito mais <code>Indefinido</code></td>\n<td style=\"text-align: left;\">❌ muito mais rótulo errado</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ pesquisadores sub-representados na etapa 3</td>\n<td style=\"text-align: left;\">❌ contagens infladas e enganosas</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">postura conservadora</td>\n<td style=\"text-align: left;\">postura arriscada</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Por que são dois.</strong> Textos curtos têm pouco contexto e produzem proximidade alta por acaso — exigem mais. Textos longos diluem o sinal em muitas palavras — exigem menos. Qual dos dois se aplica é decidido pelo <code>texto_longo</code> de cada bloco.</p>\n<p><strong>Sintoma de valor alto demais:</strong> <code>%_indefinido</code> acima de 40% no relatório. <strong>Sintoma de valor baixo demais:</strong> rótulos visivelmente errados com confiança alta, ao inspecionar o CSV.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — <strong>A escala depende do modelo.</strong> Trocar o modelo de vetores muda a faixa típica das pontuações, e os limiares precisam ser recalibrados junto. Um valor de 0,78 num modelo pode equivaler a 0,55 noutro.</p>\n</blockquote>\n<h3 id=\"margem-margem\">20.3 · Margem — <code>margem</code></h3>\n<p><strong>O que controla.</strong> A distância mínima entre o primeiro e o segundo colocado para a decisão ser considerada confiante. Abaixo disso, o item é marcado como <code>ambíguo</code> e enviado ao desempate.</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 55%\" />\n<col style=\"width: 42%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Se você AUMENTAR (ex.: 0,05)</th>\n<th style=\"text-align: left;\">Se você DIMINUIR (ex.: 0,005)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ muito mais itens marcados ambíguos</td>\n<td style=\"text-align: left;\">✅ menos ambíguos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">✅ mais itens passam pelo desempate (mais preciso)</td>\n<td style=\"text-align: left;\">❌ empates reais passam despercebidos</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ processamento mais lento</td>\n<td style=\"text-align: left;\">✅ mais rápido</td>\n</tr>\n</tbody>\n</table>\n<p><strong>A armadilha mais comum deste parâmetro.</strong> Em taxonomias grandes (100 ou mais categorias), as pontuações ficam comprimidas numa faixa estreita — quase tudo entre 0,80 e 0,90. Nesse cenário, uma margem fixa dispara em massa e a taxa de ambíguos explode.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Se <code>%_ambiguo</code> passar de ~30%, <strong>suspeite deste parâmetro antes de suspeitar das glosas</strong>. É a causa mais frequente, e a mais fácil de corrigir.</p>\n</blockquote>\n<p><strong>Refinamento possível.</strong> Empates entre duas categorias do <strong>mesmo agrupador</strong> (<code>nivel1</code>) são inofensivos — ambas caem no mesmo grupo. Ignorá-los reduz a contagem de ambíguos sem perder informação. Não está implementado hoje.</p>\n<h3 id=\"desempate-reranker_ativo-e-reranker_topk\">20.4 · Desempate — <code>reranker_ativo</code> e <code>reranker_topk</code></h3>\n<p><code>reranker_ativo</code> (padrão: <code>True</code>)</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 57%\" />\n<col style=\"width: 40%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Ligado</th>\n<th style=\"text-align: left;\">Desligado</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ muito menos ambíguos no resultado final</td>\n<td style=\"text-align: left;\">✅ execução mais rápida</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">✅ decisões melhores em categorias próximas</td>\n<td style=\"text-align: left;\">❌ empates ficam sem resolução</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ mais lento e ~2,2 GB de download inicial</td>\n<td style=\"text-align: left;\">✅ sem download extra</td>\n</tr>\n</tbody>\n</table>\n<p><code>reranker_topk</code> (padrão: <code>5</code>) — quantos candidatos deveriam ser reexaminados por item que cai na zona cinzenta.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Aumentar (ex.: 10)</th>\n<th>Diminuir (ex.: 3)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>✅ mais chance de encontrar o rótulo certo</td>\n<td>✅ mais rápido</td>\n</tr>\n<tr class=\"even\">\n<td>❌ custo cresce de forma linear</td>\n<td>❌ o certo pode ficar de fora</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Este parâmetro <strong>não está ligado ao código</strong>. Ele existe em <code>config.py</code>, mas nenhuma linha do sistema o lê; o número efetivo (5) é calculado em <code>semantica/classificador.py</code> como <code>top_k + 2</code>. Mudá-lo aqui não produz efeito. A explicação completa e a correção estão em 6.5; a pendência está registrada em 26.</p>\n</blockquote>\n<p>Ver a seção 6 para o funcionamento completo, e 6.5 para o que é o top-K.</p>\n<h3 id=\"dispositivo-dispositivo\">20.5 · Dispositivo — <code>dispositivo</code></h3>\n<p><strong>O que controla.</strong> Onde o modelo roda: placa de vídeo ou processador.</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 18%\" />\n<col style=\"width: 79%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Valor</th>\n<th style=\"text-align: left;\">Quando usar</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>\"auto\"</code></td>\n<td style=\"text-align: left;\">Desenvolvimento, máquina desconhecida</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>\"cuda\"</code></td>\n<td style=\"text-align: left;\"><strong>Produção com NVIDIA</strong> — falha com erro claro se a GPU sumir</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>\"mps\"</code></td>\n<td style=\"text-align: left;\">Mac com Apple Silicon</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>\"directml\"</code></td>\n<td style=\"text-align: left;\">AMD ou Intel no Windows</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>\"cpu\"</code></td>\n<td style=\"text-align: left;\">Máquina sem placa dedicada, ou depuração</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Em produção, <strong>deixe explícito</strong>. Com <code>\"auto\"</code>, uma reinstalação errada do PyTorch derruba tudo para o processador sem nenhum aviso, e a execução fica de 10 a 50 vezes mais lenta. Ver a seção 10.</p>\n</blockquote>\n<h3 id=\"tamanho-do-lote-lote\">20.6 · Tamanho do lote — <code>lote</code></h3>\n<p><strong>O que controla.</strong> Quantos textos são vetorizados de uma vez, numa única chamada ao modelo.</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Aumentar (ex.: 64, 128)</th>\n<th style=\"text-align: left;\">Diminuir (ex.: 8, 16)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ processamento mais rápido</td>\n<td style=\"text-align: left;\">✅ funciona em placas menores</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">❌ mais memória de vídeo</td>\n<td style=\"text-align: left;\">❌ mais lento</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ risco de <code>CUDA out of memory</code></td>\n<td style=\"text-align: left;\">✅ sem risco de estouro</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Este parâmetro <strong>não afeta o resultado</strong>, apenas a velocidade e o consumo de memória. Os rótulos saem idênticos com qualquer valor.</p>\n</blockquote>\n<p><strong>Regra prática:</strong> se aparecer erro de memória, divida por dois até parar. Numa placa de 4 GB, valores entre 8 e 16 costumam ser adequados; com 16 GB ou mais, 64 é confortável.</p>\n<h3 id=\"modelo-de-vetores-modelo\">20.7 · Modelo de vetores — <code>modelo</code></h3>\n<p><strong>O que controla.</strong> A qualidade de toda a classificação. É a decisão de maior impacto do sistema.</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 48%\" />\n<col style=\"width: 48%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Trocar por um modelo MAIOR</th>\n<th style=\"text-align: left;\">Trocar por um MENOR</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ melhor compreensão de nuance</td>\n<td style=\"text-align: left;\">✅ mais rápido, menos memória</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">❌ mais lento, mais memória</td>\n<td style=\"text-align: left;\">❌ mais erro em textos técnicos</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ download maior</td>\n<td style=\"text-align: left;\">✅ download menor</td>\n</tr>\n</tbody>\n</table>\n<h4 id=\"aprofundamento-tecnico-e5\">Aprofundamento técnico · como o multilingual-e5-large-instruct funciona por dentro</h4>\n<p>Por baixo de <code>modelo.encode(...)</code> (seção 7.1) há um transformador com uma arquitetura e um treinamento específicos — vale conhecer os dois para entender por que o modelo se comporta do jeito que se comporta.</p>\n<p><strong>Arquitetura.</strong> O modelo parte do XLM-RoBERTa-Large: 24 camadas de atenção, embeddings de 1.024 dimensões — exatamente o tamanho do vetor gravado no Parquet — e um tokenizador multilíngue (SentencePiece, vocabulário de cerca de 250 mil subpalavras) que cobre da ordem de 100 idiomas, incluindo o português. São ao todo cerca de <strong>560 milhões de parâmetros</strong>, o que explica o download de ~2 GB citado na seção 14.1. O limite de entrada é <strong>512 tokens</strong>: é este limite do modelo — não uma escolha do pipeline — que torna a ordem do texto consolidado tão importante (seção 19.3); o que ultrapassar 512 tokens simplesmente não chega a ser processado.</p>\n<p><strong>De texto para vetor: pooling.</strong> O transformador produz, internamente, um vetor <em>por token</em>, não um vetor por texto inteiro. Para chegar a um único vetor de 1.024 números, o modelo aplica <strong>mean pooling</strong>: a média dos vetores de todos os tokens, ponderada pela máscara de atenção (que ignora o preenchimento), seguida da normalização para comprimento 1 — a mesma normalização explicada na seção 7.1. Não é o vetor de um único token especial, como em outros modelos da família BERT: é a média de todos.</p>\n<p><strong>Como o modelo aprendeu a colocar textos parecidos perto um do outro.</strong> O treinamento tem dois estágios, descritos no relatório técnico do modelo (Wang et al., 2024, <em>Multilingual E5 Text Embeddings</em> — arXiv:2402.05672):</p>\n<p><strong>1. Pré-treino contrastivo, em escala.</strong> Cerca de 1 bilhão de pares de texto minerados automaticamente da internet — título e corpo de uma página, pergunta e resposta de um fórum, e outras relações naturais desse tipo — sem rótulo humano nenhum. A função de perda (InfoNCE, com temperatura baixa, 0,01) aproxima os dois lados de cada par no espaço vetorial e afasta os pares aleatórios do mesmo lote. É este estágio que dá ao modelo a noção geral de “estes dois textos falam da mesma coisa”.</p>\n<p><strong>2. Ajuste fino supervisionado e por instrução.</strong> Sobre essa base, o modelo é refinado com conjuntos de dados com rótulo humano de fato (busca, resposta a perguntas, inferência textual) e, na variante <strong>instruct</strong> usada aqui, com exemplos sintéticos cobrindo muitas tarefas diferentes, cada uma acompanhada da instrução em linguagem natural que a descreve. É este segundo estágio que ensina o modelo a reagir ao prefixo <code>Instruct: ...</code> — não existe um mecanismo separado para isso: a instrução é só mais texto, concatenado antes da consulta e processado pelo mesmo transformador. É por isso que o formato exato do prompt importa tanto (ver <code>semantica/vetores.py</code> e o dicionário <code>INSTRUCOES</code>, uma instrução por bloco do currículo).</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — O pré-treino contrastivo é como aprender um idioma lendo um bilhão de pares de frase e tradução, sem ninguém corrigir nada — só notando que certas palavras aparecem sempre nos mesmos contextos. O ajuste fino é a aula particular depois: poucos exemplos, mas com um professor — o rótulo humano, ou a instrução — dizendo exatamente o que importa em cada tarefa.</p>\n</blockquote>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Nada disso é recalculado pelo pipeline: o modelo já vem pronto (pré-treinado e ajustado) do Hugging Face. O <code>sentence-transformers</code> só carrega os pesos e executa a passagem para frente (<em>inference</em>); a seção 20.6 (tamanho do lote) e a seção 10 (GPU) tratam exatamente dessa etapa de execução, não de treinamento.</p>\n</blockquote>\n<p><strong>Por que este modelo, e não outro.</strong> Três propriedades levaram à escolha, na ordem de importância para este projeto:</p>\n<p><strong>Multilíngue.</strong> O currículo Lattes é majoritariamente em português; um modelo treinado só em inglês projetaria mal nuances técnicas do idioma.</p>\n<p><strong>Instruct.</strong> Uma única cópia do modelo atende a várias tarefas diferentes — classificar experiência profissional, formação, resumo, capacitação, área de atuação e conhecimento técnico, além da busca de currículos — cada uma com sua própria instrução, sem precisar treinar nem manter um modelo por tarefa.</p>\n<p><strong>Pesos abertos, execução local.</strong> O modelo roda inteiramente na máquina de quem usa (seção 14.1: nenhum currículo sai do computador), o que importa quando o dado é sensível.</p>\n<p><em>Fonte: Wang, L. et al. (2024). Multilingual E5 Text Embeddings: A Technical Report. arXiv:2402.05672.</em></p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Trocar o modelo <strong>exige recalibrar os limiares</strong> e reprocessar tudo. As pontuações de modelos diferentes não são comparáveis entre si.</p>\n</blockquote>\n<h3 id=\"composição-do-vetor-pesos_blocos\">20.8 · Composição do vetor — <code>pesos_blocos</code></h3>\n<p><strong>O que controla.</strong> Quantos itens de cada bloco entram no texto consolidado, e em que ordem. Ver 19.3.</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 41%\" />\n<col style=\"width: 55%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Aumentar o número de um bloco</th>\n<th style=\"text-align: left;\">Diminuir</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ mais desse conteúdo no vetor</td>\n<td style=\"text-align: left;\">✅ texto mais enxuto e focado</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">❌ dilui os demais blocos</td>\n<td style=\"text-align: left;\">❌ perde informação de currículos extensos</td>\n</tr>\n</tbody>\n</table>\n<p><strong>A ORDEM importa tanto quanto os números</strong>, porque o modelo pesa mais o começo do texto. Mover um bloco para cima aumenta seu peso, mesmo sem mudar o número.</p>\n<h3 id=\"ingestão-descartar_vazios-e-formato\">20.9 · Ingestão — <code>descartar_vazios</code> e <code>formato</code></h3>\n<p><code>descartar_vazios</code> (padrão: <code>True</code>) — remove cadastros sem nenhuma produção, atuação ou resumo.</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 61%\" />\n<col style=\"width: 35%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Ligado</th>\n<th style=\"text-align: left;\">Desligado</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ estatísticas não distorcidas por cadastros vazios</td>\n<td style=\"text-align: left;\">✅ preserva a base completa</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">❌ o total de pesquisadores diminui</td>\n<td style=\"text-align: left;\">❌ muitos zeros nas contagens</td>\n</tr>\n</tbody>\n</table>\n<p>Desligue quando a existência do cadastro vazio for, ela mesma, o objeto do estudo.</p>\n<p><code>formato</code> (padrão: <code>\"auto\"</code>) — força um leitor específico em vez de detectar. Útil quando a pasta tem arquivos de tipos misturados.</p>\n<h3 id=\"cache-versao\">20.10 · Cache — <code>versao</code></h3>\n<p><strong>O que controla.</strong> Uma string que entra no cálculo da chave de cache. Mudá-la invalida todo o cache e força reprocessamento completo.</p>\n<p><strong>Quando mudar:</strong> depois de uma revisão grande das glosas, quando você quer garantir que <strong>tudo</strong> será reclassificado.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Não é preciso mudar para uma edição pontual: alterar uma glosa já muda o texto da categoria, e os itens afetados são reprocessados sozinhos.</p>\n</blockquote>\n<h3 id=\"por-bloco-e-por-eixo-dominiosáreablocos.py\">20.11 · Por bloco e por eixo — <code>dominios/&lt;área&gt;/blocos.py</code></h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Três chaves que ficam no arquivo do domínio, e não em <code>config.py</code>, porque a resposta certa depende da área.</p>\n</blockquote>\n<p>Os parâmetros anteriores valem para o sistema inteiro. Estes três são declarados <strong>bloco a bloco</strong>, dentro do domínio — porque a resposta correta muda conforme o tipo de texto e o tipo de taxonomia.</p>\n<h4 id=\"texto_longo-qual-limiar-este-bloco-usa\"><code>texto_longo</code> — qual limiar este bloco usa</h4>\n<p><strong>O que é.</strong> Uma chave verdadeiro/falso que diz se o texto daquele bloco é <strong>prosa</strong> ou <strong>rótulo curto</strong>.</p>\n<pre><code>Bloco(\n    nome=&quot;atuacao&quot;,\n    texto_longo=True,     # ⬅️ aqui\n    ...\n)</code></pre>\n<p><strong>O que ela faz.</strong> Escolhe entre os dois limiares globais:</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 8%\" />\n<col style=\"width: 37%\" />\n<col style=\"width: 52%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Valor</th>\n<th style=\"text-align: left;\">Limiar aplicado</th>\n<th style=\"text-align: left;\">Adequado a</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>True</code></td>\n<td style=\"text-align: left;\"><code>limiar_longo</code> (0,72) — mais permissivo</td>\n<td style=\"text-align: left;\">resumos, descrições de atividade, descrições de projeto</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>False</code></td>\n<td style=\"text-align: left;\"><code>limiar_curto</code> (0,78) — mais exigente</td>\n<td style=\"text-align: left;\">títulos de artigo, nomes de curso, cargos, nomes de patente</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Por que a diferença.</strong> Um texto de três palavras pode bater alto com uma categoria por coincidência de vocabulário — exige-se mais dele. Um texto de cinquenta palavras espalha o significado por muitos termos e naturalmente pontua mais baixo — exige-se menos.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — No domínio “indústria”:</p>\n<pre><code>&quot;resumo&quot;           texto_longo=True    # prosa autoral\n&quot;atuacao&quot;          texto_longo=True    # descrição de atividades\n&quot;projetos&quot;         texto_longo=True    # descrição do projeto\n&quot;formacao&quot;         texto_longo=False   # &quot;Engenharia Mecânica&quot;\n&quot;producao_tecnica&quot; texto_longo=False   # título de patente\n&quot;publicacoes&quot;      texto_longo=False   # título de artigo\n&quot;areas_declaradas&quot; texto_longo=False   # &quot;Engenharias &gt; Mecânica&quot;</code></pre>\n<p><strong>ATENÇÃO</strong> — <strong>Marcar errado é uma causa silenciosa de problema.</strong> Um bloco de títulos marcado como longo aceita classificações frágeis, que ninguém percebe porque não geram erro. Um bloco de prosa marcado como curto produz <code>Indefinido</code> em excesso, e você culpa a taxonomia sem motivo.</p>\n<p><strong>Como diagnosticar:</strong> se um bloco específico tem taxa de indefinidos muito fora do padrão dos demais, confira o <code>texto_longo</code> dele antes de mexer em qualquer outra coisa.</p>\n</blockquote>\n<h4 id=\"multirrotulo-um-rótulo-ou-vários\"><code>multirrotulo</code> — um rótulo ou vários</h4>\n<p><strong>O que é.</strong> Uma chave por <strong>eixo</strong> (não por bloco) que permite ao mesmo item receber mais de uma categoria.</p>\n<pre><code>eixos=[\n    Eixo(&quot;setor_industrial&quot;),                      # um rótulo só\n    Eixo(&quot;tecnologia&quot;, multirrotulo=True),         # ⬅️ vários permitidos\n]</code></pre>\n<p><strong>Quando usar</strong> <code>True</code><strong>.</strong> Quando as categorias <strong>não são mutuamente exclusivas</strong> — quando faz sentido que um item pertença a duas ao mesmo tempo.</p>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Um software de manutenção preditiva com sensores é, ao mesmo tempo, «Inteligência Artificial» <strong>e</strong> «Internet das Coisas». Forçá-lo a escolher uma perderia informação verdadeira.</p>\n<p>Já uma patente está num único estágio de maturidade. Permitir «TRL 3-4» <strong>e</strong> «TRL 7-8» no mesmo item produziria um resultado sem significado.</p>\n</blockquote>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 55%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Eixo</th>\n<th style=\"text-align: left;\">Recomendado</th>\n<th style=\"text-align: left;\">Por quê</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>setor_industrial</code></td>\n<td style=\"text-align: left;\"><code>False</code></td>\n<td style=\"text-align: left;\">um item se aplica principalmente a um setor</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>competencia_tec</code></td>\n<td style=\"text-align: left;\"><code>True</code></td>\n<td style=\"text-align: left;\">uma atividade demonstra várias competências</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>tecnologia</code></td>\n<td style=\"text-align: left;\"><code>True</code></td>\n<td style=\"text-align: left;\">tecnologias se combinam naturalmente</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>maturidade</code></td>\n<td style=\"text-align: left;\"><code>False</code></td>\n<td style=\"text-align: left;\">estágios são excludentes por definição</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Efeito na saída.</strong> Com <code>True</code>, surge uma coluna extra <code>&lt;Sigla&gt;_Multi_&lt;BLOCO&gt;</code> com todos os rótulos aceitos, separados por <code>;</code>. A coluna principal continua trazendo o primeiro colocado — para que a etapa 3 possa contar sem ambiguidade.</p>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Ligar <code>multirrotulo</code> <strong>infla as contagens</strong> da etapa 3, porque o mesmo item passa a somar em várias categorias. A concentração cai e a diversidade sobe, mesmo sem o currículo ter mudado. Não compare números de antes e depois dessa mudança.</p>\n</blockquote>\n<h4 id=\"ativo-declarar-sem-executar\"><code>ativo</code> — declarar sem executar</h4>\n<p><strong>O que é.</strong> Uma chave que desliga o bloco sem removê-lo do código.</p>\n<pre><code>Bloco(\n    nome=&quot;perfil_comportamental&quot;,\n    ativo=False,     # ⬅️ declarado, não executado\n    porque=&quot;Exigiria taxonomia própria que ainda não temos.&quot;,\n)</code></pre>\n<p><strong>Por que não simplesmente apagar ou comentar.</strong> Porque a decisão de <em>não</em> fazer algo é uma informação valiosa. Com <code>ativo=False</code>:</p>\n<ul>\n<li>o bloco continua sendo lido, revisado e versionado;</li>\n<li>o campo <code>porque</code> documenta a razão da decisão;</li>\n<li>reativar é trocar uma palavra, não reescrever;</li>\n<li>ninguém pergunta seis meses depois “por que não classificamos isso?”.</li>\n</ul>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Código comentado é lixo que ninguém revisa. Bloco desligado é decisão registrada.</p>\n</blockquote>\n<h3 id=\"planilhas-teto_xlsx\">20.12 · Planilhas — <code>TETO_XLSX</code></h3>\n<p><strong>O que controla.</strong> Quantas linhas cada arquivo <code>.xlsx</code> exibe.</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 62%\" />\n<col style=\"width: 35%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Aumentar</th>\n<th style=\"text-align: left;\">Diminuir</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ mais dados visíveis na planilha</td>\n<td style=\"text-align: left;\">✅ abre mais rápido</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">❌ planilha lenta ou impossível de abrir</td>\n<td style=\"text-align: left;\">❌ mais truncamento</td>\n</tr>\n</tbody>\n</table>\n<p>O limite do Excel é 1.048.576 linhas, mas esse não é o limite prático: muito antes disso a planilha fica intratável. O dado completo está sempre no Parquet.</p>\n<h3 id=\"descoberta-de-temas-semanticadescoberta.py\">20.13 · Descoberta de temas — <code>semantica/descoberta.py</code></h3>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — A descoberta agrupa o que ficou <code>Indefinido</code> e mostra os temas que a sua taxonomia não cobre.</p>\n</blockquote>\n<h4 id=\"o-que-a-descoberta-faz-e-por-que-existe\">O que a descoberta faz, e por que existe</h4>\n<p>A classificação só enxerga o que está no dicionário. Se um assunto relevante não tiver categoria, todos os itens sobre ele viram <code>Indefinido</code> — e ficam invisíveis, misturados ao ruído.</p>\n<p>A descoberta responde à pergunta oposta: <strong>“o que está na base que a minha taxonomia não vê?”</strong></p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — A classificação é conferir uma lista de compras. A descoberta é olhar o que sobrou no carrinho e não estava na lista.</p>\n</blockquote>\n<h4 id=\"como-funciona-em-três-passos\">Como funciona, em três passos</h4>\n<pre><code>   itens &quot;Indefinido&quot;\n          │\n          ▼\n   ① UMAP — reduz de 1.024 dimensões para ~10\n          │\n          ▼\n   ② HDBSCAN — encontra grupos densos\n          │\n          ▼\n   ③ c-TF-IDF — nomeia cada grupo pelos termos característicos\n          │\n          ▼\n   &quot;há 340 itens falando de hidrogênio, eletrólise, célula a combustível&quot;</code></pre>\n<p><strong>① UMAP — a redução de dimensões.</strong> Os vetores têm mais de mil dimensões. Nesse espaço, todos os pontos ficam mais ou menos à mesma distância uns dos outros — é a chamada “maldição da dimensionalidade”, e ela impede qualquer algoritmo de agrupamento de funcionar. O UMAP projeta os pontos num espaço de poucas dimensões preservando a vizinhança: quem estava próximo continua próximo.</p>\n<p><strong>② HDBSCAN — o agrupamento.</strong> Encontra regiões densas de pontos. A virtude dele, para este uso, é que <strong>não força tudo a pertencer a um grupo</strong>: o que estiver espalhado é marcado como ruído (<code>-1</code>). Isso é exatamente o que se quer — nem todo <code>Indefinido</code> é um tema emergente; muito é só texto vago.</p>\n<p><strong>③ c-TF-IDF — a nomeação.</strong> Para cada grupo, encontra os termos que aparecem muito ali e pouco nos demais. O resultado é um punhado de palavras que descrevem o grupo, prontas para virar uma categoria nova.</p>\n<h4 id=\"aprofundamento-tecnico-umap\">Aprofundamento técnico · como o UMAP calcula essa projeção</h4>\n<p>A explicação acima descreve o <strong>efeito</strong> do UMAP — preservar vizinhança. Por baixo, o algoritmo (<em>Uniform Manifold Approximation and Projection</em>; McInnes, Healy e Melville, 2018) chega lá em três movimentos matemáticos, apoiados em geometria riemanniana e topologia algébrica.</p>\n<p><strong>1. Um grafo de vizinhança “fuzzy” no espaço original.</strong> Para cada vetor, o UMAP localiza seus <code>n_neighbors</code> vizinhos mais próximos — aqui, por cosseno, a mesma métrica de semelhança do resto do pipeline (seção 7.1) — e converte essa vizinhança numa aresta com <strong>peso</strong>, não um vínculo binário de sim/não. O peso é a confiança de que dois pontos são vizinhos de verdade, calibrada individualmente para cada ponto a partir da distância até o seu vizinho mais próximo: um currículo cercado de vizinhos muito parecidos usa uma régua mais curta que um currículo isolado. É assim que o algoritmo se adapta a regiões do espaço com densidades diferentes. Duas arestas vistas de lados opostos são combinadas por uma união fuzzy — a matemática do “OU”:</p>\n<pre><code>μ(a,b) = μ_a(b) + μ_b(a) − μ_a(b)·μ_b(a)</code></pre>\n<p><strong>2. O mesmo tipo de grafo no espaço reduzido.</strong> O UMAP monta um segundo grafo, desta vez nas poucas dimensões de saída (<code>n_components</code>), usando uma curva suave para decidir o peso de cada aresta a partir da distância entre os pontos já projetados.</p>\n<p><strong>3. Aproximar um grafo do outro.</strong> Por gradiente descendente estocástico, o algoritmo reposiciona os pontos no espaço reduzido até que o segundo grafo fique o mais parecido possível com o primeiro — minimizando a <strong>entropia cruzada</strong> entre os dois. Na prática, isso vira uma disputa de duas forças: pontos que o grafo original aponta como vizinhos se atraem; pares que não são vizinhos se repelem (calculado por amostragem negativa, para não comparar cada ponto com todos os outros a cada passo). É a mesma lógica de um layout de grafo por forças — só que a “física” vem da topologia do espaço original de 1.024 dimensões, não de uma mola arbitrária.</p>\n<blockquote>\n<p><strong>ANALOGIA</strong> — É como reduzir um mapa-múndi esférico para um mapa de papel plano: é impossível preservar todas as distâncias ao mesmo tempo. O UMAP escolhe deliberadamente preservar a vizinhança — quem está perto continua perto — e aceita distorcer as distâncias longas. Por isso a distância entre dois grupos afastados no resultado da descoberta não deve ser lida como “quão diferentes são os temas”: só a proximidade local é confiável.</p>\n</blockquote>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Comparado ao t-SNE, a alternativa mais conhecida para este tipo de redução, o UMAP resolve o mesmo problema — grafo de vizinhança seguido de otimização — mas troca a divergência KL do t-SNE por entropia cruzada, e inicializa a posição dos pontos por uma técnica espectral em vez de aleatória. Na prática, o UMAP roda bem mais rápido em bases grandes e preserva um pouco mais de estrutura global — dois motivos da escolha aqui.</p>\n</blockquote>\n<p><strong>Os parâmetros do código, na prática:</strong></p>\n<p><code>n_neighbors=n_vizinhos</code> (15) — quantos vizinhos entram no grafo de cada ponto (equilíbrio local/global, detalhado logo abaixo).</p>\n<p><code>n_components=n_componentes</code> (10) — dimensão do espaço de saída.</p>\n<p><code>metric=\"cosine\"</code> — a métrica usada para achar vizinhos no espaço original, consistente com o resto do pipeline (seção 7.1).</p>\n<p><code>random_state=semente</code> (42) — fixa a semente da otimização estocástica, tornando o resultado reprodutível na mesma máquina e nas mesmas versões de biblioteca.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Nada disso altera o vetor original de 1.024 dimensões, que segue intacto no Parquet. A redução do UMAP é temporária e vale só para a descoberta de temas — a classificação e a busca continuam operando no espaço completo.</p>\n</blockquote>\n<h4 id=\"os-parâmetros-1\">Os parâmetros</h4>\n<p><code>min_cluster_size</code> (padrão: <code>25</code>) — o tamanho mínimo de um grupo para que ele seja considerado um grupo.</p>\n<table style=\"width:97%;\">\n<colgroup>\n<col style=\"width: 51%\" />\n<col style=\"width: 45%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Aumentar (ex.: 50)</th>\n<th style=\"text-align: left;\">Diminuir (ex.: 10)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ só temas realmente recorrentes</td>\n<td style=\"text-align: left;\">✅ detecta nichos pequenos</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">✅ menos grupos para revisar</td>\n<td style=\"text-align: left;\">❌ muitos grupos irrelevantes</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ perde temas emergentes</td>\n<td style=\"text-align: left;\">❌ revisão fica cansativa</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Numa base de 5 mil itens indefinidos, <code>25</code> costuma render de 20 a 60 grupos — quantidade revisável numa tarde. Numa base de 200 mil, o mesmo valor renderia centenas de grupos minúsculos; ali faz sentido subir para 100 ou 200.</p>\n<p><strong>Regra prática:</strong> comece com cerca de 0,5% do total de itens indefinidos, com piso de 25.</p>\n</blockquote>\n<p><code>n_vizinhos</code> (padrão: <code>15</code>) — quantos vizinhos o UMAP considera ao decidir onde colocar cada ponto.</p>\n<p>Este é o parâmetro que controla o <strong>equilíbrio entre detalhe e panorama</strong>.</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 61%\" />\n<col style=\"width: 36%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Aumentar (ex.: 50)</th>\n<th style=\"text-align: left;\">Diminuir (ex.: 5)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ enxerga a estrutura geral</td>\n<td style=\"text-align: left;\">✅ enxerga detalhes locais</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">✅ grupos maiores e mais coerentes</td>\n<td style=\"text-align: left;\">❌ fragmenta um tema em vários</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">❌ funde temas próximos que deveriam ficar separados</td>\n<td style=\"text-align: left;\">❌ grupos pequenos e instáveis</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>NA PRÁTICA</strong> — Com <code>n_vizinhos=5</code>, “hidrogênio verde” e “eletrólise” podem virar dois grupos separados. Com <code>n_vizinhos=50</code>, eles se fundem — e talvez engulam também “células a combustível”. Qual é o certo depende de quão fina você quer a taxonomia.</p>\n</blockquote>\n<p><code>n_componentes</code> (padrão: <code>10</code>) — para quantas dimensões reduzir.</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 55%\" />\n<col style=\"width: 42%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Aumentar (ex.: 30)</th>\n<th style=\"text-align: left;\">Diminuir (ex.: 5)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">✅ preserva mais nuance</td>\n<td style=\"text-align: left;\">✅ agrupamento mais rápido e estável</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">❌ HDBSCAN volta a sofrer com a dimensionalidade</td>\n<td style=\"text-align: left;\">❌ perde distinções sutis</td>\n</tr>\n</tbody>\n</table>\n<p>Raramente precisa ser mexido. Entre 5 e 15 funciona para quase tudo.</p>\n<p><code>max_amostra</code> (padrão: <code>60.000</code>) — teto de itens analisados de uma vez.</p>\n<p>O UMAP consome memória de forma acelerada com o número de pontos. Acima de algumas dezenas de milhares, o custo cresce mais rápido que o ganho.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — A amostragem é <strong>determinística</strong> (semente fixa): rodar duas vezes dá o mesmo resultado. E uma amostra de 60 mil preserva bem a estrutura de temas — grupos que só apareceriam com a base completa são, por definição, pequenos demais para virar categoria.</p>\n</blockquote>\n<h4 id=\"como-usar-o-resultado\">Como usar o resultado</h4>\n<p>A descoberta <strong>não cria categorias sozinha</strong>. Ela entrega grupos nomeados, e a decisão é humana:</p>\n<ol type=\"1\">\n<li>Rode a descoberta sobre os <code>Indefinido</code>.</li>\n<li>Leia os grupos e seus termos característicos.</li>\n<li>Para cada grupo que representa um tema real, escreva uma categoria nova no dicionário — com glosa contrastiva (seção 5).</li>\n<li>Rode a classificação de novo. Os itens saem de <code>Indefinido</code> e entram na categoria nova.</li>\n</ol>\n<blockquote>\n<p><strong>ATENÇÃO</strong> — Resista à tentação de virar todo grupo em categoria. Alguns grupos são artefato: textos vagos que se parecem entre si por serem igualmente vagos. Olhe os exemplos antes de decidir.</p>\n</blockquote>\n<h2 id=\"como-calibrar-na-prática\">21. Como calibrar, na prática</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Rotule 200 linhas à mão uma única vez, e você terá um gabarito permanente.</p>\n</blockquote>\n<p>Os valores padrão são <strong>ponto de partida, não medição</strong>.</p>\n<p><strong>1.</strong> Rode o pipeline e abra um CSV classificado. <strong>2.</strong> Sorteie 200 a 300 linhas. <strong>3.</strong> Marque à mão, numa coluna nova, a categoria que você considera correta. <strong>4.</strong> Compare com o que o sistema decidiu:</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 56%\" />\n<col style=\"width: 41%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">O que você vê</th>\n<th style=\"text-align: left;\">O que fazer</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Muitos <code>Indefinido</code> que você sabia classificar</td>\n<td style=\"text-align: left;\">Reduza o limiar do bloco (20.2)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Muitos rótulos errados com confiança alta</td>\n<td style=\"text-align: left;\">Aumente o limiar (20.2)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Muitos ambíguos entre categorias bem distintas</td>\n<td style=\"text-align: left;\">Reduza a margem (20.3)</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Ambíguos entre categorias que você também confunde</td>\n<td style=\"text-align: left;\">Reescreva as glosas (seção 5)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\">Erro concentrado em textos curtos</td>\n<td style=\"text-align: left;\">Ver a seção 7.5</td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\">Um bloco específico muito pior que os outros</td>\n<td style=\"text-align: left;\">Confira o <code>texto_longo</code> dele (20.11)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>5.</strong> Ajuste, rode <code>--etapas classificacao</code> e recompare.</p>\n<div data-lab=\"calibragem\">\n\n</div>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Guarde a amostra rotulada. Ela é o seu gabarito permanente: toda mudança futura no dicionário ou nos parâmetros pode ser medida contra ela. Sem gabarito, “melhorou” é opinião.</p>\n</blockquote>"}, {"titulo": "PARTE V — ADAPTAR E OPERAR", "html": "<h1 id=\"parte-v-adaptar-e-operar\">PARTE V — ADAPTAR E OPERAR</h1>\n<p><em>Trocar de área, estrutura do código, problemas comuns e decisões pendentes.</em></p>\n<h2 id=\"trocar-a-área-de-aplicação\">22. Trocar a área de aplicação</h2>\n<blockquote>\n<p><strong>EM UMA FRASE</strong> — Um domínio é uma pasta com um dicionário e um arquivo de blocos; trocar de área não exige tocar no motor.</p>\n</blockquote>\n<p>Hoje o sistema olha para a <strong>indústria</strong>. Ele pode olhar para saúde, educação, agronegócio, defesa, cultura ou administração pública — sem reescrever nada.</p>\n<pre><code>dominios/industria/\n├── dicionario_industria.xlsx   ← as taxonomias: o que se quer enxergar\n└── blocos.py                   ← que parte do currículo cruza com quê</code></pre>\n<h3 id=\"receita-para-criar-um-domínio-novo\">22.1 · Receita para criar um domínio novo</h3>\n<p><strong>Passo 1 — copie a pasta:</strong></p>\n<pre><code>Copy-Item -Recurse dominios\\industria dominios\\saude</code></pre>\n<p><strong>Passo 2 — edite o dicionário.</strong> Cada linha é uma categoria:</p>\n<table style=\"width:98%;\">\n<colgroup>\n<col style=\"width: 15%\" />\n<col style=\"width: 44%\" />\n<col style=\"width: 37%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th style=\"text-align: left;\">Coluna</th>\n<th style=\"text-align: left;\">O que é</th>\n<th style=\"text-align: left;\">Exemplo</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>taxonomia</code></td>\n<td style=\"text-align: left;\">a que eixo pertence</td>\n<td style=\"text-align: left;\"><code>especialidade_clinica</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>nivel1</code></td>\n<td style=\"text-align: left;\">o agrupador</td>\n<td style=\"text-align: left;\"><code>Atenção Hospitalar</code></td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>nivel2</code></td>\n<td style=\"text-align: left;\">a categoria</td>\n<td style=\"text-align: left;\"><code>Terapia Intensiva</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>glosa</code></td>\n<td style=\"text-align: left;\"><strong>a definição — é ela que classifica</strong></td>\n<td style=\"text-align: left;\">(ver seção 5)</td>\n</tr>\n<tr class=\"odd\">\n<td style=\"text-align: left;\"><code>exemplares</code></td>\n<td style=\"text-align: left;\">termos típicos, separados por <code>;</code></td>\n<td style=\"text-align: left;\"><code>UTI; ventilação mecânica; sepse</code></td>\n</tr>\n<tr class=\"even\">\n<td style=\"text-align: left;\"><code>ativo</code></td>\n<td style=\"text-align: left;\"><code>SIM</code> ou <code>NAO</code></td>\n<td style=\"text-align: left;\"><code>SIM</code></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Passo 3 — edite</strong> <code>blocos.py</code><strong>:</strong> declare os eixos de cada bloco.</p>\n<pre><code>TAXONOMIAS = (&quot;especialidade_clinica&quot;, &quot;competencia_tec&quot;, &quot;populacao_alvo&quot;)\n\nBLOCOS = [\n    Bloco(\n        nome=&quot;producao_tecnica&quot;,\n        rotulo=&quot;Produção técnica&quot;,\n        tabela=&quot;producao_tec&quot;,\n        texto=texto_producao_tecnica,\n        texto_longo=False,\n        eixos=[Eixo(&quot;especialidade_clinica&quot;),\n               Eixo(&quot;competencia_tec&quot;, multirrotulo=True)],\n        porque=&quot;...&quot;,\n    ),\n]</code></pre>\n<p><strong>Passo 4 — ative:</strong></p>\n<pre><code>python pipeline.py --dominio saude</code></pre>\n<p>Ou, permanentemente, em <code>config.py</code>: <code>dominio = \"saude\"</code>.</p>\n<blockquote>\n<p><strong>LEMBRE-SE</strong> — Nada mais muda. Etapas, motor e testes continuam idênticos. É a camada de domínio que absorve a diferença.</p>\n</blockquote>\n<h2 id
